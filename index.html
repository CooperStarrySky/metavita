<title>Metavita</title>
<style>
/* Metavita shared look (pasted into every page by build_trainer.py at the THEME marker).
   Frutiger Aero / early Aqua: sky backdrop, frosted-glass panels, glossy gel buttons, sunken input wells.
   Dark is the default; :root[data-theme="light"] switches. */
:root {
  --sky: radial-gradient(120% 70% at 15% -10%, rgba(70, 200, 190, .22), transparent 60%),
         radial-gradient(90% 60% at 100% 0%, rgba(60, 120, 220, .20), transparent 55%),
         linear-gradient(180deg, #0d2b38 0%, #0a1d26 45%, #08161b 100%);
  --halo: #0b1f27;                         /* text outline on the tree, matches the backdrop */
  --ink: #e6f2f5; --muted: #8eaeb8; --line: rgba(150, 205, 220, .20);
  --glass: rgba(18, 40, 50, .66); --glass-solid: #13303b; --glass-hi: rgba(255, 255, 255, .10); --glass-edge: rgba(140, 215, 230, .26);
  --shadow: 0 10px 28px rgba(0, 0, 0, .45);
  --well: rgba(0, 0, 0, .32); --well-edge: rgba(140, 205, 220, .30);
  --btn: linear-gradient(180deg, rgba(255,255,255,.17) 0%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.02) 51%, rgba(255,255,255,.07) 100%);
  --btn-edge: rgba(150, 210, 225, .32); --btn-ink: #e6f2f5; --btn-emboss: 0 -1px 0 rgba(0, 0, 0, .45);
  --go: #43c364; --go-ink: #fff; --go-edge: #1c7a37;
  --sel: #3ba4f5; --sel-edge: #1f6fb4;
  --accent: #5bd27a;                       /* highlighted path, links */
  --gold: #f1b94b; --gold-wash: rgba(241, 185, 75, .16); --bad: #ff8a78;
  --row: rgba(255, 255, 255, .06);        /* hover / zebra */
  --edge: rgba(150, 200, 210, .38);       /* tree branches */
  --node-top: #2f5361; --node-bot: #1c3a46; /* glossy node fill */
  color-scheme: dark;
}
:root[data-theme="light"] {
  --sky: radial-gradient(120% 70% at 15% -10%, rgba(255, 255, 255, .85), transparent 60%),
         radial-gradient(80% 50% at 100% 100%, rgba(140, 215, 120, .35), transparent 60%),
         linear-gradient(180deg, #a9d8f7 0%, #d6eefc 42%, #eef8f4 78%, #ddf1d2 100%);
  --halo: #e3f2fb;
  --ink: #0f2530; --muted: #4a6672; --line: rgba(25, 75, 105, .18);
  --glass: rgba(255, 255, 255, .62); --glass-solid: #f4fafd; --glass-hi: rgba(255, 255, 255, .95); --glass-edge: rgba(40, 95, 125, .26);
  --shadow: 0 8px 22px rgba(30, 75, 105, .18);
  --well: #fff; --well-edge: rgba(45, 95, 125, .38);
  --btn: linear-gradient(180deg, #ffffff 0%, #f1f6f9 50%, #dfe9ef 51%, #eef4f8 100%);
  --btn-edge: rgba(40, 85, 110, .38); --btn-ink: #13303c; --btn-emboss: 0 1px 0 rgba(255, 255, 255, .8);
  --go: #2fa64f; --go-edge: #1b6e33;
  --sel: #2b8de0; --sel-edge: #1b65a8;
  --accent: #23964a;
  --gold: #c7860f; --gold-wash: rgba(220, 160, 40, .16); --bad: #b8382a;
  --row: rgba(30, 90, 130, .07);
  --edge: rgba(40, 90, 115, .40);
  --node-top: #ffffff; --node-bot: #e2ecf2;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: #0a1d26; }
:root[data-theme="light"] { background: #cde8f8; }
body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--sky); background-attachment: fixed;
  font: 14px/1.45 "Lucida Grande", "Segoe UI", "Frutiger", "Myriad Pro", -apple-system, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }

/* frosted glass surface */
.glass { background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 8px;
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); }

/* glossy buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 13px;
  font: inherit; font-size: 13px; font-weight: 600; color: var(--btn-ink); text-decoration: none; text-shadow: var(--btn-emboss);
  background: var(--btn); border: 1px solid var(--btn-edge); border-radius: 6px; cursor: pointer; white-space: nowrap;
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 1px 2px rgba(0, 0, 0, .18); }
.btn:hover { filter: brightness(1.07); }
.btn:active { filter: brightness(.94); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .3); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.go { color: var(--go-ink, #fff); text-shadow: 0 -1px 0 rgba(0, 50, 15, .45); border-color: var(--go-edge);
  background: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.18) 50%, rgba(255,255,255,0) 51%, rgba(255,255,255,.14) 100%), var(--go);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 1px 3px rgba(0, 60, 20, .35); }
.btn:focus-visible, .seg button:focus-visible, summary:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--sel) 45%, transparent); }

/* Aqua segmented control: joined buttons, the chosen one is a blue gel */
.seg { display: inline-flex; border: 1px solid var(--btn-edge); border-radius: 6px; overflow: hidden; background: var(--btn);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 1px 2px rgba(0, 0, 0, .18); flex: none; }
.seg button { height: 28px; min-width: 30px; padding: 0 11px; border: 0; border-left: 1px solid var(--btn-edge); background: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  font: inherit; font-size: 12.5px; font-weight: 600; color: var(--btn-ink); text-shadow: var(--btn-emboss); cursor: pointer; white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button:hover { background: var(--row); }
.seg button.on { color: #fff; text-shadow: 0 -1px 0 rgba(0, 30, 70, .45);
  background: linear-gradient(180deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,.15) 50%, rgba(255,255,255,0) 51%, rgba(255,255,255,.12) 100%), var(--sel);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .25); }

/* sunken input wells */
.well, input[type="text"], input:not([type]), select {
  font: inherit; color: var(--ink); background: var(--well); border: 1px solid var(--well-edge); border-radius: 4px;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, .22); }
input:not([type]):focus, input[type="text"]:focus, select:focus { outline: none; border-color: var(--sel);
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, .22), 0 0 0 3px color-mix(in srgb, var(--sel) 38%, transparent); }
input::placeholder { color: var(--muted); opacity: .85; }
input[type="checkbox"], input[type="range"] { accent-color: var(--sel); }
kbd { font: 11px/1.4 ui-monospace, Menlo, monospace; color: var(--muted); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--row); }

/* autocomplete list */
.drop { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; margin-top: 3px; padding: 3px; display: none;
  max-height: 300px; overflow-y: auto; background: var(--glass-solid); border: 1px solid var(--glass-edge); border-radius: 6px; box-shadow: var(--shadow); }
.drop.open { display: block; }
.drop div { padding: 5px 9px; border-radius: 4px; cursor: pointer; }
.drop div small { color: var(--muted); margin-left: 6px; font-style: italic; }
.drop div.hi { color: #fff; background: linear-gradient(180deg, color-mix(in srgb, var(--sel) 80%, #fff), var(--sel)); }
.drop div.hi small { color: rgba(255, 255, 255, .8); }

/* scrollbars stay quiet */
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

/* ---------- info window (infowin.js): column on either side, or a floating window ---------- */
#info { position: fixed; z-index: 30; display: none; flex-direction: column; overflow: hidden; }
#info.show { display: flex; }
#info .grip, #info .scroll { zoom: var(--pz, 1); }
#info .scroll { overflow-y: auto; flex: 1; min-height: 0; padding: 10px 14px 16px; }
#info.docked { border-radius: 0; }
#info.docked.right { border-width: 0 0 0 1px; }
#info.docked.left { border-width: 0 1px 0 0; }
#info.docked.short { border-bottom-width: 1px; }
#info.docked.right.short { border-bottom-left-radius: 8px; }
#info.docked.left.short { border-bottom-right-radius: 8px; }
#info.float { max-height: min(78vh, 680px); }
#info.busy { user-select: none; }
@media (max-width: 640px) { #info.docked { top: auto !important; left: 0 !important; right: 0 !important; bottom: 0 !important; width: 100% !important; height: 46vh !important; border-width: 1px 0 0 0; border-radius: 8px 8px 0 0; } }
#info .grip { display: flex; align-items: center; gap: 6px; padding: 7px 8px 7px 14px; cursor: move; touch-action: none; user-select: none;
  background: var(--btn); border-bottom: 1px solid var(--btn-edge); flex: none; }
#info .grip h2 { flex: 1; margin: 0; font-size: 15px; font-weight: 700; text-shadow: var(--btn-emboss); }
#info .grip button { width: 22px; height: 20px; padding: 0; border: 1px solid var(--btn-edge); border-radius: 4px; background: var(--btn);
  color: var(--btn-ink); font-size: 13px; line-height: 1; cursor: pointer; box-shadow: inset 0 1px 0 var(--glass-hi); }
#info .grip button:hover { filter: brightness(1.1); }
#info.docked .grip .dk { display: none; }
/* resize handles */
#info .rz { position: absolute; touch-action: none; z-index: 2; }
#info .rz-e { top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
#info.right .rz-e { left: 0; } #info.left .rz-e { right: 0; }
#info .rz-b { left: 0; right: 0; bottom: 0; height: 7px; cursor: ns-resize; }
#info .rz-bl, #info .rz-br { bottom: 0; width: 16px; height: 16px; }
#info .rz-bl { left: 0; cursor: nesw-resize; } #info .rz-br { right: 0; cursor: nwse-resize; }
#info.right .rz-e:hover, #info.right .rz-e:active { background: linear-gradient(90deg, var(--sel) 0 2px, transparent 2px); }
#info.left .rz-e:hover, #info.left .rz-e:active { background: linear-gradient(270deg, var(--sel) 0 2px, transparent 2px); }
#info .rz-b:hover, #info .rz-b:active { background: linear-gradient(0deg, var(--sel) 0 2px, transparent 2px); }
#info .rz-bl::after, #info .rz-br::after { content: ''; position: absolute; inset: 3px; opacity: .7;
  background: linear-gradient(135deg, transparent 50%, var(--muted) 50%, var(--muted) 58%, transparent 58%, transparent 72%, var(--muted) 72%, var(--muted) 80%, transparent 80%); }
#info .rz-bl::after { transform: scaleX(-1); }
#info.float .rz-e, #info.float .rz-b, #info.docked .rz-bl, #info.docked .rz-br { display: none; }
@media (max-width: 640px) { #info.docked .rz { display: none; } }
/* Aero-style snap preview while dragging the window to a side */
.snap-ghost { position: fixed; z-index: 29; bottom: 0; display: none; pointer-events: none; border: 2px solid color-mix(in srgb, var(--sel) 70%, #fff);
  background: color-mix(in srgb, var(--sel) 18%, transparent); box-shadow: inset 0 0 30px color-mix(in srgb, var(--sel) 35%, transparent);
  backdrop-filter: blur(2px); border-radius: 6px; }
.snap-ghost.on { display: block; } .snap-ghost.left { left: 4px; } .snap-ghost.right { right: 4px; }
/* contents */
#info .meta { color: var(--muted); font-size: 12.5px; margin: 0 0 6px; }
#info .crumb { font-size: 12px; color: var(--muted); margin-top: 8px; }
#info .crumb a { color: var(--muted); cursor: pointer; text-decoration: underline dotted; }
#info .crumb a:hover { color: var(--accent); }
#info .ex { font-size: 13px; margin-top: 6px; }
#info .wk { display: flow-root; margin-top: 8px; }  /* text wraps around the floated picture */
#info .wk img { float: left; margin: 3px 12px 6px 0; width: 130px; max-width: 40%; background: #fff; padding: 3px; border: 1px solid var(--well-edge); border-radius: 3px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
#info .ety { font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
#info .ety b { color: var(--ink); }
#info .ety .pie { font-size: 12px; opacity: .8; margin-top: 2px; }
#info .sum { font-size: 13px; }
#info .sum a { font-size: 12.5px; }
#info .si { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 4px; }
@media (max-width: 520px) { #info .wk img { float: none; display: block; margin: 0 0 8px; width: 100%; max-width: 100%; max-height: 180px; object-fit: cover; } }

html, body { height: 100%; }
body { display: flex; flex-direction: column; background: var(--sky); }
nav { flex: none; height: 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 0 12px;
  background: var(--btn); border-bottom: 1px solid var(--btn-edge); box-shadow: inset 0 1px 0 var(--glass-hi), 0 1px 4px rgba(0,0,0,.2); position: relative; z-index: 1; }
.brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 14px; letter-spacing: -.2px; text-shadow: var(--btn-emboss); }
.orb { width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--go-edge); box-shadow: 0 1px 2px rgba(0,0,0,.3);
  background: radial-gradient(circle at 38% 28%, #fff 0 10%, transparent 40%), radial-gradient(circle at 50% 75%, #9cf0ae, var(--go) 75%); }
nav .seg { justify-self: center; }
nav .seg button { min-width: 78px; }
@media (max-width: 520px) { nav .seg button { min-width: 0; padding: 0 10px; } }
nav .keys { justify-self: end; color: var(--muted); font-size: 11.5px; }
@media (max-width: 520px) { nav .keys, .brand span { display: none; } nav { grid-template-columns: auto 1fr auto; } }
iframe { flex: 1; width: 100%; border: 0; display: none; background: transparent; }
iframe.on { display: block; }

<script>window.METAVITA_DATA = {"animals":{"nodes":{"33208":{"n":"Metazoa","r":"kingdom","d":"Biological kingdom","x":"Animals are multicellular, eukaryotic organisms belonging to the biological kingdom Animalia. Animals consume organic material, breathe oxygen, have muscle cells, can reproduce sexually, and grow from a hollow sphere of cells, the blastula, during embryonic development.","u":"https://en.wikipedia.org/wiki/Animal","i":"img/33208.jpg","e":"Greek <b>μετά<\/b> (<i>metá<\/i>, \"after, beyond\") + <b>ζῷα<\/b> (<i>zôia<\/i>, \"animals\"): coined by Ernst Haeckel."},"6072":{"p":"33208","n":"Eumetazoa","r":"clade","d":"Basal animal clade as a sister group of the Porifera","x":"Eumetazoa, also known as Epitheliozoa or Histozoa, is a proposed animal subkingdom as a sister group of the basal phylum Porifera (sponges), and is further divided into the more basal clade Ctenophora and the much larger group ParaHoxozoa, which include Cnidaria, Bilateria and Placozoa. Eumetazoans contrast with…","u":"https://en.wikipedia.org/wiki/Eumetazoa","i":"img/6072.jpg","e":"Greek <b>εὖ<\/b> (<i>eû<\/i>) \"well, truly\" + <b>Metazoa<\/b> \"animals\": the \"true animals,\" everything here except the sponge."},"33213":{"p":"6072","n":"Bilateria","r":"clade","d":"Animals with embryonic bilateral symmetry","x":"Bilateria is a large clade of animals characterised by bilateral symmetry during embryonic development. This means their body plans are laid around a longitudinal axis with a front and a rear end, as well as a left–right–symmetrical belly (ventral) and back (dorsal) surface.","u":"https://en.wikipedia.org/wiki/Bilateria","i":"img/33213.jpg","e":"Latin <b>bi-<\/b> \"two\" + <b>latus, lateris<\/b> \"side\": two-sided, for bilateral symmetry."},"33511":{"p":"33213","n":"Deuterostomia","r":"clade","d":"Superphylum of bilateral animals","x":"Deuterostomes are bilaterian animals of the superphylum Deuterostomia, which are typically characterized by their blastopore becoming their anus during embryonic development. Deuterostomia comprises three phyla: Chordata, Echinodermata, Hemichordata, and the extinct clade Cambroernida.","u":"https://en.wikipedia.org/wiki/Deuterostome","i":"img/33511.jpg","e":"Greek <b>δεύτερος<\/b> (<i>deúteros<\/i>) \"second\" + <b>στόμα<\/b> (<i>stóma<\/i>) \"mouth\": the mouth forms second in the embryo, after the anus."},"7742":{"p":"33511","n":"Vertebrata","r":"clade","d":"Subphylum of chordates","x":"Vertebrates, also called craniates, are animals with a vertebral column and a cranium. The vertebral column surrounds and protects the spinal cord, while the cranium protects the brain.","u":"https://en.wikipedia.org/wiki/Vertebrate","i":"img/7742.jpg","e":"Latin <b>vertebratus<\/b> \"jointed\" ← <b>vertebra<\/b> \"joint\" ← <b>vertere<\/b> \"to turn\": animals with jointed backbones."},"7776":{"p":"7742","n":"Gnathostomata","r":"clade","d":"Infraphylum of vertebrates","x":"Gnathostomata are jawed vertebrates. Gnathostome diversity comprises roughly 60,000 species, which accounts for 99% of all extant vertebrates, including all living bony fishes and cartilaginous fishes, as well as extinct prehistoric fish such as placoderms and acanthodians.","u":"https://en.wikipedia.org/wiki/Gnathostomata","i":"img/7776.jpg","e":"Greek <b>γνάθος<\/b> (<i>gnáthos<\/i>) \"jaw\" + <b>στόμα<\/b> (<i>stóma<\/i>) \"mouth\": jawed mouths.","ep":"PIE <b><i>*ǵénu-<\/i><\/b> \"jaw, chin\" (probably, in γνάθος) → English <b>chin<\/b>"},"117571":{"p":"7776","n":"Euteleostomi","r":"clade","d":"Diverse clade of vertebrate animals","x":"Osteichthyes, also known as osteichthyans or commonly referred to as the bony fish, is a diverse clade of vertebrate animals that have endoskeletons primarily composed of bone tissue, encompassing both the conventional bony fishes and, in a cladistic sense, all tetrapods, including mammals and reptiles. They can be…","u":"https://en.wikipedia.org/wiki/Osteichthyes","i":"img/117571.jpg","e":"Greek <b>εὖ<\/b> (<i>eû<\/i>) \"truly\" + <b>τέλεος<\/b> (<i>téleos<\/i>) \"complete\" + <b>ὀστέον<\/b> (<i>ostéon<\/i>) \"bone\" + <b>στόμα<\/b> (<i>stóma<\/i>) \"mouth\": the bony fishes and their land-dwelling descendants. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"8287":{"p":"117571","n":"Sarcopterygii","r":"superclass","d":"Clade of lobe-finned fish","x":"Sarcopterygii is a clade of vertebrate animals which includes a group of bony fishes and all four legged land animals, including humans. The common name for this clade is lobe-finned fish.","u":"https://en.wikipedia.org/wiki/Sarcopterygii","i":"img/8287.jpg","e":"Greek <b>σάρξ<\/b> (<i>sárx<\/i>) \"flesh\" + <b>πτέρυξ<\/b> (<i>ptérux<\/i>) \"wing, fin\": fleshy, lobed fins, the fins that became legs.","ep":"PIE <b><i>*peth₂-<\/i><\/b> \"to fly, spread out\" (in πτέρυξ) → English <b>feather<\/b>"},"32523":{"p":"8287","n":"Tetrapoda","r":"clade","d":"Clade of the first four-limbed vertebrates and their descendants","x":"A tetrapod is any vertebrate animal of the clade Tetrapoda. The main diagnostic and defining trait (synapomorphy) of tetrapods is having four limbs, connected to the shoulder- and pelvic girdles, for which the group is named.","u":"https://en.wikipedia.org/wiki/Tetrapod","i":"img/32523.jpg","e":"Greek <b>τετρα-<\/b> (<i>tetra-<\/i>) \"four\" + <b>πούς<\/b> (<i>poús<\/i>) \"foot\": four-footed. The name was coined in 1896.","ep":"PIE <b><i>*kʷetwóres<\/i><\/b> → English <b>four<\/b> · PIE <b><i>*pṓds<\/i><\/b> → English <b>foot<\/b>"},"32524":{"p":"32523","n":"Amniota","r":"clade","d":"Clade of tetrapods","x":"Amniotes are tetrapod vertebrate animals belonging to the clade Amniota, a large group that comprises the vast majority of living terrestrial and semiaquatic vertebrates. Amniotes evolved from amphibious stem tetrapod ancestors during the Carboniferous period.","u":"https://en.wikipedia.org/wiki/Amniote","i":"img/32524.jpg","e":"Greek <b>ἀμνίον<\/b> (<i>amníon<\/i>) \"the membrane around the fetus\": animals whose embryos grow inside an amnion."},"40674":{"p":"32524","n":"Mammalia","r":"class","d":"Class of animals with milk-producing glands","x":"A mammal is a vertebrate animal of the class Mammalia. Mammals are characterized by the presence of milk-producing mammary glands for feeding their young, a broad neocortex region of the brain, fur or hair, and three middle ear bones.","u":"https://en.wikipedia.org/wiki/Mammal","i":"img/40674.jpg","e":"Latin <b>mamma<\/b> \"breast\": coined by Linnaeus in 1758, replacing his earlier name Quadrupedia."},"32525":{"p":"40674","n":"Theria","r":"clade","d":"Subclass of mammals in the clade Theriiformes","x":"Theria is a subclass of mammals amongst the Theriiformes. Theria contains the eutherians and the metatherians but excludes the egg-laying monotremes and various extinct mammals evolving prior to the common ancestor of placentals and marsupials.","u":"https://en.wikipedia.org/wiki/Theria","i":"img/32525.jpg","e":"Greek <b>θηρίον<\/b> (<i>thēríon<\/i>) \"wild beast\": the beasts, meaning marsupials plus placentals."},"9347":{"p":"32525","n":"Eutheria","r":"clade","d":"Clade of mammals in the subclass Theria","x":"Eutheria, also called Pan-Placentalia, is the clade consisting of placental mammals and all therian mammals that are more closely related to placentals than to marsupials. Placentalia is the only surviving taxon of eutherians, and Eutheria is often used as a synonym of Placentalia in zoological contexts.","u":"https://en.wikipedia.org/wiki/Eutheria","i":"img/9347.jpg","e":"Greek <b>εὐ-<\/b> (<i>eu-<\/i>) \"true, well\" + <b>θηρίον<\/b> (<i>thēríon<\/i>) \"beast\": the \"true beasts,\" the placental mammals."},"311790":{"p":"9347","n":"Afrotheria","r":"superorder","d":"Superorder of mammals containing elephants and elephant shrews","x":"Afrotheria is a superorder of placental mammals, the living members of which belong to groups that are either currently living in Africa or of African origin: golden moles, elephant shrews, otter shrews, tenrecs, aardvarks, hyraxes, elephants, sea cows, and several extinct clades. Most groups of afrotheres share…","u":"https://en.wikipedia.org/wiki/Afrotheria","i":"img/311790.jpg","e":"Latin <b>Afro-<\/b> \"of Africa\" + Greek <b>θηρίον<\/b> (<i>thēríon<\/i>) \"beast\": the beasts of Africa, where the group arose."},"32561":{"p":"32524","n":"Sauria","r":"clade","d":"Clade of reptiles","x":"Sauria is the clade of diapsids containing the most recent common ancestor of Archosauria and Lepidosauria, and all its descendants. Since most molecular phylogenies recover turtles as more closely related to archosaurs than to lepidosaurs as part of Archelosauria, Sauria likely contains all living reptiles and can be…","u":"https://en.wikipedia.org/wiki/Sauria","i":"img/32561.jpg","e":"Greek <b>σαῦρος<\/b> (<i>saûros<\/i>) \"lizard, reptile\": the reptiles, birds included. Coined in French as <i>Sauriens<\/i> by Alexandre Brongniart in 1799."},"1329799":{"p":"32561","n":"Archelosauria","r":"clade","d":"Clade comprising turtles, birds and crocodilians","x":"Archelosauria is a clade grouping turtles and archosaurs and their closest\nrelatives, to the exclusion of lepidosaurs. Most phylogenetic analyses based on molecular data have supported a sister-group relationship between turtles and archosaurs.","u":"https://en.wikipedia.org/wiki/Archelosauria","i":"img/1329799.jpg","e":"<b>Arch<\/b>osauria + <b>Chel<\/b>onia (turtles), with Greek <b>σαῦρος<\/b> (<i>saûros<\/i>) \"lizard\": crocodiles, birds and turtles together. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"8492":{"p":"1329799","n":"Archosauria","r":"clade","d":"Group of diapsids broadly classified as reptiles","x":"Archosauria or archosaurs is a clade of diapsid sauropsid tetrapods, with birds and crocodilians being the only known extant representatives. Although broadly classified as reptiles, which traditionally exclude birds, the cladistic sense of the term includes all living and extinct relatives of birds and crocodilians…","u":"https://en.wikipedia.org/wiki/Archosaur","i":"img/8492.jpg","e":"Greek <b>ἀρχός<\/b> (<i>archós<\/i>) \"chief, ruler\" + <b>σαῦρος<\/b> (<i>saûros<\/i>) \"lizard\": usually read as \"ruling reptiles.\" Edward Drinker Cope, who coined it in 1869, actually meant the arches of the skull."},"8782":{"p":"8492","n":"Aves","r":"class","d":"Warm-blooded animals with wings and feathers","x":"Birds are vertebrate animals constituting the class Aves, characterised by feathers, toothless beaked jaws, the laying of hard-shelled eggs, a high metabolic rate, a four-chambered heart, and a strong yet lightweight skeleton. They are warm-blooded, live worldwide, and range in size from the 5.5 cm (2.2 in) bee…","u":"https://en.wikipedia.org/wiki/Bird","i":"img/8782.jpg","e":"Latin <b>avēs<\/b>, plural of <b>avis<\/b> \"bird\": the birds."},"8825":{"p":"8782","n":"Neognathae","r":"infraclass","d":"Infraclass of birds","x":"Neognathae is an infraclass of birds, called neognaths, within the class Aves of the clade Archosauria. Neognathae includes the majority of living birds; the exceptions being the tinamous and the flightless ratites, which belong instead to the sister taxon Palaeognathae.","u":"https://en.wikipedia.org/wiki/Neognathae","i":"img/8825.jpg","e":"Greek <b>νέος<\/b> (<i>néos<\/i>) \"new\" + <b>γνάθος<\/b> (<i>gnáthos<\/i>) \"jaw\": \"new jaws,\" for the more modern palate bones."},"3078114":{"p":"8825","n":"Neoaves","r":"clade","d":"Clade of birds","x":"Neoaves is a clade that consists of all modern birds with the exception of Palaeognathae and Galloanserae. This group is defined in the PhyloCode by George Sangster and colleagues in 2022 as \"the most inclusive crown clade containing Passer domesticus, but not Gallus gallus\".","u":"https://en.wikipedia.org/wiki/Neoaves","i":"img/3078114.jpg","e":"Greek <b>νεο-<\/b> (<i>neo-<\/i>) \"new\" + Latin <b>avēs<\/b> \"birds\": every bird except fowl, ducks and ratites."},"3073812":{"p":"3078114","n":"Aequornithes","r":"clade","d":"Clade of birds","x":"Aequornithes, or core water birds, are defined in the PhyloCode as \"the least inclusive crown clade containing Pelecanus onocrotalus and Gavia immer\", that is, the last common ancestor of the great white pelican and the common loon, as well as its descendants, extinct and extant.","u":"https://en.wikipedia.org/wiki/Aequornithes","i":"img/3073812.jpg","e":"Latin <b>aequor<\/b> \"expanse of water\" + Greek <b>ὄρνιθες<\/b> (<i>órnithes<\/i>) \"birds\": the core water birds."},"1294634":{"p":"8492","n":"Crocodylia","r":"order","d":"Order of reptiles","x":"Crocodylia or Crocodilia is an order of semiaquatic, predatory reptiles that are known as crocodilians. They appeared 83.5 million years ago in the Late Cretaceous period and are the closest living relatives of birds, as the two groups are the only known survivors of the Archosauria.","u":"https://en.wikipedia.org/wiki/Crocodylia","i":"img/1294634.jpg","e":"Greek <b>κροκόδειλος<\/b> (<i>krokódeilos<\/i>) \"lizard; Nile crocodile,\" likely from <b>κρόκη<\/b> (<i>krókē<\/i>) \"pebble\" + <b>δρῖλος<\/b> (<i>drîlos<\/i>) \"worm\": a \"pebble worm\" basking on the riverbank."},"1294636":{"p":"1294634","n":"Alligatoridae","r":"family","d":"Family of crocodilians including alligators and caimans","x":"The family Alligatoridae of crocodilians includes alligators, caimans and their extinct relatives.","u":"https://en.wikipedia.org/wiki/Alligatoridae","i":"img/1294636.jpg","e":"<b>Alligator<\/b> ← Spanish <b>el lagarto<\/b> \"the lizard\" + <b>-idae<\/b> \"family\": alligators and caimans."},"1437010":{"p":"9347","n":"Boreoeutheria","r":"clade","d":"Magnorder of mammals containing Laurasiatheria and Euarchontoglires","x":"Boreoeutheria is a magnorder of placental mammals that groups together superorders Euarchontoglires and Laurasiatheria. The clade includes groups as diverse as giraffes, pigs, zebras, rhinoceroses, dogs, cats, rabbits, mice, bats, whales, dolphins, and primates.","u":"https://en.wikipedia.org/wiki/Boreoeutheria","i":"img/1437010.jpg","e":"Greek <b>Βορέας<\/b> (<i>Boréas<\/i>) \"the north wind, the North\" + <b>εὐ-<\/b> (<i>eu-<\/i>) \"true\" + <b>θηρίον<\/b> (<i>thēríon<\/i>) \"beast\": the northern true beasts."},"314145":{"p":"1437010","n":"Laurasiatheria","r":"superorder","d":"Superorder of mammals","x":"Laurasiatheria is a superorder of placental mammals that groups together true insectivores (eulipotyphlans), bats (chiropterans), carnivorans, pangolins (pholidotes), even-toed ungulates (artiodactyls), odd-toed ungulates (perissodactyls), and all their extinct relatives (pan-euungulates). From systematics and…","u":"https://en.wikipedia.org/wiki/Laurasiatheria","i":"img/314145.jpg","e":"<b>Laurasia<\/b> + Greek <b>θηρίον<\/b> (<i>thēríon<\/i>) \"beast\": named for the northern supercontinent Laurasia, where the group arose."},"91561":{"p":"314145","n":"Artiodactyla","r":"order","d":"Order of mammals","x":"Artiodactyla is an order of placental mammals. Typically, they are ungulates which bear weight equally on two of their five toes.","u":"https://en.wikipedia.org/wiki/Artiodactyla","i":"img/91561.jpg","e":"Greek <b>ἄρτιος<\/b> (<i>ártios<\/i>) \"even\" + <b>δάκτυλος<\/b> (<i>dáktylos<\/i>) \"finger, toe\": even-toed."},"9835":{"p":"91561","n":"Camelidae","r":"family","d":"Family of mammals","x":"Camelidae is a family of mammals belonging to the ungulate order Artiodactyla and the only living family in the suborder Tylopoda. The seven extant species of camelid are divided into two tribes, Camelini, including dromedary camels, Bactrian camels and wild Bactrian camels, and Lamini, including llamas, alpacas,…","u":"https://en.wikipedia.org/wiki/Camelidae","i":"img/9835.jpg","e":"<b>Camelus<\/b>, the camel genus + <b>-idae<\/b> \"family\": the camel family."},"1329961":{"p":"32561","n":"Bifurcata","r":"clade","d":"Clade of reptiles","x":"Bifurcata is a clade of squamate reptiles containing all living squamates except the dibamids. The group was named by Nicolas Vidal and S.","u":"https://en.wikipedia.org/wiki/Bifurcata","i":"img/1329961.jpg","e":"Latin <b>bifurcātus<\/b> \"forked\": for the forked tongue all its members share."},"1329950":{"p":"1329961","n":"Unidentata","r":"clade","d":"Clade of squamate reptiles","x":"Unidentata is a clade of squamate reptiles that includes all living squamates except dibamids and gekkotans. The clade was named by Nicolas Vidal and S.","u":"https://en.wikipedia.org/wiki/Unidentata","e":"Latin <b>ūni-<\/b> \"one\" + <b>dentāta<\/b> \"toothed\": for the single egg tooth the hatchlings use to cut out of the shell."},"1329911":{"p":"1329950","n":"Toxicofera","r":"clade","d":"Clade of scaled reptiles","x":"Toxicofera is a clade of scaled reptiles (squamates) that includes the Serpentes (snakes), Anguimorpha and Iguania. Toxicofera contains about 4,600 species of extant Squamata.","u":"https://en.wikipedia.org/wiki/Toxicofera","i":"img/1329911.jpg","e":"Greek <b>τοξικόν<\/b> (<i>toxikón<\/i>) \"poison\" + Latin <b>ferre<\/b> \"to bear\": the toxin-bearers, snakes and venomous lizards."},"8570":{"p":"1329911","n":"Serpentes","r":"infraorder","d":"Limbless, scaly, elongate reptile","x":"Snakes are limbless reptiles of the squamate suborder Serpentes. Closely related to lizards and the tuatara, snakes are ectothermic, amniote, air-breathing vertebrates with an elongated rope-like body covered by overlapping scales, and they move around using undulatory, rectilinear, concertina, sidewinding or…","u":"https://en.wikipedia.org/wiki/Snake","i":"img/8570.jpg","e":"Latin <b>serpentēs<\/b>, plural of <b>serpēns<\/b> \"snake,\" literally \"creeper,\" from the same root as Greek <b>ἕρπω<\/b> (<i>hérpō<\/i>) \"I crawl\"."},"34979":{"p":"8570","n":"Henophidia","r":"superfamily","d":"Group of snakes","x":"Henophidia is a former parvorder of the suborder Serpentes (snakes) that contains boas, pythons and numerous other less-well-known snakes.","u":"https://en.wikipedia.org/wiki/Henophidia","i":"img/34979.jpg","e":"Greek <b>ἕνος<\/b> (<i>hénos<\/i>) \"former, old\" + <b>Ophidia<\/b> \"snakes\": the \"older snakes,\" in contrast to Caenophidia, the \"newer snakes\"."},"8572":{"p":"34979","n":"Boidae","r":"family","d":"Family of snakes","x":"The Boidae, commonly known as boas or boids, are a family of nonvenomous snakes primarily found in the Americas, as well as Africa, Europe, Asia, and some Pacific islands. Boas include some of the world's largest snakes, with the green anaconda of South America being the heaviest and second-longest snake known; in…","u":"https://en.wikipedia.org/wiki/Boidae","i":"img/8572.jpg","e":"<b>Boa<\/b> + <b>-idae<\/b> \"family\": the boas."},"6073":{"p":"6072","n":"Cnidaria","r":"phylum","d":"Aquatic animal phylum having cnidocytes","x":"Cnidaria is a phylum of animals containing over 11,000 species of aquatic invertebrates found both in freshwater and marine environments, including jellyfish, hydroids, sea anemones, corals and some of the smallest marine parasites. Their distinguishing features are a simple nerve net distributed throughout a…","u":"https://en.wikipedia.org/wiki/Cnidaria","i":"img/6073.jpg","e":"Greek <b>κνίδη<\/b> (<i>knídē<\/i>) \"nettle\": named for their stinging cells."},"6102":{"p":"6073","n":"Hexacorallia","r":"subclass","d":"Class of cnidarians with 6-fold symmetry","x":"Hexacorallia is a class of Anthozoa.","u":"https://en.wikipedia.org/wiki/Hexacorallia","i":"img/6102.jpg","e":"Greek <b>ἑξα-<\/b> (<i>hexa-<\/i>) \"six\" + <b>Corallium<\/b> \"coral\": stony corals and sea anemones."},"32443":{"p":"117571","n":"Teleostei","r":"infraclass","d":"Division or infraclass of fishes","x":"Teleostei, members of which are known as teleosts, is, by far, the largest group of ray-finned fishes, with 96% of all extant species of fish. The Teleostei, which is variously considered a division or an infraclass in different taxonomic systems, include over 26,000 species that are arranged in about 40 orders and…","u":"https://en.wikipedia.org/wiki/Teleost","i":"img/32443.jpg","e":"Greek <b>τέλεος<\/b> (<i>téleos<\/i>) \"complete\" + <b>ὀστέον<\/b> (<i>ostéon<\/i>) \"bone\": complete bones."},"186625":{"p":"32443","n":"Clupeocephala","r":"clade","d":"Division or infraclass of fishes","x":"Teleostei, members of which are known as teleosts, is, by far, the largest group of ray-finned fishes, with 96% of all extant species of fish. The Teleostei, which is variously considered a division or an infraclass in different taxonomic systems, include over 26,000 species that are arranged in about 40 orders and…","u":"https://en.wikipedia.org/wiki/Teleost","i":"img/186625.jpg","e":"Latin <b>clupea<\/b> \"herring\" + Greek <b>κεφαλή<\/b> (<i>kephalḗ<\/i>) \"head\". <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"1489388":{"p":"186625","n":"Euteleosteomorpha","r":"cohort","d":"Clade of ray-finned fishes","x":"Euteleostei, whose members are known as euteleosts, is a clade of bony fishes within Teleostei. The oldest known fossil remains are only from the Early Cretaceous.","u":"https://en.wikipedia.org/wiki/Euteleostei","i":"img/1489388.jpg","e":"Greek <b>εὐ-<\/b> (<i>eu-<\/i>) \"true\" + <b>teleost<\/b> (<b>τέλεος<\/b> \"complete\" + <b>ὀστέον<\/b> \"bone\") + <b>μορφή<\/b> (<i>morphḗ<\/i>) \"form\". <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"123368":{"p":"1489388","n":"Acanthomorphata","r":"clade","d":"Clade of fishes","x":"Acanthomorpha is an extraordinarily diverse taxon of teleost fishes with spiny fin rays. The clade contains about one-third of the world's modern species of vertebrates: over 14,000 species.","u":"https://en.wikipedia.org/wiki/Acanthomorpha","si":"Acanthomorpha","i":"img/123368.jpg","e":"Greek <b>ἄκανθα<\/b> (<i>ákantha<\/i>) \"thorn, spine\" + <b>μορφή<\/b> (<i>morphḗ<\/i>) \"form\": the spiny-rayed fishes. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"1489872":{"p":"123368","n":"Percomorphaceae","r":"clade","d":"Clade of ray-finned fishes","x":"Percomorpha is an extremely large and diverse clade of ray-finned fish.","u":"https://en.wikipedia.org/wiki/Percomorpha","i":"img/1489872.jpg","e":"Latin <b>perca<\/b> \"perch\" + Greek <b>μορφή<\/b> (<i>morphḗ<\/i>) \"shape\": perch-shaped fishes, a huge spiny-finned group."},"1489922":{"p":"1489872","n":"Eupercaria","r":"clade","d":"Clade of ray-finned fishes","x":"Percomorpha is an extremely large and diverse clade of ray-finned fish.","u":"https://en.wikipedia.org/wiki/Percomorpha","i":"img/1489922.jpg","e":"Greek <b>εὐ-<\/b> (<i>eu-<\/i>) \"true\" + Latin <b>perca<\/b> \"perch\": the \"true perches\" and their kin. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"9348":{"p":"9347","n":"Xenarthra","r":"superorder","d":"Superorder of mammals including anteaters, sloths, and armadillos","x":"Xenarthra is a superorder and major clade of placental mammals native to the Americas. There are 31 living species: the anteaters, tree sloths, and armadillos.","u":"https://en.wikipedia.org/wiki/Xenarthra","i":"img/9348.jpg","e":"Greek <b>ξένος<\/b> (<i>xénos<\/i>) \"strange\" + <b>ἄρθρον<\/b> (<i>árthron<\/i>) \"joint\": for the extra joints between their lower vertebrae."},"948950":{"p":"9348","n":"Pilosa","r":"order","d":"Order of mammals","x":"Pilosa is an order of xenarthran placental mammals, native to the Americas. They include anteaters and sloths.","u":"https://en.wikipedia.org/wiki/Pilosa","i":"img/948950.jpg","e":"Latin <b>pilōsa<\/b> \"hairy\": sloths and anteaters."},"35500":{"p":"91561","n":"Pecora","r":"infraorder","d":"Infraorder of mammals","x":"Pecora is a clade of even-toed hoofed mammals (Artiodactyla) with ruminant digestion. Most Pecorans have cranial appendages projecting from their frontal bones; only two extant genera lack them, Hydropotes and Moschus.","u":"https://en.wikipedia.org/wiki/Pecora","i":"img/35500.jpg","e":"Latin <b>pecus, pecoris<\/b> \"cattle, livestock\": a name coined by Linnaeus."},"9895":{"p":"35500","n":"Bovidae","r":"family","d":"Family of mammals belonging to even-toed ungulates","x":"Bovidae is the biological family of cloven-hoofed, ruminant mammals that includes cattle, bison, buffalo, antelopes, and goat-antelopes such as sheep and goats. There are 143 extant species and 300 known extinct species of bovids, which are divided into either 11 major subfamilies, or two subfamilies with 13 tribes.","u":"https://en.wikipedia.org/wiki/Bovidae","i":"img/9895.jpg","e":"Latin <b>bōs, bovis<\/b> \"ox\" + <b>-idae<\/b> \"family\": the cattle family."},"33554":{"p":"314145","n":"Carnivora","r":"order","d":"Order of mammals","x":"Carnivora is an order of placental mammals specialised primarily in eating flesh, whose members are formally referred to as carnivorans. The order Carnivora is the sixth largest order of mammals, comprising at least 293 species.","u":"https://en.wikipedia.org/wiki/Carnivora","i":"img/33554.jpg","e":"Latin <b>carō, carnis<\/b> \"flesh\" + <b>vorāre<\/b> \"to devour\": flesh-eaters (the giant panda included, despite its bamboo diet)."},"379584":{"p":"33554","n":"Caniformia","r":"suborder","d":"Suborder of mammals","x":"Caniformia is a suborder within the order Carnivora consisting of \"dog-like\" carnivorans. They include dogs, bears, raccoons, mustelids, and pinnipeds.","u":"https://en.wikipedia.org/wiki/Caniformia","i":"img/379584.jpg","e":"Latin <b>canis<\/b> \"dog\" + <b>-fōrmis<\/b> \"shaped\": dog-shaped carnivores (bears and seals included)."},"9608":{"p":"379584","n":"Canidae","r":"family","d":"Family of mammals","x":"Canidae is a biological family of caniform carnivorans, constituting a clade. A member of this family is a canid, colloquially referred to as dogs.","u":"https://en.wikipedia.org/wiki/Canidae","i":"img/9608.jpg","e":"Latin <b>canis<\/b> \"dog\" + <b>-idae<\/b> \"family\": the dog family."},"9625":{"p":"9608","n":"Vulpes","r":"genus","d":"Genus of true foxes","x":"Vulpes is a genus of the subfamily Caninae. The members of this genus are colloquially referred to as true foxes, meaning they form a proper clade.","u":"https://en.wikipedia.org/wiki/Vulpes","i":"img/9625.jpg","e":"Latin <b>vulpēs<\/b> \"fox.\""},"33317":{"p":"33213","n":"Protostomia","r":"clade","d":"Clade of animals whose mouth develops before the anus","x":"Protostomia is the clade of animals once thought to be characterized by the creature's blastopore becoming its mouth during embryonic development. This nature has since been discovered to be extremely variable among Protostomia's members, although the reverse is typically true of its sister clade, Deuterostomia.","u":"https://en.wikipedia.org/wiki/Protostome","i":"img/33317.jpg","e":"Greek <b>πρωτο-<\/b> (<i>prōto-<\/i>) \"first\" + <b>στόμα<\/b> (<i>stóma<\/i>) \"mouth\": the embryo's first opening was once thought to always become the mouth.","ep":"PIE <b><i>*per-<\/i><\/b> → English <b>first<\/b>"},"1206794":{"p":"33317","n":"Ecdysozoa","r":"clade","d":"Superphylum of protostomes","x":"Ecdysozoa is a group of protostome animals, including Arthropoda, Nematoda, and several smaller phyla. The grouping of these animal phyla into a single clade was first proposed by Eernisse et al.","u":"https://en.wikipedia.org/wiki/Ecdysozoa","i":"img/1206794.jpg","e":"Greek <b>ἔκδυσις<\/b> (<i>ékdusis<\/i>) \"shedding\" + <b>ζῷον<\/b> (<i>zôion<\/i>) \"animal\": the animals that molt.","ep":"PIE <b><i>*gʷeyh₃-<\/i><\/b> \"to live\" (in ζῷον) → English <b>quick<\/b>, in its old sense \"alive\""},"88770":{"p":"1206794","n":"Panarthropoda","r":"clade","d":"Clade of animals","x":"Panarthropoda is a clade comprising the greatest diversity of animal groups. It contains the extant phyla Arthropoda (Euarthropoda), Tardigrada and Onychophora, although the relationships among these remained uncertain according to studies published in 2023 and 2024.","u":"https://en.wikipedia.org/wiki/Panarthropoda","i":"img/88770.jpg","e":"Greek <b>παν-<\/b> (<i>pan-<\/i>) \"all\" + <b>Arthropoda<\/b>: the arthropods plus tardigrades and velvet worms."},"6656":{"p":"88770","n":"Arthropoda","r":"phylum","d":"Phylum of invertebrates with jointed exoskeletons","x":"Arthropods are invertebrates in the phylum Arthropoda. They possess an exoskeleton with a cuticle made of chitin, often mineralised with calcium carbonate, a body with differentiated (metameric) segments, and paired jointed appendages.","u":"https://en.wikipedia.org/wiki/Arthropod","i":"img/6656.jpg","e":"Greek <b>ἄρθρον<\/b> (<i>árthron<\/i>) \"joint\" + <b>πούς, ποδός<\/b> (<i>poús, podós<\/i>) \"foot\": jointed feet.","ep":"PIE <b><i>*pṓds<\/i><\/b> → English <b>foot<\/b>"},"197563":{"p":"6656","n":"Mandibulata","r":"clade","d":"Clade of arthropods","x":"The clade Mandibulata constitutes one of the two major living subdivisions of the phylum Arthropoda, alongside Chelicerata. Mandibulates include the myriapods, and the pancrustaceans.","u":"https://en.wikipedia.org/wiki/Mandibulata","i":"img/197563.jpg","e":"Latin <b>mandibula<\/b> \"jaw\" + <b>-ata<\/b>: the arthropods with mandibles, insects, crustaceans and myriapods."},"3701028":{"p":"197563","n":"Altocrustacea","r":"clade","d":"Clade comprising all crustaceans and hexapods","x":"Pancrustacea is a major clade of arthropods that comprises all crustaceans and hexapods. This grouping is contrary to the Atelocerata hypothesis, in which Hexapoda and Myriapoda are sister taxa, and Crustacea are only more distantly related.","u":"https://en.wikipedia.org/wiki/Pancrustacea","i":"img/3701028.jpg","e":"Latin <b>altus<\/b> \"high\" + <b>Crustacea<\/b>: insects plus their closest crustacean relatives. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"85512":{"p":"3701028","n":"Dicondylia","r":"clade","d":"Unranked taxon","x":"Dicondylia is a taxonomic group (taxon) that includes all insects except the jumping bristletails (Archaeognatha). Dicondylia species have a mandible attached with two hinges to the head capsule (dicondyl), in contrast to a hypothetical ancestral mandible with a single ball joint (monocondyl); the members of…","u":"https://en.wikipedia.org/wiki/Dicondylia","i":"img/85512.jpg","e":"Greek <b>δικόνδυλος<\/b> (<i>dikóndulos<\/i>) \"two-jointed\": for the double-hinged jaw."},"7496":{"p":"85512","n":"Pterygota","r":"subclass","d":"Subclass of insects","x":"Pterygota is a subclass of insects that includes all winged insects and groups which lost them secondarily.","u":"https://en.wikipedia.org/wiki/Pterygota","i":"img/7496.jpg","e":"Greek <b>πτερυγωτός<\/b> (<i>pterugōtós<\/i>) \"winged\": the winged insects.","ep":"PIE <b><i>*peth₂-<\/i><\/b> \"to fly\" (in πτέρυξ) → English <b>feather<\/b>"},"33340":{"p":"7496","n":"Neoptera","r":"infraclass","d":"Infraclass of insects","x":"Neoptera is a classification group that includes most orders of the winged insects, specifically those that can flex their wings over their abdomens. This is in contrast with the more basal orders of winged insects, which are unable to flex their wings in this way.","u":"https://en.wikipedia.org/wiki/Neoptera","i":"img/33340.jpg","e":"Greek <b>νέος<\/b> (<i>néos<\/i>) \"new\" + <b>πτερόν<\/b> (<i>pterón<\/i>) \"wing\": \"new wings\" that can fold back over the body."},"3701061":{"p":"33340","n":"Eumetabola","r":"clade","d":"Clade of insects","x":"Eumetabola is an unranked clade of Neoptera. According to a phylogenetic analysis, the Eumetabola clade originated 390–350 million years ago, in the Late Devonian.","u":"https://en.wikipedia.org/wiki/Eumetabola","i":"img/3701061.jpg","e":"Greek <b>εὐ-<\/b> (<i>eu-<\/i>) \"true\" + <b>μεταβολή<\/b> (<i>metabolḗ<\/i>) \"change\". <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"33392":{"p":"3701061","n":"Endopterygota","r":"cohort","d":"Clade of insects","x":"Holometabola, also known as Endopterygota, is a supra-ordinal clade of insects within the infraclass Neoptera that go through distinctive larval, pupal, and adult stages. They undergo a radical metamorphosis, with the larval and adult stages differing considerably in their structure and behaviour.","u":"https://en.wikipedia.org/wiki/Holometabola","i":"img/33392.jpg","e":"Greek <b>ἐνδο-<\/b> (<i>endo-<\/i>) \"within\" + <b>πτέρυξ<\/b> (<i>ptérux<\/i>) \"wing\": the larvae grow their wings inside, out of sight, until the pupa. Also called Holometabola, \"complete change\"."},"3701062":{"p":"33392","n":"Aparaglossata","r":"clade","d":"Clade of insects","x":"Aparaglossata is a clade of insects comprising all modern holometabolous insects except for Hymenoptera. The clade is named for one of its most recognizable synapomorphies ; the absence of paraglossae.","u":"https://en.wikipedia.org/wiki/Aparaglossata","i":"img/3701062.jpg","e":"Greek <b>ἀ-<\/b> (<i>a-<\/i>) \"without\" + <b>παρά<\/b> (<i>pará<\/i>) \"beside\" + <b>γλῶσσα<\/b> (<i>glôssa<\/i>) \"tongue\": flies, moths and beetles. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"3701063":{"p":"3701062","n":"Panorpida","r":"clade","d":"Superorder of insects","x":"Panorpida or Mecopterida is a superorder of Holometabola. The conjectured monophyly of the Panorpida is historically based on morphological evidence, namely the reduction or loss of the ovipositor and several internal characteristics, including a muscle connecting a pleuron and the first axillary sclerite at the base…","u":"https://en.wikipedia.org/wiki/Panorpida","i":"img/3701063.jpg","e":"<b>Panorpa<\/b>, the scorpionfly genus + <b>-ida<\/b>: scorpionflies, flies, fleas, moths and butterflies."},"104431":{"p":"3701063","n":"Obtectomera","r":"clade","d":"Clade of macro-moths and butterflies","x":"The Obtectomera is a clade of macro-moths and butterflies, comprising over 100,000 species in at least 12 superfamilies. This clade was initially defined by a pupal stage with the four anterior abdominal segments fused and immobile as the sole synapomorphy, but was later revised to include the modification of the…","u":"https://en.wikipedia.org/wiki/Obtectomera","i":"img/104431.jpg","e":"Latin <b>obtectus<\/b> \"covered\" + Greek <b>μέρος<\/b> (<i>méros<\/i>) \"part\". <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"37569":{"p":"104431","n":"Bombycoidea","r":"superfamily","d":"Superfamily of moths","x":"Bombycoidea is a superfamily of moths, including the silk moths, sphinx moths, saturniids, and relatives. The superfamily Lasiocampoidea is a close relative and was historically sometimes merged in this group.","u":"https://en.wikipedia.org/wiki/Bombycoidea","i":"img/37569.jpg","e":"<b>Bombyx<\/b>, from Greek <b>βόμβυξ<\/b> (<i>bómbux<\/i>) \"silkworm\" + <b>-oidea<\/b> \"superfamily\": silk moths and atlas moths."},"41666":{"p":"32523","n":"Batrachia","r":"superorder","d":"Clade of amphibians","x":"The Batrachia are a clade of amphibians that includes frogs and salamanders, but not caecilians nor the extinct allocaudates. The name Batrachia was first used by French zoologist Pierre André Latreille in 1800 to refer to frogs, but has more recently been defined in a phylogenetic sense as a node-based taxon that…","u":"https://en.wikipedia.org/wiki/Batrachia","i":"img/41666.jpg","e":"Greek <b>βάτραχος<\/b> (<i>bátrachos<\/i>) \"frog\": once the name for frogs alone, now frogs plus salamanders."},"30367":{"p":"41666","n":"Salamandroidea","r":"superfamily","d":"Suborder of salamanders","x":"The Salamandroidea are a suborder of salamanders, referred to as advanced salamanders. The members of the suborder are found worldwide except for Antarctica, sub-Saharan Africa, and Oceania.","u":"https://en.wikipedia.org/wiki/Salamandroidea","i":"img/30367.jpg","e":"<b>Salamandra<\/b>, from Greek <b>σαλαμάνδρα<\/b> (<i>salamándra<\/i>) \"salamander\" + <b>-oidea<\/b> \"superfamily\": the salamanders and newts."},"314146":{"p":"1437010","n":"Euarchontoglires","r":"superorder","d":"Superorder of mammals","x":"Euarchontoglires, synonymous with Supraprimates, is a clade and a superorder of placental mammals, the living members of which belong to one of the five following groups: rodents, lagomorphs, treeshrews, primates, and colugos.","u":"https://en.wikipedia.org/wiki/Euarchontoglires","i":"img/314146.jpg","e":"<b>Euarchonta<\/b> (primates and their kin) + <b>Glires<\/b> (rodents and rabbits): a name stitched from its two halves."},"9443":{"p":"314146","n":"Primates","r":"order","d":"Order of mammals","x":"Primates is an order of mammals, which is further divided into the strepsirrhines, which include lemurs, galagos, and lorisids; and the haplorhines, which include tarsiers and simians. Primates arose 74–63 million years ago first from small terrestrial mammals, which adapted for life in tropical forests: many primate…","u":"https://en.wikipedia.org/wiki/Primate","i":"img/9443.jpg","e":"Latin <b>prīmās<\/b> \"one of the first, chief\": the first-ranked order, as Linnaeus saw it."},"314293":{"p":"9443","n":"Simiiformes","r":"infraorder","d":"Infraorder of primates","x":"The simians, anthropoids, or higher primates are primates of the infraorder Simiiformes, containing all animals traditionally called monkeys and apes. More precisely, they consist of the parvorders Platyrrhini and Catarrhini, the latter of which consists of the family Cercopithecidae and the superfamily Hominoidea.","u":"https://en.wikipedia.org/wiki/Simian","i":"img/314293.jpg","e":"Latin <b>sīmia<\/b> \"ape, monkey\" + <b>forma<\/b> \"shape\": monkey-shaped, the monkeys and apes."},"9526":{"p":"314293","n":"Catarrhini","r":"parvorder","d":"Group of Old World monkeys and apes","x":"The parvorder Catarrhini consists of the Cercopithecoidea and Hominoidea (apes). In 1812, Geoffroy grouped those two groups together and established the name Catarrhini, \"Old World monkeys\".","u":"https://en.wikipedia.org/wiki/Catarrhini","i":"img/9526.jpg","e":"Greek <b>κατά<\/b> (<i>katá<\/i>) \"down\" + <b>ῥίς, ῥινός<\/b> (<i>rhís, rhinós<\/i>) \"nose\": nostrils that face downward, like ours."},"9528":{"p":"9526","n":"Cercopithecinae","r":"subfamily","d":"Subfamily of Old World monkeys","x":"The Cercopithecinae are a subfamily of the Old World monkeys, which comprises roughly 71 species, including the baboons, the macaques, and the vervet monkeys. Most cercopithecine monkeys are limited to sub-Saharan Africa, although the macaques range from the far eastern parts of Asia through northern Africa, as well…","u":"https://en.wikipedia.org/wiki/Cercopithecinae","i":"img/9528.jpg","e":"<b>Cercopithecus<\/b>, from Greek <b>κέρκος<\/b> (<i>kérkos<\/i>) \"tail\" + <b>πίθηκος<\/b> (<i>píthēkos<\/i>) \"ape\" + <b>-inae<\/b> \"subfamily\": the tailed apes, meaning baboons and macaques. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"3072906":{"p":"379584","n":"Musteloidea","r":"superfamily","d":"Superfamily of carnivoran mammals","x":"Musteloidea is a superfamily of carnivoran mammals united by shared characteristics of the skull and teeth. Musteloids are the sister group of pinnipeds, the group which includes seals and allies.","u":"https://en.wikipedia.org/wiki/Musteloidea","i":"img/3072906.jpg","e":"Latin <b>Mustela<\/b> \"weasel\" + <b>-oidea<\/b> \"superfamily\": the weasel-like carnivores."},"9655":{"p":"3072906","n":"Mustelidae","r":"family","d":"Family of mammals","x":"The Mustelidae are a diverse family of carnivoran mammals, including weasels, badgers, otters, sea otters, polecats, martens, grisons and wolverines. Otherwise known as mustelids, they form the largest family in the suborder Caniformia of the order Carnivora with between 66 to 70 species in nine subfamilies.","u":"https://en.wikipedia.org/wiki/Mustelidae","i":"img/9655.jpg","e":"Latin <b>mustela<\/b> \"weasel\" + <b>-idae<\/b> \"family\": the weasel family."},"3073808":{"p":"3078114","n":"Telluraves","r":"clade","d":"Clade of birds","x":"Telluraves, also known as land birds or core landbirds, is a recently defined clade of birds defined by their arboreality. Based on most recent genetic studies, the clade unites a variety of bird groups, including the australavians as well as the afroavians.","u":"https://en.wikipedia.org/wiki/Telluraves","i":"img/3073808.jpg","e":"Latin <b>tellūs<\/b> \"earth, land\" + <b>avēs<\/b> \"birds\": land birds. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2558200":{"p":"3073808","n":"Accipitriformes","r":"order","d":"Order of birds","x":"The Accipitriformes are an order of birds that includes most of the diurnal birds of prey, including hawks, eagles,\nOld World vultures, kites, ospreys and secretary birds, but not falcons or seriemas. The generally nocturnal owls, also considered birds of prey, are a separate order from the accipitriforms.","u":"https://en.wikipedia.org/wiki/Accipitriformes","i":"img/2558200.jpg","e":"Latin <b>accipiter<\/b> \"hawk\" + <b>-fōrmes<\/b> \"shaped\": hawks, eagles and kites."},"8955":{"p":"2558200","n":"Accipitrinae","r":"subfamily","d":"Subfamily of birds","x":"The Accipitrinae are the subfamily of the Accipitridae often known as the \"true\" hawks. The subfamily contains 73 species that are divided into 11 genera.","u":"https://en.wikipedia.org/wiki/Accipitrinae","i":"img/8955.jpg","e":"Latin <b>accipiter<\/b> \"hawk\" + <b>-inae<\/b> \"subfamily\": the true hawks."},"1206795":{"p":"33317","n":"Lophotrochozoa","r":"clade","d":"Superphylum of animals","x":"Lophotrochozoa is a clade of protostome animals within the Spiralia. The taxon was established as a monophyletic group based on molecular evidence.","u":"https://en.wikipedia.org/wiki/Lophotrochozoa","i":"img/1206795.jpg","e":"<b>Lopho<\/b>phorata + <b>Trocho<\/b>zoa: Greek <b>λόφος<\/b> (<i>lóphos<\/i>) \"crest\" + <b>τροχός<\/b> (<i>trochós<\/i>) \"wheel\" + <b>ζῷα<\/b> (<i>zôia<\/i>) \"animals\"."},"6447":{"p":"1206795","n":"Mollusca","r":"phylum","d":"Phylum of invertebrate animals","x":"Mollusca is a phylum of protostomic invertebrate animals, whose members are known as molluscs or mollusks. 89,857 extant species of molluscs are recognized with estimates ranging over 251,000 species, making it the second-largest animal phylum after Arthropoda.","u":"https://en.wikipedia.org/wiki/Mollusca","i":"img/6447.jpg","e":"Latin <b>molluscus<\/b> \"soft,\" from <b>mollis<\/b> \"soft\": the soft-bodied animals. In classical Latin, <i>molluscus<\/i> described only one thing, a thin-shelled nut."},"216366":{"p":"6447","n":"Helicina","r":"clade","d":"Informal group of gastropods","x":"Sigmurethra is a taxonomic category of air-breathing land snails and slugs, terrestrial pulmonate gastropod molluscs. This is an informal group which includes most land snails and slugs.","u":"https://en.wikipedia.org/wiki/Sigmurethra","i":"img/216366.jpg","e":"<b>Helix<\/b>, from Greek <b>ἕλιξ<\/b> (<i>hélix<\/i>) \"spiral\" + <b>-ina<\/b>: land snails, named for the coiled shell."},"6843":{"p":"6656","n":"Chelicerata","r":"subphylum","d":"Subphylum of arthropods","x":"The subphylum Chelicerata constitutes one of the two major living subdivisions of the phylum Arthropoda, alongside Mandibulata. Chelicerates include the sea spiders, horseshoe crabs, and arachnids, as well as a number of extinct lineages, such as the eurypterids and chasmataspidids.","u":"https://en.wikipedia.org/wiki/Chelicerata","i":"img/6843.jpg","e":"Greek <b>χηλή<\/b> (<i>khēlḗ<\/i>) \"claw\" + <b>κέρας<\/b> (<i>kéras<\/i>) \"horn\": for the chelicerae, the fang-like mouthparts."},"6854":{"p":"6843","n":"Arachnida","r":"class","d":"Class of arthropods","x":"Arachnids are arthropods in the class Arachnida of the subphylum Chelicerata. Arachnida includes, among others, spiders, scorpions, ticks, mites, pseudoscorpions, harvestmen, camel spiders, whip spiders and vinegaroons.","u":"https://en.wikipedia.org/wiki/Arachnid","i":"img/6854.jpg","e":"Greek <b>ἀράχνη<\/b> (<i>aráchnē<\/i>) \"spider\": after Arachne, the weaver who challenged Athena and was turned into a spider."},"6855":{"p":"6854","n":"Scorpiones","r":"order","d":"Predatory order of arachnids","x":"Scorpions are predatory arachnids with eight legs, a pair of grasping pincers and a narrow, segmented tail, often carried in a characteristic forward curve over the back and always ending with a stinger. The evolutionary history of scorpions goes back to the Silurian Period, approximately 430 million years ago.","u":"https://en.wikipedia.org/wiki/Scorpion","i":"img/6855.jpg","e":"Latin <b>scorpiōnēs<\/b> ← Greek <b>σκορπίος<\/b> (<i>skorpíos<\/i>) \"scorpion,\" a loanword from outside Indo-European, possibly akin to Hebrew <b>ʿaqrāb<\/b>."},"30458":{"p":"3073808","n":"Strigiformes","r":"order","d":"Birds from the order Strigiformes","x":"Owls are birds from the order Strigiformes, which includes over 200 species of mostly solitary and nocturnal birds of prey typified by an upright stance, a large, broad head, binocular vision, binaural hearing, sharp talons, and feathers adapted for silent flight. Exceptions include the diurnal northern hawk-owl and…","u":"https://en.wikipedia.org/wiki/Owl","i":"img/30458.jpg","e":"Latin <b>strīx, strigis<\/b> \"owl\" + <b>-iformes<\/b> \"shaped\": the owls."},"3701029":{"p":"3701028","n":"Communostraca","r":"clade","d":"Superclass of crustaceans","x":"The clade Multicrustacea constitutes the largest superclass of crustaceans, containing approximately four-fifths of all described non-hexapod crustacean species, including crabs, lobsters, crayfish, shrimp, krill, prawns, woodlice, barnacles, copepods, amphipods, mantis shrimp and others. The largest branch of…","u":"https://en.wikipedia.org/wiki/Multicrustacea","i":"img/3701029.jpg","e":"A modern name built on <b>-ostraca<\/b>, Greek <b>ὄστρακον<\/b> (<i>óstrakon<\/i>) \"shell,\" the ending of crustacean groups like Malacostraca: crabs, lobsters, barnacles and krill. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"1489904":{"p":"1489872","n":"Carangaria","r":"clade","d":"Order of fishes","x":"Carangiformes is a large and diverse order of ray-finned fishes within the clade Percomorpha. It is part of a sister clade to the Ovalentaria, alongside its sister group, the Anabantaria.","u":"https://en.wikipedia.org/wiki/Carangiformes","i":"img/1489904.jpg","e":"<b>Caranx<\/b>, the jack genus + <b>-aria<\/b>: jacks, swordfish and flatfish. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"314147":{"p":"314146","n":"Glires","r":"clade","d":"Clade of rodents and lagomorphs","x":"Glires is a clade consisting of rodents and lagomorphs. The hypothesis that these form a monophyletic group has been long debated based on morphological evidence.","u":"https://en.wikipedia.org/wiki/Glires","i":"img/314147.jpg","e":"Latin <b>glīrēs<\/b> \"dormice\" (singular <b>glīs<\/b>): rodents and rabbits."},"9989":{"p":"314147","n":"Rodentia","r":"order","d":"Order of mammals","x":"Rodents are a group of mammals belonging to the order Rodentia characterized by a single pair of continuously growing incisors in each of the upper and lower jaws. Rodents make up about 40% of all mammal species.","u":"https://en.wikipedia.org/wiki/Rodent","i":"img/9989.jpg","e":"Latin <b>rōdēns<\/b> \"gnawing\" ← <b>rōdere<\/b> \"to gnaw\": the gnawers."},"2653789":{"p":"91561","n":"Whippomorpha","r":"suborder","d":"Suborder of mammals","x":"Whippomorpha is a clade of Artiodactyla that contains all living cetaceans (whales) and Hippopotamidae. This makes it a crown group.","u":"https://en.wikipedia.org/wiki/Whippomorpha","i":"img/2653789.jpg","e":"<b>Wh<\/b>ale + <b>hippo<\/b>potamus + Greek <b>μορφή<\/b> (<i>morphḗ<\/i>) \"form\": whales and hippos are each other's closest living relatives."},"9721":{"p":"2653789","n":"Cetacea","r":"infraorder","d":"Infraorder of marine mammals","x":"Cetaceans are marine mammals belonging to the infraorder Cetacea, a secondarily aquatic clade under the order Artiodactyla that include whales, dolphins, porpoises and extinct groups such as Basilosaurus. Most cetaceans live in marine environments, particularly the pelagic zone, but some reside solely in brackish or…","u":"https://en.wikipedia.org/wiki/Cetacean","i":"img/9721.jpg","e":"Latin <b>cētus<\/b> \"whale\" ← Greek <b>κῆτος<\/b> (<i>kêtos<\/i>) \"sea monster, huge fish\": the whales and dolphins."},"9722":{"p":"9721","n":"Odontoceti","r":"parvorder","d":"Parvorder of cetaceans","x":"The toothed whales are a parvorder of cetaceans that includes dolphins, porpoises, and all other whales with teeth, such as beaked whales and the sperm whales. 73 species of toothed whales are described.","u":"https://en.wikipedia.org/wiki/Toothed_whale","i":"img/9722.jpg","e":"Greek <b>ὀδούς<\/b> (<i>odoús<\/i>) \"tooth\" + <b>κῆτος<\/b> (<i>kêtos<\/i>) \"sea monster\": the toothed whales.","ep":"PIE <b><i>*h₃dónts<\/i><\/b> → English <b>tooth<\/b>"},"9747":{"p":"9722","n":"Monodontidae","r":"family","d":"Family of mammals","x":"The cetacean family Monodontidae comprises two living whale species, the narwhal and the beluga whale and at least four extinct species, known from the fossil record. Beluga and narwhal are native to coastal regions and pack ice around the Arctic Ocean.","u":"https://en.wikipedia.org/wiki/Monodontidae","i":"img/9747.jpg","e":"<b>Monodon<\/b>, from Greek <b>μόνος<\/b> (<i>mónos<\/i>) \"one\" + <b>ὀδούς<\/b> (<i>odoús<\/i>) \"tooth\" + <b>-idae<\/b> \"family\": for the narwhal's single tusk. <i style=\"opacity:.7\">(from the roots of the name)<\/i>","ep":"PIE <b><i>*h₃dónts<\/i><\/b> → English <b>tooth<\/b>"},"1489892":{"p":"1489872","n":"Anabantaria","r":"clade","d":"Clade of ray-finned fishes","x":"Percomorpha is an extremely large and diverse clade of ray-finned fish.","u":"https://en.wikipedia.org/wiki/Percomorpha","i":"img/1489892.jpg","e":"<b>Anabas<\/b>, the climbing perch, from Greek <b>ἀναβαίνω<\/b> (<i>anabaínō<\/i>) \"to climb up\" + <b>-aria<\/b>. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"6605":{"p":"6447","n":"Cephalopoda","r":"class","d":"Class of mollusks","x":"A cephalopod is any member of the molluscan class Cephalopoda such as a squid, octopus, cuttlefish, or nautilus. These exclusively marine animals are characterized by bilateral body symmetry, a prominent head, and a set of arms or tentacles modified from the primitive molluscan foot.","u":"https://en.wikipedia.org/wiki/Cephalopod","i":"img/6605.jpg","e":"Greek <b>κεφαλή<\/b> (<i>kephalḗ<\/i>) \"head\" + <b>πούς<\/b> (<i>poús<\/i>) \"foot\": \"head-feet,\" arms growing straight from the head. The snake-haired Gorgon Medusa may have been inspired by the octopus.","ep":"PIE <b><i>*pṓds<\/i><\/b> → English <b>foot<\/b>"},"6606":{"p":"6605","n":"Coleoidea","r":"subclass","d":"Subclass of cephalopods","x":"Coleoidea or Dibranchiata is one of the two subclasses of cephalopod molluscs containing all the various taxa popularly thought of as \"soft-bodied\" or \"shell-less\". Unlike its sister groups, the shelled †Ammonoidea and Nautiloidea, the coleoids have at most an internal shell called cuttlebone or gladius that is used…","u":"https://en.wikipedia.org/wiki/Coleoidea","i":"img/6606.jpg","e":"Greek <b>κολεός<\/b> (<i>koleós<\/i>) \"sheath\" + <b>-oidea<\/b>: squid, cuttlefish and octopuses, whose shell is inside the body or gone."},"215450":{"p":"6606","n":"Decapodiformes","r":"superorder","d":"Superorder of Cephalopoda","x":"Decapodiformes is a superorder of Cephalopoda comprising all cephalopod species with ten limbs, specifically eight short arms and two long tentacles. It is hypothesized that the ancestral coleoid had five identical pairs of limbs, and that one branch of descendants evolved a modified arm pair IV to become the…","u":"https://en.wikipedia.org/wiki/Decapodiformes","i":"img/215450.jpg","e":"<b>Decapoda<\/b>, Greek <b>δέκα<\/b> (<i>déka<\/i>) \"ten\" + <b>πούς<\/b> (<i>poús<\/i>) \"foot\" + <b>-iformes<\/b> \"shaped\": squid and cuttlefish, with ten arms.","ep":"PIE <b><i>*déḱm̥<\/i><\/b> → English <b>ten<\/b> · PIE <b><i>*pṓds<\/i><\/b> → English <b>foot<\/b>"},"27592":{"p":"9895","n":"Bovinae","r":"subfamily","d":"Subfamily of mammals","x":"Bovines comprise a diverse group of 10 genera of medium to large-sized ungulates, including cattle, bison, African buffalo, water buffalos, and the four-horned and spiral-horned antelopes. The members of this group of bovids are classified into loose tribes rather than formal subgroups, as the evolutionary…","u":"https://en.wikipedia.org/wiki/Bovinae","i":"img/27592.jpg","e":"Latin <b>Bos<\/b> \"ox\" + <b>-inae<\/b> \"subfamily\": cattle, bison and buffalo."},"9632":{"p":"379584","n":"Ursidae","r":"family","d":"Family of carnivoran mammals","x":"Bears are carnivoran mammals of the family Ursidae. They are classified as caniforms within the suborder Caniformia.","u":"https://en.wikipedia.org/wiki/Bear","i":"img/9632.jpg","e":"Latin <b>ursus<\/b> \"bear\" + <b>-idae<\/b> \"family\": the bear family. Greek <b>ἄρκτος<\/b> (<i>árktos<\/i>) \"bear\" gave us <b>arctic<\/b>, named for the Great Bear in the northern sky."},"9639":{"p":"9632","n":"Ursus","r":"genus","d":"Genus of bears","x":"Ursus is a genus in the family Ursidae (bears) that includes the widely distributed brown bear, the polar bear, the American black bear, and the\nAsian black bear. The name is derived from the Latin ursus, meaning bear.","u":"https://en.wikipedia.org/wiki/Ursus_(mammal)","i":"img/9639.jpg","e":"Latin <b>ursus<\/b> \"bear.\" Its Greek twin <b>ἄρκτος<\/b> (<i>árktos<\/i>) gives the brown bear its full name, <i>Ursus arctos<\/i>, literally \"bear bear.\""},"34989":{"p":"8570","n":"Colubroidea","r":"superfamily","d":"Superfamily of snakes","x":"Colubroidea is a superfamily of snakes in the clade Colubroides that includes Colubridae, with some studies splitting Colubridae into multiple families that make up Colubroidea. Historically, Colubroidea also included other caenophidian snakes such as cobras and vipers, as these snakes form a clade.","u":"https://en.wikipedia.org/wiki/Colubroidea","i":"img/34989.jpg","e":"Latin <b>coluber<\/b> \"snake\" + <b>-oidea<\/b> \"superfamily\": vipers, cobras and their relatives."},"8602":{"p":"34989","n":"Elapidae","r":"family","d":"Family of venomous snakes","x":"Elapidae is a family of snakes characterized by their permanently erect fangs at the front of the mouth. Most elapids are venomous, with the exception of the genus Emydocephalus.","u":"https://en.wikipedia.org/wiki/Elapidae","i":"img/8602.jpg","e":"<b>Elaps<\/b>, a former coral-snake genus, from Greek <b>ἔλαψ<\/b> (<i>élaps<\/i>), oddly a variant of <b>ἔλλοψ<\/b> \"sea-fish\": the cobras, mambas and sea snakes."},"42168":{"p":"8602","n":"Elapinae","r":"subfamily","d":"Family of venomous snakes","x":"Elapidae is a family of snakes characterized by their permanently erect fangs at the front of the mouth. Most elapids are venomous, with the exception of the genus Emydocephalus.","u":"https://en.wikipedia.org/wiki/Elapidae","i":"img/42168.jpg","e":"<b>Elaps<\/b>, a former coral-snake genus + <b>-inae<\/b> \"subfamily\": cobras, mambas and their kin."},"8922":{"p":"2558200","n":"Cathartidae","r":"family","d":"Family of birds","x":"Cathartidae, commonly known as New World vultures and condors, are a family of birds of prey consisting of seven extant species in five genera. It includes five extant vultures and two extant condors found in the Americas.","u":"https://en.wikipedia.org/wiki/New_World_vulture","i":"img/8922.jpg","e":"Greek <b>καθαρτής<\/b> (<i>kathartḗs<\/i>) \"purifier\" + <b>-idae<\/b> \"family\": the New World vultures, nature's cleanup crew."},"6893":{"p":"6854","n":"Araneae","r":"order","d":"Order of arachnids","x":"Spiders are air-breathing arthropods that have eight limbs, chelicerae with fangs generally able to inject venom, and spinnerets that extrude silk. They are the largest order of arachnids and rank seventh in total species diversity among all orders of organisms.","u":"https://en.wikipedia.org/wiki/Spider","i":"img/6893.jpg","e":"Latin <b>arānea<\/b> \"spider\": the spiders. In Ovid's <i>Metamorphoses<\/i>, Arachne is the weaver Athena turned into one."},"6905":{"p":"6893","n":"Araneomorphae","r":"suborder","d":"Infraorder of arachnids","x":"The Araneomorphae are an infraorder of spiders. They are distinguishable by chelicerae (fangs) that point diagonally forward and cross in a pinching action, in contrast to those of Mygalomorphae, which point straight down.","u":"https://en.wikipedia.org/wiki/Araneomorphae","i":"img/6905.jpg","e":"<b>Araneus<\/b> \"spider\" + Greek <b>μορφή<\/b> (<i>morphḗ<\/i>) \"form\": the \"modern\" spiders, whose fangs pinch sideways."},"74971":{"p":"6905","n":"Entelegynae","r":"clade","d":"Clade of spiders","x":"The Entelegynae or entelegynes are a subgroup of araneomorph spiders, the largest of the two main groups into which the araneomorphs were traditionally divided. Females have a genital plate (epigynum) and a \"flow through\" fertilization system; males have complex palpal bulbs.","u":"https://en.wikipedia.org/wiki/Entelegynae","i":"img/74971.jpg","e":"Greek <b>ἐντελής<\/b> (<i>entelḗs<\/i>) \"complete\" + <b>γυνή<\/b> (<i>gunḗ<\/i>) \"woman\": for the female's more complex genital plate."},"74975":{"p":"74971","n":"Araneoidea","r":"superfamily","d":"Superfamily of spiders","x":"Araneoidea is a taxon of araneomorph spiders, termed \"araneoids\", treated as a superfamily. As with many such groups, its circumscription has varied; in particular some families that had at one time been moved to the Palpimanoidea have more recently been restored to Araneoidea.","u":"https://en.wikipedia.org/wiki/Araneoidea","i":"img/74975.jpg","e":"<b>Araneus<\/b> \"spider\" + <b>-oidea<\/b> \"superfamily\": orb-weavers and cobweb spiders, black widow included."},"3073809":{"p":"3073808","n":"Australaves","r":"clade","d":"Clade of birds","x":"Australaves is a clade of birds defined in 2012, consisting of the Eufalconimorphae as well as the Cariamiformes. They appear to be the sister group of Afroaves.","u":"https://en.wikipedia.org/wiki/Australaves","i":"img/3073809.jpg","e":"Latin <b>austrālis<\/b> \"southern\" + <b>avēs<\/b> \"birds\": southern birds, for the group's roots in the Southern Hemisphere."},"9126":{"p":"3073809","n":"Passeriformes","r":"order","d":"Perching birds of the order Passeriformes","x":"A passerine is any bird of the order Passeriformes. Sometimes known as perching birds, passerines generally have an anisodactyl arrangement of their toes, which facilitates perching.","u":"https://en.wikipedia.org/wiki/Passerine","i":"img/9126.jpg","e":"Latin <b>passer<\/b> \"sparrow\" + <b>-iformes<\/b> \"shaped\": the perching birds, named after the house sparrow's genus."},"28725":{"p":"9126","n":"Corvidae","r":"family","d":"Family of perching birds","x":"Corvidae is a cosmopolitan family of oscine passerine birds that contains the crows, ravens, rooks, magpies, jackdaws, jays, treepies, choughs, and nutcrackers. In colloquial terms, the crow family is made up of corvids; currently 135 species are included.","u":"https://en.wikipedia.org/wiki/Corvidae","i":"img/28725.jpg","e":"Latin <b>corvus<\/b> \"raven\" + <b>-idae<\/b> \"family\": crows, ravens, jays and magpies."},"9765":{"p":"9721","n":"Balaenopteridae","r":"family","d":"Family of cetacean mammals","x":"Rorquals are the largest group of baleen whales, comprising the family Balaenopteridae, which contains nine extant species in two genera. They include the largest animal ever known to have lived, the blue whale, which can reach 180 tonnes, and the fin whale, which reaches 120 tonnes ; the smallest of the group, the…","u":"https://en.wikipedia.org/wiki/Rorqual","i":"img/9765.jpg","e":"<b>Balaenoptera<\/b>, from Latin <b>balaena<\/b> \"whale\" + Greek <b>πτερόν<\/b> (<i>pterón<\/i>) \"wing, fin\" + <b>-idae<\/b> \"family\": the finned whales, or rorquals. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"215451":{"p":"6606","n":"Octopodiformes","r":"superorder","d":"Superorder of molluscs","u":"https://en.wikipedia.org/wiki/Octopodiformes","e":"<b>Octopus<\/b>, from Greek <b>ὀκτώπους<\/b> (<i>oktṓpous<\/i>) \"eight-foot\" + <b>-iformes<\/b> \"shaped\": octopuses and the vampire squid.","ep":"PIE <b><i>*oḱtṓw<\/i><\/b> → English <b>eight<\/b> · PIE <b><i>*pṓds<\/i><\/b> → English <b>foot<\/b>"},"6647":{"p":"215451","n":"Octopodidae","r":"family","d":"Family of octopuses","x":"The Octopodidae are a family containing the majority of known octopus species.","u":"https://en.wikipedia.org/wiki/Octopodidae","i":"img/6647.jpg","e":"<b>Octopus<\/b> \"eight-foot\" + <b>-idae<\/b> \"family\": the octopuses.","ep":"PIE <b><i>*oḱtṓw<\/i><\/b> → English <b>eight<\/b> · PIE <b><i>*pṓds<\/i><\/b> → English <b>foot<\/b>"},"379583":{"p":"33554","n":"Feliformia","r":"suborder","d":"Suborder of carnivores","x":"Feliformia is a suborder within the order Carnivora consisting of \"cat-like\" carnivorans, including cats, hyenas, mongooses, viverrids, and related taxa. Feliformia stands in contrast to the other suborder of Carnivora, Caniformia consisting of \"dog-like\" carnivorans.","u":"https://en.wikipedia.org/wiki/Feliformia","i":"img/379583.jpg","e":"Latin <b>fēlis<\/b> \"cat\" + <b>-fōrmis<\/b> \"shaped\": cat-shaped carnivores (hyenas and mongooses included). <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"9681":{"p":"379583","n":"Felidae","r":"family","d":"Family of mammals","x":"Felidae is the family of mammals in the order Carnivora commonly referred to as cats. A member of this family is also called a felid.","u":"https://en.wikipedia.org/wiki/Felidae","i":"img/9681.jpg","e":"Latin <b>Felis<\/b> \"cat\" + <b>-idae<\/b> \"family\": the cat family."},"338152":{"p":"9681","n":"Felinae","r":"subfamily","d":"Subfamily of Felidae","x":"The Felinae or small cats are a subfamily of the Felidae distinguished by a bony hyoid, because of which they can purr but not roar. Other authors have proposed an alternative definition for this subfamily, as comprising only the living conical-toothed cat genera, with two tribes, the Felini and Pantherini, and…","u":"https://en.wikipedia.org/wiki/Felinae","i":"img/338152.jpg","e":"Latin <b>Felis<\/b> \"cat\" + <b>-inae<\/b> \"subfamily\": the small cats."},"13124":{"p":"338152","n":"Lynx","r":"genus","d":"Genus of medium-sized wild cats","x":"A lynx is any of the four extant species within the medium-sized wild cat genus Lynx. The name originated in Middle English via Latin from the Greek word lynx,","u":"https://en.wikipedia.org/wiki/Lynx","i":"img/13124.jpg","e":"Latin <b>lynx<\/b> ← Greek <b>λύγξ<\/b> (<i>lúnx<\/i>) \"lynx.\""},"314295":{"p":"9526","n":"Hominoidea","r":"superfamily","d":"Superfamily of primates","x":"Apes, collectively Hominoidea, are a superfamily of Old World simians native to sub-Saharan Africa and Southeast Asia. They were more widespread in Africa, Asia, and Europe in prehistory, and, including humans, are found globally.","u":"https://en.wikipedia.org/wiki/Ape","i":"img/314295.jpg","e":"Latin <b>homō, hominis<\/b> \"human\" + <b>-oidea<\/b> \"superfamily\": the apes, humans included."},"9604":{"p":"314295","n":"Hominidae","r":"family","d":"Family of primates","x":"The Hominidae, whose members are known as the great apes, are a taxonomic family of primates that includes eight extant species in four genera: Pongo ; Gorilla ; Pan ; and Homo, of which only modern humans  remain.","u":"https://en.wikipedia.org/wiki/Hominidae","i":"img/9604.jpg","e":"Latin <b>homō, hominis<\/b> \"human\" + <b>-idae<\/b> \"family\": the great apes."},"207598":{"p":"9604","n":"Homininae","r":"subfamily","d":"Subfamily of mammals","x":"The Homininae is a subfamily of the family Hominidae (hominids). The Homininae encompass humans, and are also called \"African hominids\" or \"African apes\".","u":"https://en.wikipedia.org/wiki/Homininae","i":"img/207598.jpg","e":"Latin <b>homō, hominis<\/b> \"human\" + <b>-inae<\/b> \"subfamily\": gorillas, chimps and humans."},"9596":{"p":"207598","n":"Pan","r":"genus","d":"Genus of African great ape","x":"The genus Pan consists of two extant species: the bonobo and the chimpanzee. Taxonomically, these two ape species are collectively termed panins; however, both species are more commonly referred to collectively using the generalized term chimpanzees, or chimps.","u":"https://en.wikipedia.org/wiki/Pan_(genus)","i":"img/9596.jpg","e":"Greek <b>Πάν<\/b> (<i>Pán<\/i>), the wild god of the woods: a name given to chimps and bonobos by Lorenz Oken in 1816."},"1579337":{"p":"1329799","n":"Durocryptodira","r":"clade","d":"Suborder of reptiles","x":"The Cryptodira are a suborder of Testudines that includes most living tortoises and turtles. Cryptodira is commonly called the hidden-necked turtles or the typical turtles.","u":"https://en.wikipedia.org/wiki/Cryptodira","i":"img/1579337.jpg","e":"Built on <b>Cryptodira<\/b>, Greek <b>κρυπτός<\/b> (<i>kruptós<\/i>) \"hidden\" + <b>δειρή<\/b> (<i>deirḗ<\/i>) \"neck\": turtles that draw the neck straight back into the shell. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"8486":{"p":"1579337","n":"Testudinoidea","r":"superfamily","d":"Superfamily of turtles","x":"Testudinoidea is a superfamily within the suborder Cryptodira of the order Testudines. It includes the pond turtles, Asian turtles, the monotypic big-headed turtle, and the tortoises.","u":"https://en.wikipedia.org/wiki/Testudinoidea","i":"img/8486.jpg","e":"Latin <b>testūdō<\/b> \"tortoise\" + <b>-oidea<\/b> \"superfamily\": tortoises and pond turtles."},"74970":{"p":"6905","n":"Haplogynae","r":"clade","d":"Infraorder of spiders","x":"The Haplogynae or haplogynes are one of the two main groups into which araneomorph spiders have traditionally been divided, the other being the Entelegynae. Morphological phylogenetic studies suggested that the Haplogynae formed a clade; more recent molecular phylogenetic studies refute this, although many of the…","u":"https://en.wikipedia.org/wiki/Haplogynae","i":"img/74970.jpg","e":"Greek <b>ἁπλόος<\/b> (<i>hapló
