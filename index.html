y Mactridae. It is one of the most commonly found species of bivalves in the western Atlantic Ocean.","u":"https://en.wikipedia.org/wiki/Atlantic_surf_clam","i":"img/6584.jpg"},"571810":{"n":"sea cucumber","s":"Actinopyga echinites","p":"7624","x":"Actinopyga echinites, commonly known as the brownfish or deep water redfish, is a species of sea cucumber in the family Holothuriidae. It is native to the tropical Indo-Pacific region and is harvested for food.","u":"https://en.wikipedia.org/wiki/Actinopyga_echinites","i":"img/571810.jpg"},"9704":{"n":"sea lion","s":"Zalophus californianus","p":"3072905","x":"The California sea lion is a coastal eared seal native to western North America. It is one of six species of sea lions.","u":"https://en.wikipedia.org/wiki/California_sea_lion","i":"img/9704.jpg"},"34882":{"n":"sea otter","s":"Enhydra lutris","p":"169417","x":"The sea otter is a marine mammal native to the coasts of the northern and eastern North Pacific Ocean. Adult sea otters typically weigh between 14 and 45 kg (30–100 lb), making them the heaviest members of the weasel family, but among the smallest marine mammals.","u":"https://en.wikipedia.org/wiki/Sea_otter","i":"img/34882.jpg"},"8688":{"n":"sea snake","s":"Hydrophis platurus","p":"8602","x":"The yellow-bellied sea snake is an extremely venomous species of snake from the subfamily Hydrophiinae found in tropical oceanic waters around the world except for the Atlantic Ocean. For many years, it was placed in the monotypic genus Pelamis, but recent molecular evidence indicates it lies within the genus…","u":"https://en.wikipedia.org/wiki/Yellow-bellied_sea_snake","i":"img/8688.jpg"},"202113":{"n":"sea sponge","s":"Aplysina fistularis","p":"33208","x":"Aplysina fistularis, also known as the yellow tube sponge or yellow sponge, is a species of sea sponge in the order Verongiida. Aplysina fistularis is a golden or orange-brown color with a conulose surface.","u":"https://en.wikipedia.org/wiki/Aplysina_fistularis","i":"img/202113.jpg"},"27794":{"n":"sea turtle","s":"Dermochelys coriacea","p":"1579336","x":"The leatherback sea turtle, sometimes called the lute turtle, leathery turtle or simply the luth, is a large species of sea turtle. The largest of all living turtles and the heaviest non-crocodilian reptile, it reaches lengths of up to 2.7 metres and weights of 500 kilograms (1,100 lb).","u":"https://en.wikipedia.org/wiki/Leatherback_sea_turtle","i":"img/27794.jpg"},"7671":{"n":"sea urchin","s":"Strongylocentrotus droebachiensis","p":"7638","x":"Strongylocentrotus droebachiensis, commonly known as the green sea urchin because of its characteristic green color, is a species of sea urchin commonly found in northern waters all around the world including both the Pacific and Atlantic Oceans to a northerly latitude of 81 degrees and as far south as Maine and…","u":"https://en.wikipedia.org/wiki/Strongylocentrotus_droebachiensis","i":"img/7671.jpg"},"35669":{"n":"seagull","s":"Larus argentatus","p":"8906","x":"The European herring gull or simply herring gull is a large gull, up to 66 cm (26 in) long. It breeds throughout the northern and western coasts of Europe.","u":"https://en.wikipedia.org/wiki/European_herring_gull","i":"img/35669.jpg"},"109280":{"n":"seahorse","s":"Hippocampus comes","p":"1489872","x":"The tiger tail seahorse is a species of fish in the family Syngnathidae. The species was first described by Theodore Cantor in 1850.","u":"https://en.wikipedia.org/wiki/Tiger_tail_seahorse","i":"img/109280.jpg"},"9711":{"n":"seal","s":"Halichoerus grypus","p":"3072905","x":"The grey seal, or gray seal in the United States, is a large seal of the family Phocidae, which are commonly referred to as \"true seals\" or \"earless seals\". The only species classified in the genus Halichoerus, it is found on both shores of the North Atlantic Ocean.","u":"https://en.wikipedia.org/wiki/Grey_seal","i":"img/9711.jpg"},"9940":{"n":"sheep","s":"Ovis aries","p":"9963","x":"Sheep or domestic sheep are a domesticated ruminant mammal typically kept as livestock. Although the term sheep can apply to other species in the genus Ovis, in everyday usage it almost always refers to domesticated sheep.","u":"https://en.wikipedia.org/wiki/Sheep","i":"img/9940.jpg"},"7091":{"n":"silkworm","s":"Bombyx mori","p":"37569","x":"Bombyx mori, commonly known as the domestic silk moth, is a domesticated moth species belonging to the family Bombycidae. It is the closest relative of Bombyx mandarina, the wild silk moth.","u":"https://en.wikipedia.org/wiki/Bombyx_mori","i":"img/7091.jpg"},"50586":{"n":"silverfish","s":"Lepisma saccharinum","p":"85512","x":"The silverfish is a species of small, primitive, wingless insect in the order Zygentoma. Its common name derives from the insect's silvery light grey colour, combined with the fish-like appearance of its movements.","u":"https://en.wikipedia.org/wiki/Silverfish","i":"img/50586.jpg"},"96725":{"n":"skink","s":"Tiliqua gigas","p":"1329950","x":"The Indonesian blue-tongued skink is a lizard in the family Scincidae. It is a close relative of the eastern blue-tongued skink.","u":"https://en.wikipedia.org/wiki/Indonesian_blue-tongued_skink","i":"img/96725.jpg"},"30548":{"n":"skunk","s":"Mephitis mephitis","p":"3072906","x":"The striped skunk is a skunk of the genus Mephitis that occurs across much of North America, including southern Canada, the United States, and northern Mexico. It is currently listed as least concern by the IUCN on account of its wide range and ability to adapt to human-modified environments.","u":"https://en.wikipedia.org/wiki/Striped_skunk","i":"img/30548.jpg"},"6536":{"n":"snail","s":"Helix pomatia","p":"216366","x":"Helix pomatia, known as the Roman snail, Burgundy snail, or escargot, is a species of large, air-breathing stylommatophoran land snail belonging to the family Helicidae and native to Europe. It is characterized by a globular brown shell.","u":"https://en.wikipedia.org/wiki/Helix_pomatia","i":"img/6536.jpg"},"8475":{"n":"snapping turtle","s":"Chelydra serpentina","p":"1579336","x":"The common snapping turtle is a species of large, freshwater turtles in the family Chelydridae. Its natural range extends from southeastern Canada, southwest to the edge of the Rocky Mountains, as far east as Nova Scotia, and Florida.","u":"https://en.wikipedia.org/wiki/Common_snapping_turtle","i":"img/8475.jpg"},"371907":{"n":"snowy owl","s":"Bubo scandiacus","p":"30458","x":"The snowy owl, also known as the polar owl, the white owl and the Arctic owl, is a large, white owl of the true owl family. Snowy owls are native to the Arctic regions of both North America and the Palearctic, breeding mostly on the tundra.","u":"https://en.wikipedia.org/wiki/Snowy_owl","i":"img/371907.jpg"},"48849":{"n":"sparrow","s":"Passer domesticus","p":"175121","x":"The house sparrow is a bird of the sparrow family Passeridae, found in most parts of the world. It is a small bird that has a typical length of 16 cm (6.3 in) and a mass of 24–39.5 g (0.85–1.39 oz).","u":"https://en.wikipedia.org/wiki/House_sparrow","i":"img/48849.jpg"},"9755":{"n":"sperm whale","s":"Physeter macrocephalus","p":"9722","x":"The sperm whale or cachalot is the largest of the toothed whales and the largest toothed predator. It is the only living member of the genus Physeter and one of three extant species in the sperm whale superfamily Physeteroidea, along with the pygmy sperm whale and dwarf sperm whale of the genus Kogia.","u":"https://en.wikipedia.org/wiki/Sperm_whale","i":"img/9755.jpg"},"30640":{"n":"squirrel","s":"Sciurus carolinensis","p":"9991","x":"The eastern gray squirrel, spelled as grey squirrel outside of the United States, is a species of tree squirrel in the genus Sciurus. It is native to eastern North America, where it is the most prodigious and ecologically essential natural forest regenerator.","u":"https://en.wikipedia.org/wiki/Eastern_gray_squirrel","i":"img/30640.jpg"},"7604":{"n":"starfish","s":"Asterias rubens","p":"133551","x":"The common starfish, common sea star or sugar starfish is the most common and familiar starfish in the north-east Atlantic. Belonging to the family Asteriidae, it has five arms and usually grows to between 10–30 cm across, although larger specimens are known.","u":"https://en.wikipedia.org/wiki/Common_starfish","i":"img/7604.jpg"},"7022":{"n":"stick bug","s":"Carausius morosus","p":"213547","x":"Carausius morosus is a species of Phasmatodea (phasmid) often kept as pets. Culture stocks originate from a collection from Tamil Nadu, India.","u":"https://en.wikipedia.org/wiki/Carausius_morosus","i":"img/7022.jpg"},"2484686":{"n":"sting ray","s":"Hypanus americanus","p":"117851","x":"The southern stingray is a whiptail stingray found in tropical and subtropical waters of the Western Atlantic Ocean from New Jersey to southern Brazil. It has a flat, diamond-shaped disc, with a mud brown, olive, and grey dorsal surface and white underbelly.","u":"https://en.wikipedia.org/wiki/Southern_stingray","i":"img/2484686.jpg"},"34899":{"n":"sugar glider","s":"Petaurus breviceps","p":"38609","x":"The sugar glider is a small, omnivorous, arboreal, and nocturnal gliding possum. The common name refers to its predilection for sugary foods such as sap and nectar and its ability to glide through the air, much like a flying squirrel.","u":"https://en.wikipedia.org/wiki/Sugar_glider","i":"img/34899.jpg"},"43150":{"n":"swallow","s":"Hirundo rustica","p":"9126","x":"The barn swallow is the most widespread species of swallow in the world, occurring on all continents, with vagrants reported even in Antarctica. It is a distinctive passerine bird with blue upperparts and a long, deeply forked tail.","u":"https://en.wikipedia.org/wiki/Barn_swallow","i":"img/43150.jpg"},"8869":{"n":"swan","s":"Cygnus olor","p":"2068722","x":"The mute swan is a species of swan and a member of the family Anatidae within the waterfowl order. It is native to much of Europe and parts of Asia and the far north of Africa.","u":"https://en.wikipedia.org/wiki/Mute_swan","i":"img/8869.jpg"},"8895":{"n":"swift","s":"Apus apus","p":"8892","x":"The common swift is a medium-sized bird, superficially similar to the barn swallow or house martin but somewhat larger, though not stemming from those passerine species, being in the order Apodiformes. The resemblances between the groups are due to convergent evolution, reflecting similar contextual development.","u":"https://en.wikipedia.org/wiki/Common_swift","i":"img/8895.jpg"},"8245":{"n":"swordfish","s":"Xiphias gladius","p":"1489904","x":"The swordfish, also known as the broadbill in some countries, are large, highly migratory predatory fish characterized by a long, flat, sword-like, pointed bill. They are the sole member of the family Xiphiidae.","u":"https://en.wikipedia.org/wiki/Swordfish","i":"img/8245.jpg"},"30588":{"n":"tamarin","s":"Leontopithecus rosalia","p":"9498","x":"The golden lion tamarin, less commonly known as the golden lion marmoset, is a small New World monkey of the family Callitrichidae. Endemic to the Atlantic coastal forests of Brazil, the golden lion tamarin is an endangered species.","u":"https://en.wikipedia.org/wiki/Golden_lion_tamarin","i":"img/30588.jpg"},"3370412":{"n":"tanuki","s":"Nyctereutes viverrinus","p":"9608","x":"The Japanese raccoon dog, also called the tanuki, is a species of canid that is endemic to Japan. It is one of two species in the genus Nyctereutes, alongside the common raccoon dog (N.","u":"https://en.wikipedia.org/wiki/Japanese_raccoon_dog","i":"img/3370412.jpg"},"6206":{"n":"tapeworm","s":"Taenia saginata","p":"1206795","x":"Taenia saginata, commonly known as the beef tapeworm, is a zoonotic tapeworm belonging to the order Cyclophyllidea and genus Taenia. It is an intestinal parasite in humans causing taeniasis and cysticercosis in cattle.","u":"https://en.wikipedia.org/wiki/Taenia_saginata","i":"img/6206.jpg"},"9802":{"n":"tapir","s":"Tapirus indicus","p":"9787","x":"The Malayan tapir, also called Asian tapir, Asiatic tapir, oriental tapir, Indian tapir, piebald tapir, or black-and-white tapir, is the only living tapir species outside of the Americas. It is native to Southeast Asia from the Malay Peninsula to Sumatra.","u":"https://en.wikipedia.org/wiki/Malayan_tapir","i":"img/9802.jpg"},"260533":{"n":"tarantula","s":"Theraphosa blondi","p":"6893","x":"The Goliath birdeater is a large spider that belongs to the tarantula family Theraphosidae. Found in northern South America, it is the largest spider in the world by mass and body length, and second to the giant huntsman spider by leg span.","u":"https://en.wikipedia.org/wiki/Goliath_birdeater","i":"img/260533.jpg"},"1317727":{"n":"tarantula hawk wasp","s":"Pepsis grossa","p":"7434","x":"Pepsis grossa is a species of very large pepsine spider wasp from the southern part of North America, south to northern South America. They prey on tarantula spiders, giving rise to the name tarantula hawk for the wasps in the genus Pepsis and the related Hemipepsis.","u":"https://en.wikipedia.org/wiki/Pepsis_grossa","i":"img/1317727.jpg"},"46460":{"n":"tardigrade","s":"Milnesium tardigradum","p":"88770","x":"Milnesium tardigradum is a cosmopolitan species of tardigrade that can be found in a diverse range of environments. It has also been found in the sea around Antarctica.","u":"https://en.wikipedia.org/wiki/Milnesium_tardigradum","i":"img/46460.jpg"},"9305":{"n":"tasmanian devil","s":"Sarcophilus harrisii","p":"9263","x":"The Tasmanian devil is a carnivorous marsupial of the family Dasyuridae. It was formerly present across mainland Australia, but became extinct there around 3,500 years ago; it is now confined to the island of Tasmania.","u":"https://en.wikipedia.org/wiki/Tasmanian_devil","i":"img/9305.jpg"},"36987":{"n":"termite","s":"Coptotermes formosanus","p":"1049657","x":"The Formosan termite is a species of termite local to southern China and introduced to Taiwan, Japan, South Africa, Sri Lanka, Hawaii, and the continental United States.","u":"https://en.wikipedia.org/wiki/Formosan_subterranean_termite","i":"img/36987.jpg"},"34613":{"n":"tick","s":"Ixodes ricinus","p":"6854","x":"Ixodes ricinus, commonly known as the castor bean tick, the sheep ked, sheep tick, is a chiefly European species of hard-bodied tick. It may reach a length of 11 mm (0.43 in) when engorged with a blood meal, and can transmit both bacterial and viral pathogens such as the causative agents of Lyme disease and tick-borne…","u":"https://en.wikipedia.org/wiki/Ixodes_ricinus","i":"img/34613.jpg"},"9694":{"n":"tiger","s":"Panthera tigris","p":"9688","x":"The tiger is a large cat and a member of the genus Panthera native to Asia. It has a powerful, muscular body with a large head and paws, a long tail and orange fur that fades to white in parts, with black, mostly vertical stripes.","u":"https://en.wikipedia.org/wiki/Tiger","i":"img/9694.jpg"},"6687":{"n":"tiger prawn","s":"Penaeus monodon","p":"6683","x":"Penaeus monodon, commonly known as the giant tiger prawn, Asian tiger shrimp, black tiger shrimp, and other names, is a marine crustacean that is widely reared for food.","u":"https://en.wikipedia.org/wiki/Penaeus_monodon","i":"img/6687.jpg"},"7819":{"n":"tiger shark","s":"Galeocerdo cuvier","p":"7805","x":"The tiger shark is a species of ground shark, and the only extant member of the genus Galeocerdo and family Galeocerdonidae. It is a large predator, with females capable of attaining a length of over 5 m.","u":"https://en.wikipedia.org/wiki/Tiger_shark","i":"img/7819.jpg"},"8142":{"n":"tilapia","s":"Oreochromis tanganicae","p":"1489908","x":"Oreochromis tanganicae, the Tanganyika tilapia, is a species of cichlid endemic to Lake Tanganyika and the mouths of its larger affluent rivers. This species can reach a length of 42 centimetres (17 in) SL.","u":"https://en.wikipedia.org/wiki/Oreochromis_tanganicae","i":"img/8142.jpg"},"8384":{"n":"toad","s":"Bufo bufo","p":"8417","x":"The common toad, also known as European toad or simply the toad in Anglophone parts of Europe, is a toad found throughout most of Europe, western North Asia and a small part of Northwest Africa. It belongs to a group of closely related species descended from a common ancestral line of toads and forming a species…","u":"https://en.wikipedia.org/wiki/Common_toad","i":"img/8384.jpg"},"66189":{"n":"tortoise","s":"Chelonoidis niger","p":"8486","x":"The Floreana giant tortoise, also known as the Charles Island giant tortoise, is a subspecies of the Galápagos tortoise endemic to the Galápagos archipelago in the equatorial eastern Pacific Ocean. The specific epithet niger (‘black’) probably refers to the colouration of the holotype specimen.","u":"https://en.wikipedia.org/wiki/Floreana_giant_tortoise","i":"img/66189.jpg"},"95723":{"n":"toucan","s":"Ramphastos toco","p":"9219","x":"The toco toucan is a species of bird in the toucan family Ramphastidae. It is the largest species of toucan and has a distinctive appearance, with a black body, a white throat, chest and uppertail-coverts, and red undertail-coverts.","u":"https://en.wikipedia.org/wiki/Toco_toucan","i":"img/95723.jpg"},"8022":{"n":"trout","s":"Oncorhynchus mykiss","p":"504568","x":"The rainbow trout is a species of trout native to cold-water tributaries of the Pacific Ocean in North America and Asia. The steelhead is an anadromous (sea-run) form of the coastal rainbow trout (O.","u":"https://en.wikipedia.org/wiki/Rainbow_trout","i":"img/8022.jpg"},"8236":{"n":"tuna","s":"Thunnus albacares","p":"186745","x":"The yellowfin tuna is a species of tuna found in pelagic waters of tropical and subtropical oceans worldwide.","u":"https://en.wikipedia.org/wiki/Yellowfin_tuna","i":"img/8236.jpg"},"9103":{"n":"turkey","s":"Meleagris gallopavo","p":"9005","x":"The wild turkey is an upland game bird native to North America, one of two extant species of turkey and the heaviest member of the order Galliformes. It is the ancestor to the domestic turkey, which was originally derived from a southern Mexican subspecies of wild turkey.","u":"https://en.wikipedia.org/wiki/Wild_turkey","i":"img/9103.jpg"},"43455":{"n":"turkey vulture","s":"Cathartes aura","p":"8922","x":"The turkey vulture is the most widespread of the New World vultures. One of three species in the genus Cathartes of the family Cathartidae, the turkey vulture ranges from southern Canada to the southernmost tip of South America.","u":"https://en.wikipedia.org/wiki/Turkey_vulture","i":"img/43455.jpg"},"27675":{"n":"two-toed sloth","s":"Choloepus didactylus","p":"948950","x":"Linnaeus's two-toed sloth, also known as the southern two-toed sloth, unau, or Linne's two-toed sloth is a species of sloth from South America, found in Venezuela, Suriname, Guyana, French Guiana, Colombia, Ecuador, Peru, and Brazil north of the Amazon River. There is now evidence suggesting the species' range expands…","u":"https://en.wikipedia.org/wiki/Linnaeus's_two-toed_sloth","i":"img/27675.jpg"},"9430":{"n":"vampire bat","s":"Desmodus rotundus","p":"9397","x":"The common vampire bat is a small, leaf-nosed bat native to the Americas. It is one of three extant species of vampire bats, the other two being the hairy-legged and the white-winged vampire bats.","u":"https://en.wikipedia.org/wiki/Common_vampire_bat","i":"img/9430.jpg"},"55288":{"n":"vampire squid","s":"Vampyroteuthis infernalis","p":"215451","x":"The vampire squid is a small cephalopod found throughout temperate and tropical oceans in extreme deep sea conditions. The vampire squid uses its bioluminescent organs and its unique oxygen metabolism to thrive in the parts of the ocean with the lowest concentrations of oxygen.","u":"https://en.wikipedia.org/wiki/Vampire_squid","i":"img/55288.jpg"},"1385931":{"n":"velvet worm","s":"Eoperipatus totoro","p":"88770","x":"Eoperipatus totoro is a species of velvet worm of the family Peripatidae. The species name was inspired by the Catbus from the Studio Ghibli film My Neighbor Totoro.","u":"https://en.wikipedia.org/wiki/Eoperipatus_totoro","i":"img/1385931.jpg"},"8697":{"n":"viper","s":"Cerastes cerastes","p":"8689","x":"Cerastes cerastes, commonly known as the Saharan horned viper or the desert horned viper, is a species of viper native to the deserts of Northern Africa and parts of the Arabian Peninsula and Levant. It is often easily recognized by the presence of a pair of supraocular \"horns\", although hornless individuals do occur.","u":"https://en.wikipedia.org/wiki/Cerastes_cerastes","i":"img/8697.jpg"},"9707":{"n":"walrus","s":"Odobenus rosmarus","p":"3072905","x":"The walrus is a large pinniped marine mammal with discontinuous distribution about the North Pole in the Arctic Ocean and subarctic seas of the Northern Hemisphere. It is the only extant species in the family Odobenidae and genus Odobenus.","u":"https://en.wikipedia.org/wiki/Walrus","i":"img/9707.jpg"},"41426":{"n":"warthog","s":"Phacochoerus africanus","p":"9821","x":"The common warthog is a wild member of the pig family (Suidae) found in grassland, savanna, and woodland in sub-Saharan Africa. In the past, it was commonly treated as a subspecies of P.","u":"https://en.wikipedia.org/wiki/Common_warthog","i":"img/41426.jpg"},"30213":{"n":"wasp","s":"Vespula pensylvanica","p":"7439","x":"Vespula pensylvanica, the western yellowjacket, is a Nearctic species of wasp in the genus Vespula. It is native to regions of North America, largely in areas with northern temperate climates.","u":"https://en.wikipedia.org/wiki/Vespula_pensylvanica","i":"img/30213.jpg"},"89462":{"n":"water buffalo","s":"Bubalus bubalis","p":"27592","x":"The water buffalo, also called domestic water buffalo, Asian water buffalo, and Asiatic water buffalo, is a large domesticated bovine originating in South and Southeast Asia descended from the wild water buffalo. Today, it is also kept in regions including Italy, the Balkans, Australia, the Americas, and parts of…","u":"https://en.wikipedia.org/wiki/Water_buffalo","i":"img/89462.jpg"},"212017":{"n":"water bug","s":"Lethocerus indicus","p":"7524","x":"Lethocerus indicus is a giant water bug in the family Belostomatidae, native to South and Southeast Asia, as well as southeast China, the Ryukyu Islands, and New Guinea. It was originally described as Belostoma indicum but is no longer placed in that genus.","u":"https://en.wikipedia.org/wiki/Lethocerus_indicus","i":"img/212017.jpg"},"3370370":{"n":"weasel","s":"Neogale frenata","p":"169418","x":"The long-tailed weasel, also known as the bridled weasel, masked ermine, or big stoat, is a species of weasel found in North, Central, and South America. It is distinct from the short-tailed weasel, also known as a \"stoat\", a close relation in the genus Mustela that originated in Eurasia and crossed into North America…","u":"https://en.wikipedia.org/wiki/Long-tailed_weasel","i":"img/3370370.jpg"},"259920":{"n":"whale shark","s":"Rhincodon typus","p":"119195","x":"The whale shark is a slow-moving, filter-feeding carpet shark and the largest known extant fish species. An individual with a length of 18.8 m (61.7 ft) has been considered the largest reliably recorded.","u":"https://en.wikipedia.org/wiki/Whale_shark","i":"img/259920.jpg"},"9927":{"n":"wildebeest","s":"Connochaetes taurinus","p":"9895","x":"The blue wildebeest, also called the common wildebeest, white-bearded gnu or brindled gnu, is a large antelope and one of the two species of wildebeest. It is placed in the genus Connochaetes and family Bovidae, and has a close taxonomic relationship with the black wildebeest.","u":"https://en.wikipedia.org/wiki/Blue_wildebeest","i":"img/9927.jpg"},"9612":{"n":"wolf","s":"Canis lupus","p":"9611","x":"The wolf, also known as the grey wolf or gray wolf, is a canine native to Eurasia and North America. More than thirty subspecies of Canis lupus have been recognized, including the dog and dingo, though grey wolves, as popularly understood, include only naturally occurring wild subspecies.","u":"https://en.wikipedia.org/wiki/Wolf","i":"img/9612.jpg"},"48420":{"n":"wolverine","s":"Gulo gulo","p":"9655","x":"The wolverine, also called the carcajou or quickhatch, is the largest land-dwelling member of the family Mustelidae. It is a muscular carnivore and a solitary animal.","u":"https://en.wikipedia.org/wiki/Wolverine","i":"img/48420.jpg"},"29139":{"n":"wombat","s":"Vombatus ursinus","p":"38609","x":"The common wombat, also known as the bare-nosed wombat, is a marsupial, one of three extant species of wombats and the sole extant member of the genus Vombatus. It has three subspecies: Vombatus ursinus hirsutus, found on the Australian mainland;\nVombatus ursinus tasmaniensis, found in Tasmania; and Vombatus ursinus…","u":"https://en.wikipedia.org/wiki/Common_wombat","i":"img/29139.jpg"},"51359":{"n":"woodpecker","s":"Dryocopus pileatus","p":"9219","x":"The pileated woodpecker is a large, crow-sized woodpecker with a prominent red crest, white neck stripe, and a mostly black body. This woodpecker is native to North America, where it is the largest confirmed extant woodpecker species and the third-largest extant species of woodpecker in the world, after the great…","u":"https://en.wikipedia.org/wiki/Pileated_woodpecker","i":"img/51359.jpg"},"36278":{"n":"wren","s":"Troglodytes troglodytes","p":"9126","x":"The Eurasian wren is a very small insectivorous bird and the only member of the wren family found in the Old World, specifically in Eurasia and Africa (Maghreb). In Anglophone Europe, it is commonly known simply as the wren.","u":"https://en.wikipedia.org/wiki/Eurasian_wren","i":"img/36278.jpg"},"30521":{"n":"yak","s":"Bos grunniens","p":"9903","x":"The yak is a species of long-haired domesticated Asian cattle found throughout the Himalayan region, the Tibetan Plateau, Tajikistan, the Pamir Mountains, and as far north as Mongolia and Siberia. It is descended from the wild yak.","u":"https://en.wikipedia.org/wiki/Yak","i":"img/30521.jpg"} nantly photosynthetic superclade Archaeplastida, with around half a million known species that include all green algae and land plants. They are important primary…","u":"https://en.wikipedia.org/wiki/Viridiplantae","i":"img/33090.jpg","e":"Latin <b>viridis<\/b> \"green\" + <b>plantae<\/b> \"plants\": the green plants."},"3193":{"p":"33090","n":"Embryophyta","r":"clade","d":"Subclade of green plants, also known as land plants","x":"The embryophytes are plants of the clade Embryophyta, also known as Plantae sensu strictissimo or land plants. They are complex multicellular eukaryotes with haplodiplontic life cycles.","u":"https://en.wikipedia.org/wiki/Embryophyte","i":"img/3193.jpg","e":"<b>embryo<\/b> + Greek <b>φυτά<\/b> (<i>phutá<\/i>) \"plants\": the land plants, which nurture the embryo inside the parent plant."},"78536":{"p":"3193","n":"Euphyllophyta","r":"clade","d":"Clade of vascular plants","x":"The euphyllophytes are a clade of plants within the tracheophytes. The group may be treated as an unranked clade, a division under the name Euphyllophyta or a subdivision under the name Euphyllophytina.","u":"https://en.wikipedia.org/wiki/Euphyllophyte","i":"img/78536.jpg","e":"Greek <b>εὐ-<\/b> (<i>eu-<\/i>) \"true\" + <b>φύλλον<\/b> (<i>phúllon<\/i>) \"leaf\" + <b>φυτόν<\/b> (<i>phutón<\/i>) \"plant\": the true-leaved plants, ferns and seed plants. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"58024":{"p":"78536","n":"Spermatophyta","r":"clade","d":"Plants that reproduce with seeds","x":"A seed plant or spermatophyte, also called a phanerogam or a phaenogam, is any plant that produces seeds. It is a category of embryophyte that includes most of the familiar land plants, including the flowering plants and the gymnosperms, but not ferns, mosses, or algae.","u":"https://en.wikipedia.org/wiki/Seed_plant","i":"img/58024.jpg","e":"Greek <b>σπέρμα<\/b> (<i>spérma<\/i>) \"seed\" + <b>φυτόν<\/b> (<i>phutón<\/i>) \"plant\": the seed plants."},"3398":{"p":"58024","n":"Magnoliopsida","r":"class","d":"Class of flowering plants","x":"Magnoliopsida is a valid botanical name for a class of flowering plants. By definition the class will include the family Magnoliaceae, but its circumscription can otherwise vary, being more inclusive or less inclusive depending upon the classification system being discussed.","u":"https://en.wikipedia.org/wiki/Magnoliopsida","i":"img/3398.jpg","e":"<b>Magnolia<\/b> + <b>-opsida<\/b> (Greek <b>ὄψις<\/b>, <i>ópsis<\/i>, \"appearance\"): the flowering plants, named for the magnolia."},"1437183":{"p":"3398","n":"Mesangiospermae","r":"clade","d":"One of two clades of flowering plants","x":"Mesangiospermae is a clade that contains the majority of flowering plants (angiosperms). Mesangiosperms are therefore known as the core angiosperms, in contrast to the three orders of earlier-diverging species known as the basal angiosperms: Nymphaeales, Austrobaileyales, and Amborellales.","u":"https://en.wikipedia.org/wiki/Mesangiospermae","i":"img/1437183.jpg","e":"Greek <b>μέσος<\/b> (<i>mésos<\/i>) \"middle\" + <b>ἀγγεῖον<\/b> (<i>angeîon<\/i>) \"vessel\" + <b>σπέρμα<\/b> (<i>spérma<\/i>) \"seed\": the core flowering plants, seeds enclosed in a vessel. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"4447":{"p":"1437183","n":"Liliopsida","r":"clade","d":"Class of flowering plants","x":"Liliopsida Batsch is a botanical name for the class containing the family Liliaceae. It is considered synonymous with the name monocotyledon.","u":"https://en.wikipedia.org/wiki/Liliopsida","i":"img/4447.jpg","e":"<b>Lilium<\/b> \"lily\" + <b>-opsida<\/b> \"looking like\": the monocots, named for the lily."},"1437197":{"p":"4447","n":"Petrosaviidae","r":"subclass","d":"Clade of flowering plants","x":"Monocotyledons, commonly referred to as monocots, are flowering plants whose seeds contain only one embryonic leaf, or cotyledon. A monocot taxon has been in use for several decades, but with various ranks and under several different names.","u":"https://en.wikipedia.org/wiki/Monocotyledon","si":"Monocotyledon","i":"img/1437197.jpg","e":"<b>Petrosavia<\/b>, a small Asian herb genus + <b>-idae<\/b> \"subclass\": nearly all monocots. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"73496":{"p":"1437197","n":"Asparagales","r":"order","d":"Order of monocot flowering plants","x":"Asparagales are a diverse order of flowering plants in the monocots. Under the APG IV system of flowering plant classification, Asparagales are the largest order of monocots with 14 families, 1,122 genera, and about 36,000 species, with members as varied as asparaguses, orchids, yuccas, irises, onions, garlics, leeks,…","u":"https://en.wikipedia.org/wiki/Asparagales","i":"img/73496.jpg","e":"<b>Asparagus<\/b> + <b>-ales<\/b> \"order\": orchids, onions, irises and agave."},"40552":{"p":"73496","n":"Asparagaceae","r":"family","d":"Family of plants","x":"Asparagaceae, known as the asparagus family, is a family of flowering plants, placed in the order Asparagales of the monocots. The family name is based on the edible garden asparagus, Asparagus officinalis.","u":"https://en.wikipedia.org/wiki/Asparagaceae","i":"img/40552.jpg","e":"<b>Asparagus<\/b> + <b>-aceae<\/b> \"family\": asparagus, agave and hyacinths."},"1437201":{"p":"1437183","n":"Pentapetalae","r":"clade","d":"Group of eudicots known as core eudicots","x":"In phylogenetic nomenclature, the Pentapetalae are a large group of eudicots that were informally referred to as the \"core eudicots\" in some papers on angiosperm phylogenetics. They comprise an extremely large and diverse group accounting for about 65% of the species richness of the angiosperms, with wide variability…","u":"https://en.wikipedia.org/wiki/Pentapetalae","i":"img/1437201.jpg","e":"Greek <b>πέντε<\/b> (<i>pénte<\/i>) \"five\" + <b>πέταλον<\/b> (<i>pétalon<\/i>) \"leaf, petal\": flowers built in whorls of five.","ep":"PIE <b><i>*pénkʷe<\/i><\/b> → English <b>five<\/b>"},"71275":{"p":"1437201","n":"rosids","r":"clade","d":"Large clade of flowering plants","x":"The rosids are members of a large clade of flowering plants, containing about 70,000 species, more than a quarter of all angiosperms.","u":"https://en.wikipedia.org/wiki/Rosids","i":"img/71275.jpg","e":"Latin <b>rosa<\/b> \"rose\" + <b>-ids<\/b>, an informal ending for clades: the rose-like eudicots."},"91835":{"p":"71275","n":"fabids","r":"clade","d":"Large clade of flowering plants","x":"The rosids are members of a large clade of flowering plants, containing about 70,000 species, more than a quarter of all angiosperms.","u":"https://en.wikipedia.org/wiki/Rosids","i":"img/91835.jpg","e":"Latin <b>faba<\/b> \"bean\" + <b>-ids<\/b>: legumes, roses, oaks and squashes."},"3803":{"p":"91835","n":"Fabaceae","r":"family","d":"Family of legume flowering plants","x":"Fabaceae or Leguminosae, commonly known as the legume, pea, or bean family, is a large and agriculturally important family of flowering plants. It includes trees, shrubs, and perennial or annual herbaceous plants, which are easily recognized by their fruit (legume) and their compound, stipulate leaves.","u":"https://en.wikipedia.org/wiki/Fabaceae","i":"img/3803.jpg","e":"<b>Faba<\/b>, an old genus name for the broad bean + <b>-aceae<\/b> \"family\": the legume family."},"2231393":{"p":"3803","n":"50 kb inversion clade","r":"clade","d":"Clade of legumes","x":"Meso-Papilionoideae or 50-kb Inversion clade is a monophyletic clade of the flowering plant subfamily Faboideae that includes the majority of papilionoid legumes. It contains many agronomically important genera, including Arachis (peanut), Cicer (chickpea), Glycine (soybean), Medicago (alfalfa), Phaseolus, Trifolium…","u":"https://en.wikipedia.org/wiki/Meso-Papilionoideae","i":"img/2231393.jpg","e":"Not Latin: named for a <b>50-kilobase inversion<\/b>, a flipped stretch of the chloroplast genome shared by most legumes. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2231382":{"p":"2231393","n":"NPAAA clade","r":"clade","d":"Division within flowering plants","x":"The non-protein amino acid-accumulating clade, also known as the Canavanine-accumulating clade, is a clade of the flowering plant subfamily Faboideae that includes the majority of agriculturally-cultivated legumes. It is characterized by the accumulation of the non-proteinogenic amino acid canavanine in the seeds—a…","u":"https://en.wikipedia.org/wiki/Non-protein_amino_acid-accumulating_clade","i":"img/2231382.jpg","e":"Not Latin: an acronym usually read as <b>non-protein amino acid accumulating<\/b> clade, for chemicals many of its legumes store. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2233839":{"p":"2231382","n":"IRL clade","r":"clade","d":"Group of flowering plants","x":"The inverted repeat-lacking clade (IRLC) is an informal monophyletic clade of the flowering plant subfamily Faboideae. Well-known members of this clade include chickpeas, broad or fava beans, vetch, lentils, peas, wisteria, alfalfa, clover, fenugreek, liquorice, and locoweeds.","u":"https://en.wikipedia.org/wiki/Inverted_repeat-lacking_clade","i":"img/2233839.jpg","e":"Not Latin: <b>IRL<\/b> = \"inverted-repeat-lacking,\" for legumes that lost one copy of a repeated chloroplast DNA segment. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"163742":{"p":"2233839","n":"Trifolieae","r":"tribe","d":"Tribe of legumes","x":"The tribe Trifolieae is one of the subdivisions of the plant family Fabaceae. It is included within the inverted repeat-lacking clade (IRLC).","u":"https://en.wikipedia.org/wiki/Trifolieae","i":"img/163742.jpg","e":"<b>Trifolium<\/b>, Latin <b>tri-<\/b> \"three\" + <b>folium<\/b> \"leaf\" + <b>-eae<\/b> \"tribe\": clovers and alfalfa.","ep":"PIE <b><i>*tréyes<\/i><\/b> → English <b>three<\/b>"},"3744":{"p":"91835","n":"Rosales","r":"order","d":"Order of flowering plants","x":"Rosales are an order of flowering plants. Well-known members of Rosales include: roses, strawberries, blackberries and raspberries, apples, cherries, pears, plums, peaches and apricots, almonds, rowan and hawthorn, jujube, elms, banyans, figs, mulberries, breadfruit, nettles, hops, and cannabis.","u":"https://en.wikipedia.org/wiki/Rosales","i":"img/3744.jpg","e":"Latin <b>Rosa<\/b> \"rose\" + <b>-ales<\/b> \"order\": roses, figs, elms and hemp."},"3745":{"p":"3744","n":"Rosaceae","r":"family","d":"Rose family of flowering plants","x":"Rosaceae, the rose family, is a family of flowering plants that includes 4,828 known species in 91 genera.","u":"https://en.wikipedia.org/wiki/Rosaceae","i":"img/3745.jpg","e":"Latin <b>Rosa<\/b> \"rose\" + <b>-aceae<\/b> \"family\": roses, apples, cherries and strawberries."},"171637":{"p":"3745","n":"Amygdaloideae","r":"subfamily","d":"Subfamily of flowering plants","x":"Amygdaloideae is a subfamily within the flowering plant family Rosaceae. It was formerly considered by some authors to be separate from Rosaceae, and the family names Prunaceae and Amygdalaceae have been used.","u":"https://en.wikipedia.org/wiki/Amygdaloideae","i":"img/171637.jpg","e":"<b>Amygdalus<\/b>, Greek <b>ἀμυγδάλη<\/b> (<i>amugdálē<\/i>) \"almond\" + <b>-oideae<\/b> \"subfamily\". The brain's <b>amygdala<\/b> is named for its almond shape."},"3754":{"p":"171637","n":"Prunus","r":"genus","d":"Genus of trees and shrubs","x":"Prunus is a genus of flowering trees and shrubs from the rose family (Rosaceae) that produce stone fruits, or drupes. As of March 2024, the genus has about 340 accepted species, including almonds, apricots, cherries, peaches, and plums.","u":"https://en.wikipedia.org/wiki/Prunus","i":"img/3754.jpg","e":"Latin <b>prūnus<\/b> \"plum tree,\" a loan from Greek <b>προῦμνον<\/b> (<i>proûmnon<\/i>), origin unknown: plums, cherries, peaches and almonds."},"71274":{"p":"1437201","n":"asterids","r":"clade","d":"Clade of eudicot angiosperms","x":"Asterids are a large clade of flowering plants, composed of 17 orders and more than 80,000 species, about a third of the total flowering plant species. The asterids are divided into the unranked clades lamiids and campanulids, and the single orders Cornales and Ericales.","u":"https://en.wikipedia.org/wiki/Asterids","i":"img/71274.jpg","e":"From <b>Asteridae<\/b>, after <b>Aster<\/b>, Greek <b>ἀστήρ<\/b> (<i>astḗr<\/i>) \"star,\" for the star-shaped flower heads."},"91882":{"p":"71274","n":"campanulids","r":"clade","d":"Clade of eudicot angiosperms","x":"Asterids are a large clade of flowering plants, composed of 17 orders and more than 80,000 species, about a third of the total flowering plant species. The asterids are divided into the unranked clades lamiids and campanulids, and the single orders Cornales and Ericales.","u":"https://en.wikipedia.org/wiki/Asterids","i":"img/91882.jpg","e":"From <b>Campanulidae<\/b>, after <b>Campanula<\/b> \"little bell\" (Latin <b>campāna<\/b> \"bell\"): daisies, carrots and honeysuckles."},"364270":{"p":"91882","n":"Apiineae","r":"suborder","d":"Order of eudicot flowering plants in the asterid group","x":"The Apiales are an order of flowering plants, included in the asterid group of dicotyledons. Well-known members of Apiales include carrots, celery, coriander, parsley, parsnips, poison hemlock, ginseng, ivies, and pittosporums.","u":"https://en.wikipedia.org/wiki/Apiales","si":"Apiales","i":"img/364270.jpg","e":"<b>Apium<\/b> \"celery\" + <b>-ineae<\/b> \"suborder\": carrots, parsley and ginseng. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"241778":{"p":"364270","n":"Apioideae","r":"subfamily","d":"Family of flowering plants","x":"Apiaceae, also called Umbelliferae, is a family of mostly aromatic flowering plants named after the type genus Apium, and commonly known as the celery, carrot, or parsley family, or as umbellifers. It is the 16th-largest family of flowering plants, with more than 3,800 species in about 446 genera, including such…","u":"https://en.wikipedia.org/wiki/Apiaceae","si":"Apiaceae","i":"img/241778.jpg","e":"<b>Apium<\/b> \"celery\" + <b>-oideae<\/b> \"subfamily\": carrots, celery, parsley, dill and cumin."},"241780":{"p":"241778","n":"apioid superclade","r":"clade","d":"Family of flowering plants","x":"Apiaceae, also called Umbelliferae, is a family of mostly aromatic flowering plants named after the type genus Apium, and commonly known as the celery, carrot, or parsley family, or as umbellifers. It is the 16th-largest family of flowering plants, with more than 3,800 species in about 446 genera, including such…","u":"https://en.wikipedia.org/wiki/Apiaceae","si":"Apiaceae","i":"img/241780.jpg","e":"Not formal Latin: \"apioid\" = celery-like (<b>Apium<\/b>), the core of the carrot family. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"721813":{"p":"171637","n":"Maleae","r":"tribe","d":"Tribe of flowering plants","x":"The Maleae are the apple tribe in the rose family, Rosaceae. The group includes some plants bearing commercially important fruits, such as apples and pears, while others are cultivated as ornamentals.","u":"https://en.wikipedia.org/wiki/Maleae","i":"img/721813.jpg","e":"Latin <b>Malus<\/b> \"apple tree\" + <b>-eae<\/b> \"tribe\": apples and pears."},"4210":{"p":"91882","n":"Asteraceae","r":"family","d":"Large family of flowering plants","x":"Asteraceae is a large family of flowering plants that consists of over 32,000 known species in over 1,900 genera within the order Asterales. The number of species in Asteraceae is rivaled only by the Orchidaceae, and which is the larger family is unclear as the number of extant species in each family is unknown.","u":"https://en.wikipedia.org/wiki/Asteraceae","i":"img/4210.jpg","e":"<b>Aster<\/b>, Greek <b>ἀστήρ<\/b> (<i>astḗr<\/i>) \"star\" + <b>-aceae<\/b> \"family\": daisies and sunflowers, whose flower heads look like rayed stars."},"232347":{"p":"1437183","n":"Magnoliidae","r":"clade","d":"Clade of flowering plants","x":"Magnoliids, Magnoliidae or Magnolianae are a clade of flowering plants. With more than 10,000 species, including magnolias, nutmeg, bay laurel, cinnamon, annonas, avocado, black pepper, tulip tree and many others, it is the third-largest group of angiosperms after the eudicots and monocots.","u":"https://en.wikipedia.org/wiki/Magnoliids","i":"img/232347.jpg","e":"<b>Magnolia<\/b> + <b>-idae<\/b> \"subclass\": magnolias, laurels and black pepper."},"3433":{"p":"232347","n":"Lauraceae","r":"family","d":"Family of flowering plants","x":"Lauraceae, or the laurels, is a plant family that includes the true laurel and its closest relatives. This family comprises about 2850 known species in about 45 genera worldwide.","u":"https://en.wikipedia.org/wiki/Lauraceae","i":"img/3433.jpg","e":"Latin <b>Laurus<\/b> \"laurel, bay\" + <b>-aceae<\/b> \"family\": bay laurel, avocado and cinnamon. A laurel wreath was the ancient sign of victory."},"1437180":{"p":"58024","n":"Acrogymnospermae","r":"clade","d":"Clade of non-flowering, naked-seeded vascular plants","x":"The gymnosperms are a group of woody, perennial seed-producing plants, typically lacking the protective outer covering which surrounds the seeds in flowering plants, that include conifers, cycads, ginkgos, and gnetophytes, forming the clade Gymnospermae. The name is based on the unenclosed condition of their seeds.","u":"https://en.wikipedia.org/wiki/Gymnosperm","i":"img/1437180.jpg","e":"Greek <b>ἄκρος<\/b> (<i>ákros<\/i>) \"topmost\" + <b>γυμνός<\/b> (<i>gumnós<\/i>) \"naked\" + <b>σπέρμα<\/b> (<i>spérma<\/i>) \"seed\": the living gymnosperms, whose seeds sit naked on cone scales. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"3313":{"p":"1437180","n":"Pinidae","r":"subclass","d":"Subclass of plants","x":"Pinidae is a subclass of Equisetopsida in the sense used by Mark W. Chase and James L.","u":"https://en.wikipedia.org/wiki/Pinidae","i":"img/3313.jpg","e":"Latin <b>Pinus<\/b> \"pine\" + <b>-idae<\/b> \"subclass\": the conifers."},"3318":{"p":"3313","n":"Pinaceae","r":"family","d":"Family of conifers","x":"The Pinaceae, or pine family, is a large family of conifers, including many of the well-known conifers of commercial importance such as cedars, firs, hemlocks, larches, pines, and spruces. The family is included in the order Pinales, formerly known as Coniferales.","u":"https://en.wikipedia.org/wiki/Pinaceae","i":"img/3318.jpg","e":"Latin <b>Pinus<\/b> \"pine\" + <b>-aceae<\/b> \"family\": pines, spruces, firs and cedars."},"4734":{"p":"1437197","n":"commelinids","r":"clade","d":"Clade of monocot flowering plants","x":"In plant taxonomy, commelinids is a clade of flowering plants within the monocots, distinguished by having cell walls containing UV-fluorescent ferulic acid. Well-known commelinids include palms and relatives, dayflowers, spiderworts, kangaroo paws, and water hyacinth, grasses, bromeliads, pineapples, rushes, and…","u":"https://en.wikipedia.org/wiki/Commelinids","i":"img/4734.jpg","e":"From <b>Commelina<\/b> (dayflowers) + <b>-ids<\/b>: grasses, palms, gingers and bananas."},"38820":{"p":"4734","n":"Poales","r":"order","d":"Order of monocotyledonous flowering plants","x":"The Poales are a large order of flowering plants in the monocotyledons, and includes families of plants such as the grasses, bromeliads, rushes and sedges. 14 plant families are currently recognized by botanists to be part of Poales.","u":"https://en.wikipedia.org/wiki/Poales","i":"img/38820.jpg","e":"<b>Poa<\/b> + <b>-ales<\/b> \"order\": grasses, sedges and pineapples."},"4479":{"p":"38820","n":"Poaceae","r":"family","d":"Family of flowering plants commonly known as grasses","x":"Poaceae, also called Gramineae, is a large and nearly ubiquitous family of monocotyledonous flowering plants commonly known as true grasses. It includes the cereal grasses, bamboos, the grasses of natural grassland and species cultivated in lawns and pasture.","u":"https://en.wikipedia.org/wiki/Poaceae","i":"img/4479.jpg","e":"<b>Poa<\/b>, Greek <b>πόα<\/b> (<i>póa<\/i>) \"fodder\" + <b>-aceae<\/b> \"family\": the grasses."},"359160":{"p":"4479","n":"BOP clade","r":"clade","d":"Clade of grasses","x":"The BOP clade (sometimes BEP clade) is one of two major lineages (or clades) of undefined taxonomic rank in the grasses (Poaceae), containing more than 5,400 species, about half of all grasses. Well-known members of this clade include rice, some major cereals such as wheat, barley, oat, and rye, many lawn and pasture…","u":"https://en.wikipedia.org/wiki/BOP_clade","i":"img/359160.jpg","e":"An acronym: <b>B<\/b>ambusoideae + <b>O<\/b>ryzoideae + <b>P<\/b>ooideae, meaning bamboos, rice and wheat."},"4618":{"p":"4734","n":"Zingiberales","r":"order","d":"Order of flowering plants","x":"The Zingiberales are flowering plants forming one of four orders in the commelinids clade of monocots, together with its sister order, Commelinales. The order includes 68 genera and 2,600 species.","u":"https://en.wikipedia.org/wiki/Zingiberales","i":"img/4618.jpg","e":"<b>Zingiber<\/b> \"ginger\" + <b>-ales<\/b> \"order\": ginger, bananas and bird-of-paradise flowers."},"91836":{"p":"71275","n":"malvids","r":"clade","d":"Large clade of flowering plants","x":"The rosids are members of a large clade of flowering plants, containing about 70,000 species, more than a quarter of all angiosperms.","u":"https://en.wikipedia.org/wiki/Rosids","i":"img/91836.jpg","e":"Latin <b>malva<\/b> \"mallow\" + <b>-ids<\/b>: citrus, cabbages, cotton and myrtles."},"3629":{"p":"91836","n":"Malvaceae","r":"family","d":"Family of flowering plants","x":"Malvaceae, or the mallows, is a family of flowering plants estimated to contain 244 genera with 4225 known species. Well-known members of economic importance include cacao, cola, cotton, okra, roselle and durian.","u":"https://en.wikipedia.org/wiki/Malvaceae","i":"img/3629.jpg","e":"Latin <b>malva<\/b> \"mallow\" + <b>-aceae<\/b> \"family\": mallows, cotton, cacao and durian. <i>Malva<\/i> also gave English the color <b>mauve<\/b>."},"147368":{"p":"359160","n":"Pooideae","r":"subfamily","d":"Subfamily of plants","x":"The Pooideae are the largest subfamily of the grass family Poaceae, with about 4,000 species in 15 tribes and roughly 200 genera. They include some major cereals such as wheat, barley, oat, rye and many lawn and pasture grasses.","u":"https://en.wikipedia.org/wiki/Pooideae","i":"img/147368.jpg","e":"<b>Poa<\/b> \"grass\" + <b>-oideae<\/b> \"subfamily\": wheat, barley, oats and lawn grasses."},"147389":{"p":"147368","n":"Triticeae","r":"tribe","d":"Tribe of grasses","x":"Triticeae is a botanical tribe within the subfamily Pooideae of grasses that includes genera with many domesticated species. Major crop genera found in this tribe include wheat, barley, and rye; crops in other genera include some for human consumption, and others used for animal feed or rangeland protection.","u":"https://en.wikipedia.org/wiki/Triticeae","i":"img/147389.jpg","e":"Latin <b>Triticum<\/b> \"wheat\" + <b>-eae<\/b> \"tribe\": wheat, barley and rye."},"1648017":{"p":"147389","n":"Hordeinae","r":"subtribe","d":"Tribe of grasses","x":"Triticeae is a botanical tribe within the subfamily Pooideae of grasses that includes genera with many domesticated species. Major crop genera found in this tribe include wheat, barley, and rye; crops in other genera include some for human consumption, and others used for animal feed or rangeland protection.","u":"https://en.wikipedia.org/wiki/Triticeae","si":"Triticeae","i":"img/1648017.jpg","e":"Latin <b>Hordeum<\/b> \"barley\" + <b>-inae<\/b> \"subtribe\": barley, wheat and rye."},"3524":{"p":"1437201","n":"Caryophyllales","r":"order","d":"Order of flowering plants","x":"Caryophyllales is a diverse and heterogeneous order of flowering plants which includes well-known species such as cacti, carnations, beets, quinoa, spinach, amaranths, pigfaces and ice plants, oraches and saltbushes, goosefoots, sundews, Venus flytrap, tropical pitcher plants, Malabar spinach, bougainvilleas, four…","u":"https://en.wikipedia.org/wiki/Caryophyllales","i":"img/3524.jpg","e":"<b>Caryophyllus<\/b>, a former genus now mostly in <i>Dianthus<\/i> (carnations) + <b>-ales<\/b> \"order\": cacti, carnations and spinach."},"3593":{"p":"3524","n":"Cactaceae","r":"family","d":"Family of mostly succulent plants, adapted to dry environments","x":"A cactus is a member of the plant family Cactaceae, a family of the order Caryophyllales comprising about 131-140 genera with some 1,866 up to 2000+ known species. The word cactus derives, through Latin, from the Ancient Greek word κάκτος (káktos), a name originally used by Theophrastus for a spiny plant whose…","u":"https://en.wikipedia.org/wiki/Cactus","i":"img/3593.jpg","e":"<b>Cactus<\/b>, through Latin from Greek <b>κάκτος<\/b> (<i>káktos<\/i>), Theophrastus' name for an unidentified spiny plant + <b>-aceae<\/b> \"family\"."},"186265":{"p":"3593","n":"Cactoideae","r":"subfamily","d":"Subfamily of the cactus family, Cactaceae","x":"The Cactoideae are the largest subfamily of the cactus family, Cactaceae, and are widely distributed throughout the Americas. Around 80% of cactus species belong to this subfamily.","u":"https://en.wikipedia.org/wiki/Cactoideae","i":"img/186265.jpg","e":"<b>Cactus<\/b> + <b>-oideae<\/b> \"subfamily\": most cacti, saguaro included."},"186270":{"p":"186265","n":"Cacteae","r":"tribe","d":"Tribe of plants","x":"Cacteae is a tribe of plants of the family Cactaceae found mainly in North America especially Mexico. As of August 2018, the internal classification of the family Cactaceae remained uncertain and subject to change.","u":"https://en.wikipedia.org/wiki/Cacteae","i":"img/186270.jpg","e":"<b>Cactus<\/b> + <b>-eae<\/b> \"tribe\": barrel cacti and their kin. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"91888":{"p":"71274","n":"lamiids","r":"clade","d":"Clade of eudicot angiosperms","x":"Asterids are a large clade of flowering plants, composed of 17 orders and more than 80,000 species, about a third of the total flowering plant species. The asterids are divided into the unranked clades lamiids and campanulids, and the single orders Cornales and Ericales.","u":"https://en.wikipedia.org/wiki/Asterids","i":"img/91888.jpg","e":"<b>Lamium<\/b> \"deadnettle\" + <b>-ids<\/b>: mints, nightshades, olives and coffee. Named by Armen Takhtajan."},"4143":{"p":"91888","n":"Lamiales","r":"order","d":"Order of dicot flowering plants","x":"The Lamiales are an order of flowering plants in the asterids clade of the Eudicots. Under the APG IV system of flowering plant classification the order consists of 24 families, and includes about 23,810 species and 1,059 genera with representatives found all over the world.","u":"https://en.wikipedia.org/wiki/Lamiales","i":"img/4143.jpg","e":"<b>Lamium<\/b> \"deadnettle\" + <b>-ales<\/b> \"order\": mints, olives, snapdragons and sesame."},"216706":{"p":"4143","n":"Nepetoideae","r":"subfamily","d":"Subfamily of flowering plants in the sage family","x":"Nepetoideae is a subfamily of plants in the family Lamiaceae.","u":"https://en.wikipedia.org/wiki/Nepetoideae","i":"img/216706.jpg","e":"<b>Nepeta<\/b> \"catnip\" + <b>-oideae<\/b> \"subfamily\": mints, basil, sage and catnip."},"216719":{"p":"216706","n":"Ocimeae","r":"tribe","d":"Subfamily of flowering plants in the sage family","x":"Nepetoideae is a subfamily of plants in the family Lamiaceae.","u":"https://en.wikipedia.org/wiki/Nepetoideae","i":"img/216719.jpg","e":"<b>Ocimum<\/b> \"basil,\" from Greek <b>ὤκιμον<\/b> (<i>ṓkimon<\/i>) + <b>-eae<\/b> \"tribe\": basil and lavender. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"3563":{"p":"3524","n":"Amaranthaceae","r":"family","d":"Family of flowering plants","x":"Amaranthaceae is a family of flowering plants commonly known as the amaranth family, in reference to its type genus Amaranthus. It includes the former goosefoot family Chenopodiaceae and contains about 165 genera and 2,040 species, making it the most species-rich lineage within its parent order, Caryophyllales.","u":"https://en.wikipedia.org/wiki/Amaranthaceae","i":"img/3563.jpg","e":"<b>Amaranthus<\/b>, from Greek <b>ἀμάραντος<\/b> (<i>amárantos<\/i>) \"unfading\" + <b>-aceae<\/b> \"family\": amaranth, beets, spinach and quinoa. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"4199":{"p":"91882","n":"Dipsacales","r":"order","d":"Order of dicotyledonous flowering plants","x":"The Dipsacales are an order of flowering plants, included within the asterid group of dicotyledons. In the APG III system of 2009, the order includes only two families, Adoxaceae and a broadly defined Caprifoliaceae.","u":"https://en.wikipedia.org/wiki/Dipsacales","i":"img/4199.jpg","e":"<b>Dipsacus<\/b> \"teasel,\" from Greek <b>δίψα<\/b> (<i>dípsa<\/i>) \"thirst,\" for leaves that cup rainwater + <b>-ales<\/b> \"order\": honeysuckles and valerian. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"163735":{"p":"2231382","n":"Phaseoleae","r":"tribe","d":"Tribe of legumes","x":"The plant tribe Phaseoleae is one of the subdivisions of the legume subfamily Faboideae, in the unranked NPAAA clade. This group includes many of the beans cultivated for human and animal food, most importantly from the genera Glycine, Phaseolus, and Vigna.","u":"https://en.wikipedia.org/wiki/Phaseoleae","i":"img/163735.jpg","e":"<b>Phaseolus<\/b> \"bean,\" from Greek <b>φάσηλος<\/b> (<i>phásēlos<\/i>) + <b>-eae<\/b> \"tribe\": beans and soybeans."},"3699":{"p":"91836","n":"Brassicales","r":"order","d":"Order of dicot flowering plants","x":"The Brassicales are an order of flowering plants, belonging to the malvid group of eudicotyledons under the APG IV system. Well-known members of Brassicales include cabbage, cauliflower, Brussels sprout, broccoli, kale, mustard, turnip, bok choy, rapeseed, radish, horseradish, caper, papaya, moringa or drumstick tree,…","u":"https://en.wikipedia.org/wiki/Brassicales","i":"img/3699.jpg","e":"Latin <b>Brassica<\/b> \"cabbage\" + <b>-ales<\/b> \"order\": cabbages, capers and papaya."},"3700":{"p":"3699","n":"Brassicaceae","r":"family","d":"Family of flowering plants","x":"Brassicaceae or Cruciferae is a medium-sized and economically important family of flowering plants commonly known as the mustards, the crucifers, or the cabbage family. Most are herbaceous plants, while some are shrubs.","u":"https://en.wikipedia.org/wiki/Brassicaceae","i":"img/3700.jpg","e":"Latin <b>Brassica<\/b> \"cabbage\" + <b>-aceae<\/b> \"family\". The older name <b>Cruciferae<\/b> means \"cross-bearers,\" for the four petals in a cross."},"981071":{"p":"3700","n":"Brassiceae","r":"tribe","d":"Family of flowering plants","x":"Brassicaceae or Cruciferae is a medium-sized and economically important family of flowering plants commonly known as the mustards, the crucifers, or the cabbage family. Most are herbaceous plants, while some are shrubs.","u":"https://en.wikipedia.org/wiki/Brassicaceae","si":"Brassicaceae","i":"img/981071.jpg","e":"Latin <b>Brassica<\/b> \"cabbage\" + <b>-eae<\/b> \"tribe\": cabbage, mustard and radish."},"3705":{"p":"981071","n":"Brassica","r":"genus","d":"Genus of flowering plants in the cabbage family","x":"Brassica is a genus of plants in the cabbage and mustard family (Brassicaceae). The members of the genus are informally known as cruciferous vegetables, cabbages, mustard plants, or simply brassicas.","u":"https://en.wikipedia.org/wiki/Brassica","i":"img/3705.jpg","e":"Latin <b>brassica<\/b> \"cabbage.\" The \"cole\" in cole crops (and coleslaw) is Latin <b>caulis<\/b> \"stem\"."},"171638":{"p":"3745","n":"Rosoideae","r":"subfamily","d":"Subfamily of flowering plants","x":"The rose subfamily Rosoideae consists of more than 850 species, including many shrubs, perennial herbs, and fruit plants such as strawberries and brambles. Only a few are annual herbs.","u":"https://en.wikipedia.org/wiki/Rosoideae","i":"img/171638.jpg","e":"Latin <b>Rosa<\/b> \"rose\" + <b>-oideae<\/b> \"subfamily\": roses, strawberries and raspberries."},"1176516":{"p":"171638","n":"Rosoideae incertae sedis","r":"no rank","d":"Subfamily of flowering plants","x":"The rose subfamily Rosoideae consists of more than 850 species, including many shrubs, perennial herbs, and fruit plants such as strawberries and brambles. Only a few are annual herbs.","u":"https://en.wikipedia.org/wiki/Rosoideae","si":"Rosoideae","i":"img/1176516.jpg","e":"Latin <b>incertae sedis<\/b> \"of uncertain seat\": a holding pen for Rosoideae members whose exact placement isn't settled. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"23216":{"p":"1176516","n":"Rubus","r":"genus","d":"Genus of plants in the rose family","x":"Rubus is a large and diverse genus of flowering plants in the rose family, Rosaceae, subfamily Rosoideae, most commonly known as brambles. Fruits of various species are known as raspberries, blackberries, dewberries, cloudberries, and bristleberries.","u":"https://en.wikipedia.org/wiki/Rubus","i":"img/23216.jpg","e":"Latin <b>rubus<\/b> \"bramble, blackberry bush.\""},"3328":{"p":"3318","n":"Picea","r":"genus","d":"Genus of coniferous evergreen trees","x":"A spruce is a tree of the genus Picea, a genus of some 37 species of coniferous trees in the pine family, Pinaceae, found in the northern temperate and boreal (taiga) regions of the Northern Hemisphere. Picea is treated either in the subfamily Pinoideae, or the sole genus in its own subfamily Piceoideae.","u":"https://en.wikipedia.org/wiki/Spruce","i":"img/3328.jpg","e":"Latin <b>picea<\/b> \"pitch pine,\" from <b>pix<\/b> \"pitch\": spruce resin was once boiled down for pitch."},"41945":{"p":"71274","n":"Ericales","r":"order","d":"Order of eudicot flowering plants","x":"The Ericales are a large and diverse order of flowering plants in the asterid group of the eudicots. Well-known and economically important members of this order include tea and ornamental camellias, persimmon, ebony, blueberry, cranberry, lingonberry, huckleberry, kiwifruit, Brazil nut, argan, sapote, azaleas and…","u":"https://en.wikipedia.org/wiki/Ericales","i":"img/41945.jpg","e":"<b>Erica<\/b> \"heath,\" from Greek <b>ἐρείκη<\/b> (<i>ereíkē<\/i>) + <b>-ales<\/b> \"order\": heathers, blueberries, tea and kiwifruit."},"13749":{"p":"41945","n":"Vaccinium","r":"genus","d":"Genus of berry-producing shrubs in the heath family","x":"Vaccinium is a common and widespread genus of shrubs or dwarf shrubs in the heath family (Ericaceae). The fruits of many species are eaten by humans and some are of commercial importance, including the cranberry, blueberry, bilberry (whortleberry), lingonberry (cowberry), and huckleberry.","u":"https://en.wikipedia.org/wiki/Vaccinium","i":"img/13749.jpg","e":"Latin <b>vaccīnium<\/b>, a classical plant name (perhaps bilberry), maybe from <b>bacca<\/b> \"berry\": blueberries and cranberries."},"3487":{"p":"3744","n":"Moraceae","r":"family","d":"Family of flowering plants","x":"Moraceae is a family of flowering plants comprising about 48 genera and over 1100 species, and is commonly known as the mulberry or fig family. Most are widespread in tropical and subtropical regions, less so in temperate climates; however, their distribution is cosmopolitan overall.","u":"https://en.wikipedia.org/wiki/Moraceae","i":"img/3487.jpg","e":"Latin <b>Morus<\/b> \"mulberry\" + <b>-aceae<\/b> \"family\": mulberries, figs and breadfruit."},"3488":{"p":"3487","n":"Artocarpus","r":"genus","d":"Genus of trees and shrubs","x":"Artocarpus is a genus of approximately 60 trees and shrubs of Southeast Asian and Pacific origin, belonging to the mulberry family, Moraceae. Most species of Artocarpus are restricted to Southeast Asia; a few cultivated species are more widely distributed, especially A.","u":"https://en.wikipedia.org/wiki/Artocarpus","i":"img/3488.jpg","e":"Greek <b>ἄρτος<\/b> (<i>ártos<\/i>) \"bread\" + <b>καρπός<\/b> (<i>karpós<\/i>) \"fruit\": breadfruit and jackfruit."},"1110380":{"p":"3524","n":"Polygonoideae","r":"subfamily","d":"Subfamily of the knotweed family of plants","x":"Polygonoideae is a subfamily of plants in the family Polygonaceae. It includes a number of plants that can be highly invasive, such as Japanese knotweed, Reynoutria japonica, and its hybrid with R.","u":"https://en.wikipedia.org/wiki/Polygonoideae","i":"img/1110380.jpg","e":"<b>Polygonum<\/b>, Greek <b>πολύς<\/b> (<i>polús<\/i>) \"many\" + <b>γόνυ<\/b> (<i>gónu<\/i>) \"knee,\" for the jointed stems + <b>-oideae<\/b> \"subfamily\": buckwheat and rhubarb. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"3650":{"p":"91835","n":"Cucurbitaceae","r":"family","d":"Family of plants","x":"The Cucurbitaceae, also called cucurbits or the gourd family, are a plant family consisting of about 965 species in 101 genera. Some commonly cultivated cucurbits include:Cucurbita – squash, pumpkin, zucchini (courgette), some gourds.","u":"https://en.wikipedia.org/wiki/Cucurbitaceae","i":"img/3650.jpg","e":"Latin <b>cucurbita<\/b> \"gourd\" + <b>-aceae<\/b> \"family\": squashes, melons and cucumbers."},"3660":{"p":"3650","n":"Cucurbita","r":"genus","d":"Genus of flowering plants","x":"Cucurbita is a genus, native to the Andes and Mesoamerica, of herbaceous fruits in the gourd family, Cucurbitaceae. Five edible species are grown and consumed for their flesh and seeds.","u":"https://en.wikipedia.org/wiki/Cucurbita","i":"img/3660.jpg","e":"Latin <b>cucurbita<\/b> \"gourd\": pumpkins and squashes."},"4642":{"p":"4618","n":"Zingiberaceae","r":"family","d":"Family of plants","x":"Zingiberaceae, the ginger family, is a family of flowering plants containing 59 genera and about 1600 described species distributed globally in the tropics and subtropics. They are aromatic perennial herbs with creeping rhizomes, sometimes tuberous.","u":"https://en.wikipedia.org/wiki/Zingiberaceae","i":"img/4642.jpg","e":"<b>Zingiber<\/b> \"ginger\" + <b>-aceae<\/b> \"family\": ginger, turmeric and cardamom."},"41937":{"p":"91836","n":"Sapindales","r":"order","d":"Order of flowering plants","x":"Sapindales is an order of flowering plants that diversified in the mid-Cretaceous. Well-known members of Sapindales include citrus; maples, sumac, horse-chestnuts, lychees and rambutans; mangos and cashews; frankincense and myrrh; mahogany neem and also pistachio.","u":"https://en.wikipedia.org/wiki/Sapindales","i":"img/41937.jpg","e":"<b>Sapindus<\/b>, Latin <b>sāpō Indicus<\/b> \"Indian soap,\" the soapberry + <b>-ales<\/b> \"order\": citrus, maples, mangoes and cashews. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"4011":{"p":"41937","n":"Anacardiaceae","r":"family","d":"Family of flowering plants that includes cashew and mango","x":"The Anacardiaceae, commonly known as the cashew family or sumac family, are a family of flowering plants, including about 83 genera with about 860 known species. Members of the Anacardiaceae bear fruits that are drupes and in some cases produce urushiol, an irritant.","u":"https://en.wikipedia.org/wiki/Anacardiaceae","i":"img/4011.jpg","e":"<b>Anacardium<\/b>, Greek <b>ἀνά<\/b> (<i>aná<\/i>) \"upward\" + <b>καρδία<\/b> (<i>kardía<\/i>) \"heart\": the cashew nut hangs outside, below its fruit. Mangoes and poison ivy are in this family too."},"3646":{"p":"91835","n":"Malpighiales","r":"order","d":"Eudicot order of flowering plants","x":"The Malpighiales comprise one of the largest orders of flowering plants. The order is very diverse, with well-known members including willows, violets, poplars, corpse flower, coca plant, cassava, rubber tree, castor bean, spurges, flaxseed, Saint John's wort, passionfruit, mangosteen, and the manchineel tree.","u":"https://en.wikipedia.org/wiki/Malpighiales","i":"img/3646.jpg","e":"<b>Malpighia<\/b>, named for Marcello Malpighi, the anatomist behind the Malpighian corpuscles + <b>-ales<\/b> \"order\". <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"3977":{"p":"3646","n":"Euphorbiaceae","r":"family","d":"Family of Eudicot flowering plants","x":"Euphorbiaceae, the spurge family, is a large family of flowering plants. In English, they are also commonly called euphorbias, which is also the name of the type genus of the family.","u":"https://en.wikipedia.org/wiki/Euphorbiaceae","i":"img/3977.jpg","e":"<b>Euphorbia<\/b>, named after Euphorbus, Greek physician to King Juba II + <b>-aceae<\/b> \"family\": spurges, cassava and the rubber tree. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"235631":{"p":"3977","n":"Crotonoideae","r":"subfamily","d":"Subfamily of flowering plants","x":"The Crotonoideae (crotonoids) is a subfamily within the family Euphorbiaceae. This subfamily contains many plants with purgative properties, such as Croton tiglium and Jatropha curcas.","u":"https://en.wikipedia.org/wiki/Crotonoideae","i":"img/235631.jpg","e":"<b>Croton<\/b>, Greek <b>κρότων<\/b> (<i>krótōn<\/i>) \"tick,\" for the tick-like seeds + <b>-oideae<\/b> \"subfamily\". <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"241793":{"p":"241780","n":"Apieae","r":"tribe","d":"Family of flowering plants","x":"Apiaceae, also called Umbelliferae, is a family of mostly aromatic flowering plants named after the type genus Apium, and commonly known as the celery, carrot, or parsley family, or as umbellifers. It is the 16th-largest family of flowering plants, with more than 3,800 species in about 446 genera, including such…","u":"https://en.wikipedia.org/wiki/Apiaceae","si":"Apiaceae","i":"img/241793.jpg","e":"<b>Apium<\/b> \"celery\" + <b>-eae<\/b> \"tribe\": celery, dill and fennel."},"102804":{"p":"4210","n":"Asteroideae","r":"subfamily","d":"Subfamily of flowering plants","x":"Asteroideae is a subfamily of the plant family Asteraceae. It contains about 70% of the species of the family.","u":"https://en.wikipedia.org/wiki/Asteroideae","i":"img/102804.jpg","e":"<b>Aster<\/b> \"star\" + <b>-oideae<\/b> \"subfamily\": sunflowers, daisies, chrysanthemums and dandelion's cousins."},"102810":{"p":"102804","n":"Anthemideae","r":"tribe","d":"Tribe of flowering plants","x":"Anthemideae is a tribe of flowering plants in the subfamily Asteroideae, which is part of the family Asteraceae. They are distributed worldwide, with concentrations in central Asia, the Mediterranean Basin, and southern Africa.","u":"https://en.wikipedia.org/wiki/Anthemideae","i":"img/102810.jpg","e":"<b>Anthemis<\/b>, from Greek <b>ἄνθος<\/b> (<i>ánthos<\/i>) \"flower\" + <b>-eae<\/b> \"tribe\": chamomile, chrysanthemums and wormwood. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"3502":{"p":"91835","n":"Fagales","r":"order","d":"Order of flowering plants","x":"The Fagales are an order of flowering plants in the rosid group of dicotyledons, including some of the best-known trees. Well-known members of Fagales include: beeches, chestnuts, oaks, walnut, pecan, hickory, birches, alders, hazels, hornbeams, she-oaks, and southern beeches.","u":"https://en.wikipedia.org/wiki/Fagales","i":"img/3502.jpg","e":"Latin <b>fāgus<\/b> \"beech\" + <b>-ales<\/b> \"order\": beeches, oaks, birches and walnuts."},"3503":{"p":"3502","n":"Fagaceae","r":"family","d":"Family of flowering plants","x":"The Fagaceae are a family of flowering plants that includes beeches, chestnuts and oaks, and comprises eight genera with around 1,000 or more species. Fagaceae in temperate regions are mostly deciduous, whereas in the tropics, many species occur as evergreen trees and shrubs.","u":"https://en.wikipedia.org/wiki/Fagaceae","i":"img/3503.jpg","e":"Latin <b>fāgus<\/b> \"beech\" + <b>-aceae<\/b> \"family\": beeches, chestnuts and oaks."},"219121":{"p":"4210","n":"Cichorieae","r":"tribe","d":"Tribe of flowering plants","x":"The Cichorieae are a tribe in the plant family Asteraceae that includes 93 genera, more than 1,600 sexually reproductive species and more than 7,000 apomictic species. They are found primarily in temperate regions of the Eastern Hemisphere.","u":"https://en.wikipedia.org/wiki/Cichorieae","i":"img/219121.jpg","e":"<b>Cichorium<\/b> \"chicory\" + <b>-eae<\/b> \"tribe\": chicory, lettuce and dandelions."},"886714":{"p":"102810","n":"Artemisiinae","r":"subtribe","d":"Genus of flowering plants","x":"Artemisia is a large, diverse genus of plants belonging to the daisy family, Asteraceae, with almost 500 species. Common names for various species in the genus include mugwort, wormwood, and sagebrush.","u":"https://en.wikipedia.org/wiki/Artemisia_(plant)","si":"Artemisia (plant)","i":"img/886714.jpg","e":"<b>Artemisia<\/b>, named for the goddess Artemis + <b>-inae<\/b> \"subtribe\": wormwood, mugwort and tarragon. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2706":{"p":"41937","n":"Citrus","r":"genus","d":"Genus of flowering plants","x":"Citrus is a genus of flowering trees and shrubs in the family Rutaceae. Plants in the genus produce citrus fruits, such as citrons, mandarins, and pomelos.","u":"https://en.wikipedia.org/wiki/Citrus","i":"img/2706.jpg","e":"Latin <b>citrus<\/b> \"citron tree,\" probably linked to Greek <b>κέδρος<\/b> (<i>kédros<\/i>) \"cedar,\" for the similar fragrance."},"4710":{"p":"4734","n":"Arecaceae","r":"family","d":"Palm family of flowering plants","x":"The Arecaceae are a family of perennial, flowering plants in the monocot order Arecales. Their growth form can be climbers, shrubs, tree-like and stemless plants, all commonly known as palms.","u":"https://en.wikipedia.org/wiki/Arecaceae","i":"img/4710.jpg","e":"<b>Areca<\/b>, from Malayalam <b>aṭaykka<\/b> \"areca nut\" via Portuguese + <b>-aceae<\/b> \"family\": the palms. English <b>palm<\/b> is Latin <b>palma<\/b> \"palm of the hand,\" for the spread-finger fronds."},"169705":{"p":"4710","n":"Cocoseae","r":"tribe","d":"Tribe of palms","x":"Cocoseae is a tribe of cocosoid palms of the family Arecaceae.","u":"https://en.wikipedia.org/wiki/Cocoseae","i":"img/169705.jpg","e":"<b>Cocos<\/b> + <b>-eae<\/b> \"tribe\": coconut and oil palms. <b>Coco<\/b> is Portuguese for a grinning face, for the three holes on the nut. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"4050":{"p":"364270","n":"Araliaceae","r":"family","d":"Family of flowering plants","x":"The Araliaceae are a family of flowering plants composed of about 47 genera and around 1500 species. They are primarily woody plants, along with some herbaceous plants commonly referred to as the ivy or ginseng family.","u":"https://en.wikipedia.org/wiki/Araliaceae","i":"img/4050.jpg","e":"<b>Aralia<\/b> + <b>-aceae<\/b> \"family\": ginseng and ivy."},"147369":{"p":"4479","n":"Panicoideae","r":"subfamily","d":"Subfamily of plants","x":"Panicoideae is the second-largest subfamily of the grasses with over 3,500 species, mainly distributed in warm temperate and tropical regions. It comprises some important agricultural crops, including sugarcane, maize, millet, sorghum, and switchgrass.","u":"https://en.wikipedia.org/wiki/Panicoideae","i":"img/147369.jpg","e":"<b>Panicum<\/b> \"millet\" + <b>-oideae<\/b> \"subfamily\": maize, sugarcane and sorghum."},"147429":{"p":"147369","n":"Andropogoneae","r":"tribe","d":"Tribe of grasses","x":"The Andropogoneae, sometimes called the sorghum tribe, are a large tribe of grasses (family Poaceae) with roughly 1,200 species in 90 genera, mainly distributed in tropical and subtropical areas. They include such important crops as maize (corn), sugarcane, and sorghum.","u":"https://en.wikipedia.org/wiki/Andropogoneae","i":"img/147429.jpg","e":"<b>Andropogon<\/b>, Greek <b>ἀνήρ, ἀνδρός<\/b> (<i>anḗr, andrós<\/i>) \"man\" + <b>πώγων<\/b> (<i>pṓgōn<\/i>) \"beard,\" for the hairy flower spikes + <b>-eae<\/b> \"tribe\": maize, sugarcane and sorghum. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"214907":{"p":"3629","n":"Malvoideae","r":"subfamily","d":"Subfamily of flowering plants","x":"Malvoideae is a botanical name at the rank of subfamily, which includes in the minimum the genus Malva. It was first used by Burnett in 1835, but was not much used until recently, where, within the framework of the APG System, which unites the families Malvaceae, Bombacaceae, Sterculiaceae and Tiliaceae of the…","u":"https://en.wikipedia.org/wiki/Malvoideae","i":"img/214907.jpg","e":"Latin <b>Malva<\/b> \"mallow\" + <b>-oideae<\/b> \"subfamily\": mallows, cotton and okra."},"1003877":{"p":"3650","n":"Benincaseae","r":"tribe","d":"Tribe of rosids in the family Cucurbitaceae","x":"Benincaseae is one of 15 tribes in the family Cucurbitaceae.","u":"https://en.wikipedia.org/wiki/Benincaseae","i":"img/1003877.jpg","e":"<b>Benincasa<\/b>, the wax gourd genus + <b>-eae<\/b> \"tribe\": melons, cucumbers and watermelons. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"3655":{"p":"1003877","n":"Cucumis","r":"genus","d":"Genus of flowering plants","x":"Cucumis is a genus of twining, tendril-bearing plants in the family Cucurbitaceae which includes the cucumber, true melons, the horned melon, and the West Indian gherkin.","u":"https://en.wikipedia.org/wiki/Cucumis","i":"img/3655.jpg","e":"Latin <b>cucumis<\/b> \"cucumber\": cucumbers and melons."},"4668":{"p":"73496","n":"Amaryllidaceae","r":"family","d":"Family of flowering plants","x":"The Amaryllidaceae are a family of herbaceous, mainly perennial and bulbous flowering plants in the monocot order Asparagales. The family takes its name from the genus Amaryllis and is commonly known as the amaryllis family.","u":"https://en.wikipedia.org/wiki/Amaryllidaceae","i":"img/4668.jpg","e":"<b>Amaryllis<\/b>, described by Linnaeus + <b>-aceae<\/b> \"family\": onions, garlic, leeks and daffodils."},"911341":{"p":"102804","n":"Heliantheae alliance","r":"clade","d":"Tribe of sunflower plants","x":"The Heliantheae are the third-largest tribe in the sunflower family (Asteraceae). With some 190 genera and nearly 2500 recognized species, only the tribes Senecioneae and Astereae are larger.","u":"https://en.wikipedia.org/wiki/Heliantheae","si":"Heliantheae","i":"img/911341.jpg","e":"Informal alliance named for <b>Helianthus<\/b>, Greek <b>ἥλιος<\/b> (<i>hḗlios<\/i>) \"sun\" + <b>ἄνθος<\/b> (<i>ánthos<\/i>) \"flower\": the sunflower's group. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"40921":{"p":"241793","n":"Anethum","r":"genus","d":"Herb genus","x":"Anethum is a flowering plant genus in the family Apiaceae, native to the Middle East and the Sahara in northern Africa.","u":"https://en.wikipedia.org/wiki/Anethum","i":"img/40921.jpg","e":"Latin <b>anethum<\/b> ← Greek <b>ἄνηθον<\/b> (<i>ánēthon<\/i>), a word used for both \"dill\" and \"anise\"."},"4069":{"p":"91888","n":"Solanales","r":"order","d":"Order of dicot flowering plants","x":"The Solanales are an order of flowering plants in the asterid group of the eudicots. Well-known members of Solanales include potatoes, sweet potatoes, eggplants, tomatoes, chili peppers, tobacco, petunias, nightshades, and morning glory.","u":"https://en.wikipedia.org/wiki/Solanales","i":"img/4069.jpg","e":"<b>Solanum<\/b> + <b>-ales<\/b> \"order\": nightshades, potatoes and morning glories. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"4070":{"p":"4069","n":"Solanaceae","r":"family","d":"Family of flowering plants","x":"Solanaceae, commonly known as the nightshades, is a family of flowering plants in the order Solanales. The family contains approximately 2,700 species, several of which are used as agricultural crops, medicinal plants, and ornamental plants.","u":"https://en.wikipedia.org/wiki/Solanaceae","i":"img/4070.jpg","e":"<b>Solanum<\/b> + <b>-aceae<\/b> \"family\": probably from Latin <b>sōl<\/b> \"sun,\" for the sun-like flowers, or from <b>sōlārī<\/b> \"to soothe\". Tomatoes, potatoes, peppers and tobacco.","ep":"If the name is from <b>sōl<\/b>: PIE <b><i>*sóh₂wl̥<\/i><\/b> → English <b>sun<\/b>"},"424551":{"p":"4070","n":"Solanoideae","r":"subfamily","d":"Subfamily of flowering plants","x":"Solanoideae is a subfamily of the flowering plant family Solanaceae, and is sister to the subfamily Nicotianoideae. Within Solanaceae, Solanoideae contains some of the most economically important genera and species, such as the tomato, potato, eggplant or aubergine, chili and bell peppers (Capsicum), mandrakes…","u":"https://en.wikipedia.org/wiki/Solanoideae","i":"img/424551.jpg","e":"<b>Solanum<\/b> + <b>-oideae<\/b> \"subfamily\": tomatoes, potatoes, peppers and deadly nightshade."},"4107":{"p":"424551","n":"Solanum","r":"genus","d":"Genus of flowering plants","x":"Solanum is a large and diverse genus of flowering plants, which include three food crops of high economic importance: the potato, the tomato and the eggplant. It is the largest genus in the nightshade family Solanaceae, comprising around 1,500 species.","u":"https://en.wikipedia.org/wiki/Solanum","i":"img/4107.jpg","e":"Latin <b>sōlānum<\/b> \"nightshade,\" possibly from <b>sōl<\/b> \"sun\": tomato, potato and eggplant.","ep":"If the name is from <b>sōl<\/b>: PIE <b><i>*sóh₂wl̥<\/i><\/b> → English <b>sun<\/b>"},"41944":{"p":"91836","n":"Myrtales","r":"order","d":"Order of flowering plants","x":"The Myrtales are an order of flowering plants, in the malvid clade of the rosid group of dicotyledons. Well-known members of Myrtales include: myrtle, pōhutukawa, bay rum tree, clove, guava, acca (feijoa), allspice, eucalyptus, crape myrtles, henna tree, pomegranate, water caltrop, loosestrifes, cupheas, evening…","u":"https://en.wikipedia.org/wiki/Myrtales","i":"img/41944.jpg","e":"Latin <b>Myrtus<\/b> \"myrtle\" + <b>-ales<\/b> \"order\": myrtles, eucalyptus, guava and pomegranate."},"1699513":{"p":"41944","n":"Myrtoideae","r":"subfamily","d":"Myrtle family of plants","x":"Myrtaceae, the myrtle family, is a family of dicotyledonous plants placed within the order Myrtales. Myrtle, pōhutukawa, bay rum tree, clove, guava, acca (feijoa), allspice, and eucalyptus are some notable members of this group.","u":"https://en.wikipedia.org/wiki/Myrtacea
