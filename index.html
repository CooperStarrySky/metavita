.","u":"https://en.wikipedia.org/wiki/Taro","i":"img/4460.jpg"},"4442":{"n":"tea","s":"Camellia sinensis","p":"41945","x":"Camellia sinensis, commonly known as tea plant, tea shrub, and tea tree, is a species of evergreen shrub in the flowering plant family Theaceae. The leaves harvested from C.","u":"https://en.wikipedia.org/wiki/Camellia_sinensis","i":"img/4442.jpg"},"49992":{"n":"thyme","s":"Thymus vulgaris","p":"216718","x":"Thymus vulgaris is a species of flowering plant in the mint family, Lamiaceae.","u":"https://en.wikipedia.org/wiki/Thymus_vulgaris","i":"img/49992.jpg"},"79002":{"n":"tiger lily","s":"Lilium lancifolium","p":"4677","x":"Lilium lancifolium is an Asian species of lily, native to China, Japan, Korea, and the Russian Far East. It is widely planted as an ornamental because of its showy orange-and-black flowers, and sporadically occurs as a garden escapee in North America, particularly the eastern United States including New England, and…","u":"https://en.wikipedia.org/wiki/Lilium_lancifolium","i":"img/79002.jpg"},"4097":{"n":"tobacco","s":"Nicotiana tabacum","p":"4070","x":"Nicotiana tabacum, or cultivated tobacco, is an annually grown herbaceous plant of the genus Nicotiana. N.","u":"https://en.wikipedia.org/wiki/Nicotiana_tabacum","i":"img/4097.jpg"},"4081":{"n":"tomato","s":"Solanum lycopersicum","p":"4107","x":"The tomato is a plant whose fruit is an edible berry that is eaten as a vegetable. The tomato is a member of the nightshade family that includes tobacco, potato, and chili peppers.","u":"https://en.wikipedia.org/wiki/Tomato","i":"img/4081.jpg"},"76306":{"n":"touch-me-not","s":"Mimosa pudica","p":"3807","x":"Mimosa pudica is a creeping annual or perennial flowering plant of the pea/legume family Fabaceae. It is often grown for its curiosity value: the sensitive compound leaves quickly fold inward and droop when touched or shaken and re-open a few minutes later.","u":"https://en.wikipedia.org/wiki/Mimosa_pudica","i":"img/76306.jpg"},"13306":{"n":"tulip","s":"Tulipa gesneriana","p":"4677","x":"Tulipa gesneriana, the Didier's tulip or garden tulip, is a species of plant in the lily family, cultivated as an ornamental in many countries because of its large, showy flowers. This tall, late-blooming species has a single blooming flower and linear or broadly lanceolate leaves.","u":"https://en.wikipedia.org/wiki/Tulipa_gesneriana","i":"img/13306.jpg"},"355937":{"n":"tumbleweed","s":"Salsola tragus","p":"3563","x":"Salsola tragus, often known by its synonym Kali tragus, is a species of flowering plant in the family Amaranthaceae. It is known by various common names such as prickly Russian thistle, windwitch, or common saltwort.","u":"https://en.wikipedia.org/wiki/Salsola_tragus","i":"img/355937.jpg"},"136217":{"n":"turmeric","s":"Curcuma longa","p":"4642","x":"Turmeric, or Curcuma longa, is a flowering plant in the ginger family Zingiberaceae. It is a perennial, rhizomatous, herbaceous plant native to the Indian subcontinent and Southeast Asia that requires temperatures between 20 and 30 °C and high annual rainfall to thrive.","u":"https://en.wikipedia.org/wiki/Turmeric","i":"img/136217.jpg"},"51239":{"n":"vanilla","s":"Vanilla planifolia","p":"4747","x":"Vanilla planifolia is a species of vanilla orchid native to Mexico, Central America, Colombia, and Brazil. It is one of the primary sources for vanilla flavouring, due to its high vanillin content.","u":"https://en.wikipedia.org/wiki/Vanilla_planifolia","i":"img/51239.jpg"},"4362":{"n":"venus flytrap","s":"Dionaea muscipula","p":"3524","x":"The Venus flytrap is a carnivorous plant native to the temperate and subtropical wetlands of North Carolina and South Carolina, on the East Coast of the United States. Although various modern hybrids have been created in cultivation, D.","u":"https://en.wikipedia.org/wiki/Venus_flytrap","i":"img/4362.jpg"},"97424":{"n":"violet","s":"Viola cucullata","p":"3646","x":"Viola cucullata, the hooded blue violet, marsh blue violet or purple violet, is a species of the genus Viola native to eastern North America, from Newfoundland west to Ontario and Minnesota, and south to Georgia. It is a recipient of the Royal Horticultural Society's Award of Garden Merit.","u":"https://en.wikipedia.org/wiki/Viola_cucullata","i":"img/97424.jpg"},"16719":{"n":"walnut","s":"Juglans nigra","p":"16714","x":"Juglans nigra, the eastern American black walnut, is a species of deciduous tree in the walnut family, Juglandaceae, native to central and eastern North America, growing mostly in riparian zones.","u":"https://en.wikipedia.org/wiki/Juglans_nigra","i":"img/16719.jpg"},"75806":{"n":"wasabi","s":"Eutrema japonicum","p":"3700","x":"Wasabi or Japanese horseradish is a plant of the family Brassicaceae, which also includes horseradish and mustard in other genera. The plant is native to Japan, the Russian Far East including Sakhalin, and the Korean Peninsula.","u":"https://en.wikipedia.org/wiki/Wasabi","i":"img/75806.jpg"},"34301":{"n":"water lily","s":"Nymphaea alba","p":"3398","x":"Nymphaea alba – commonly called the white water lily, European white water lily, or white nenuphar – is an aquatic flowering plant in the family Nymphaeaceae. It is native to North Africa, temperate Asia, Europe, and tropical Asia.","u":"https://en.wikipedia.org/wiki/Nymphaea_alba","i":"img/34301.jpg"},"65948":{"n":"watercress","s":"Nasturtium officinale","p":"980193","x":"Watercress or yellowcress is a species of aquatic flowering plant in the cabbage family, Brassicaceae.","u":"https://en.wikipedia.org/wiki/Watercress","i":"img/65948.jpg"},"3654":{"n":"watermelon","s":"Citrullus lanatus","p":"1003877","x":"The watermelon is a species of flowering plant in the family Cucurbitaceae. It is a scrambling and trailing vine-like plant cultivated worldwide for its fruit, a large berry with a firm rind and no internal divisions, botanically termed a pepo.","u":"https://en.wikipedia.org/wiki/Watermelon","i":"img/3654.jpg"},"75706":{"n":"weeping willow","s":"Salix babylonica","p":"3646","x":"Salix babylonica is a species of willow native to dry areas of northern China, Korea, Mongolia, Japan, and Siberia but cultivated for millennia elsewhere in Asia, being traded along the Silk Road to southwest Asia and Europe.","u":"https://en.wikipedia.org/wiki/Salix_babylonica","i":"img/75706.jpg"},"4565":{"n":"wheat","s":"Triticum aestivum","p":"4564","x":"Common wheat, also known as bread wheat, is a cultivated wheat species. It originated around 8,000 years ago, from the hybridization of an already existing domesticated variety of wheat and the wild goatgrass in the South Caucasus or southwestern Caspian area.","u":"https://en.wikipedia.org/wiki/Common_wheat","i":"img/4565.jpg"},"3922":{"n":"wisteria","s":"Wisteria floribunda","p":"2233839","x":"Wisteria floribunda, common name Japanese wisteria , is a species of flowering plant in the family Fabaceae, native to Japan. Growing to 9 m (30 ft), Wisteria floribunda is a woody, deciduous twining climber.","u":"https://en.wikipedia.org/wiki/Wisteria_floribunda","i":"img/3922.jpg"},"29710":{"n":"yam","s":"Dioscorea cayenensis","p":"1437197","x":"Dioscorea cayenensis is a species of plant in the yam family Dioscoreaceae. It is native to Western Africa, where it is a widely consumed crop.","u":"https://en.wikipedia.org/wiki/Dioscorea_cayenensis","i":"img/29710.jpg"}},"presets":[["Legumes, Roses & Kin",["91835"]],["Citrus, Cabbages & Mallows",["91836"]],["Daisies, Mints & Nightshades",["71274"]],["Cacti & Other Eudicots",["3524","41946","41947"]],["Monocots",["4447"]],["Conifers & Early Flowering Plants",["1437180","232347","232378"]]],"decks":[["00 Plant Backbone",["76314","94688","361556","34301","3469"]],["01 Legumes, Roses & Kin::01 rosids, fabids & 2 more",["29760","20340","58860","3818"]],["01 Legumes, Roses & Kin::02 NPAAA clade, core genistoids",["3888","3859","3906","3864","3879","97021","3827","49827","3922","3917","3885","3847","3902","155124"]],["01 Legumes 8051","4530","4577","66014","4547","4543"]],["05 Monocots::03 Zingiberales, Arecaceae",["105181","94328","136217","89151","13894","51953","42345"]],["05 Monocots::04 Asparagales, Liliaceae",["4682","4681","4679","54855","39510","4686","82025","78817","51239","34199","79002","13306"]],["06 Conifers & Early Flowering Plants::01 Magnoliidae, Proteales",["51089","85868","12953","3435","128608","13216","4432","60698","4403"]],["06 Conifers & Early Flowering Plants::02 Acrogymnospermae",["3331","3329","3349","93692","3357","99814","3311"]]]},"microbes":{"nodes":{"131567":{"n":"cellular organisms","r":"cellular root","d":"Basic unit of life forms","x":"The cell is the basic structural and functional unit of all forms of life or organisms. The term comes from the Latin word cellula meaning 'small room'.","u":"https://en.wikipedia.org/wiki/Cell_(biology)","i":"img/131567.jpg","e":"Plain English (NCBI's label). The formal name <b>Cytota<\/b> is <b>cyto-<\/b> \"cell\" (Greek <b>κύτος<\/b>, <i>kýtos<\/i>) + <b>-ota<\/b> \"having\": life built from cells."},"2":{"p":"131567","n":"Bacteria","r":"domain","d":"Domain of microorganisms","x":"Bacteria are ubiquitous, mostly free-living organisms often consisting of one biological cell. They constitute a large domain of prokaryotic microorganisms.","u":"https://en.wikipedia.org/wiki/Bacteria","i":"img/2.jpg","e":"Greek <b>βακτήριον<\/b> (<i>baktḗrion<\/i>) \"little staff\": named for the rod shape of the first ones seen."},"1783272":{"p":"2","n":"Bacillati","r":"kingdom","d":"Kingdom of land bacteria","x":"Bacillati, is a kingdom containing approximately two-thirds of prokaryote species, including those in the gram positive phyla as well as the phyla Cyanobacteriota and Chloroflexota. It was originally proposed under the name \"Terrabacteria\", referring to the commonalities of its members: the possession of important…","u":"https://en.wikipedia.org/wiki/Bacillati","i":"img/1783272.jpg","e":"<b>Bacillus<\/b>, Latin \"little rod\" + <b>-ati<\/b>, the new (2024) kingdom ending: Gram-positives, cyanobacteria and kin. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"1239":{"p":"1783272","n":"Bacillota","r":"phylum","d":"Phylum of bacteria","x":"The Bacillota are a phylum of bacteria, most of which have Gram-positive cell wall structure. They have round cells, called cocci, or rod-like forms (bacillus).","u":"https://en.wikipedia.org/wiki/Bacillota","i":"img/1239.jpg","e":"<b>Bacillus<\/b> + <b>-ota<\/b> \"phylum\". Its old name <b>Firmicutes<\/b> is Latin <b>firmus<\/b> \"strong\" + <b>cutis<\/b> \"skin,\" for the thick cell wall that stains Gram-positive."},"91061":{"p":"1239","n":"Bacilli","r":"class","d":"Class of bacteria in the phylum Firmicutes","x":"Bacilli is a taxonomic class of bacteria that includes two orders, Bacillales and Lactobacillales, which contain several well-known pathogens such as Bacillus anthracis. Bacilli are almost exclusively gram-positive bacteria.","u":"https://en.wikipedia.org/wiki/Bacilli","i":"img/91061.jpg","e":"Latin <b>bacillus<\/b> \"little rod\": Staph, Strep, Listeria and their kin."},"1385":{"p":"91061","n":"Caryophanales","r":"order","d":"Order of bacteria","x":"Bacillales, from Latin \"bacillus\", meaning \"little staff, wand\", are an order of Gram-positive bacteria, placed within the Bacillota. The Bacillales are the most productive order of the phylum \"Firmicutes\".","u":"https://en.wikipedia.org/wiki/Bacillales","e":"<b>Caryophanon<\/b> + <b>-ales<\/b> \"order\". This is the 2024 name for what was <b>Bacillales<\/b> (Latin <b>bacillus<\/b> \"little staff\"): Bacillus, Listeria and Staph."},"1279":{"p":"1385","n":"Staphylococcus","r":"genus","d":"Genus of Gram-positive bacteria","x":"Staphylococcus, from Ancient Greek σταφυλή (staphulḗ), meaning \"bunch of grapes\", and κόκκος (kókkos), meaning \"kernel\" or \"Kermes\", is a genus of Gram-positive bacteria in the family Staphylococcaceae from the order Bacillales. Under the microscope, they appear spherical (cocci), and form in grape-like clusters.","u":"https://en.wikipedia.org/wiki/Staphylococcus","i":"img/1279.jpg","e":"Greek <b>σταφυλή<\/b> (<i>staphulḗ<\/i>) \"bunch of grapes\" + <b>κόκκος<\/b> (<i>kókkos<\/i>) \"grain\": cocci in grape-like clusters."},"186826":{"p":"91061","n":"Lactobacillales","r":"order","d":"Order of bacteria","x":"Lactobacillales are an order of gram-positive, low-GC, acid-tolerant, generally nonsporulating, nonrespiring, either rod-shaped (bacilli) or spherical (cocci) bacteria that share common metabolic and physiological characteristics. These bacteria, usually found in decomposing plants and milk products, produce lactic…","u":"https://en.wikipedia.org/wiki/Lactic_acid_bacteria","i":"img/186826.jpg","e":"<b>Lactobacillus<\/b>, Latin <b>lac, lactis<\/b> \"milk\" + <b>bacillus<\/b> \"little rod\" + <b>-ales<\/b> \"order\": lactic acid bacteria, Strep included."},"1300":{"p":"186826","n":"Streptococcaceae","r":"family","d":"Family of bacteria","x":"Streptococcaceae, from Ancient Greek στρεπτός (streptós), meaning \"twisted\", and κόκκος (kókkos), meaning \"grain\", are a family of gram-positive bacteria, placed within the order Lactobacillales. Representative genera include Lactococcus, Lactovum, and Streptococcus.","u":"https://en.wikipedia.org/wiki/Streptococcaceae","i":"img/1300.jpg","e":"Greek <b>στρεπτός<\/b> (<i>streptós<\/i>) \"twisted\" + <b>κόκκος<\/b> (<i>kókkos<\/i>) \"grain\" + <b>-aceae<\/b> \"family\"."},"1301":{"p":"1300","n":"Streptococcus","r":"genus","d":"Genus of bacteria","x":"Streptococcus is a genus of gram-positive spherical bacteria that belongs to the family Streptococcaceae, within the order Lactobacillales, in the phylum Bacillota. Cell division in streptococci occurs along a single axis, thus when growing they tend to form pairs or chains, which may appear bent or twisted.","u":"https://en.wikipedia.org/wiki/Streptococcus","i":"img/1301.jpg","e":"Greek <b>στρεπτός<\/b> (<i>streptós<\/i>) \"twisted\" + <b>κόκκος<\/b> (<i>kókkos<\/i>) \"grain\": cocci in twisted chains. Coined in 1877 by the surgeon Theodor Billroth."},"1350":{"p":"186826","n":"Enterococcus","r":"genus","d":"Genus of bacteria","x":"Enterococcus is a large genus of lactic acid bacteria of the phylum Bacillota. Enterococci are Gram-positive cocci that often occur in pairs (diplococci) or short chains, and are difficult to distinguish from streptococci on physical characteristics alone.","u":"https://en.wikipedia.org/wiki/Enterococcus","i":"img/1350.jpg","e":"Greek <b>ἔντερον<\/b> (<i>énteron<\/i>) \"intestine\" + <b>κόκκος<\/b> (<i>kókkos<\/i>) \"grain\": gut cocci, classed as group D Strep until 1984."},"1386":{"p":"1385","n":"Bacillus","r":"genus","d":"Genus of bacteria","x":"Bacillus, from Latin \"bacillus\", meaning \"little staff, wand\", is a genus of Gram-positive, rod-shaped bacteria, a member of the phylum Bacillota, with 266 named species. The term is also used to describe the shape (rod) of other so-shaped bacteria; and the plural Bacilli is the name of the class of bacteria to which…","u":"https://en.wikipedia.org/wiki/Bacillus","i":"img/1386.jpg","e":"Latin <b>bacillus<\/b> \"little staff, wand\": rod-shaped spore-formers."},"86661":{"p":"1386","n":"Bacillus cereus group","r":"species group","d":"Species of bacterium","x":"Bacillus cereus is a Gram-positive rod-shaped bacterium commonly found in soil, food, and marine sponges. The specific name, cereus, meaning \"waxy\" in Latin, refers to the appearance of colonies grown on blood agar.","u":"https://en.wikipedia.org/wiki/Bacillus_cereus","si":"Bacillus cereus","i":"img/86661.jpg","e":"Latin <b>cēreus<\/b> \"waxen,\" for the colonies' look: anthrax and its food-poisoning cousin. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"186801":{"p":"1239","n":"Clostridia","r":"class","d":"Class of bacteria","x":"The Clostridia are a highly polyphyletic class of Bacillota, including Clostridium and other similar genera. They are distinguished from the Bacilli by lacking aerobic respiration.","u":"https://en.wikipedia.org/wiki/Clostridia","i":"img/186801.jpg","e":"Greek <b>κλωστήρ<\/b> (<i>klōstḗr<\/i>) \"spindle\": spore-forming anaerobes that swell like a spindle around their spore. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"1485":{"p":"186801","n":"Clostridium","r":"genus","d":"Genus of bacteria","x":"Clostridium is a genus of anaerobic, Gram-positive bacteria. Species of Clostridium inhabit soils and the intestinal tracts of animals, including humans.","u":"https://en.wikipedia.org/wiki/Clostridium","i":"img/1485.jpg","e":"Greek <b>κλωστήρ<\/b> (<i>klōstḗr<\/i>) \"spindle\" + <b>-idium<\/b> \"small\": botulism, tetanus and gas gangrene."},"2790998":{"p":"1783272","n":"Mycoplasmoidaceae","r":"family","d":"Family of bacteria","x":"Mycoplasmoidaceae is a family of bacteria under the order Mycoplasmoidales. It contains the genera Eperythrozoon, Malacoplasma, Mycoplasmoides, and Ureaplasma.","u":"https://en.wikipedia.org/wiki/Mycoplasmoidaceae","e":"<b>Mycoplasmoides<\/b>, Greek <b>μύκης<\/b> (<i>múkēs<\/i>) \"fungus\" + <b>πλάσμα<\/b> (<i>plásma<\/i>) \"formed thing\" + <b>-aceae<\/b> \"family\": bacteria with no cell wall."},"1760":{"p":"1783272","n":"Actinomycetes","r":"class","d":"Class of bacteria","x":"Actinomycetes is a class of bacteria in the phylum Actinomycetota.","u":"https://en.wikipedia.org/wiki/Actinomycetes","i":"img/1760.jpg","e":"Greek <b>ἀκτίς<\/b> (<i>aktís<\/i>) \"ray\" + <b>μύκης<\/b> (<i>múkēs<\/i>) \"fungus\": branching \"ray fungi\" that are really bacteria (high-GC Gram-positives). <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"85007":{"p":"1760","n":"Mycobacteriales","r":"order","d":"Order of bacteria","x":"The Mycobacteriales are an order of bacteria. The current description is genome-based, per Gupta 2019 emendation.","u":"https://en.wikipedia.org/wiki/Mycobacteriales","i":"img/85007.jpg","e":"<b>Mycobacterium<\/b> + <b>-ales<\/b> \"order\": mycobacteria, Corynebacterium and Nocardia. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"1763":{"p":"85007","n":"Mycobacterium","r":"genus","d":"Genus of bacteria","x":"Mycobacterium is a genus of over 190 species of Gram-positive bacteria in the phylum Actinomycetota, assigned its own family, Mycobacteriaceae. This genus includes pathogens known to cause serious diseases in mammals, including tuberculosis and leprosy in humans.","u":"https://en.wikipedia.org/wiki/Mycobacterium","i":"img/1763.jpg","e":"Greek <b>μύκης<\/b> (<i>múkēs<\/i>) \"fungus\" + <b>βακτήριον<\/b> (<i>baktḗrion<\/i>) \"little rod\": the waxy cell wall makes colonies look mold-like."},"31953":{"p":"1760","n":"Bifidobacteriaceae","r":"family","d":"Family of bacteria","x":"The Bifidobacteriaceae are the only family of bacteria in the order Bifidobacteriales.","u":"https://en.wikipedia.org/wiki/Bifidobacteriaceae","i":"img/31953.jpg","e":"Latin <b>bifidus<\/b> \"split in two\": for the Y- or V-shaped cells. Bifidobacteria and Gardnerella."},"3379134":{"p":"2","n":"Pseudomonadati","r":"kingdom","d":"Kingdom of bacteria","x":"Pseudomonadati is \na prokaryotic kingdom containing approximately one-third of prokaryote species, mostly gram-negative bacteria and their relatives. The grouping was originally proposed under the name \"Hydrobacteria\".","u":"https://en.wikipedia.org/wiki/Pseudomonadati","i":"img/3379134.jpg","e":"<b>Pseudomonas<\/b>, Greek <b>ψευδής<\/b> (<i>pseudḗs<\/i>) \"false\" + <b>μονάς<\/b> (<i>monás<\/i>) \"unit\" + <b>-ati<\/b>, the new (2024) kingdom ending: mostly Gram-negative bacteria. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"1224":{"p":"3379134","n":"Pseudomonadota","r":"phylum","d":"Phylum of Gram-negative bacteria","x":"Pseudomonadota is a major phylum of gram-negative bacteria. They include both pathogenic and free-living (non-parasitic) genera.","u":"https://en.wikipedia.org/wiki/Pseudomonadota","i":"img/1224.jpg","e":"<b>Pseudomonas<\/b> + <b>-ota<\/b> \"phylum\". Its old name <b>Proteobacteria<\/b> honors Proteus, the shape-shifting sea god, for its huge variety."},"1236":{"p":"1224","n":"Gammaproteobacteria","r":"class","d":"Class of bacteria in the phylum Pseudomonadota","x":"Gammaproteobacteria is a class of bacteria in the phylum Pseudomonadota. It contains about 250 genera, which makes it the most genus-rich taxon of the Prokaryotes.","u":"https://en.wikipedia.org/wiki/Gammaproteobacteria","i":"img/1236.jpg","e":"<b>Gamma<\/b>, the third Greek letter, for Class III in <i>Bergey's Manual<\/i> + <b>Proteobacteria<\/b> (after Proteus): E. coli, Vibrio, Pseudomonas."},"91347":{"p":"1236","n":"Enterobacterales","r":"order","d":"Order of gram-negative bacteria","x":"Enterobacterales is an order of Gram-negative, non-spore forming, facultatively anaerobic, rod-shaped bacteria with the class Gammaproteobacteria. The type genus of this order is Enterobacter.","u":"https://en.wikipedia.org/wiki/Enterobacterales","i":"img/91347.jpg","e":"<b>Enterobacter<\/b>, Greek <b>ἔντερον<\/b> (<i>énteron<\/i>) \"intestine\" + <b>-ales<\/b> \"order\": the gut rods, E. coli, Salmonella and Klebsiella."},"543":{"p":"91347","n":"Enterobacteriaceae","r":"family","d":"Family of bacteria","x":"Enterobacteriaceae is a large family of Gram-negative bacteria. It includes over 30 genera and more than 100 species.","u":"https://en.wikipedia.org/wiki/Enterobacteriaceae","i":"img/543.jpg","e":"<b>Enterobacter<\/b> \"gut rod\" + <b>-aceae<\/b> \"family\": E. coli, Salmonella, Shigella, Klebsiella."},"1903411":{"p":"91347","n":"Yersiniaceae","r":"family","d":"Family of bacteria","x":"The Yersiniaceae are a family of Gram-negative bacteria that includes some familiar pathogens. For example, the type genus Yersinia includes Yersinia pestis, the causative agent of plague.","u":"https://en.wikipedia.org/wiki/Yersiniaceae","i":"img/1903411.jpg","e":"<b>Yersinia<\/b> + <b>-aceae<\/b> \"family\": plague bacteria and Serratia."},"629":{"p":"1903411","n":"Yersinia","r":"genus","d":"Genus of bacteria","x":"Yersinia is a genus of bacteria in the family Yersiniaceae. Yersinia species are Gram-negative, coccobacilli bacteria, and are facultative anaerobes.","u":"https://en.wikipedia.org/wiki/Yersinia","i":"img/629.jpg","e":"Named after <b>Alexandre Yersin<\/b> (1863–1943), the French-Swiss physician who found the plague bacterium in Hong Kong in 1894."},"662":{"p":"1236","n":"Vibrio","r":"genus","d":"Genus of bacteria and the disease it can cause","x":"Vibrio is a genus of Gram-negative bacteria, which have a characteristic curved-rod (comma) shape, several species of which can cause foodborne infection or soft-tissue infection called Vibriosis. Infection is commonly associated with eating undercooked seafood.","u":"https://en.wikipedia.org/wiki/Vibrio","i":"img/662.jpg","e":"Latin <b>vibrāre<\/b> \"to quiver, shake\": for the darting motion. Named by the Italian anatomist Filippo Pacini, who saw cholera's agent in 1854."},"712":{"p":"1236","n":"Pasteurellaceae","r":"family","d":"Family of bacteria","x":"The Pasteurellaceae comprise a large family of Gram-negative bacteria. Most members live as commensals on mucosal surfaces of birds and mammals, especially in the upper respiratory tract.","u":"https://en.wikipedia.org/wiki/Pasteurellaceae","i":"img/712.jpg","e":"<b>Pasteurella<\/b>, after Louis Pasteur + <b>-aceae<\/b> \"family\": Haemophilus and Pasteurella. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"468":{"p":"1236","n":"Moraxellaceae","r":"family","d":"Family of bacteria","x":"The Moraxellaceae are a family of Gammaproteobacteria, including a few pathogenic species. Others are harmless commensals of mammals and humans or occur in water or soil.","u":"https://en.wikipedia.org/wiki/Moraxellaceae","i":"img/468.jpg","e":"<b>Moraxella<\/b>, after the Swiss ophthalmologist Victor Morax + <b>-aceae<\/b> \"family\": Moraxella and Acinetobacter. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"118969":{"p":"1236","n":"Legionellales","r":"order","d":"Order of bacteria","x":"The Legionellales are an order of Pseudomonadota (\"Proteobacteria\"). Like all Pseudomonadota, they are Gram-negative.","u":"https://en.wikipedia.org/wiki/Legionellales","i":"img/118969.jpg","e":"<b>Legionella<\/b>, named after the 1976 American Legion convention outbreak + <b>-ales<\/b> \"order\": Legionella and Coxiella. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"28216":{"p":"1224","n":"Betaproteobacteria","r":"class","d":"Class of bacteria","x":"Betaproteobacteria are a class of Gram-negative bacteria, and one of the six classes of the phylum Pseudomonadota.","u":"https://en.wikipedia.org/wiki/Betaproteobacteria","i":"img/28216.jpg","e":"<b>Beta<\/b> + <b>Proteobacteria<\/b>: Neisseria, Bordetella and Burkholderia."},"482":{"p":"28216","n":"Neisseria","r":"genus","d":"Genus of bacteria","x":"Neisseria is a large genus of bacteria that colonize the mucous membranes of many animals. Of the 11 species that colonize humans, only two are pathogens: N.","u":"https://en.wikipedia.org/wiki/Neisseria","i":"img/482.jpg","e":"Named after <b>Albert Neisser<\/b> (1855–1916), the German physician who discovered the gonorrhea bacterium."},"80840":{"p":"28216","n":"Burkholderiales","r":"order","d":"Order of bacteria","x":"The Burkholderiales are an order of Betaproteobacteria in the phylum Pseudomonadota. Like all Pseudomonadota, they are Gram-negative.","u":"https://en.wikipedia.org/wiki/Burkholderiales","i":"img/80840.jpg","e":"<b>Burkholderia<\/b> + <b>-ales<\/b> \"order\": Neisseria, Bordetella and Burkholderia."},"32008":{"p":"80840","n":"Burkholderia","r":"genus","d":"Genus of bacteria","x":"Burkholderia is a genus of Pseudomonadota whose pathogenic members include the Burkholderia cepacia complex, which attacks humans and plants; Burkholderia mallei, responsible for glanders, a disease that occurs mostly in horses and related animals; Burkholderia pseudomallei, causative agent of melioidosis; and…","u":"https://en.wikipedia.org/wiki/Burkholderia","i":"img/32008.jpg","e":"Named after <b>Walter H. Burkholder<\/b> (1891–1983), the American plant pathologist who described onion rot caused by <i>B. cepacia<\/i>."},"28211":{"p":"1224","n":"Alphaproteobacteria","r":"class","d":"Class of bacteria","x":"Alphaproteobacteria or α-proteobacteria, also called α-Purple bacteria in earlier literature, is a class of bacteria in the phylum Pseudomonadota. The Magnetococcales and Mariprofundales are considered basal or sister to the Alphaproteobacteria.","u":"https://en.wikipedia.org/wiki/Alphaproteobacteria","i":"img/28211.jpg","e":"<b>Alpha<\/b> + <b>Proteobacteria<\/b>: Rickettsia, Brucella, and the ancestors of mitochondria."},"766":{"p":"28211","n":"Rickettsiales","r":"order","d":"Order of bacteria","x":"The Rickettsiales, informally called rickettsias, are an order of small Alphaproteobacteria. They are obligate intracellular parasites, and some are notable pathogens, including Rickettsia, which causes a variety of diseases in humans, and Ehrlichia, which causes diseases in livestock.","u":"https://en.wikipedia.org/wiki/Rickettsiales","i":"img/766.jpg","e":"<b>Rickettsia<\/b> + <b>-ales<\/b> \"order\": Rickettsia, Ehrlichia, Anaplasma and Wolbachia."},"780":{"p":"766","n":"Rickettsia","r":"genus","d":"Genus of bacteria","x":"Rickettsia is a genus of nonmotile, gram-negative, nonspore-forming, highly pleomorphic bacteria that may occur in the forms of cocci, bacilli, or threads. The genus was named after Howard Taylor Ricketts in honor of his pioneering work on tick-borne spotted fever.","u":"https://en.wikipedia.org/wiki/Rickettsia","i":"img/780.jpg","e":"Named after <b>Howard Taylor Ricketts<\/b> (1871–1910), the American pathologist who died of typhus while studying it."},"356":{"p":"28211","n":"Hyphomicrobiales","r":"order","d":"Order of bacteria","x":"The Hyphomicrobiales are an order of Gram-negative Alphaproteobacteria.","u":"https://en.wikipedia.org/wiki/Hyphomicrobiales","i":"img/356.jpg","e":"<b>Hyphomicrobium<\/b>, Greek <b>ὑφή<\/b> (<i>huphḗ<\/i>) \"web, thread\" + <b>μικρός<\/b> (<i>mikrós<\/i>) \"small\" + <b>-ales<\/b> \"order\": Brucella, Bartonella and Rhizobium. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"942":{"p":"766","n":"Anaplasmataceae","r":"family","d":"Family of bacteria","x":"The Ehrlichiaceae are a family of bacteria, included in the order Rickettsiales.","u":"https://en.wikipedia.org/wiki/Ehrlichiaceae","i":"img/942.jpg","e":"<b>Anaplasma<\/b> + <b>-aceae<\/b> \"family\": Ehrlichia, Anaplasma and Wolbachia."},"227290":{"p":"356","n":"Rhizobium/Agrobacterium group","r":"no rank","d":"Family of bacteria","x":"The Rhizobiaceae is a family of Pseudomonadota comprising multiple subgroups that enhance and hinder plant development. Some bacteria found in the family are used for plant nutrition and collectively make up the rhizobia.","u":"https://en.wikipedia.org/wiki/Rhizobiaceae","si":"Rhizobiaceae","i":"img/227290.jpg","e":"<b>Rhizobium<\/b>, Greek <b>ῥίζα<\/b> (<i>rhíza<\/i>) \"root\" + <b>βίος<\/b> (<i>bíos<\/i>) \"life\": root-nodule bacteria and their tumor-making cousin Agrobacterium. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"213849":{"p":"3379134","n":"Campylobacterales","r":"order","d":"Order of bacteria","x":"The Campylobacterales are an order of Campylobacterota which make up the epsilon subdivision, together with the small family Nautiliaceae. They are Gram-negative.","u":"https://en.wikipedia.org/wiki/Campylobacterales","i":"img/213849.jpg","e":"<b>Campylobacter<\/b>, Greek <b>καμπύλος<\/b> (<i>kampúlos<\/i>) \"curved\" + <b>βακτήριον<\/b> \"rod\" + <b>-ales<\/b> \"order\": curved rods, H. pylori included. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"203691":{"p":"3379134","n":"Spirochaetota","r":"phylum","d":"Phylum of bacteria","x":"A spirochaete or spirochete is a member of the phylum Spirochaetota, which contains distinctive diderm (double-membrane) Gram-negative bacteria, most of which have long, helically coiled cells. Spirochaetes are chemoheterotrophic in nature, with lengths between 3 and 500 μm and diameters around 0.09 to at least 3 μm.","u":"https://en.wikipedia.org/wiki/Spirochaete","i":"img/203691.jpg","e":"Greek <b>σπεῖρα<\/b> (<i>speîra<\/i>) \"coil\" + <b>χαίτη<\/b> (<i>khaítē<\/i>) \"long hair\": corkscrew bacteria. Syphilis, Lyme disease and leptospirosis. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"203692":{"p":"203691","n":"Spirochaetia","r":"class","d":"Phylum of bacteria","x":"A spirochaete or spirochete is a member of the phylum Spirochaetota, which contains distinctive diderm (double-membrane) Gram-negative bacteria, most of which have long, helically coiled cells. Spirochaetes are chemoheterotrophic in nature, with lengths between 3 and 500 μm and diameters around 0.09 to at least 3 μm.","u":"https://en.wikipedia.org/wiki/Spirochaete","i":"img/203692.jpg","e":"Greek <b>σπεῖρα<\/b> (<i>speîra<\/i>) \"coil\" + <b>χαίτη<\/b> (<i>khaítē<\/i>) \"long hair\" + <b>-ia<\/b> \"class\": the corkscrew bacteria. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"810":{"p":"3379134","n":"Chlamydia","r":"genus","d":"Genus of bacteria","x":"Chlamydia is a genus of pathogenic Gram-negative bacteria that are obligate intracellular parasites. Chlamydia infections are the most common bacterial sexually transmitted diseases in humans and are the leading cause of infectious blindness worldwide.","u":"https://en.wikipedia.org/wiki/Chlamydia_(bacterium)","i":"img/810.jpg","e":"Greek <b>χλαμύς<\/b> (<i>khlamús<\/i>) \"short cloak\": for the inclusion that cloaks the infected cell's nucleus."},"171549":{"p":"3379134","n":"Bacteroidales","r":"order","d":"Order of bacteria","x":"Bacteroidales is an order of bacteria. Notably it includes the genera Prevotella and Bacteroides, which are commonly found in the human gut microbiota.","u":"https://en.wikipedia.org/wiki/Bacteroidales","i":"img/171549.jpg","e":"<b>Bacteroides<\/b> \"rod-like\" + <b>-ales<\/b> \"order\": gut anaerobes. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"3028117":{"p":"1783272","n":"Cyanophyceae","r":"class","d":"Class of bacteria","x":"Cyanophyceae is a class of cyanobacteria.","u":"https://en.wikipedia.org/wiki/Cyanophyceae","e":"Greek <b>κυανός<\/b> (<i>kuanós<\/i>) \"dark blue\" + <b>φῦκος<\/b> (<i>phûkos<\/i>) \"seaweed\": the blue-green \"algae\" that are really bacteria."},"1150":{"p":"3028117","n":"Oscillatoriales","r":"order","d":"Order of bacteria","x":"The Oscillatoriales are an order of cyanobacteria.","u":"https://en.wikipedia.org/wiki/Oscillatoriales","i":"img/1150.jpg","e":"<b>Oscillatoria<\/b>, Latin <b>ōscillāre<\/b> \"to swing,\" for filaments that sway + <b>-ales<\/b> \"order\". <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"3384194":{"p":"2","n":"Thermotogati","r":"kingdom","d":"Kingdom of bacteria","x":"Thermotogati is a kingdom of bacteria. They are united by the presence of an outer sheath-like membrane called a \"toga\".","u":"https://en.wikipedia.org/wiki/Thermotogati","i":"img/3384194.jpg","e":"<b>Thermotoga<\/b>, Greek <b>θέρμη<\/b> (<i>thérmē<\/i>) \"heat\" + Latin <b>toga<\/b>, for the loose outer sheath + <b>-ati<\/b> \"kingdom\": hot-spring bacteria. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"188787":{"p":"3384194","n":"Deinococci","r":"class","d":"Phylum of Gram-negative bacteria","x":"Deinococcota is a phylum of bacteria with a single class, Deinococci, that are highly resistant to environmental hazards, also known as extremophiles.","u":"https://en.wikipedia.org/wiki/Deinococcota","i":"img/188787.jpg","e":"Greek <b>δεινός<\/b> (<i>deinós<\/i>) \"terrible\" + <b>κόκκος<\/b> (<i>kókkos<\/i>) \"grain\": the \"terrible berry\" that survives radiation, and Taq polymerase's source."},"2157":{"p":"131567","n":"Archaea","r":"domain","d":"Domain of organisms","x":"Archaea is a domain of organisms. Traditionally, Archaea included only its prokaryotic members, but has since been found to be paraphyletic, as eukaryotes are known to have evolved from archaea.","u":"https://en.wikipedia.org/wiki/Archaea","i":"img/2157.jpg","e":"Greek <b>ἀρχαῖα<\/b> (<i>arkhaîa<\/i>) \"ancient things\": the first ones found were methanogens, thought to resemble early life."},"3366610":{"p":"2157","n":"Methanobacteriati","r":"kingdom","d":"Kingdom of archaea","x":"Methanobacteriati is a kingdom of archaea. Methanobacteriati are highly diverse and include methanogens, which produce methane and are often found in intestines; halobacteria, which survive extreme concentrations of salt; and some extremely thermophilic aerobes and anaerobes, which generally live at temperatures…","u":"https://en.wikipedia.org/wiki/Methanobacteriati","i":"img/3366610.jpg","e":"<b>Methanobacterium<\/b> + <b>-ati<\/b> \"kingdom\". Formerly <b>Euryarchaeota<\/b>, from Greek <b>εὐρύς<\/b> (<i>eurús<\/i>) \"broad\": methanogens and salt-lovers."},"28890":{"p":"3366610","n":"Methanobacteriota","r":"phylum","d":"Phylum of archaea","x":"Methanobacteriota is a phylum in the domain Archaea. The phylum was introduced to prokaryotic nomenclature in 2023.","u":"https://en.wikipedia.org/wiki/Methanobacteriota","i":"img/28890.jpg","e":"<b>Methanobacterium<\/b> + <b>-ota<\/b> \"phylum\": methanogens, halophiles and Thermococcus. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2283794":{"p":"28890","n":"Methanomada group","r":"clade","d":"Phylum of archaea","x":"Methanobacteriota is a phylum in the domain Archaea. The phylum was introduced to prokaryotic nomenclature in 2023.","u":"https://en.wikipedia.org/wiki/Methanobacteriota","si":"Methanobacteriota","i":"img/2283794.jpg","e":"Not formal Latin: \"<b>Methano<\/b>-\" + \"<b>-mada<\/b>\" for the methanogen lineages it groups. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2290931":{"p":"28890","n":"Stenosarchaea group","r":"clade","d":"Class of salt-tolerant archaea","x":"Haloarchaea are a class of archaea under the phylum Euryarchaeota, found in water saturated or nearly saturated with salt. 'Halobacteria' are now recognized as archaea rather than bacteria and are one of the largest groups of archaea.","u":"https://en.wikipedia.org/wiki/Haloarchaea","si":"Haloarchaea","i":"img/2290931.jpg","e":"Greek <b>στενός<\/b> (<i>stenós<\/i>) \"narrow\" + <b>archaea<\/b>: a molecular grouping of salt-lovers and Thermoplasma. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2235":{"p":"2290931","n":"Halobacteriales","r":"order","d":"Order of archaea","x":"Halobacteriales, from Ancient Greek ἅλς (háls), meaning \"salt\", and \"bacterium\", are an order of the Halobacteria, found in water saturated or nearly saturated with salt. They are also called halophiles, though this name is also used for other organisms which live in somewhat less concentrated salt water.","u":"https://en.wikipedia.org/wiki/Halobacteriales","i":"img/2235.jpg","e":"Greek <b>ἅλς<\/b> (<i>háls<\/i>) \"salt\" + <b>bacterium<\/b> + <b>-ales<\/b> \"order\": archaea of near-saturated brine."},"1783275":{"p":"2157","n":"Thermoproteati","r":"kingdom","d":"Kingdom of archaea","x":"Thermoproteati is a kingdom of archaea. Its synonym, \"TACK\", is an acronym for \"Thaumarchaeota\", \"Aigarchaeota\", \"Crenarchaeota\", and \"Korarchaeota\", the first groups discovered.","u":"https://en.wikipedia.org/wiki/Thermoproteati","i":"img/1783275.jpg","e":"<b>Thermoproteus<\/b>, Greek <b>θέρμη<\/b> (<i>thérmē<\/i>) \"heat\" + <b>Proteus<\/b>, the shape-shifting sea god + <b>-ati<\/b> \"kingdom\": hot-spring archaea. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2259":{"p":"28890","n":"Thermococcaceae","r":"family","d":"Family of archaea","x":"Thermococcaceae is a family of archaeans in the order Thermococcales. Almost all species within the three genera of Thermococcaceae were isolated from hydrothermal vents in the ocean.","u":"https://en.wikipedia.org/wiki/Thermococcaceae","i":"img/2259.jpg","e":"<b>Thermococcus<\/b>, Greek <b>θέρμη<\/b> (<i>thérmē<\/i>) \"heat\" + <b>κόκκος<\/b> (<i>kókkos<\/i>) \"grain\" + <b>-aceae<\/b> \"family\": deep-sea vent archaea."},"2301":{"p":"3366610","n":"Thermoplasmatales","r":"order","d":"Order of archaea","x":"Thermoplasmatales is an order of archaeans in the class Thermoplasmata. All are acidophiles, growing optimally at pH below 2.","u":"https://en.wikipedia.org/wiki/Thermoplasmatales","i":"img/2301.jpg","e":"<b>Thermoplasma<\/b>, Greek <b>θέρμη<\/b> (<i>thérmē<\/i>) \"heat\" + <b>πλάσμα<\/b> (<i>plásma<\/i>) \"formed thing\" + <b>-ales<\/b> \"order\": wall-less archaea in hot acid. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2759":{"p":"131567","n":"Eukaryota","r":"domain","d":"Domain of life whose cells have nuclei","x":"The eukaryotes are cellular organisms of the domain Eukaryota or Eukarya, which have a distinct cell nucleus, membrane-bound organelles and organization supported by a cytoskeleton. Extant eukaryotes are traditionally grouped into four kingdoms: animals, plants, fungi and protists.","u":"https://en.wikipedia.org/wiki/Eukaryote","i":"img/2759.jpg","e":"Greek <b>εὖ<\/b> (<i>eû<\/i>) \"true\" + <b>κάρυον<\/b> (<i>káruon<\/i>) \"nut, kernel\": cells with a true nucleus."},"33154":{"p":"2759","n":"Opisthokonta","r":"clade","d":"Group of eukaryotes which includes animals and fungi, among other groups","x":"The opisthokonts are a broad group of eukaryotes, including both the animal and fungus kingdoms. The opisthokonts, previously called the \"Fungi/Metazoa group\", are generally recognized as a clade.","u":"https://en.wikipedia.org/wiki/Opisthokont","i":"img/33154.jpg","e":"Greek <b>ὀπίσθιος<\/b> (<i>opísthios<\/i>) \"rear\" + <b>κοντός<\/b> (<i>kontós<\/i>) \"pole\": cells pushed by a single flagellum at the back, like sperm. Animals and fungi both belong here."},"4751":{"p":"33154","n":"Fungi","r":"kingdom","d":"Organism belonging to kingdom Fungi","x":"A fungus is any member of the group of eukaryotic organisms that includes yeasts, molds, and mushrooms. These organisms are classified in the biological kingdom Fungi.","u":"https://en.wikipedia.org/wiki/Fungus","i":"img/4751.jpg","e":"Latin <b>fungus<\/b> \"mushroom,\" probably from Greek <b>σπόγγος<\/b> (<i>spóngos<\/i>) \"sponge\". The study of fungi, <b>mycology<\/b>, comes from Greek <b>μύκης<\/b> \"mushroom\"."},"451864":{"p":"4751","n":"Dikarya","r":"subkingdom","d":"Subkingdom of fungi","x":"Dikarya is a subkingdom of Fungi that includes the divisions Ascomycota and Basidiomycota, both of which in general produce dikaryons, may be filamentous or unicellular, but are always without flagella. The Dikarya are most of the so-called \"higher fungi\", but also include many anamorphic species that would have been…","u":"https://en.wikipedia.org/wiki/Dikarya","i":"img/451864.jpg","e":"Greek <b>δίς<\/b> (<i>dís<\/i>) \"twice\" + <b>κάρυον<\/b> (<i>káruon<\/i>) \"nucleus\": fungi with a two-nucleus stage after mating, sac fungi and mushrooms."},"4890":{"p":"451864","n":"Ascomycota","r":"phylum","d":"Division or phylum of fungi","x":"The Ascomycota are a phylum in the kingdom Fungi that, together with the Basidiomycota, form the subkingdom Dikarya. Members of Ascomycota are commonly known as the sac fungi or ascomycetes.","u":"https://en.wikipedia.org/wiki/Ascomycota","i":"img/4890.jpg","e":"Greek <b>ἀσκός<\/b> (<i>askós<\/i>) \"wineskin, sac\" + <b>μύκης<\/b> \"fungus\": the sac fungi, spores in a tiny sac called an ascus."},"716545":{"p":"4890","n":"saccharomyceta","r":"clade","d":"Clade of fungi","x":"Saccharomyceta is a clade of fungi containing Pezizomycotina and Saccharomycotina, or all Ascomycete fungi except Taphrinomycotina according to the 2007 fungal phylogeny \"The Mycota: A Comprehensive Treatise on Fungi as Experimental Systems for Basic and Applied Research\" and Tedersoo et al. 2018.","u":"https://en.wikipedia.org/wiki/Saccharomyceta","i":"img/716545.jpg","e":"<b>Saccharomyces<\/b> \"sugar fungus\" + <b>-eta<\/b>: the yeasts and filamentous sac fungi together. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"147537":{"p":"716545","n":"Saccharomycotina","r":"subphylum","d":"Subdivision of fungi","x":"Saccharomycotina is a subdivision (subphylum) of the division (phylum) Ascomycota in the kingdom Fungi. It comprises most of the ascomycete yeasts.","u":"https://en.wikipedia.org/wiki/Saccharomycotina","i":"img/147537.jpg","e":"Greek <b>σάκχαρον<\/b> (<i>sákkharon<\/i>) \"sugar\" + <b>μύκης<\/b> (<i>múkēs<\/i>) \"fungus\": the budding yeasts, baker's yeast and Candida."},"451866":{"p":"4890","n":"Taphrinomycotina","r":"subphylum","d":"Subdivision of fungi","x":"The Taphrinomycotina are one of three subdivisions constituting the Ascomycota and is more or less synonymous with the slightly older invalid name Archiascomycetes. Recent molecular studies suggest that the group is monophyletic and basal to the rest of the Ascomycota.","u":"https://en.wikipedia.org/wiki/Taphrinomycotina","i":"img/451866.jpg","e":"<b>Taphrina<\/b> + <b>-mycotina<\/b>: fission yeast and Pneumocystis. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"5204":{"p":"451864","n":"Basidiomycota","r":"phylum","d":"Division of fungi","x":"The Basidiomycota are one of two large divisions that, together with the Ascomycota, constitute the subkingdom Dikarya within the kingdom Fungi. Members are known as basidiomycetes.","u":"https://en.wikipedia.org/wiki/Basidiomycota","i":"img/5204.jpg","e":"<b>Basidium<\/b>, from Greek <b>βάσις<\/b> (<i>básis<\/i>) \"base\" + <b>-ίδιον<\/b> \"small\" + <b>-mycota<\/b>: mushrooms, rusts and Cryptococcus."},"5302":{"p":"5204","n":"Agaricomycotina","r":"subphylum","d":"Subdivision of fungi","x":"Agaricomycotina is one of three subdivisions of the Basidiomycota, and represents many fungi which form macroscopic fruiting bodies. Agaricomycotina contains over 30,000 species, divided into three classes: Tremellomycetes, Dacrymycetes, and Agaricomycetes.","u":"https://en.wikipedia.org/wiki/Agaricomycotina","i":"img/5302.jpg","e":"<b>Agaricus<\/b>, from Greek <b>ἀγαρικόν<\/b> (<i>agarikón<\/i>), a tree fungus + <b>-mycotina<\/b>: the mushroom-formers and Cryptococcus. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"147538":{"p":"716545","n":"Pezizomycotina","r":"subphylum","d":"Subdivision of fungi","x":"Pezizomycotina is the largest subdivision of Ascomycota, containing the filamentous ascomycetes and most lichenized fungi. It is more or less synonymous with the older taxon Euascomycota.","u":"https://en.wikipedia.org/wiki/Pezizomycotina","i":"img/147538.jpg","e":"<b>Peziza<\/b>, a cup fungus + <b>-mycotina<\/b>: molds, morels and truffles."},"716546":{"p":"147538","n":"leotiomyceta","r":"clade","d":"Taxon of filamentous ascomycete fungi","x":"Leotiomyceta represents all the filamentous ascomycete fungi (Pezizomycotina), excluding the classes Pezizomycetes and Orbiliomycetes. It is well supported in several studies comparing DNA sequences in fungi.","u":"https://en.wikipedia.org/wiki/Leotiomyceta","i":"img/716546.jpg","e":"<b>Leotia<\/b>, a jelly-baby fungus + <b>-myceta<\/b>: most filamentous sac fungi. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"451871":{"p":"716546","n":"Eurotiomycetidae","r":"subclass","d":"Subclass of fungi","x":"Eurotiomycetidae is a subclass of the Eurotiomycetes.","u":"https://en.wikipedia.org/wiki/Eurotiomycetidae","i":"img/451871.jpg","e":"<b>Eurotium<\/b> + <b>-mycetidae<\/b>: Aspergillus, Penicillium and the dimorphic fungi."},"1131492":{"p":"451871","n":"Aspergillaceae","r":"family","d":"Family of fungi","x":"The Aspergillaceae are a family of fungi in the order Eurotiales which are commonly known as the blue and green molds. The family includes the commonly known and observed genera of Aspergillus and Penicillium, amongst other lesser known mold genera but also includes larger ascomycete fungi such as Penicilliopsis.","u":"https://en.wikipedia.org/wiki/Aspergillaceae","i":"img/1131492.jpg","e":"<b>Aspergillus<\/b> + <b>-aceae<\/b> \"family\": Aspergillus and Penicillium."},"5052":{"p":"1131492","n":"Aspergillus","r":"genus","d":"Genus of fungi","x":"Aspergillus is a genus consisting of several hundred mold species found in various climates worldwide.","u":"https://en.wikipedia.org/wiki/Aspergillus","i":"img/5052.jpg","e":"Latin <b>aspergillum<\/b> \"holy-water sprinkler\" (from <b>spargere<\/b> \"to sprinkle\"): Pier Antonio Micheli saw the sprinkler's shape in the spore heads under his microscope."},"2720871":{"p":"5052","n":"Aspergillus subgen. Circumdati","r":"subgenus","d":"Genus of fungi","x":"Aspergillus is a genus consisting of several hundred mold species found in various climates worldwide.","u":"https://en.wikipedia.org/wiki/Aspergillus","si":"Aspergillus","i":"img/2720871.jpg","e":"Latin <b>circumdatī<\/b> \"surrounded\": a subgenus of Aspergillus, the aflatoxin producers included. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"5073":{"p":"1131492","n":"Penicillium","r":"genus","d":"Genus of fungi","x":"Penicillium is a genus of ascomycetous fungi that is part of the mycobiome of many species and is of major importance in the natural environment, in food spoilage, and in food and drug production.","u":"https://en.wikipedia.org/wiki/Penicillium","i":"img/5073.jpg","e":"Latin <b>pēnicillum<\/b> \"painter's brush\" + <b>-ium<\/b>: for chains of spores that splay like a brush."},"33183":{"p":"451871","n":"Onygenales","r":"order","d":"Order of fungi","x":"The Onygenales are an order of fungi in the class Eurotiomycetes and division Ascomycota. The order's last common ancestor is estimated to have lived 150 million years ago.","u":"https://en.wikipedia.org/wiki/Onygenales","i":"img/33183.jpg","e":"<b>Onygena<\/b> + <b>-ales<\/b> \"order\": the dimorphic pathogens Histoplasma, Blastomyces and Coccidioides."},"299071":{"p":"33183","n":"Ajellomycetaceae","r":"family","d":"Family of fungi","x":"The Ajellomycetaceae are a family of fungi in the Ascomycota, class Eurotiomycetes.","u":"https://en.wikipedia.org/wiki/Ajellomycetaceae","i":"img/299071.jpg","e":"<b>Ajellomyces<\/b>, named after the mycologist Libero Ajello + <b>-aceae<\/b> \"family\": Histoplasma, Blastomyces and Paracoccidioides. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"715989":{"p":"716546","n":"sordariomyceta","r":"clade","d":"Taxon of filamentous ascomycete fungi","x":"Leotiomyceta represents all the filamentous ascomycete fungi (Pezizomycotina), excluding the classes Pezizomycetes and Orbiliomycetes. It is well supported in several studies comparing DNA sequences in fungi.","u":"https://en.wikipedia.org/wiki/Leotiomyceta","i":"img/715989.jpg","e":"<b>Sordaria<\/b> + <b>-myceta<\/b>: Neurospora, ergot and zombie-ant fungi. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"147550":{"p":"715989","n":"Sordariomycetes","r":"class","d":"Class of fungi","x":"Sordariomycetes is a class of fungi in the subdivision Pezizomycotina (Ascomycota). It is the second-largest class of Ascomycota, with a worldwide distribution that mostly accommodates terrestrial based taxa, although several can also be found in aquatic habitats.","u":"https://en.wikipedia.org/wiki/Sordariomycetes","i":"img/147550.jpg","e":"Latin <b>sordēs<\/b> \"filth\" + <b>-mycetes<\/b>: some grow on dung. Neurospora, ergot and Fusarium."},"222544":{"p":"147550","n":"Sordariomycetidae","r":"subclass","d":"Subclass of sac fungi","x":"Sordariomycetidae is a subclass of sac fungi.","u":"https://en.wikipedia.org/wiki/Sordariomycetidae","i":"img/222544.jpg","e":"<b>Sordaria<\/b> \"of filth\" + <b>-mycetidae<\/b>: Neurospora and rice blast."},"452284":{"p":"5204","n":"Ustilaginomycotina","r":"subphylum","d":"Subdivision of fungi","x":"The Ustilaginomycotina is a subdivision within the division Basidiomycota of the kingdom Fungi. It consists of the classes Ustilaginomycetes and Exobasidiomycetes, and in 2014 the subdivision was reclassified and the two additional classes Malasseziomycetes and Monilielliomycetes added.","u":"https://en.wikipedia.org/wiki/Ustilaginomycotina","i":"img/452284.jpg","e":"<b>Ustilago<\/b>, Latin for a smut fungus (from <b>ūrere<\/b> \"to burn,\" for the scorched look) + <b>-mycotina<\/b>: smuts and Malassezia. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"112252":{"p":"4751","n":"Fungi incertae sedis","r":"no rank","d":"Organism belonging to kingdom Fungi","x":"A fungus is any member of the group of eukaryotic organisms that includes yeasts, molds, and mushrooms. These organisms are classified in the biological kingdom Fungi.","u":"https://en.wikipedia.org/wiki/Fungus","si":"Fungus","i":"img/112252.jpg","e":"Latin <b>incertae sedis<\/b> \"of uncertain seat\": fungi whose placement isn't settled, chytrids and microsporidia here. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"5125":{"p":"147550","n":"Hypocreales","r":"order","d":"Order of fungi","x":"The Hypocreales are an order of fungi within the class Sordariomycetes.","u":"https://en.wikipedia.org/wiki/Hypocreales","i":"img/5125.jpg","e":"<b>Hypocrea<\/b> + <b>-ales<\/b> \"order\": ergot, zombie-ant fungi and Trichoderma."},"155619":{"p":"5302","n":"Agaricomycetes","r":"class","d":"Class of fungi","x":"The Agaricomycetes are a class of fungi in the division Basidiomycota. The taxon is roughly identical to that defined for the Homobasidiomycetes by Hibbett & Thorn, with the inclusion of Auriculariales and Sebacinales.","u":"https://en.wikipedia.org/wiki/Agaricomycetes","i":"img/155619.jpg","e":"<b>Agaricus<\/b> + <b>-mycetes<\/b>: mushrooms, chanterelles and brackets. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"452333":{"p":"155619","n":"Agaricomycetidae","r":"subclass","d":"Subclass of fungi","x":"Agaricomycetidae is a subclass of fungi, in the division Basidiomycota. The name Agaricomycetidae had previously been named by Marcel Locquin in 1984, but his publication did not contain a Latin diagnosis and it is therefore invalid under the International Code of Nomenclature for algae, fungi, and plants.","u":"https://en.wikipedia.org/wiki/Agaricomycetidae","i":"img/452333.jpg","e":"<b>Agaricus<\/b> + <b>-mycetidae<\/b>: gilled mushrooms and boletes. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"5338":{"p":"452333","n":"Agaricales","r":"order","d":"Order of mushrooms","x":"The Agaricales are an order of fungi in the division Basidiomycota. As originally conceived, the order contained all the agarics, but subsequent research has shown that not all agarics are closely related and some belong in other orders, such as the Russulales and Boletales.","u":"https://en.wikipedia.org/wiki/Agaricales","i":"img/5338.jpg","e":"<b>Agaricus<\/b> + <b>-ales<\/b> \"order\": button, oyster and magic mushrooms, fly agaric and death cap. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2982305":{"p":"5338","n":"Agaricineae","r":"suborder","d":"Order of mushrooms","x":"The Agaricales are an order of fungi in the division Basidiomycota. As originally conceived, the order contained all the agarics, but subsequent research has shown that not all agarics are closely related and some belong in other orders, such as the Russulales and Boletales.","u":"https://en.wikipedia.org/wiki/Agaricales","si":"Agaricales","i":"img/2982305.jpg","e":"<b>Agaricus<\/b> + <b>-ineae<\/b> \"suborder\": button mushrooms, Amanita and Psilocybe. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"41955":{"p":"5338","n":"Amanita","r":"genus","d":"Genus of mushrooms","x":"The genus Amanita contains about 600 described species of agarics, including some of the most toxic known mushrooms found worldwide, as well as some well-regarded edible species. The genus is responsible for 95% of fatalities resulting from mushroom poisoning, with the death cap accounting for 90% of fatalities every…","u":"https://en.wikipedia.org/wiki/Amanita","i":"img/41955.jpg","e":"Greek <b>ἀμανίτης<\/b> (<i>amanítēs<\/i>), a mushroom possibly named for Mount Amanus in Cilicia: fly agaric and death cap."},"5185":{"p":"147538","n":"Pezizales","r":"order","d":"Order of fungi","x":"The Pezizales are an order of the subphylum Pezizomycotina within the phylum Ascomycota. The order contains 16 families, 199 genera, and 1683 species.","u":"https://en.wikipedia.org/wiki/Pezizales","i":"img/5185.jpg","e":"<b>Peziza<\/b> + <b>-ales<\/b> \"order\": morels and truffles."},"2982316":{"p":"5338","n":"Marasmiineae","r":"suborder","d":"Order of mushrooms","x":"The Agaricales are an order of fungi in the division Basidiomycota. As originally conceived, the order contained all the agarics, but subsequent research has shown that not all agarics are closely related and some belong in other orders, such as the Russulales and Boletales.","u":"https://en.wikipedia.org/wiki/Agaricales","si":"Agaricales","i":"img/2982316.jpg","e":"<b>Marasmius<\/b>, Greek <b>μαραίνω<\/b> (<i>maraínō<\/i>) \"to wither\" + <b>-ineae<\/b> \"suborder\": shiitake and the humongous fungus. Same root as medicine's <b>marasmus<\/b>. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2698737":{"p":"2759","n":"Sar","r":"clade","d":"Topics referred to by the same term","x":"SAR or Sar may refer to:","u":"https://en.wikipedia.org/wiki/SAR","e":"An acronym: <b>S<\/b>tramenopiles + <b>A<\/b>lveolata + <b>R<\/b>hizaria, from kelp and diatoms to <i>Plasmodium<\/i> and forams. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"33630":{"p":"2698737","n":"Alveolata","r":"clade","d":"Clade of protists","x":"The alveolates are a group of protists, considered a major clade within Eukaryota. They are currently grouped with the Stramenopiles and Rhizaria among the protists with tubulocristate mitochondria into the SAR supergroup.","u":"https://en.wikipedia.org/wiki/Alveolate","i":"img/33630.jpg","e":"Latin <b>alveolātus<\/b> \"with small cavities\" (from <b>alveus<\/b> \"hollow\"), for sacs under the cell membrane, the same root as lung <b>alveoli<\/b>. Malaria parasites, ciliates and dinoflagellates."},"5794":{"p":"33630","n":"Apicomplexa","r":"phylum","d":"Phylum of parasitic alveolates","x":"The Apicomplexa are organisms of a large phylum of mainly parasitic alveolates. They are a kind of protozoan.","u":"https://en.wikipedia.org/wiki/Apicomplexa","i":"img/5794.jpg","e":"Latin <b>apex<\/b> \"tip\" + <b>complexus<\/b> \"embrace\": for the apical complex these parasites use to invade cells. Malaria, Toxoplasma, Cryptosporidium."},"422676":{"p":"5794","n":"Aconoidasida","r":"class","d":"Class of single-celled organisms","x":"The Aconoidasida are a class of apicomplexan parasites described by Mehlhorn et al in 1980.","u":"https://en.wikipedia.org/wiki/Aconoidasida","i":"img/422676.jpg","e":"Greek <b>ἀ-<\/b> \"lacking\" + <b>conoid<\/b> (<b>κῶνος<\/b> \"cone\"): apicomplexans without the cone-shaped invasion tool. Plasmodium and Babesia."},"5820":{"p":"422676","n":"Plasmodium","r":"genus","d":"Genus of parasitic protists that can cause malaria","x":"Plasmodium is a genus of unicellular eukaryotes that are obligate parasites of vertebrates and insects such as mosquitoes in the genus Anopheles. The life cycles of Plasmodium species involve development in a blood-feeding insect host which then injects parasites into a vertebrate host during a blood meal.","u":"https://en.wikipedia.org/wiki/Plasmodium","i":"img/5820.jpg","e":"New Latin <b>plasmodium<\/b>, from Greek <b>πλάσμα<\/b> (<i>plásma<\/i>) \"formed thing\" + <b>-ώδης<\/b> \"like\": for the multinucleate blob it forms inside cells. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"423054":{"p":"5794","n":"Eimeriorina","r":"suborder","d":"Suborder of single-celled organisms","x":"Eimeriorina is a suborder of phylum Apicomplexa.","u":"https://en.wikipedia.org/wiki/Eimeriorina","e":"<b>Eimeria<\/b>, after the zoologist Theodor Eimer + <b>-orina<\/b>: Toxoplasma, Cryptosporidium and Cyclospora. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"5878":{"p":"33630","n":"Ciliophora","r":"phylum","d":"Taxon of protozoans with hair-like organelles called cilia","x":"The ciliates are a group of alveolates characterized by the presence of hair-like organelles called cilia, which are identical in structure to eukaryotic flagella, but are in general shorter and present in much larger numbers, with a different undulating pattern than flagella. Cilia occur in all members of the group…","u":"https://en.wikipedia.org/wiki/Ciliate","i":"img/5878.jpg","e":"Latin <b>cilium<\/b> \"eyelash\" + Greek <b>φέρω<\/b> (<i>phérō<\/i>) \"to carry\": the eyelash-bearers, covered in beating cilia. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"6020":{"p":"5878","n":"Oligohymenophorea","r":"class","d":"Class of single-celled organisms","x":"The Oligohymenophorea are a large class of ciliates. There is typically a ventral groove containing the mouth and distinct oral cilia, separate from those of the body.","u":"https://en.wikipedia.org/wiki/Oligohymenophorea","i":"img/6020.jpg","e":"Greek <b>ὀλίγος<\/b> (<i>olígos<\/i>) \"few\" + <b>ὑμήν<\/b> (<i>humḗn<\/i>) \"membrane\" + <b>φέρω<\/b> \"to bear\": ciliates with a few membrane-like rows of cilia by the mouth. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2864":{"p":"33630","n":"Dinophyceae","r":"class","d":"Class of single-celled organisms","x":"Dinophyceae is a class of dinoflagellates.","u":"https://en.wikipedia.org/wiki/Dinophyceae","i":"img/2864.jpg","e":"Greek <b>δῖνος<\/b> (<i>dînos<\/i>) \"whirling\" + <b>φῦκος<\/b> (<i>phûkos<\/i>) \"seaweed\": dinoflagellates spin as they swim. Red tides and coral symbionts. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"33634":{"p":"2698737","n":"Stramenopiles","r":"clade","d":"Clade of eukaryotes","x":"The stramenopiles, also called heterokonts, are protists distinguished by the presence of stiff tripartite external hairs. In most species, the hairs are attached to flagella, in some they are attached to other areas of the cell surface, and in some they have been secondarily lost.","u":"https://en.wikipedia.org/wiki/Stramenopile","i":"img/33634.jpg","e":"Latin <b>strāmen<\/b> \"straw\" + <b>pilus<\/b> \"hair\": for a front flagellum covered in stiff straw-like hairs. Kelp, diatoms and Phytophthora."},"4762":{"p":"33634","n":"Oomycota","r":"phylum","d":"Fungus-like eukaryotic microorganism","x":"The oomycetes, or Oomycota, form a distinct phylogenetic lineage of fungus-like eukaryotic microorganisms within the Stramenopiles. They are filamentous and heterotrophic, and can reproduce both sexually and asexually.","u":"https://en.wikipedia.org/wiki/Oomycete","i":"img/4762.jpg","e":"Greek <b>ᾠόν<\/b> (<i>ōión<\/i>) \"egg\" + <b>μύκης<\/b> \"fungus\": \"egg fungi\" (water molds), which aren't fungi at all. The potato blight."},"2696291":{"p":"33634","n":"Ochrophyta","r":"clade","d":"Phylum of algae","x":"Ochrophytes, also known as heterokontophytes or stramenochromes, are a phylum of algae. They are the photosynthetic stramenopiles, a group of eukaryotes, organisms with a cell nucleus, characterized by the presence of two unequal flagella, one of which has tripartite hairs called mastigonemes.","u":"https://en.wikipedia.org/wiki/Ochrophyte","i":"img/2696291.jpg","e":"Greek <b>ὠχρός<\/b> (<i>ōkhrós<\/i>) \"pale yellow\" + <b>φυτόν<\/b> (<i>phutón<\/i>) \"plant\": golden-brown algae, kelp and diatoms."},"2836":{"p":"2696291","n":"Bacillariophyta","r":"phylum","d":"Single-celled algae with silica cell walls","x":"A diatom is any member of a large group comprising several genera of algae, specifically microalgae, found in the oceans, waterways and soils of the world. Living diatoms make up a significant portion of Earth's biomass.","u":"https://en.wikipedia.org/wiki/Diatom","i":"img/2836.jpg","e":"<b>Bacillaria<\/b> \"little rods\" + <b>-ophyta<\/b>: the diatoms (Greek <b>διάτομος<\/b> \"cut in two,\" for their two-halved glass shell). <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2870":{"p":"2696291","n":"Phaeophyceae","r":"class","d":"Large group of multicellular algae, comprising the class Phaeophyceae","x":"Brown algae are a large group of photoautotrophic, multicellular SAR comprising the class Phaeophyceae. They include many seaweeds located in colder waters of the Northern Hemisphere.","u":"https://en.wikipedia.org/wiki/Brown_algae","i":"img/2870.jpg","e":"Greek <b>φαιός<\/b> (<i>phaiós<\/i>) \"gray-brown\" + <b>φῦκος<\/b> (<i>phûkos<\/i>) \"seaweed\": the brown algae, kelp and bladderwrack. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"33636":{"p":"2870","n":"Laminariaceae","r":"family","d":"Family of brown algal seaweeds, many genera of which are popularly called \"kelp\"","x":"Laminariaceae is a family of brown algal seaweeds, many genera of which are popularly called \"kelp\". The table indicates the genera within this family.","u":"https://en.wikipedia.org/wiki/Laminariaceae","i":"img/33636.jpg","e":"<b>Laminaria<\/b>, Latin <b>lāmina<\/b> \"thin plate,\" for the flat blades + <b>-aceae<\/b> \"family\": kelps and kombu. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"543769":{"p":"2698737","n":"Rhizaria","r":"clade","d":"Clade of protists","x":"The Rhizaria are a diverse and species-rich clade of mostly unicellular eukaryotes. Except for the chlorarachniophytes and three species in the genus Paulinella in the phylum Cercozoa, they are all non-photosynthetic, but many Foraminifera and Radiolaria have a symbiotic relationship with unicellular algae.","u":"https://en.wikipedia.org/wiki/Rhizaria","i":"img/543769.jpg","e":"Greek <b>ῥίζα<\/b> (<i>rhíza<\/i>) \"root\" + <b>-aria<\/b>: amoebae with fine root-like threads, forams included."},"2611352":{"p":"2759","n":"Discoba","r":"clade","d":"Group of single-celled microbes","x":"Discoba is a diverse lineage of single-celled protists with two flagella. It is one of the main supergroups of eukaryotes, robustly supported by phylogenetic analyses.","u":"https://en.wikipedia.org/wiki/Discoba","i":"img/2611352.jpg","e":"Named partly after <b>Discicristata<\/b>, Greek <b>δίσκος<\/b> (<i>dískos<\/i>) \"disc,\" for the disc-shaped folds inside their mitochondria: <i>Trypanosoma<\/i>, <i>Euglena<\/i>, <i>Naegleria<\/i>. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"33682":{"p":"2611352","n":"Euglenozoa","r":"phylum","d":"Phylum of protozoans","x":"Euglenozoa are a large group of flagellate Discoba. They include a variety of common free-living species, as well as a few important parasites, some of which infect humans.","u":"https://en.wikipedia.org/wiki/Euglenozoa","i":"img/33682.jpg","e":"<b>Euglena<\/b>, Greek <b>εὖ<\/b> \"good\" + <b>γλήνη<\/b> (<i>glḗnē<\/i>) \"eyeball,\" for its red eyespot + <b>-zoa<\/b>: Euglena and the trypanosomes. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"5654":{"p":"33682","n":"Trypanosomatidae","r":"family","d":"Group of single-celled parasitic organisms","x":"Trypanosomatida is a group of kinetoplastid unicellular organisms distinguished by having only a single flagellum. The name is derived from the Greek trypano (borer) and soma (body) because of the corkscrew-like motion of some trypanosomatid species.","u":"https://en.wikipedia.org/wiki/Trypanosomatida","i":"img/5654.jpg","e":"Greek <b>τρύπανον<\/b> (<i>trúpanon<\/i>) \"borer\" + <b>σῶμα<\/b> (<i>sôma<\/i>) \"body\" + <b>-idae<\/b> \"family\": for their corkscrew motion."},"5690":{"p":"5654","n":"Trypanosoma","r":"genus","d":"Genus of parasitic flagellate protist in the Kinetoplastea class","x":"Trypanosoma is a genus of kinetoplastids, a group of unicellular parasitic flagellate protozoa under the phylum Euglenozoa. The name is derived from the Ancient Greek trypano- (borer) and soma (body) because of their corkscrew-like motion.","u":"https://en.wikipedia.org/wiki/Trypanosoma","i":"img/5690.jpg","e":"Greek <b>τρύπανον<\/b> (<i>trúpanon<\/i>) \"auger, borer\" + <b>σῶμα<\/b> (<i>sôma<\/i>) \"body\": the corkscrew swimmers of sleeping sickness and Chagas. Same root as <b>trepanation<\/b>."},"38568":{"p":"5654","n":"Leishmania","r":"subgenus","d":"Genus of parasitic flagellate protist","x":"Leishmania is a genus of parasitic protozoans, single-celled eukaryotic organisms of the trypanosomatid group that are responsible for the disease leishmaniasis. The parasites are transmitted by sandflies of the genus Phlebotomus in the Old World, and of the genus Lutzomyia in the New World.","u":"https://en.wikipedia.org/wiki/Leishmania","i":"img/38568.jpg","e":"Named after <b>William Boog Leishman<\/b>, the Scottish pathologist (and stain inventor) who described the parasite in 1901."},"2611341":{"p":"2759","n":"Metamonada","r":"clade","d":"Clade of excavate protists","x":"The metamonads are a large group of flagellate amitochondriate microscopic eukaryotes. They include the retortamonads, diplomonads, parabasalids, oxymonads, and a range of more poorly studied taxa, most of which are free-living flagellates.","u":"https://en.wikipedia.org/wiki/Metamonad","i":"img/2611341.jpg","e":"Greek <b>μετά<\/b> (<i>metá<\/i>) + <b>μονάς<\/b> (<i>monás<\/i>) \"unit, single cell\": <i>Giardia<\/i> and <i>Trichomonas<\/i>, which have lost typical mitochondria. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"554915":{"p":"2759","n":"Amoebozoa","r":"clade","d":"Phylum of protozoans","x":"Amoebozoa is a major taxonomic group containing about 2,400 described species of amoeboid protists, often possessing blunt, fingerlike, lobose pseudopods and tubular mitochondrial cristae. In traditional classification schemes, Amoebozoa is usually ranked as a phylum within either the kingdom Protista or the kingdom…","u":"https://en.wikipedia.org/wiki/Amoebozoa","i":"img/554915.jpg","e":"<b>Amoeba<\/b>, from Greek <b>ἀμοιβή<\/b> (<i>amoibḗ<\/i>) \"change\" + <b>ζῷα<\/b> (<i>zôia<\/i>) \"animals\": the shape-changers."},"2605435":{"p":"554915","n":"Evosea","r":"phylum","d":"Group of amoebae","x":"Evosea is a diverse clade of amoeboid protists discovered through molecular analyses. Along with Tubulinea and Discosea, Evosea is one of the three major groups within Amoebozoa, an important clade of eukaryotic organisms.","u":"https://en.wikipedia.org/wiki/Evosea","i":"img/2605435.jpg","e":"A modern name for the amoebozoan branch with Entamoeba, Dictyostelium and slime molds. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"142796":{"p":"2605435","n":"Eumycetozoa","r":"class","d":"Infraphylum of protists","x":"Mycetozoa is a polyphyletic grouping of slime molds. It was originally thought to be a monophyletic clade, but in 2010 it was discovered that protostelia are a polyphyletic group within Conosa.","u":"https://en.wikipedia.org/wiki/Mycetozoa","i":"img/142796.jpg","e":"Greek <b>εὐ-<\/b> \"true\" + <b>μύκης<\/b> (<i>múkēs<\/i>) \"fungus\" + <b>ζῷα<\/b> \"animals\": the \"true fungus-animals,\" slime molds. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"81529":{"p":"33154","n":"Salpingoecidae","r":"family","d":"Family of choanoflagellates","x":"Salpingoecidae is a family of choanoflagellates.","u":"https://en.wikipedia.org/wiki/Salpingoecidae","i":"img/81529.jpg","e":"<b>Salpingoeca<\/b>, Greek <b>σάλπιγξ<\/b> (<i>sálpinx<\/i>) \"trumpet\" + <b>οἶκος<\/b> (<i>oîkos<\/i>) \"house\" + <b>-idae<\/b> \"family\": choanoflagellates, the closest single-celled relatives of animals. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2763":{"p":"2759","n":"Rhodophyta","r":"phylum","d":"Division of plant life","x":"Red algae, or Rhodophyta, make up one of the oldest and largest phyla of eukaryotic algae, containing over 7,000 recognized species within over 900 genera amidst ongoing taxonomic revisions. The majority of species (6,793) are in the class Florideophyceae, and mostly consist of multicellular marine algae, including…","u":"https://en.wikipedia.org/wiki/Red_algae","i":"img/2763.jpg","e":"Greek <b>ῥόδον<\/b> (<i>rhódon<\/i>) \"rose\" + <b>φυτόν<\/b> (<i>phutón<\/i>) \"plant\": the red algae, nori included."},"2797":{"p":"2763","n":"Bangiophyceae","r":"class","d":"Class of algae","x":"Bangiophyceae is a class of red algae that includes the order Bangiales and possibly Goniotrichales. In some classifications it is merged with the Florideophyceae to form the Rhodophyceae.","u":"https://en.wikipedia.org/wiki/Bangiophyceae","i":"img/2797.jpg","e":"<b>Bangia<\/b>, after the Danish botanist Niels Hofman Bang + <b>-phyceae<\/b> \"seaweed class\": red algae like nori. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2692248":{"p":"2759","n":"core chlorophytes","r":"clade","d":"Phylum of green algae","x":"Chlorophyta or chlorophytes is a major division of green algae, and is sister taxon to the other major division Charophyta as well as the proposed basal clade Prasinodermophyta, together with whom they form the major primary algae clade Viridiplantae.","u":"https://en.wikipedia.org/wiki/Chlorophyta","si":"Chlorophyta","i":"img/2692248.jpg","e":"Greek <b>χλωρός<\/b> (<i>khlōrós<\/i>) \"pale green\" + <b>φυτόν<\/b> (<i>phutón<\/i>) \"plant\": the core green algae. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"3042":{"p":"2692248","n":"Chlamydomonadales","r":"order","d":"Order of green algae","x":"Chlamydomonadales, also known as Volvocales, are an order of flagellated or pseudociliated green algae, specifically of the Chlorophyceae. Chlamydomonadales can form planar or spherical colonies.","u":"https://en.wikipedia.org/wiki/Chlamydomonadales","i":"img/3042.jpg","e":"<b>Chlamydomonas<\/b>, Greek <b>χλαμύς<\/b> (<i>khlamús<\/i>) \"cloak\" + <b>μονάς<\/b> (<i>monás<\/i>) \"single unit\" + <b>-ales<\/b> \"order\": cloaked single cells, Chlamydomonas and Volvox. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"}},"leaves":{"1280":{"n":"Staph aureus","s":"Staphylococcus aureus","p":"1279","x":"Staphylococcus aureus is a gram-positive spherically shaped bacterium, a member of the Bacillota, and is a usual member of the microbiota of the body, frequently found in the upper respiratory tract and on the skin. It is often positive for catalase and nitrate reduction and is a facultative anaerobe, meaning that it…","u":"https://en.wikipedia.org/wiki/Staphylococcus_aureus","i":"img/1280.jpg"},"1282":{"n":"Staph epidermidis","s":"Staphylococcus epidermidis","p":"1279","x":"Staphylococcus epidermidis is a gram-positive bacterium, and one of over 40 species belonging to the genus Staphylococcus. It is part of the normal human microbiota, typically the skin microbiota, and less commonly the mucosal microbiota and also found in marine sponges.","u":"https://en.wikipedia.org/wiki/Staphylococcus_epidermidis","i":"img/1282.jpg"},"29385":{"n":"Staph saprophyticus","s":"Staphylococcus saprophyticus","p":"1279","x":"Staphylococcus saprophyticus is a Gram-positive coccus belonging to the genus Staphylococcus. S.","u":"https://en.wikipedia.org/wiki/Staphylococcus_saprophyticus","i":"img/29385.jpg"},"1314":{"n":"Strep pyogenes (Group A)","s":"Streptococcus pyogenes","p":"1301","x":"Streptococcus pyogenes is a species of Gram-positive, aerotolerant bacteria in the genus Streptococcus. These bacteria are extracellular, and made up of non-motile and non-sporing cocci that tend to link in chains.","u":"https://en.wikipedia.org/wiki/Streptococcus_pyogenes","i":"img/1314.jpg"},"1311":{"n":"Strep agalactiae (Group B)","s":"Streptococcus agalactiae","p":"1301","x":"Streptococcus agalactiae is a gram-positive coccus with a tendency to form chains. It is a beta-hemolytic, catalase-negative, and facultative anaerobe.","u":"https://en.wikipedia.org/wiki/Streptococcus_agalactiae","i":"img/1311.jpg"},"1313":{"n":"pneumococcus","s":"Streptococcus pneumoniae","p":"1301","x":"Streptococcus pneumoniae, or pneumococcus, is a Gram-positive, spherical bacteria, alpha-hemolytic member of the genus Streptococcus. S.","u":"https://en.wikipedia.org/wiki/Streptococcus_pneumoniae","i":"img/1313.jpg"},"1309":{"n":"Strep mutans","s":"Streptococcus mutans","p":"1301","x":"Streptococcus mutans is a facultatively anaerobic, gram-positive coccus commonly found in the human oral cavity and is a significant contributor to tooth decay. The microbe was first described by James Kilian Clarke in 1924.","u":"https://en.wikipedia.org/wiki/Streptococcus_mutans","i":"img/1309.jpg"},"1351":{"n":"Enterococcus faecalis","s":"Enterococcus faecalis","p":"1350","x":"Enterococcus faecalis – formerly classified as part of the group D Streptococcus, is a Gram-positive, commensal bacterium naturally inhabiting the gastrointestinal tracts of humans. Like other species in the genus Enterococcus, E.","u":"https://en.wikipedia.org/wiki/Enterococcus_faecalis","i":"img/1351.jpg"},"1352":{"n":"Enterococcus faecium","s":"Enterococcus faecium","p":"1350","x":"Enterococcus faecium is a Gram-positive, gamma-hemolytic or non-hemolytic bacterium in the genus Enterococcus. It can be commensal in the gastrointestinal tract of humans and animals, but it may also be pathogenic, causing diseases such as neonatal meningitis or endocarditis.","u":"https://en.wikipedia.org/wiki/Enterococcus_faecium","i":"img/1352.jpg"},"1392":{"n":"anthrax bacterium","s":"Bacillus anthracis","p":"86661","x":"Bacillus anthracis is a gram-positive and rod-shaped bacterium that causes anthrax, a deadly disease to livestock and, occasionally, to humans. It is the only permanent (obligate) pathogen within the genus Bacillus.","u":"https://en.wikipedia.org/wiki/Bacillus_anthracis","i":"img/1392.jpg"},"1396":{"n":"Bacillus cereus","s":"Bacillus cereus","p":"86661","x":"Bacillus cereus is a Gram-positive rod-shaped bacterium commonly found in soil, food, and marine sponges. The specific name, cereus, meaning \"waxy\" in Latin, refers to the appearance of colonies grown on blood agar.","u":"https://en.wikipedia.org/wiki/Bacillus_cereus","i":"img/1396.jpg"},"1423":{"n":"hay bacillus","s":"Bacillus subtilis","p":"1386","x":"Bacillus subtilis, known also as the hay bacillus or grass bacillus, is a Gram-positive, catalase-positive bacterium, found in soil and the gastrointestinal tract of ruminants, humans, and marine sponges.","u":"https://en.wikipedia.org/wiki/Bacillus_subtilis","i":"img/1423.jpg"},"1639":{"n":"Listeria","s":"Listeria monocytogenes","p":"1385","x":"Listeria monocytogenes is the species of pathogenic bacteria that causes the infection listeriosis. It is a facultative anaerobic bacterium, capable of surviving with or without oxygen.","u":"https://en.wikipedia.org/wiki/Listeria_monocytogenes","i":"img/1639.jpg"},"1491":{"n":"botulism bacterium","s":"Clostridium botulinum","p":"1485","x":"Clostridium botulinum is a gram-positive, rod-shaped, anaerobic, spore-forming, motile bacterium that has the ability to produce botulinum toxin, which is a highly potent neurotoxin.","u":"https://en.wikipedia.org/wiki/Clostridium_botulinum","i":"img/1491.jpg"},"1513":{"n":"tetanus bacterium","s":"Clostridium tetani","p":"1485","x":"Clostridium tetani is a common soil bacterium and the causative agent of tetanus, a disease that afflicts up to 400,000 people each year, mainly newborns. Vegetative cells of Clostridium tetani are usually rod-shaped and up to 2.5 μm long, but they become enlarged and tennis racket- or drumstick-shaped when forming…","u":"https://en.wikipedia.org/wiki/Clostridium_tetani","i":"img/1513.jpg"},"1502":{"n":"Clostridium perfringens","s":"Clostridium perfringens","p":"1485","x":"Clostridium perfringens is a Gram-positive, bacillus (rod-shaped), anaerobic, spore-forming pathogenic bacterium of the genus Clostridium. C.","u":"https://en.wikipedia.org/wiki/Clostridium_perfringens","i":"img/1502.jpg"},"1496":{"n":"C. diff","s":"Clostridioides difficile","p":"186801","x":"Clostridioides difficile is a bacterium known for causing serious diarrheal infections, and may also cause colon cancer. It is known also as C.","u":"https://en.wikipedia.org/wiki/Clostridioides_difficile","i":"img/1496.jpg"},"1579":{"n":"Lactobacillus","s":"Lactobacillus acidophilus","p":"186826","x":"Lactobacillus acidophilus is a rod-shaped, Gram-positive, homofermentative, anaerobic microbe first isolated from infant feces in the year 1900. The species is commonly found in humans, specifically the gastrointestinal tract and oral cavity as well as some speciality fermented foods such as fermented milk or yogurt,…","u":"https://en.wikipedia.org/wiki/Lactobacillus_acidophilus","i":"img/1579.jpg"},"1358":{"n":"Lactococcus","s":"Lactococcus lactis","p":"1300","x":"Lactococcus lactis is a gram-positive bacterium used extensively in the production of buttermilk and cheese, but has also become famous as the first genetically modified organism to be used alive for the treatment of human disease. L.","u":"https://en.wikipedia.org/wiki/Lactococcus_lactis","i":"img/1358.jpg"},"2104":{"n":"Mycoplasma pneumoniae","s":"Mycoplasmoides pneumoniae","p":"2790998","x":"Mycoplasma pneumoniae is a species of very small-cell bacteria that lack a cell wall, in the class Mollicutes. M.","u":"https://en.wikipedia.org/wiki/Mycoplasma_pneumoniae"},"2130":{"n":"Ureaplasma","s":"Ureaplasma urealyticum","p":"2790998","x":"Ureaplasma urealyticum is a bacterium belonging to the genus Ureaplasma and class Mollicutes. The Mycoplasmatota family consists of the genera Mycoplasma and Ureaplasma.","u":"https://en.wikipedia.org/wiki/Ureaplasma_urealyticum","i":"img/2130.jpg"},"1773":{"n":"TB bacterium","s":"Mycobacterium tuberculosis","p":"1763","x":"Mycobacterium tuberculosis, also known as Koch's bacillus, is a species of pathogenic bacteria in the family Mycobacteriaceae and the causative agent of tuberculosis.","u":"https://en.wikipedia.org/wiki/Mycobacterium_tuberculosis","i":"img/1773.
