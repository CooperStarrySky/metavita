jpg"},"1769":{"n":"leprosy bacterium","s":"Mycobacterium leprae","p":"1763","x":"Mycobacterium leprae is one\nof the two species of bacteria that cause Hansen's disease (leprosy), a chronic but curable infectious disease that damages the peripheral nerves and targets the skin, eyes, nose, and muscles.","u":"https://en.wikipedia.org/wiki/Mycobacterium_leprae","i":"img/1769.jpg"},"1764":{"n":"MAC","s":"Mycobacterium avium","p":"1763","x":"Mycobacterium avium is a species of Mycobacterium.","u":"https://en.wikipedia.org/wiki/Mycobacterium_avium"},"1717":{"n":"diphtheria bacterium","s":"Corynebacterium diphtheriae","p":"85007","x":"Corynebacterium diphtheriae is a Gram-positive pathogenic bacterium that causes diphtheria. It is also known as the Klebs–Löffler bacillus because it was discovered in 1884 by German bacteriologists Edwin Klebs (1834–1913) and Friedrich Löffler (1852–1915).","u":"https://en.wikipedia.org/wiki/Corynebacterium_diphtheriae","i":"img/1717.jpg"},"1824":{"n":"Nocardia","s":"Nocardia asteroides","p":"85007","x":"Nocardia asteroides is a species of Nocardia. It can cause nocardiosis, a severe pulmonary infection in immunocompromised hosts.","u":"https://en.wikipedia.org/wiki/Nocardia_asteroides","i":"img/1824.jpg"},"1659":{"n":"Actinomyces","s":"Actinomyces israelii","p":"1760","x":"Actinomyces israelii is a species of Gram-positive, rod-shaped bacteria within the genus Actinomyces. Known to live commensally on and within humans, A.","u":"https://en.wikipedia.org/wiki/Actinomyces_israelii","i":"img/1659.jpg"},"1911":{"n":"Streptomyces","s":"Streptomyces griseus","p":"1760","x":"Streptomyces griseus is a species of bacteria in the genus Streptomyces commonly found in soil. A few strains have been also reported from deep-sea sediments.","u":"https://en.wikipedia.org/wiki/Streptomyces_griseus","i":"img/1911.jpg"},"1747":{"n":"acne bacterium","s":"Cutibacterium acnes","p":"1760","x":"Cutibacterium acnes is the relatively slow-growing, typically aerotolerant anaerobic, gram-positive bacterium (rod) linked to the skin condition of acne; it can also cause chronic blepharitis and endophthalmitis, the latter particularly following intraocular surgery. Its genome has been sequenced and a study has shown…","u":"https://en.wikipedia.org/wiki/Cutibacterium_acnes","i":"img/1747.jpg"},"216816":{"n":"Bifidobacterium","s":"Bifidobacterium longum","p":"31953","x":"Bifidobacterium longum is a Gram-positive, catalase-negative, rod-shaped bacterium present in the human gastrointestinal tract and one of the 32 species that belong to the genus Bifidobacterium. It is a microaerotolerant anaerobe and considered to be one of the earliest colonizers of the gastrointestinal tract of…","u":"https://en.wikipedia.org/wiki/Bifidobacterium_longum","i":"img/216816.jpg"},"2702":{"n":"Gardnerella","s":"Gardnerella vaginalis","p":"31953","x":"Gardnerella vaginalis is a species of Gram-variable-staining facultative anaerobic bacteria. The organisms are small non-spore-forming, nonmotile coccobacilli.","u":"https://en.wikipedia.org/wiki/Gardnerella_vaginalis","i":"img/2702.jpg"},"2039":{"n":"Whipple's bacterium","s":"Tropheryma whipplei","p":"1760","x":"\"Tropheryma whipplei\" is a rod-shaped, environmental actinomycete that is the causative organism of Whipple's disease, and rarely, endocarditis.","u":"https://en.wikipedia.org/wiki/%22Tropheryma%22"},"562":{"n":"E. coli","s":"Escherichia coli","p":"543","x":"Escherichia coli ( ESH-ə-RIK-ee-ə KOH-lye) is a gram-negative, facultative anaerobic, rod-shaped, coliform bacterium of the genus Escherichia that is commonly found in the lower intestine of warm-blooded organisms. Most E.","u":"https://en.wikipedia.org/wiki/Escherichia_coli","i":"img/562.jpg"},"28901":{"n":"Salmonella","s":"Salmonella enterica","p":"543","x":"Salmonella enterica is a rod-shaped, flagellate, facultative anaerobic, Gram-negative bacterium and a species of the genus Salmonella. It is divided into six subspecies, arizonae (IIIa), diarizonae (IIIb), houtenae (IV), salamae (II), indica (VI), and enterica (I).","u":"https://en.wikipedia.org/wiki/Salmonella_enterica","i":"img/28901.jpg"},"622":{"n":"Shigella","s":"Shigella dysenteriae","p":"543","x":"Shigella dysenteriae is a species of the rod-shaped bacterial genus Shigella. Shigella species can cause shigellosis.","u":"https://en.wikipedia.org/wiki/Shigella_dysenteriae","i":"img/622.jpg"},"573":{"n":"Klebsiella","s":"Klebsiella pneumoniae","p":"543","x":"Klebsiella pneumoniae is a Gram-negative, non-motile, encapsulated, lactose-fermenting, facultative anaerobic, rod-shaped bacterium. It appears as a mucoid lactose fermenter on MacConkey agar.","u":"https://en.wikipedia.org/wiki/Klebsiella_pneumoniae","i":"img/573.jpg"},"584":{"n":"Proteus","s":"Proteus mirabilis","p":"91347","x":"Proteus mirabilis is a Gram-negative, facultatively anaerobic, rod-shaped, nitrate-reducing, indole-negative bacterium. It shows swarming motility and urease activity.","u":"https://en.wikipedia.org/wiki/Proteus_mirabilis","i":"img/584.jpg"},"632":{"n":"plague bacterium","s":"Yersinia pestis","p":"629","x":"Yersinia pestis is a gram-negative, non-motile, coccobacillus bacterium without spores. It is related to pathogens Yersinia enterocolitica and Yersinia pseudotuberculosis, from which it evolved.","u":"https://en.wikipedia.org/wiki/Yersinia_pestis","i":"img/632.jpg"},"630":{"n":"Yersinia enterocolitica","s":"Yersinia enterocolitica","p":"629","x":"Yersinia enterocolitica is a Gram-negative, rod-shaped bacterium, belonging to the family Yersiniaceae. It is motile at temperatures of 22–29 °C, but it becomes nonmotile at normal human body temperature.","u":"https://en.wikipedia.org/wiki/Yersinia_enterocolitica","i":"img/630.jpg"},"615":{"n":"Serratia","s":"Serratia marcescens","p":"1903411","x":"Serratia marcescens is a species of rod-shaped, Gram-negative bacteria in the family Yersiniaceae. It is a facultative anaerobe and an opportunistic pathogen in humans.","u":"https://en.wikipedia.org/wiki/Serratia_marcescens","i":"img/615.jpg"},"550":{"n":"Enterobacter","s":"Enterobacter cloacae","p":"543","x":"Enterobacter cloacae is a species of gram-negative, facultatively-anaerobic, rod-shaped bacterium from the order Enterobacterales. This species is a commensal of the human gastrointestinal tract and is occasionally implicated in human infections.","u":"https://en.wikipedia.org/wiki/Enterobacter_cloacae","i":"img/550.jpg"},"666":{"n":"cholera bacterium","s":"Vibrio cholerae","p":"662","x":"Vibrio cholerae is a species of Gram-negative, facultative anaerobe and comma-shaped bacteria. The bacteria naturally live in brackish or saltwater where they attach themselves easily to the chitin-containing shells of crabs, shrimp, and other shellfish.","u":"https://en.wikipedia.org/wiki/Vibrio_cholerae","i":"img/666.jpg"},"672":{"n":"Vibrio vulnificus","s":"Vibrio vulnificus","p":"662","x":"Vibrio vulnificus is a species of Gram-negative, motile, curved rod-shaped (vibrio), pathogenic bacteria of the genus Vibrio. Present in marine environments such as estuaries, brackish ponds, or coastal areas, V.","u":"https://en.wikipedia.org/wiki/Vibrio_vulnificus","i":"img/672.jpg"},"727":{"n":"Haemophilus influenzae","s":"Haemophilus influenzae","p":"712","x":"Haemophilus influenzae is a Gram-negative, non-motile, coccobacillary, facultatively anaerobic, capnophilic pathogenic bacterium of the family Pasteurellaceae. The bacteria are mesophilic and grow best at temperatures between 35 and 37 °C.","u":"https://en.wikipedia.org/wiki/Haemophilus_influenzae","i":"img/727.jpg"},"747":{"n":"Pasteurella","s":"Pasteurella multocida","p":"712","x":"Pasteurella multocida is a Gram-negative, nonmotile, penicillin-sensitive coccobacillus from the family Pasteurellaceae. P.","u":"https://en.wikipedia.org/wiki/Pasteurella_multocida","i":"img/747.jpg"},"287":{"n":"Pseudomonas","s":"Pseudomonas aeruginosa","p":"1236","x":"Pseudomonas aeruginosa is a common encapsulated, Gram-negative, aerobic–facultatively anaerobic, rod-shaped bacterium that can cause disease in plants and animals, including humans. A species of considerable medical importance, P.","u":"https://en.wikipedia.org/wiki/Pseudomonas_aeruginosa","i":"img/287.jpg"},"470":{"n":"Acinetobacter","s":"Acinetobacter baumannii","p":"468","x":"Acinetobacter baumannii is a typically short, almost round, rod-shaped (coccobacillus) Gram-negative bacterium. It is named after the bacteriologist Paul Baumann.","u":"https://en.wikipedia.org/wiki/Acinetobacter_baumannii","i":"img/470.jpg"},"480":{"n":"Moraxella","s":"Moraxella catarrhalis","p":"468","x":"Moraxella catarrhalis is a bacterium that infects humans, mainly in the upper airways and middle ear. It is a Gram-negative, oxygen-using, paired-sphere (diplococcus) bacterium that often lives in the nose and throat, especially in young children, without causing harm.","u":"https://en.wikipedia.org/wiki/Moraxella_catarrhalis","i":"img/480.jpg"},"446":{"n":"Legionella","s":"Legionella pneumophila","p":"118969","x":"Legionella pneumophila, the primary causative agent for Legionnaires’ disease, is an aerobic, pleomorphic, flagellated, non-spore-forming, Gram-negative bacterium. L.","u":"https://en.wikipedia.org/wiki/Legionella_pneumophila","i":"img/446.jpg"},"263":{"n":"Francisella","s":"Francisella tularensis","p":"1236","x":"Francisella tularensis is a pathogenic species of Gram-negative coccobacillus, an aerobic bacterium. It is nonspore-forming, nonmotile, and the causative agent of tularemia, the pneumonic form of which is often lethal without treatment.","u":"https://en.wikipedia.org/wiki/Francisella_tularensis","i":"img/263.jpg"},"777":{"n":"Coxiella","s":"Coxiella burnetii","p":"118969","x":"Coxiella burnetii is a gram-negative, obligate intracellular bacterial pathogen and the causative agent of Q fever. Although it was historically grouped with Rickettsia because of similar cell morphology, genetic and physiological studies show that C.","u":"https://en.wikipedia.org/wiki/Coxiella_burnetii","i":"img/777.jpg"},"487":{"n":"meningococcus","s":"Neisseria meningitidis","p":"482","x":"Neisseria meningitidis, often referred to as the meningococcus, is a Gram-negative bacterium that can cause meningitis and other forms of meningococcal disease such as meningococcemia, a life-threatening sepsis. The bacterium is referred to as a coccus because it is round, and more specifically a diplococcus because…","u":"https://en.wikipedia.org/wiki/Neisseria_meningitidis","i":"img/487.jpg"},"485":{"n":"gonococcus","s":"Neisseria gonorrhoeae","p":"482","x":"Neisseria gonorrhoeae, also known as gonococcus (singular) or gonococci (plural), is a species of Gram-negative diplococci bacteria first isolated by Albert Neisser in 1879. An obligate human pathogen, it primarily colonizes the mucosal lining of the urogenital tract; however, it is also capable of adhering to the…","u":"https://en.wikipedia.org/wiki/Neisseria_gonorrhoeae","i":"img/485.jpg"},"520":{"n":"whooping cough bacterium","s":"Bordetella pertussis","p":"80840","x":"Bordetella pertussis is a Gram-negative, aerobic, pathogenic, encapsulated coccobacillus bacterium of the genus Bordetella. It is the causative agent of pertussis or whooping cough.","u":"https://en.wikipedia.org/wiki/Bordetella_pertussis","i":"img/520.jpg"},"292":{"n":"Burkholderia cepacia","s":"Burkholderia cepacia","p":"32008","x":"Burkholderia cepacia complex (BCC) is a species complex consisting of Burkholderia cepacia and at least 20 different biochemically similar species of Gram-negative bacteria. They are catalase-producing and lactose-nonfermenting.","u":"https://en.wikipedia.org/wiki/Burkholderia_cepacia_complex","i":"img/292.jpg"},"28450":{"n":"Burkholderia pseudomallei","s":"Burkholderia pseudomallei","p":"32008","x":"Burkholderia pseudomallei is a Gram-negative, bipolar, aerobic, motile rod-shaped bacterium. It is a soil-dwelling bacterium endemic in tropical and subtropical regions worldwide, particularly in Thailand and northern Australia.","u":"https://en.wikipedia.org/wiki/Burkholderia_pseudomallei","i":"img/28450.jpg"},"783":{"n":"Rocky Mountain spotted fever bacterium","s":"Rickettsia rickettsii","p":"780","x":"Rickettsia rickettsii is a Gram-negative, intracellular, cocco-bacillus bacterium that was first discovered in 1896. Having a reduced genome, the bacterium harvests nutrients from its host cell to carry out respiration, making it an organo-heterotroph.","u":"https://en.wikipedia.org/wiki/Rickettsia_rickettsii","i":"img/783.jpg"},"782":{"n":"epidemic typhus bacterium","s":"Rickettsia prowazekii","p":"780","x":"Rickettsia prowazekii is a species of gram-negative, obligate intracellular parasitic, aerobic bacilliform bacteria of class Alphaproteobacteria that is the etiologic agent of epidemic typhus, transmitted in the feces of lice. In North America, the main reservoir for R.","u":"https://en.wikipedia.org/wiki/Rickettsia_prowazekii"},"38323":{"n":"Bartonella","s":"Bartonella henselae","p":"356","x":"Bartonella henselae, formerly Rochalimæa henselae, is a bacterium that is the causative agent of cat-scratch disease (bartonellosis). It primarily infects red blood cells and endothelial cells and is transmitted to humans through scratches, bites, or flea vectors associated with domestic and feral cats.","u":"https://en.wikipedia.org/wiki/Bartonella_henselae","i":"img/38323.jpg"},"29459":{"n":"Brucella","s":"Brucella melitensis","p":"356","x":"Brucella melitensis is a Gram-negative coccobacillus bacterium from the Brucellaceae family. The bacterium causes ovine brucellosis, along with Brucella ovis.","u":"https://en.wikipedia.org/wiki/Brucella_melitensis","i":"img/29459.jpg"},"945":{"n":"Ehrlichia","s":"Ehrlichia chaffeensis","p":"942","x":"Ehrlichia chaffeensis is an obligately intracellular, Gram-negative species of Rickettsiales bacteria. It is a zoonotic pathogen transmitted to humans by the lone star tick.","u":"https://en.wikipedia.org/wiki/Ehrlichia_chaffeensis"},"948":{"n":"Anaplasma","s":"Anaplasma phagocytophilum","p":"942","x":"Anaplasma phagocytophilum is a Gram-negative bacterium that is unusual in its tropism to neutrophils. It causes anaplasmosis in sheep and cattle, also known as tick-borne fever and pasture fever, and also causes the zoonotic disease human granulocytic anaplasmosis.","u":"https://en.wikipedia.org/wiki/Anaplasma_phagocytophilum","i":"img/948.jpg"},"955":{"n":"Wolbachia","s":"Wolbachia pipientis","p":"942","x":"Wolbachia is a genus of gram-negative bacteria infecting many species of arthropods and filarial nematodes. The relationship between Wolbachia and its hosts ranges from parasitism through benign symbiosis up to obligate mutualism.","u":"https://en.wikipedia.org/wiki/Wolbachia","i":"img/955.jpg"},"384":{"n":"Rhizobium","s":"Rhizobium leguminosarum","p":"227290","x":"Rhizobium leguminosarum is a Gram-negative soil bacterium in the genus Rhizobium that forms mutualistic, nitrogen-fixing symbioses with legumes. Compatible strains colonise the roots of various host plants and induce the formation of root nodules, within which the bacteria differentiate into bacteroids and convert…","u":"https://en.wikipedia.org/wiki/Rhizobium_leguminosarum"},"358":{"n":"Agrobacterium","s":"Agrobacterium tumefaciens","p":"227290","x":"Agrobacterium tumefaciens is the causal agent of crown gall disease in over 140 species of eudicots. It is a rod-shaped, Gram-negative soil bacterium.","u":"https://en.wikipedia.org/wiki/Agrobacterium_tumefaciens","i":"img/358.jpg"},"210":{"n":"H. pylori","s":"Helicobacter pylori","p":"213849","x":"Helicobacter pylori, previously known as Campylobacter pylori, is a gram-negative bacterium best known for its role in infecting the human stomach, often causing gastric ulcers and sometimes stomach cancer. Its helical body is thought to have evolved to penetrate the mucous lining of the stomach, helped by its…","u":"https://en.wikipedia.org/wiki/Helicobacter_pylori","i":"img/210.jpg"},"197":{"n":"Campylobacter","s":"Campylobacter jejuni","p":"213849","x":"Campylobacter jejuni is a Gram-negative, helical-shaped, motile, microaerophilic, pathogenic bacterium in the genus Campylobacter. It is commonly found in the intestinal tracts of poultry and other animals and is a major cause of bacterial gastroenteritis in humans worldwide.","u":"https://en.wikipedia.org/wiki/Campylobacter_jejuni","i":"img/197.jpg"},"160":{"n":"syphilis bacterium","s":"Treponema pallidum","p":"203692","x":"Treponema pallidum, formerly known as Spirochaeta pallida, is a microaerophilic, gram-negative, spirochaete bacterium with subspecies that cause the diseases syphilis, Bejel, and yaws. It is known to be transmitted only among humans and baboons.","u":"https://en.wikipedia.org/wiki/Treponema_pallidum","i":"img/160.jpg"},"139":{"n":"Lyme bacterium","s":"Borreliella burgdorferi","p":"203692","x":"Borrelia (Borreliella) burgdorferi is a bacterial species of the Spirochaetes phylum in the genus Borrelia, and is one of the causative agents of Lyme disease in humans. Along with a few similar genospecies, some of which also cause Lyme disease, it makes up the species complex of Borrelia burgdorferi sensu lato.","u":"https://en.wikipedia.org/wiki/Borrelia_burgdorferi","i":"img/139.jpg"},"173":{"n":"Leptospira","s":"Leptospira interrogans","p":"203691","x":"Leptospira interrogans is a thin, P1+, motile, gram-negative, obligate aerobic spirochaete bacterium that belongs to the genus Leptospira in the phylum Spirochaetota. L.","u":"https://en.wikipedia.org/wiki/Leptospira_interrogans","i":"img/173.jpg"},"813":{"n":"Chlamydia","s":"Chlamydia trachomatis","p":"810","x":"Chlamydia trachomatis is a Gram-negative, facultative anaerobic bacterium responsible for chlamydia and trachoma. C.","u":"https://en.wikipedia.org/wiki/Chlamydia_trachomatis","i":"img/813.jpg"},"83554":{"n":"parrot fever bacterium","s":"Chlamydia psittaci","p":"810","x":"Chlamydia psittaci is a lethal intracellular bacterial species that may cause endemic avian chlamydiosis, epizootic outbreaks in other mammals, and respiratory psittacosis in humans. Potential hosts include feral birds and domesticated poultry, as well as cattle, pigs, sheep, and horses.","u":"https://en.wikipedia.org/wiki/Chlamydia_psittaci","i":"img/83554.jpg"},"817":{"n":"Bacteroides","s":"Bacteroides fragilis","p":"171549","x":"Bacteroides fragilis is an anaerobic, Gram-negative, pleomorphic to rod-shaped bacterium. It is part of the normal microbiota of the human colon and is generally commensal, but can cause infection if displaced into the bloodstream or surrounding tissue following surgery, disease, or trauma.","u":"https://en.wikipedia.org/wiki/Bacteroides_fragilis","i":"img/817.jpg"},"837":{"n":"Porphyromonas","s":"Porphyromonas gingivalis","p":"171549","x":"Porphyromonas gingivalis belongs to the phylum Bacteroidota and is a nonmotile, Gram-negative, rod-shaped, anaerobic, pathogenic bacterium. It forms black colonies on blood agar.","u":"https://en.wikipedia.org/wiki/Porphyromonas_gingivalis"},"851":{"n":"Fusobacterium","s":"Fusobacterium nucleatum","p":"2","x":"Fusobacterium nucleatum is a Gram-negative, anaerobic bacterium, commensal to the human oral cavity, that plays a role in periodontal disease. This organism is commonly recovered from different monocultured microbial and mixed infections in humans and animals.","u":"https://en.wikipedia.org/wiki/Fusobacterium_nucleatum"},"1219":{"n":"Prochlorococcus","s":"Prochlorococcus marinus","p":"3028117","x":"Prochlorococcus is a genus of very small (0.6 μm) marine cyanobacteria with an unusual pigmentation. These bacteria belong to the photosynthetic picoplankton and are probably the most abundant photosynthetic organism on Earth.","u":"https://en.wikipedia.org/wiki/Prochlorococcus","i":"img/1219.jpg"},"272131":{"n":"Nostoc","s":"Nostoc punctiforme","p":"3028117","x":"Nostoc punctiforme is a species of filamentous cyanobacterium. Under non-limiting nutritional environmental conditions, its filaments are composed of photosynthetic vegetative cells; upon nutrient limitation, some of these cells undergo differentiation into heterocysts, akinetes or hormogonia.","u":"https://en.wikipedia.org/wiki/Nostoc_punctiforme","i":"img/272131.jpg"},"1206":{"n":"Trichodesmium","s":"Trichodesmium erythraeum","p":"1150","x":"Trichodesmium erythraeum is a marine cyanobacteria species characterized by its prolific diazotrophic capabilities. They play a dominant role in the ocean ecosystem, supplying a steady and significant source of new, biologically available nitrogen and cycling phosphorus.","u":"https://en.wikipedia.org/wiki/Trichodesmium_erythraeum"},"118562":{"n":"spirulina","s":"Limnospira platensis","p":"1150","x":"Limnospira platensis is a filamentous, gram-negative cyanobacterium. This bacterium is non-nitrogen-fixing photoautotroph.","u":"https://en.wikipedia.org/wiki/Limnospira_platensis","i":"img/118562.jpg"},"1299":{"n":"Deinococcus","s":"Deinococcus radiodurans","p":"188787","x":"Deinococcus radiodurans is a bacterium, an extremophile and one of the most radiation-resistant organisms known. It can survive cold, dehydration, vacuum, and acid, and therefore is known as a polyextremophile.","u":"https://en.wikipedia.org/wiki/Deinococcus_radiodurans","i":"img/1299.jpg"},"271":{"n":"Thermus aquaticus","s":"Thermus aquaticus","p":"188787","x":"Thermus aquaticus is a species of bacteria that can tolerate high temperatures, one of several thermophilic bacteria that belong to the Deinococcota phylum. It is the source of the heat-resistant enzyme Taq DNA polymerase, one of the most important enzymes in molecular biology because of its use in the polymerase…","u":"https://en.wikipedia.org/wiki/Thermus_aquaticus","i":"img/271.jpg"},"63363":{"n":"Aquifex","s":"Aquifex aeolicus","p":"3379134","x":"\"Aquifex aeolicus\" is a chemolithoautotrophic, Gram-negative, motile, hyperthermophilic bacterium. \"A.","u":"https://en.wikipedia.org/wiki/%22Aquifex_aeolicus%22","i":"img/63363.jpg"},"2336":{"n":"Thermotoga","s":"Thermotoga maritima","p":"3384194","x":"Thermotoga maritima is a hyperthermophilic, anaerobic organism that is a member of the order Thermotogales. T.","u":"https://en.wikipedia.org/wiki/Thermotoga_maritima","i":"img/2336.jpg"},"2173":{"n":"Methanobrevibacter","s":"Methanobrevibacter smithii","p":"2283794","x":"Methanobrevibacter smithii is the predominant methanogenic archaeon in the microbiota of the human gut. M.","u":"https://en.wikipedia.org/wiki/Methanobrevibacter_smithii","i":"img/2173.jpg"},"2190":{"n":"Methanocaldococcus","s":"Methanocaldococcus jannaschii","p":"2283794","x":"Methanocaldococcus jannaschii is a thermophilic methanogenic archaeon in the class Methanococci that lives at temperatures from 48° to 94 °C and at pressures of more than 200 atmospheres. It was the first archaeon, and third organism, to have its complete genome sequenced.","u":"https://en.wikipedia.org/wiki/Methanocaldococcus_jannaschii","i":"img/2190.jpg"},"2208":{"n":"Methanosarcina","s":"Methanosarcina barkeri","p":"2290931","x":"Methanosarcina barkeri is a methane-producing species of archaea and the type species of the genus Methanosarcina, characterized by its wide range of substrates used in methanogenesis. While most known methanogens produce methane from H2 and CO2, M.","u":"https://en.wikipedia.org/wiki/Methanosarcina_barkeri","i":"img/2208.jpg"},"2320":{"n":"Methanopyrus","s":"Methanopyrus kandleri","p":"2283794","x":"Methanopyrus is a genus of methanogen, with a single described species, Methanopyrus kandleri. It is a rod-shaped hyperthermophile, discovered on the wall of a black smoker from the Gulf of California at a depth of 2,000 m, at temperatures of 84–110 °C.","u":"https://en.wikipedia.org/wiki/Methanopyrus","i":"img/2320.jpg"},"2242":{"n":"Halobacterium","s":"Halobacterium salinarum","p":"2235","x":"Halobacterium salinarum, formerly known as Halobacterium cutirubrum or Halobacterium halobium, is an extremely halophilic marine obligate aerobic archaeon. Despite its name, this is not a bacterium, but a member of the domain Archaea.","u":"https://en.wikipedia.org/wiki/Halobacterium_salinarum","i":"img/2242.jpg"},"293091":{"n":"square archaeon","s":"Haloquadratum walsbyi","p":"2235","x":"Haloquadratum walsbyi is a species of Archaea in the genus Haloquadratum, known for its square shape and halophilic nature.","u":"https://en.wikipedia.org/wiki/Haloquadratum_walsbyi","i":"img/293091.jpg"},"2285":{"n":"Sulfolobus","s":"Sulfolobus acidocaldarius","p":"1783275","x":"Sulfolobus acidocaldarius is a thermoacidophilic archaeon that belongs to the phylum Thermoproteota. S.","u":"https://en.wikipedia.org/wiki/Sulfolobus_acidocaldarius","i":"img/2285.jpg"},"2261":{"n":"Pyrococcus","s":"Pyrococcus furiosus","p":"2259","x":"Pyrococcus furiosus is a heterotrophic, strictly anaerobic, extremophilic, model species of archaea. It is classified as a hyperthermophile because it thrives best under extremely high temperatures, and is notable for having an optimum growth temperature of 100 °C.","u":"https://en.wikipedia.org/wiki/Pyrococcus_furiosus","i":"img/2261.jpg"},"311400":{"n":"Thermococcus","s":"Thermococcus kodakarensis","p":"2259","x":"Thermococcus kodakarensis is a species of thermophilic archaea. The type strain T.","u":"https://en.wikipedia.org/wiki/Thermococcus_kodakarensis","i":"img/311400.jpg"},"160232":{"n":"Nanoarchaeum","s":"Nanoarchaeum equitans","p":"2157","x":"Nanoarchaeum equitans is a species of marine archaea that was discovered in 2002 in a hydrothermal vent off the coast of Iceland on the Kolbeinsey Ridge by Karl Stetter. It has been proposed as the first species in a new phylum, and is the only species within the genus Nanoarchaeum.","u":"https://en.wikipedia.org/wiki/Nanoarchaeum_equitans","i":"img/160232.jpg"},"338192":{"n":"Nitrosopumilus","s":"Nitrosopumilus maritimus","p":"1783275","x":"Nitrosopumilus is a genus of archaea. The type species, Nitrosopumilus maritimus, is an extremely common archaeon living in seawater.","u":"https://en.wikipedia.org/wiki/Nitrosopumilus","i":"img/338192.jpg"},"2303":{"n":"Thermoplasma","s":"Thermoplasma acidophilum","p":"2301","x":"Thermoplasma acidophilum is an archaeon, the type species of its genus. Unlike most organisms, its MVA pathway involves (R)-mevalonate-3-phosphate and (R)-mevalonate-3,5-bisphosphate.","u":"https://en.wikipedia.org/wiki/Thermoplasma_acidophilum"},"46632":{"n":"Picrophilus","s":"Picrophilus oshimae","p":"2301","u":"https://en.wikipedia.org/wiki/Picrophilus_oshimae"},"2594042":{"n":"Asgard archaeon","s":"Promethearchaeum syntrophicum","p":"2157","x":"Promethearchaeum is a genus of archaea discovered from the deep-sea sediments of the Pacific Ocean at the coast of Japan. Described in 2020 as a single species, \"Candidatus Prometheoarchaeum syntrophicum\", it took 12 years for the archeal samples to be successfully cultured.","u":"https://en.wikipedia.org/wiki/Promethearchaeum","i":"img/2594042.jpg"},"4932":{"n":"baker's yeast","s":"Saccharomyces cerevisiae","p":"147537","x":"Saccharomyces cerevisiae, also called brewer's yeast or baker's yeast, is a species of yeast. The species has been instrumental in winemaking, baking, and brewing since ancient times.","u":"https://en.wikipedia.org/wiki/Saccharomyces_cerevisiae","i":"img/4932.jpg"},"4896":{"n":"fission yeast","s":"Schizosaccharomyces pombe","p":"451866","x":"Schizosaccharomyces pombe, also called \"fission yeast\", is a species of yeast used in traditional brewing and as a model organism in molecular and cell biology. It is a unicellular eukaryote, whose cells are rod-shaped.","u":"https://en.wikipedia.org/wiki/Schizosaccharomyces_pombe","i":"img/4896.jpg"},"5476":{"n":"Candida albicans","s":"Candida albicans","p":"147537","x":"Candida albicans is an opportunistic pathogenic yeast that is a common member of the human gut flora. It can also survive outside the human body.","u":"https://en.wikipedia.org/wiki/Candida_albicans","i":"img/5476.jpg"},"5207":{"n":"Cryptococcus","s":"Cryptococcus neoformans","p":"5302","x":"Cryptococcus neoformans is an encapsulated basidiomycetous yeast belonging to the class Tremellomycetes and an obligate aerobe that can live in both plants and animals. Its teleomorph is a filamentous fungus, formerly referred to Filobasidiella neoformans.","u":"https://en.wikipedia.org/wiki/Cryptococcus_neoformans","i":"img/5207.jpg"},"746128":{"n":"Aspergillus fumigatus","s":"Aspergillus fumigatus","p":"5052","x":"Aspergillus fumigatus is a species of fungus in the genus Aspergillus, and is one of the most common Aspergillus species to cause disease in individuals with an immunodeficiency.","u":"https://en.wikipedia.org/wiki/Aspergillus_fumigatus","i":"img/746128.jpg"},"5059":{"n":"Aspergillus flavus","s":"Aspergillus flavus","p":"2720871","x":"Aspergillus flavus is a saprotrophic and pathogenic fungus with a cosmopolitan distribution. It is best known for its colonization of cereal grains, legumes, and tree nuts.","u":"https://en.wikipedia.org/wiki/Aspergillus_flavus","i":"img/5059.jpg"},"5061":{"n":"black mold","s":"Aspergillus niger","p":"2720871","x":"Aspergillus niger ( ) is a mold classified within the Nigri section of the Aspergillus genus. The Aspergillus genus consists of common molds found throughout the environment within soil and water, on vegetation, in fecal matter, on decomposing matter, and suspended in the air.","u":"https://en.wikipedia.org/wiki/Aspergillus_niger","i":"img/5061.jpg"},"1108849":{"n":"penicillin mold","s":"Penicillium rubens","p":"5073","x":"Penicillium rubens is a species of fungus in the genus Penicillium and was the first species known to produce the antibiotic penicillin. It was first described by Philibert Melchior Joseph Ehi Biourge in 1923.","u":"https://en.wikipedia.org/wiki/Penicillium_rubens","i":"img/1108849.jpg"},"5082":{"n":"blue cheese mold","s":"Penicillium roqueforti","p":"5073","x":"Penicillium roqueforti is a common saprotrophic fungus in the genus Penicillium. Widespread in nature, it can be isolated from soil, decaying organic matter, and plants.","u":"https://en.wikipedia.org/wiki/Penicillium_roqueforti","i":"img/5082.jpg"},"5037":{"n":"Histoplasma","s":"Histoplasma capsulatum","p":"299071","x":"Histoplasma capsulatum is a species of dimorphic fungus. Its sexual form is called Ajellomyces capsulatus.","u":"https://en.wikipedia.org/wiki/Histoplasma_capsulatum","i":"img/5037.jpg"},"5039":{"n":"Blastomyces","s":"Blastomyces dermatitidis","p":"299071","x":"Blastomyces dermatitidis is a dimorphic fungus that causes blastomycosis, an invasive and often serious fungal infection found occasionally in humans and other animals. It lives in soil and wet, decaying wood, often in an area close to a waterway such as a lake, river or stream.","u":"https://en.wikipedia.org/wiki/Blastomyces_dermatitidis","i":"img/5039.jpg"},"5501":{"n":"Coccidioides","s":"Coccidioides immitis","p":"33183","x":"Coccidioides immitis is a pathogenic fungus that resides in the soil in certain parts of the southwestern United States, northern Mexico, and a few other areas in the Western Hemisphere.","u":"https://en.wikipedia.org/wiki/Coccidioides_immitis","i":"img/5501.jpg"},"121759":{"n":"Paracoccidioides","s":"Paracoccidioides brasiliensis","p":"299071","x":"Paracoccidioides brasiliensis is a dimorphic fungus and one of the two species that cause paracoccidioidomycosis. The fungus has been affiliated with the family Ajellomycetaceae although a sexual state or teleomorph has not yet been found.","u":"https://en.wikipedia.org/wiki/Paracoccidioides_brasiliensis","i":"img/121759.jpg"},"29908":{"n":"Sporothrix","s":"Sporothrix schenckii","p":"222544","x":"Sporothrix schenckii, a fungus that can be found worldwide in the environment, is named for medical student Benjamin Schenck, who in 1896 was the first to isolate it from a human specimen. The species is present in soil as well as in and on living and decomposing plant material such as peat moss.","u":"https://en.wikipedia.org/wiki/Sporothrix_schenckii","i":"img/29908.jpg"},"42068":{"n":"Pneumocystis","s":"Pneumocystis jirovecii","p":"451866","x":"Pneumocystis jirovecii is a yeast-like fungus of the genus Pneumocystis. The causative organism of Pneumocystis pneumonia, it is an important human pathogen, particularly among immunocompromised hosts.","u":"https://en.wikipedia.org/wiki/Pneumocystis_jirovecii","i":"img/42068.jpg"},"5551":{"n":"athlete's foot fungus","s":"Trichophyton rubrum","p":"33183","x":"Trichophyton rubrum is a dermatophytic fungus in the phylum Ascomycota. It is an exclusively clonal, anthropophilic saprotroph that colonizes the upper layers of dead skin, and is the most common cause of athlete's foot, fungal infection of nail, jock itch, and ringworm worldwide.","u":"https://en.wikipedia.org/wiki/Trichophyton_rubrum","i":"img/5551.jpg"},"55194":{"n":"Malassezia","s":"Malassezia furfur","p":"452284","x":"Malassezia furfur is a species of yeast that is naturally found on the skin surfaces of humans and some other mammals. It is associated with a variety of dermatological conditions caused by fungal infections, notably seborrhoeic dermatitis and tinea versicolor.","u":"https://en.wikipedia.org/wiki/Malassezia_furfur","i":"img/55194.jpg"},"64495":{"n":"Rhizopus","s":"Rhizopus arrhizus","p":"112252","x":"Rhizopus arrhizus is a fungus of the family Mucoraceae, characterized by sporangiophores that arise from nodes at the point where the rhizoids are formed and by a hemispherical columella. It is the most common cause of mucormycosis in humans and occasionally infects other animals.","u":"https://en.wikipedia.org/wiki/Rhizopus_arrhizus"},"5141":{"n":"red bread mold","s":"Neurospora crassa","p":"222544","x":"Neurospora crassa is a type of red bread mold of the phylum Ascomycota. The genus name, meaning 'nerve spore' in Greek, refers to the characteristic striations on the spores.","u":"https://en.wikipedia.org/wiki/Neurospora_crassa","i":"img/5141.jpg"},"5111":{"n":"ergot fungus","s":"Claviceps purpurea","p":"5125","x":"Claviceps purpurea is an ergot fungus that grows on the ears of rye and related cereal and forage plants. Consumption of grains or seeds contaminated with the survival structure of this fungus, the ergot sclerotium, can cause ergotism in humans and other mammals.","u":"https://en.wikipedia.org/wiki/Claviceps_purpurea","i":"img/5111.jpg"},"268505":{"n":"zombie-ant fungus","s":"Ophiocordyceps unilateralis","p":"5125","x":"Ophiocordyceps unilateralis, commonly known as zombie-ant fungus, is an insect-pathogenic fungus, discovered by the British naturalist Alfred Russel Wallace in 1859. Zombie ants, infected by the Ophiocordyceps unilateralis fungus, are predominantly found in tropical rainforests.","u":"https://en.wikipedia.org/wiki/Ophiocordyceps_unilateralis","i":"img/268505.jpg"},"109871":{"n":"frog chytrid","s":"Batrachochytrium dendrobatidis","p":"112252","x":"Batrachochytrium dendrobatidis, also known as Bd or the amphibian chytrid fungus, is a fungus that causes the disease chytridiomycosis in amphibians.","u":"https://en.wikipedia.org/wiki/Batrachochytrium_dendrobatidis","i":"img/109871.jpg"},"6035":{"n":"microsporidian","s":"Encephalitozoon cuniculi","p":"112252","x":"Encephalitozoon cuniculi is a microsporidial parasite of mammals with world-wide distribution. An important cause of neurologic and renal disease in rabbits, E.","u":"https://en.wikipedia.org/wiki/Encephalitozoon_cuniculi"},"5341":{"n":"button mushroom","s":"Agaricus bisporus","p":"2982305","x":"Agaricus bisporus, the cultivated mushroom, is a basidiomycete mushroom native to grasslands in Eurasia and North America. It is cultivated in more than 70 countries and is one of the most commonly and widely consumed mushrooms in the world.","u":"https://en.wikipedia.org/wiki/Agaricus_bisporus","i":"img/5341.jpg"},"41956":{"n":"fly agaric","s":"Amanita muscaria","p":"41955","x":"Amanita muscaria, commonly known as the fly agaric or fly amanita or simply red toadstool, is a basidiomycete fungus of the genus Amanita. Its name may come from its historical use to kill flies or from the effects it causes.","u":"https://en.wikipedia.org/wiki/Amanita_muscaria","i":"img/41956.jpg"},"67723":{"n":"death cap","s":"Amanita phalloides","p":"41955","x":"Amanita phalloides, commonly known as the death cap, is a deadly poisonous basidiomycete fungus and mushroom, one of many in the genus Amanita. Originating in Europe but later introduced to other parts of the world since the late twentieth century, A.","u":"https://en.wikipedia.org/wiki/Amanita_phalloides","i":"img/67723.jpg"},"181762":{"n":"magic mushroom","s":"Psilocybe cubensis","p":"2982305","x":"Psilocybe cubensis, commonly known as the magic mushroom, shroom, golden halo, cube, gold cap, or bluestain smoothcap, is a species of psilocybin mushroom of moderate potency whose principal active compounds are psilocybin and psilocin. It belongs to the fungus family Hymenogastraceae and was previously known as…","u":"https://en.wikipedia.org/wiki/Psilocybe_cubensis","i":"img/181762.jpg"},"36066":{"n":"chanterelle","s":"Cantharellus cibarius","p":"155619","x":"Cantharellus cibarius is the golden chanterelle, the type species of the chanterelle genus Cantharellus. It is also known as girolle.","u":"https://en.wikipedia.org/wiki/Cantharellus_cibarius","i":"img/36066.jpg"},"39407":{"n":"morel","s":"Morchella esculenta","p":"5185","x":"Morchella esculenta is a species of fungus in the family Morchellaceae of the Ascomycota.","u":"https://en.wikipedia.org/wiki/Morchella_esculenta","i":"img/39407.jpg"},"39416":{"n":"black truffle","s":"Tuber melanosporum","p":"5185","x":"Tuber melanosporum, commonly called black truffle, Périgord truffle or French black truffle, is a species of truffle native to Southern Europe. It is one of the most expensive edible fungi in the world.","u":"https://en.wikipedia.org/wiki/Tuber_melanosporum","i":"img/39416.jpg"},"5353":{"n":"shiitake","s":"Lentinula edodes","p":"2982316","x":"The shiitake is an edible mushroom native to East Asia and mainland Southeast Asia, which is cultivated and consumed around the globe. The earliest written records of their cultivation dates to 1209, during the Song dynasty in China.","u":"https://en.wikipedia.org/wiki/Shiitake","i":"img/5353.jpg"},"5322":{"n":"oyster mushroom","s":"Pleurotus ostreatus","p":"5338","x":"Pleurotus ostreatus, commonly known as the oyster mushroom, grey oyster mushroom, oyster fungus, hiratake, or pearl oyster mushroom, is a popular edible mushroom found in temperate and subtropical forests around the world.","u":"https://en.wikipedia.org/wiki/Pleurotus_ostreatus","i":"img/5322.jpg"},"47428":{"n":"humongous fungus","s":"Armillaria ostoyae","p":"2982316","x":"Armillaria ostoyae is a pathogenic species of fungus in the family Physalacriaceae. It has decurrent lamella, and the mushroom stalk (stipe) has a annulus (ring).","u":"https://en.wikipedia.org/wiki/Armillaria_ostoyae","i":"img/47428.jpg"},"36056":{"n":"porcini","s":"Boletus edulis","p":"452333","x":"Boletus edulis is a basidiomycete fungus, and the type species of the genus Boletus. It is prized as an edible mushroom.","u":"https://en.wikipedia.org/wiki/Boletus_edulis","i":"img/36056.jpg"},"5297":{"n":"wheat stem rust","s":"Puccinia graminis","p":"5204","x":"Stem rust, also known as cereal rust, black rust, red rust or red dust, is caused by the fungus Puccinia graminis, which causes significant disease in cereal crops. Crop species that are affected by the disease include bread wheat, durum wheat, barley and triticale.","u":"https://en.wikipedia.org/wiki/Stem_rust","i":"img/5297.jpg"},"5270":{"n":"corn smut","s":"Mycosarcoma maydis","p":"452284","x":"Corn smut is a plant disease caused by the pathogenic fungus Mycosarcoma maydis, synonym Ustilago maydis. One of several cereal crop pathogens called smut, the fungus forms galls on all above-ground parts of corn species such as maize and teosinte.","u":"https://en.wikipedia.org/wiki/Corn_smut","i":"img/5270.jpg"},"40559":{"n":"noble rot","s":"Botrytis cinerea","p":"715989","x":"Botrytis cinerea is a necrotrophic fungus that affects many plant species, including wine grapes. In viticulture, it is commonly known as \"botrytis bunch rot\"; in horticulture, it is usually called \"grey mould\" or \"gray mold\".","u":"https://en.wikipedia.org/wiki/Botrytis_cinerea","i":"img/40559.jpg"},"51453":{"n":"Trichoderma","s":"Trichoderma reesei","p":"5125","x":"Trichoderma reesei is a mesophilic and filamentous fungus. It is an anamorph of the fungus Hypocrea jecorina.","u":"https://en.wikipedia.org/wiki/Trichoderma_reesei","i":"img/51453.jpg"},"5833":{"n":"falciparum malaria parasite","s":"Plasmodium falciparum","p":"5820","x":"Plasmodium falciparum is a unicellular protozoan parasite of humans and is the deadliest species of Plasmodium that causes malaria in humans. The parasite is transmitted through the bite of a female Anopheles mosquito and causes the disease's most dangerous form, falciparum malaria.","u":"https://en.wikipedia.org/wiki/Plasmodium_falciparum","i":"img/5833.jpg"},"5855":{"n":"vivax malaria parasite","s":"Plasmodium vivax","p":"5820","x":"Plasmodium vivax is a protozoal parasite and a human pathogen. This parasite is the most frequent and widely distributed cause of recurring malaria.","u":"https://en.wikipedia.org/wiki/Plasmodium_vivax","i":"img/5855.jpg"},"5811":{"n":"Toxoplasma","s":"Toxoplasma gondii","p":"423054","x":"Toxoplasma gondii is a species of parasitic alveolate that causes toxoplasmosis. Found worldwide, T.","u":"https://en.wikipedia.org/wiki/Toxoplasma_gondii","i":"img/5811.jpg"},"5807":{"n":"Cryptosporidium","s":"Cryptosporidium parvum","p":"423054","x":"Cryptosporidium parvum is one of several species of apicomplexan eukaryotes that cause cryptosporidiosis, a parasitic disease of the mammalian intestinal tract.","u":"https://en.wikipedia.org/wiki/Cryptosporidium_parvum","i":"img/5807.jpg"},"5868":{"n":"Babesia","s":"Babesia microti","p":"422676","x":"Babesia microti is a parasitic blood-borne piroplasm transmitted by deer ticks. B.","u":"https://en.wikipedia.org/wiki/Babesia_microti","i":"img/5868.jpg"},"88456":{"n":"Cyclospora","s":"Cyclospora cayetanensis","p":"423054","x":"Cyclospora cayetanensis is a protozoan coccidia parasite that causes a diarrheal disease called cyclosporiasis in humans and possibly other primates. Originally reported as a novel pathogen of probable coccidian nature in the 1980s and described in the early 1990s, it was virtually unknown in developed countries until…","u":"https://en.wikipedia.org/wiki/Cyclospora_cayetanensis","i":"img/88456.jpg"},"5888":{"n":"Paramecium","s":"Paramecium tetraurelia","p":"6020","x":"Paramecium is a genus of eukaryotic, unicellular ciliates, widespread in freshwater, brackish, and ocean environments. Paramecia are often abundant in stagnant basins and ponds.","u":"https://en.wikipedia.org/wiki/Paramecium","si":"Paramecium","i":"img/5888.jpg"},"5911":{"n":"Tetrahymena","s":"Tetrahymena thermophila","p":"6020","x":"Tetrahymena thermophila is a species of Ciliophora in the family Tetrahymenidae. It is a free living protozoon and occurs in fresh water.","u":"https://en.wikipedia.org/wiki/Tetrahymena_thermophila","i":"img/5911.jpg"},"5963":{"n":"Stentor","s":"Stentor coeruleus","p":"5878","x":"Stentor coeruleus is a protist in the family Stentoridae which is characterized by being a very large ciliate that measures 0.5 to 2 millimetres when fully extended.","u":"https://en.wikipedia.org/wiki/Stentor_coeruleus","i":"img/5963.jpg"},"156230":{"n":"red tide dinoflagellate","s":"Karenia brevis","p":"2864","x":"Karenia brevis is a microscopic, single-celled, photosynthetic organism in the genus Karenia. It is a marine dinoflagellate commonly found in the waters of the Gulf of Mexico.","u":"https://en.wikipedia.org/wiki/Karenia_brevis","i":"img/156230.jpg"},"2966":{"n":"sea sparkle","s":"Noctiluca scintillans","p":"2864","x":"Noctiluca is a genus of dinoflagellates in the family Noctilucaceae. Its only species is Noctiluca scintillans, a marine species that can exist in a green or red form, depending on the pigmentation in its vacuoles.","u":"https://en.wikipedia.org/wiki/Noctiluca","i":"img/2966.jpg"},"2951":{"n":"coral symbiont","s":"Symbiodinium microadriaticum","p":"2864","x":"Symbiodinium is a genus of dinoflagellates that encompasses the largest and most prevalent group of endosymbiotic dinoflagellates known and have photosymbiotic relationships with many species. These unicellular microalgae commonly reside in the endoderm of tropical cnidarians such as corals, sea anemones, and…","u":"https://en.wikipedia.org/wiki/Symbiodinium","si":"Symbiodinium","i":"img/2951.jpg"},"4787":{"n":"potato blight","s":"Phytophthora infestans","p":"4762","x":"Phytophthora infestans is an oomycete or water mold, a fungus-like microorganism (oomycete) that causes the serious crop disease known as late blight or potato blight. The Early blight caused by Alternaria solani is also often called \"potato blight\".","u":"https://en.wikipedia.org/wiki/Phytophthora_infestans","i":"img/4787.jpg"},"35128":{"n":"diatom","s":"Thalassiosira pseudonana","p":"2836","x":"Thalassiosira pseudonana is a species of marine centric Bulka diatoms. It was chosen as the first eukaryotic marine phytoplankton for whole genome sequencing.","u":"https://en.wikipedia.org/wiki/Thalassiosira_pseudonana","i":"img/35128.jpg"},"2850":{"n":"Phaeodactylum","s":"Phaeodactylum tricornutum","p":"2836","x":"Phaeodactylum tricornutum is a diatom, the only species in the genus Phaeodactylum. Unlike other diatoms, P.","u":"https://en.wikipedia.org/wiki/Phaeodactylum","i":"img/2850.jpg"},"35122":{"n":"giant kelp","s":"Macrocystis pyrifera","p":"33636","x":"Macrocystis, commonly known as giant kelp, is a monospecific genus of kelp. Previously, several species had been reognized, including M.","u":"https://en.wikipedia.org/wiki/Macrocystis","i":"img/35122.jpg"},"88149":{"n":"kombu","s":"Saccharina japonica","p":"33636","x":"Saccharina japonica is a marine species of the Phaeophyceae class, a type of kelp or seaweed, which is extensively cultivated on ropes between the seas of China, Japan and Korea. It has the common name sweet kelp.","u":"https://en.wikipedia.org/wiki/Saccharina_japonica","i":"img/88149.jpg"},"49266":{"n":"bladderwrack","s":"Fucus vesiculosus","p":"2870","x":"Fucus vesiculosus, known by the common names bladderwrack, black tang, rockweed, sea grapes, bladder fucus, sea oak, cut weed, dyers fucus, red fucus and rock wrack, is a brown alga found on the coasts of the North Sea, the western Baltic Sea and the Atlantic and Pacific Oceans. It was the original source of iodine,…","u":"https://en.wikipedia.org/wiki/Fucus_vesiculosus","i":"img/49266.jpg"},"12968":{"n":"Blastocystis","s":"Blastocystis hominis","p":"33634","x":"Blastocystis hominis is a single-celled eukaryotic organism that inhabits the gastrointestinal tract of humans and various animals. This stramenopile exhibits significant genetic diversity and has become an organism of increasing scientific interest due to its widespread distribution and the emerging understanding of…","u":"https://en.wikipedia.org/wiki/Blastocystis_hominis","i":"img/12968.jpg"},"101203":{"n":"fish water mold","s":"Saprolegnia parasitica","p":"4762","x":"Saprolegnia parasitica is a species of freshwater and estuarine water mold, or oomycete, in the genus Saprolegnia. The species is an important pathogen of fish and fish eggs and is one of the principal causative agents of saprolegniasis in aquaculture.","u":"https://en.wikipedia.org/wiki/Saprolegnia_parasitica"},"69025":{"n":"foraminiferan","s":"Globigerina bulloides","p":"543769","x":"Globigerina bulloides is a species of heterotrophic planktonic foraminifer with a wide distribution in the photic zone of the world's oceans. It is able to tolerate a range of sea surface temperatures, salinities and water densities, and is most abundant at high southern latitudes, certain high northern latitudes, and…","u":"https://en.wikipedia.org/wiki/Globigerina_bulloides","i":"img/69025.jpg"},"227086":{"n":"Bigelowiella","s":"Bigelowiella natans","p":"543769","x":"Bigelowiella natans is a species of chlorarachniophyte alga that is a model organism for the Rhizaria.","u":"https://en.wikipedia.org/wiki/Bigelowiella_natans"},"37360":{"n":"clubroot","s":"Plasmodiophora brassicae","p":"543769","x":"Plasmodiophora brassicae is a soilborne organism that is best known for its high economic impact on Brassica oil and vegetable crops. It infects 30 different cruciferous plants, which consists of up to 16 crop species, 9 ornamentals, and 5 weeds.","u":"https://en.wikipedia.org/wiki/Plasmodiophora_brassicae","i":"img/37360.jpg"},"5691":{"n":"sleeping sickness parasite","s":"Trypanosoma brucei","p":"5690","x":"Trypanosoma brucei is a species of parasitic kinetoplastid belonging to the genus Trypanosoma that is present in sub-Saharan Africa. Unlike other protozoan parasites that normally infect blood and tissue cells, it is exclusively extracellular and inhabits the blood plasma and body fluids.","u":"https://en.wikipedia.org/wiki/Trypanosoma_brucei","i":"img/5691.jpg"},"5693":{"n":"Chagas parasite","s":"Trypanosoma cruzi","p":"5690","x":"Trypanosoma cruzi is a species of parasitic kinetoplastid which causes Chagas disease. Among the protozoa, the trypanosomes characteristically bore tissue in another organism and feed on blood (primarily) and also lymph.","u":"https://en.wikipedia.org/wiki/Trypanosoma_cruzi","i":"img/5693.jpg"},"5661":{"n":"kala-azar parasite","s":"Leishmania donovani","p":"38568","x":"Leishmania donovani is a species of intracellular parasites belonging to the genus Leishmania, a group of haemoflagellate kinetoplastids that cause the disease leishmaniasis. It is a human blood parasite responsible for visceral leishmaniasis or kala-azar, the most severe form of leishmaniasis.","u":"https://en.wikipedia.org/wiki/Leishmania_donovani","i":"img/5661.jpg"},"5664":{"n":"Leishmania major","s":"Leishmania major","p":"38568","x":"Leishmania major is a species of parasite found in the genus Leishmania, and is associated with the disease zoonotic cutaneous leishmaniasis. L.","u":"https://en.wikipedia.org/wiki/Leishmania_major","i":"img/5664.jpg"},"3039":{"n":"Euglena","s":"Euglena gracilis","p":"33682","x":"Euglena gracilis is a freshwater species of euglenid, a microscopic type of algae, in the genus Euglena. It has secondary chloroplasts, and is a mixotroph able to feed by photosynthesis or phagocytosis.","u":"https://en.wikipedia.org/wiki/Euglena_gracilis","i":"img/3039.jpg"},"5763":{"n":"brain-eating amoeba","s":"Naegleria fowleri","p":"2611352","x":"Naegleria fowleri, also known as the brain-eating amoeba or brain-eating amoeboid, is a species of the genus Naegleria. It belongs to the phylum Percolozoa and is classified as an amoeboflagellate excavate, an organism capable of behaving as both an amoeba and a flagellate.","u":"https://en.wikipedia.org/wiki/Naegleria_fowleri","i":"img/5763.jpg"},"5741":{"n":"Giardia","s":"Giardia duodenalis","p":"2611341","x":"Giardia duodenalis, also known as Giardia intestinalis and Giardia lamblia, is a flagellated parasitic protozoan microorganism of the genus Giardia that colonizes the small intestine, causing a diarrheal condition known as giardiasis. The parasite attaches to the intestinal epithelium by a ventral disc, and reproduces…","u":"https://en.wikipedia.org/wiki/Giardia_duodenalis","i":"img/5741.jpg"},"5722":{"n":"Trichomonas","s":"Trichomonas vaginalis","p":"2611341","x":"Trichomonas vaginalis is an anaerobic, flagellated protozoan parasite and the causative agent of a sexually transmitted disease called trichomoniasis. It is the most common pathogenic protozoan that infects humans in industrialized countries.","u":"https://en.wikipedia.org/wiki/Trichomonas_vaginalis","i":"img/5722.jpg"},"5759":{"n":"Entamoeba","s":"Entamoeba histolytica","p":"2605435","x":"Entamoeba histolytica is an anaerobic parasitic amoebozoan, part of the genus Entamoeba. Predominantly infecting humans and other primates causing amoebiasis, E.","u":"https://en.wikipedia.org/wiki/Entamoeba_histolytica","i":"img/5759.jpg"},"5755":{"n":"Acanthamoeba","s":"Acanthamoeba castellanii","p":"554915","x":"Acanthamoeba is a genus of amoebae that are commonly recovered from soil, fresh water, and other habitats. The genus Acanthamoeba has two stages in its life cycle, the metabolically active trophozoite stage and a dormant, stress-resistant cyst stage.","u":"https://en.wikipedia.org/wiki/Acanthamoeba","si":"Acanthamoeba","i":"img/5755.jpg"},"44689":{"n":"social amoeba","s":"Dictyostelium discoideum","p":"142796","x":"Dictyostelium discoideum is a species of soil-dwelling amoeba belonging to the phylum Amoebozoa, infraphylum Mycetozoa. It is one of a number of distantly related spore-forming species collectively referred to as the slime molds, due to the presence of both single-celled and multicellular forms at different stages in…","u":"https://en.wikipedia.org/wiki/Dictyostelium_discoideum","i":"img/44689.jpg"},"5791":{"n":"slime mold","s":"Badhamia polycephala","p":"142796","x":"Physarum polycephalum, an acellular slime mold, or myxomycete, is an amoeba with diverse cellular forms and broad geographic distribution. The \"acellular\" moniker derives from the plasmodial stage of the life cycle: the plasmodium is a bright yellow macroscopic multinucleate coenocyte shaped in a network of interlaced…","u":"https://en.wikipedia.org/wiki/Physarum_polycephalum","i":"img/5791.jpg"},"5775":{"n":"Amoeba proteus","s":"Amoeba proteus","p":"554915","x":"Amoeba proteus is a large species of amoeba closely related to another genus of giant amoebae, Chaos. As such, the species is sometimes given the alternative scientific name Chaos diffluens.","u":"https://en.wikipedia.org/wiki/Amoeba_proteus","i":"img/5775.jpg"},"81824":{"n":"choanoflagellate","s":"Monosiga brevicollis","p":"81529","x":"Choanoflagellates are a group of free-living unicellular and colonial flagellate eukaryotes considered to be the closest living relatives of animals. The name refers to the characteristic funnel-shaped \"collar\" of interconnected microvilli and the presence of a flagellum.","u":"https://en.wikipedia.org/wiki/Choanoflagellate","si":"Choanoflagellate","i":"img/81824.jpg"},"946362":{"n":"Salpingoeca","s":"Salpingoeca rosetta","p":"81529","x":"Salpingoeca rosetta is a species of choanoflagellate in the family Salpingoecidae. It is a rare marine eukaryote consisting of a number of cells embedded in a jelly-like matrix.","u":"https://en.wikipedia.org/wiki/Salpingoeca_rosetta","i":"img/946362.jpg"},"192875":{"n":"Capsaspora","s":"Capsaspora owczarzaki","p":"33154","x":"Capsaspora is a monotypic genus of protists containing the single species Capsaspora owczarzaki. C.","u":"https://en.wikipedia.org/wiki/Capsaspora","i":"img/192875.jpg"},"2788":{"n":"nori","s":"Pyropia yezoensis","p":"2797","x":"Neopyropia is a disputed genus of foliose red algae of the family Bangiaceae described in 2020.","u":"https://en.wikipedia.org/wiki/Neopyropia","i":"img/2788.jpg"},"2769":{"n":"Irish moss","s":"Chondrus crispus","p":"2763","x":"Chondrus crispus—commonly called Irish moss or carrageenan moss —is a species of red algae which grows abundantly along the rocky parts of the Atlantic coasts of Europe and North America. In its fresh condition it is soft and cartilaginous, varying in color from a greenish-yellow, through red, to a dark purple or…","u":"https://en.wikipedia.org/wiki/Chondrus_crispus","i":"img/2769.jpg"},"130081":{"n":"Galdieria","s":"Galdieria sulphuraria","p":"2797","x":"Galdieria sulphuraria is an extremophilic unicellular species of red algae. It is the type species of the genus Galdieria.","u":"https://en.wikipedia.org/wiki/Galdieria_sulphuraria","i":"img/130081.jpg"},"45157":{"n":"Cyanidioschyzon","s":"Cyanidioschyzon merolae","p":"2797","x":"Cyanidioschyzon merolae is a small (2μm), club-shaped, unicellular haploid red alga adapted to high sulfur acidic hot spring environments. The cellular architecture of C.","u":"https://en.wikipedia.org/wiki/Cyanidioschyzon","i":"img/45157.jpg"},"2762":{"n":"Cyanophora","s":"Cyanophora paradoxa","p":"2759","x":"Cyanophora paradoxa is a freshwater species of Glaucophyte that is used as a model organism. C.","u":"https://en.wikipedia.org/wiki/Cyanophora_paradoxa","i":"img/2762.jpg"},"3055":{"n":"Chlamydomonas","s":"Chlamydomonas reinhardtii","p":"3042","x":"Chlamydomonas reinhardtii is a single-cell green alga about 10 micrometres in diameter that swims with two flagella. It has a cell wall made of hydroxyproline-rich glycoproteins, a large cup-shaped chloroplast, a large pyrenoid, and an eyespot apparatus that senses light.","u":"https://en.wikipedia.org/wiki/Chlamydomonas_reinhardtii","i":"img/3055.jpg"},"3067":{"n":"Volvox","s":"Volvox carteri","p":"3042","x":"Volvox carteri is a species of colonial green algae in the order Volvocales. It is a freshwater species with a wide distribution.","u":"https://en.wikipedia.org/wiki/Volvox_carteri","i":"img/3067.jpg"},"3077":{"n":"Chlorella","s":"Chlorella vulgaris","p":"2692248","x":"Chlorella vulgaris is a species of green microalga in the division Chlorophyta. This unicellular alga was discovered in 1890 by Martinus Willem Beijerinck as the first microalga with a well-defined nucleus.","u":"https://en.wikipedia.org/wiki/Chlorella_vulgaris","i":"img/3077.jpg"},"2903":{"n":"coccolithophore","s":"Emiliania huxleyi","p":"2759","x":"Gephyrocapsa huxleyi, also called Emiliania huxleyi, is the most abundant species of coccolithophore in modern oceans found in almost all ecosystems from the equator to sub-polar regions, and from nutrient rich upwelling zone <iframe id="f-practice" title="Clade Trainer" srcdoc="&lt;!doctype html&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
&lt;title&gt;Clade Trainer&lt;/title&gt;
&lt;style&gt;
/* Metavita shared look (pasted into every page by build_trainer.py at the THEME marker).
   Frutiger Aero / early Aqua: sky backdrop, frosted-glass panels, glossy gel buttons, sunken input wells.
   Dark is the default; :root[data-theme=&quot;light&quot;] switches. */
:root {
  --sky: radial-gradient(120% 70% at 15% -10%, rgba(70, 200, 190, .22), transparent 60%),
         radial-gradient(90% 60% at 100% 0%, rgba(60, 120, 220, .20), transparent 55%),
         linear-gradient(180deg, #0d2b38 0%, #0a1d26 45%, #08161b 100%);
  --halo: #0b1f27;                         /* text outline on the tree, matches the backdrop */
  --ink: #e6f2f5; --muted: #8eaeb8; --line: rgba(150, 205, 220, .20);
  --glass: rgba(18, 40, 50, .66); --glass-solid: #13303b; --glass-hi: rgba(255, 255, 255, .10); --glass-edge: rgba(140, 215, 230, .26);
  --shadow: 0 10px 28px rgba(0, 0, 0, .45);
  --well: rgba(0, 0, 0, .32); --well-edge: rgba(140, 205, 220, .30);
  --btn: linear-gradient(180deg, rgba(255,255,255,.17) 0%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.02) 51%, rgba(255,255,255,.07) 100%);
  --btn-edge: rgba(150, 210, 225, .32); --btn-ink: #e6f2f5; --btn-emboss: 0 -1px 0 rgba(0, 0, 0, .45);
  --go: #43c364; --go-ink: #fff; --go-edge: #1c7a37;
  --sel: #3ba4f5; --sel-edge: #1f6fb4;
  --accent: #5bd27a;                       /* highlighted path, links */
  --gold: #f1b94b; --gold-wash: rgba(241, 185, 75, .16); --bad: #ff8a78;
  --row: rgba(255, 255, 255, .06);        /* hover / zebra */
  --edge: rgba(150, 200, 210, .38);       /* tree branches */
  --node-top: #2f5361; --node-bot: #1c3a46; /* glossy node fill */
  color-scheme: dark;
}
:root[data-theme=&quot;light&quot;] {
  --sky: radial-gradient(120% 70% at 15% -10%, rgba(255, 255, 255, .85), transparent 60%),
         radial-gradient(80% 50% at 100% 100%, rgba(140, 215, 120, .35), transparent 60%),
         linear-gradient(180deg, #a9d8f7 0%, #d6eefc 42%, #eef8f4 78%, #ddf1d2 100%);
  --halo: #e3f2fb;
  --ink: #0f2530; --muted: #4a6672; --line: rgba(25, 75, 105, .18);
  --glass: rgba(255, 255, 255, .62); --glass-solid: #f4fafd; --glass-hi: rgba(255, 255, 255, .95); --glass-edge: rgba(40, 95, 125, .26);
  --shadow: 0 8px 22px rgba(30, 75, 105, .18);
  --well: #fff; --well-edge: rgba(45, 95, 125, .38);
  --btn: linear-gradient(180deg, #ffffff 0%, #f1f6f9 50%, #dfe9ef 51%, #eef4f8 100%);
  --btn-edge: rgba(40, 85, 110, .38); --btn-ink: #13303c; --btn-emboss: 0 1px 0 rgba(255, 255, 255, .8);
  --go: #2fa64f; --go-edge: #1b6e33;
  --sel: #2b8de0; --sel-edge: #1b65a8;
  --accent: #23964a;
  --gold: #c7860f; --gold-wash: rgba(220, 160, 40, .16); --bad: #b8382a;
  --row: rgba(30, 90, 130, .07);
  --edge: rgba(40, 90, 115, .40);
  --node-top: #ffffff; --node-bot: #e2ecf2;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: #0a1d26; }
:root[data-theme=&quot;light&quot;] { background: #cde8f8; }
body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--sky); background-attachment: fixed;
  font: 14px/1.45 &quot;Lucida Grande&quot;, &quot;Segoe UI&quot;, &quot;Frutiger&quot;, &quot;Myriad Pro&quot;, -apple-system, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }

/* frosted glass surface */
.glass { background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 8px;
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); }

/* glossy buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 13px;
  font: inherit; font-size: 13px; font-weight: 600; color: var(--btn-ink); text-decoration: none; text-shadow: var(--btn-emboss);
  background: var(--btn); border: 1px solid var(--btn-edge); border-radius: 6px; cursor: pointer; white-space: nowrap;
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 1px 2px rgba(0, 0, 0, .18); }
.btn:hover { filter: brightness(1.07); }
.btn:active { filter: brightness(.94); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .3); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.go { color: var(--go-ink, #fff); text-shadow: 0 -1px 0 rgba(0, 50, 15, .45); border-color: var(--go-edge);
  background: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.18) 50%, rgba(255,255,255,0) 51%, rgba(255,255,255,.14) 100%), var(--go);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 1px 3px rgba(0, 60, 20, .35); }
.btn:focus-visible, .seg button:focus-visible, summary:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--sel) 45%, transparent); }

/* Aqua segmented control: joined buttons, the chosen one is a blue gel */
.seg { display: inline-flex; border: 1px solid var(--btn-edge); border-radius: 6px; overflow: hidden; background: var(--btn);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 1px 2px rgba(0, 0, 0, .18); flex: none; }
.seg button { height: 28px; min-width: 30px; padding: 0 11px; border: 0; border-left: 1px solid var(--btn-edge); background: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  font: inherit; font-size: 12.5px; font-weight: 600; color: var(--btn-ink); text-shadow: var(--btn-emboss); cursor: pointer; white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button:hover { background: var(--row); }
.seg button.on { color: #fff; text-shadow: 0 -1px 0 rgba(0, 30, 70, .45);
  background: linear-gradient(180deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,.15) 50%, rgba(255,255,255,0) 51%, rgba(255,255,255,.12) 100%), var(--sel);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .25); }

/* sunken input wells */
.well, input[type=&quot;text&quot;], input:not([type]), select {
  font: inherit; color: var(--ink); background: var(--well); border: 1px solid var(--well-edge); border-radius: 4px;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, .22); }
input:not([type]):focus, input[type=&quot;text&quot;]:focus, select:focus { outline: none; border-color: var(--sel);
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, .22), 0 0 0 3px color-mix(in srgb, var(--sel) 38%, transparent); }
input::placeholder { color: var(--muted); opacity: .85; }
input[type=&quot;checkbox&quot;], input[type=&quot;range&quot;] { accent-color: var(--sel); }
kbd { font: 11px/1.4 ui-monospace, Menlo, monospace; color: var(--muted); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--row); }

/* autocomplete list */
.drop { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; margin-top: 3px; padding: 3px; display: none;
  max-height: 300px; overflow-y: auto; background: var(--glass-solid); border: 1px solid var(--glass-edge); border-radius: 6px; box-shadow: var(--shadow); }
.drop.open { display: block; }
.drop div { padding: 5px 9px; border-radius: 4px; cursor: pointer; }
.drop div small { color: var(--muted); margin-left: 6px; font-style: italic; }
.drop div.hi { color: #fff; background: linear-gradient(180deg, color-mix(in srgb, var(--sel) 80%, #fff), var(--sel)); }
.drop div.hi small { color: rgba(255, 255, 255, .8); }

/* scrollbars stay quiet */
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

/* ---------- info window (infowin.js): column on either side, or a floating window ---------- */
#info { position: fixed; z-index: 30; display: none; flex-direction: column; overflow: hidden; }
#info.show { display: flex; }
#info .grip, #info .scroll { zoom: var(--pz, 1); }
#info .scroll { overflow-y: auto; flex: 1; min-height: 0; padding: 10px 14px 16px; }
#info.docked { border-radius: 0; }
#info.docked.right { border-width: 0 0 0 1px; }
#info.docked.left { border-width: 0 1px 0 0; }
#info.docked.short { border-bottom-width: 1px; }
#info.docked.right.short { border-bottom-left-radius: 8px; }
#info.docked.left.short { border-bottom-right-radius: 8px; }
#info.float { max-height: min(78vh, 680px); }
#info.busy { user-select: none; }
@media (max-width: 640px) { #info.docked { top: auto !important; left: 0 !important; right: 0 !important; bottom: 0 !important; width: 100% !important; height: 46vh !important; border-width: 1px 0 0 0; border-radius: 8px 8px 0 0; } }
#info .grip { display: flex; align-items: center; gap: 6px; padding: 7px 8px 7px 14px; cursor: move; touch-action: none; user-select: none;
  background: var(--btn); border-bottom: 1px solid var(--btn-edge); flex: none; }
#info .grip h2 { flex: 1; margin: 0; font-size: 15px; font-weight: 700; text-shadow: var(--btn-emboss); }
#info .grip button { width: 22px; height: 20px; padding: 0; border: 1px solid var(--btn-edge); border-radius: 4px; background: var(--btn);
  color: var(--btn-ink); font-size: 13px; line-height: 1; cursor: pointer; box-shadow: inset 0 1px 0 var(--glass-hi); }
#info .grip button:hover { filter: brightness(1.1); }
#info.docked .grip .dk { display: none; }
/* resize handles */
#info .rz { position: absolute; touch-action: none; z-index: 2; }
#info .rz-e { top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
#info.right .rz-e { left: 0; } #info.left .rz-e { right: 0; }
#info .rz-b { left: 0; right: 0; bottom: 0; height: 7px; cursor: ns-resize; }
#info .rz-bl, #info .rz-br { bottom: 0; width: 16px; height: 16px; }
#info .rz-bl { left: 0; cursor: nesw-resize; } #info .rz-br { right: 0; cursor: nwse-resize; }
#info.right .rz-e:hover, #info.right .rz-e:active { background: linear-gradient(90deg, var(--sel) 0 2px, transparent 2px); }
#info.left .rz-e:hover, #info.left .rz-e:active { background: linear-gradient(270deg, var(--sel) 0 2px, transparent 2px); }
#info .rz-b:hover, #info .rz-b:active { background: linear-gradient(0deg, var(--sel) 0 2px, transparent 2px); }
#info .rz-bl::after, #info .rz-br::after { content: &#x27;&#x27;; position: absolute; inset: 3px; opacity: .7;
  background: linear-gradient(135deg, transparent 50%, var(--muted) 50%, var(--muted) 58%, transparent 58%, transparent 72%, var(--muted) 72%, var(--muted) 80%, transparent 80%); }
#info .rz-bl::after { transform: scaleX(-1); }
#info.float .rz-e, #info.float .rz-b, #info.docked .rz-bl, #info.docked .rz-br { display: none; }
@media (max-width: 640px) { #info.docked .rz { display: none; } }
/* Aero-style snap preview while dragging the window to a side */
.snap-ghost { position: fixed; z-index: 29; bottom: 0; display: none; pointer-events: none; border: 2px solid color-mix(in srgb, var(--sel) 70%, #fff);
  background: color-mix(in srgb, var(--sel) 18%, transparent); box-shadow: inset 0 0 30px color-mix(in srgb, var(--sel) 35%, transparent);
  backdrop-filter: blur(2px); border-radius: 6px; }
.snap-ghost.on { display: block; } .snap-ghost.left { left: 4px; } .snap-ghost.right { right: 4px; }
/* contents */
#info .meta { color: var(--muted); font-size: 12.5px; margin: 0 0 6px; }
#info .crumb { font-size: 12px; color: var(--muted); margin-top: 8px; }
#info .crumb a { color: var(--muted); cursor: pointer; text-decoration: underline dotted; }
#info .crumb a:hover { color: var(--accent); }
#info .ex { font-size: 13px; margin-top: 6px; }
#info .wk { display: flow-root; margin-top: 8px; }  /* text wraps around the floated picture */
#info .wk img { float: left; margin: 3px 12px 6px 0; width: 130px; max-width: 40%; background: #fff; padding: 3px; border: 1px solid var(--well-edge); border-radius: 3px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
#info .ety { font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
#info .ety b { color: var(--ink); }
#info .ety .pie { font-size: 12px; opacity: .8; margin-top: 2px; }
#info .sum { font-size: 13px; }
#info .sum a { font-size: 12.5px; }
#info .si { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 4px; }
@media (max-width: 520px) { #info .wk img { float: none; display: block; margin: 0 0 8px; width: 100%; max-width: 100%; max-height: 180px; object-fit: cover; } }

main { max-width: calc(980px + var(--dock-l, 0px) + var(--dock-r, 0px)); margin: 0 auto; padding: 14px calc(16px + var(--dock-r, 0px)) 28px calc(16px + var(--dock-l, 0px)); }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.2px; text-shadow: var(--btn-emboss); }
.embedded header h1, .embedded .tree-link { display: none; }
.bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 7px 8px 7px 12px; margin-bottom: 10px; }
.setline { flex: 1; min-width: 200px; color: var(--muted); font-size: 13px; }
.setline b { color: var(--ink); font-weight: 600; }
.panel { padding: 12px 14px; }
#setup { display: none; margin-bottom: 10px; padding: 4px 14px 12px; }
#setup.open { display: block; }
.sect { border-bottom: 1px solid var(--line); }
.sect summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 10px 0; user-select: none; }
.sect summary::-webkit-details-marker { display: none; }
.sect summary::before { content: &#x27;&#x27;; width: 0; height: 0; border-style: solid; border-width: 5px 0 5px 7px; border-color: transparent transparent transparent var(--muted);
  transition: transform .15s; flex: none; }
.sect[open] summary::before { transform: rotate(90deg); }
.sect summary b { font-size: 13px; }
.sect .dsum { margin-left: auto; color: var(--muted); font-size: 12px; }
.sect .body { padding: 0 0 12px; }
.dtools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.dtools .note { color: var(--muted); font-size: 12px; margin-left: 4px; }
.dtools .btn, .presets .btn { height: 24px; padding: 0 9px; font-size: 12px; }
.dgrid { columns: 2 280px; column-gap: 20px; padding: 8px 10px; }
.dsec { break-inside: avoid; margin-bottom: 6px; }
.dsec label { display: flex; align-items: baseline; gap: 7px; font-size: 13px; padding: 2px 4px; border-radius: 3px; cursor: pointer; }
.dsec label:hover { background: var(--row); }
.dsec &gt; label { font-weight: 700; }
.dsec .sub { padding-left: 24px; }
.dsec label small { color: var(--muted); margin-left: auto; padding-left: 8px; font-variant-numeric: tabular-nums; }
.dsec input { margin: 0; transform: translateY(1px); }
.setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 680px) { .setup-grid { grid-template-columns: 1fr; } }
.setup-grid h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; min-height: 26px; margin-bottom: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 2px 0 9px; border-radius: 4px; font-size: 13px; font-weight: 600;
  color: #fff; text-shadow: 0 -1px 0 rgba(0,0,0,.3); border: 1px solid var(--sel-edge);
  background: linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0) 55%), var(--sel); }
.chip.out { border-color: #8a5a07; background: linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0) 55%), var(--gold); }
.chip small { opacity: .8; font-weight: 400; }
.chip button { border: 0; background: none; color: inherit; cursor: pointer; font-size: 14px; padding: 0 5px; opacity: .8; }
.chip button:hover { opacity: 1; }
.empty { color: var(--muted); font-size: 13px; padding: 3px 0; }
.presets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.search { position: relative; }
.search input { width: 100%; height: 30px; padding: 0 9px; }
.setup-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 12px; font-size: 13px; }
.setup-foot select { height: 26px; padding: 0 4px; margin-left: 4px; }
.status { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.where { font-size: 12.5px; color: var(--muted); }
.where b { display: block; font-size: 22px; line-height: 1.2; color: var(--ink); letter-spacing: -.3px; }
.lives { display: flex; gap: 3px; flex-wrap: wrap; max-width: 330px; justify-content: flex-end; }
.lives i { width: 11px; height: 11px; border-radius: 50%; display: block;
  background: radial-gradient(circle at 35% 30%, #fff 0 8%, transparent 35%), radial-gradient(circle at 50% 70%, color-mix(in srgb, var(--go) 70%, #fff), var(--go) 70%);
  box-shadow: 0 1px 1px rgba(0,0,0,.3); }
.lives i.used { background: var(--well); box-shadow: inset 0 1px 2px rgba(0,0,0,.35); }
.lives-text { font-size: 12px; color: var(--muted); text-align: right; margin-top: 4px; }
.guess { display: flex; gap: 6px; margin-bottom: 10px; }
.guess .search { flex: 1; }
.guess .search input { height: 32px; font-size: 14px; }
.guess .btn { height: 32px; }
.tree-wrap { overflow-x: auto; padding: 10px 0; border-radius: 6px; background: var(--well); border: 1px solid var(--well-edge); box-shadow: inset 0 2px 6px rgba(0,0,0,.2); }
svg { display: block; margin: 0 auto; }
svg .edge { stroke: var(--edge); stroke-width: 1.6; fill: none; }
svg .edge.on { stroke: var(--accent); stroke-width: 2.6; }
svg .nb { fill: url(#gGlass); stroke: var(--btn-edge); stroke-width: 1; }
svg .nb.on { fill: url(#gGreenSoft); stroke: var(--go-edge); }
svg .nb.front { fill: url(#gGreen); stroke: var(--go-edge); }
svg .nb.close { stroke: var(--gold); stroke-width: 2; }
svg .nb.ans { fill: url(#gGold); stroke: #8a5a07; }
svg .nb.q { fill: none; stroke: var(--accent); stroke-dasharray: 4 3; stroke-width: 1.6; }
svg text { fill: var(--ink); font-size: 13px; dominant-baseline: central; text-anchor: middle; pointer-events: none; }
svg text.front { fill: #fff; font-weight: 700; }
svg text.clade { font-weight: 700; }
svg text.q { fill: var(--accent); font-weight: 700; }
svg g.n { cursor: pointer; }
svg g.n:hover rect { filter: brightness(1.12); }
#tip { min-height: 22px; font-size: 13px; color: var(--muted); margin: 8px 2px 0; }
#tip b { color: var(--ink); }
.log { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1px; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.log:empty { display: none; }
.log div { padding: 5px 10px; font-size: 13px; background: var(--row); }
.log div span { color: var(--muted); }
.end { display: none; margin-bottom: 10px; text-align: center; padding: 16px; }
.end.show { display: block; }
.end h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.2px; }
.end .lin { color: var(--muted); font-size: 12px; margin: 6px 0 12px; }
.end .btns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.stats { color: var(--muted); font-size: 12px; text-align: center; margin-top: 14px; }

&lt;body&gt;
&lt;main&gt;
  &lt;header&gt;

        &lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;

        &lt;div class=&quot;search&quot;&gt;&lt;input id=&quot;outSearch&quot; placeholder=&quot;Skip a clade you already know&quot; autocomplete=&quot;off&quot;&gt;&lt;div class=&quot;drop&quot; id=&quot;outDrop&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;/details&gt;

      &lt;button class=&quot;btn go&quot; id=&quot;startBtn&quot;&gt;Start&lt;/button&gt;

      &lt;div class=&quot;where&quot; id=&quot;where&quot;&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;&lt;/div&gt;&lt;div class=&quot;lives-text&quot; id=&quot;livesText&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;guess&quot;&gt;
      &lt;div class=&quot;search&quot;&gt;&lt;input id=&quot;guessIn&quot; placeholder=&quot;Guess an animal…&quot; autocomplete=&quot;off&quot;&gt;&lt;div class=&quot;drop&quot; id=&quot;guessDrop&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;button class=&quot;btn&quot; id=&quot;hintBtn&quot; title=&quot;Reveal the next clade on the answer&#x27;s path (costs one guess)&quot;&gt;Hint&lt;/button&gt;
