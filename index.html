os<\/i>) \"simple\" + <b>γυνή<\/b> (<i>gunḗ<\/i>) \"woman\": for the female's simpler genitalia (in contrast to Entelegynae). <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"8416":{"p":"41666","n":"Neobatrachia","r":"suborder","d":"Suborder of amphibians","x":"The Neobatrachia are a suborder of the Anura, the order of frogs and toads.","u":"https://en.wikipedia.org/wiki/Neobatrachia","i":"img/8416.jpg","e":"Greek <b>νεο-<\/b> (<i>neo-<\/i>) \"new\" + <b>βάτραχος<\/b> (<i>bátrachos<\/i>) \"frog\": the \"new frogs,\" the most derived frog lineage."},"7434":{"p":"33392","n":"Aculeata","r":"infraorder","d":"Infraorder of insects","x":"Aculeata is an infraorder of Hymenoptera containing ants, bees, and stinging wasps. The name is a reference to the defining feature of the group, which is the modification of the ovipositor into a stinger.","u":"https://en.wikipedia.org/wiki/Aculeata","i":"img/7434.jpg","e":"Latin <b>aculeātus<\/b> \"barbed, stinging\": bees, ants and wasps."},"70987":{"p":"7434","n":"Apinae","r":"subfamily","d":"Subfamily of bees in the family Apidae","x":"The Apinae are the subfamily that includes the majority of bees in the family Apidae. It includes the familiar \"corbiculate\" bees—bumblebees, honey bees, orchid bees, stingless bees, and the extinct genus Euglossopteryx.","u":"https://en.wikipedia.org/wiki/Apinae","i":"img/70987.jpg","e":"Latin <b>apis<\/b> \"bee\" + <b>-inae<\/b> \"subfamily\": honey bees and bumble bees."},"34984":{"p":"34979","n":"Pythonidae","r":"family","d":"Family of snakes","x":"The Pythonidae, commonly known as pythons, are a family of non-venomous snakes found in Africa, Asia, and Australia. Among its members are some of the largest snakes in the world.","u":"https://en.wikipedia.org/wiki/Pythonidae","i":"img/34984.jpg","e":"<b>Python<\/b>, after Greek <b>Πύθων<\/b> (<i>Pýthōn<\/i>), the serpent Apollo killed at Delphi + <b>-idae<\/b> \"family\". <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"175121":{"p":"9126","n":"Passeroidea","r":"superfamily","d":"Superfamily of birds","x":"Passeroidea is a superfamily of birds within the parvorder Passerida, which is within Passeriformes. It includes, but is not limited to, cardinals and allies and Old World sparrows as well as many other families of birds.","u":"https://en.wikipedia.org/wiki/Passeroidea","e":"Latin <b>Passer<\/b> \"sparrow\" + <b>-oidea<\/b> \"superfamily\": sparrows, finches and their kin."},"9133":{"p":"175121","n":"Fringillidae","r":"family","d":"Family of birds","x":"The true finches are small to medium-sized passerine birds in the family Fringillidae. Finches generally have stout conical bills adapted for eating seeds and nuts and often have colourful plumage.","u":"https://en.wikipedia.org/wiki/Finch","i":"img/9133.jpg","e":"Latin <b>fringilla<\/b> \"finch\" + <b>-idae<\/b> \"family\": the true finches."},"9479":{"p":"314293","n":"Platyrrhini","r":"parvorder","d":"Parvorder of mammals","x":"New World monkeys are the five families of primates that are found in the tropical regions of Mexico, Central and South America: Callitrichidae, Cebidae, Aotidae, Pitheciidae, and Atelidae. The five families are ranked together as the Ceboidea, the only extant superfamily in the parvorder Platyrrhini.","u":"https://en.wikipedia.org/wiki/New_World_monkey","i":"img/9479.jpg","e":"Greek <b>πλατύς<\/b> (<i>platús<\/i>) \"broad, flat\" + <b>ῥίς, ῥινός<\/b> (<i>rhís, rhinós<\/i>) \"nose\": broad noses with sideways-facing nostrils."},"9498":{"p":"9479","n":"Cebidae","r":"family","d":"Family of New World monkeys","x":"The Cebidae are one of the five families of New World monkeys now recognised. Extant members are the capuchin and squirrel monkeys.","u":"https://en.wikipedia.org/wiki/Cebidae","i":"img/9498.jpg","e":"<b>Cebus<\/b>, the capuchin genus, from Greek <b>κῆβος<\/b> (<i>kêbos<\/i>) \"long-tailed monkey\" + <b>-idae<\/b> \"family\". <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"33550":{"p":"9989","n":"Hystricomorpha","r":"suborder","d":"Suborder of rodents","x":"Hystricomorpha is a term referring to families and orders of rodents which has had many definitions throughout its history. In the broadest sense, it refers to any rodent with a hystricomorphous zygomasseteric system.","u":"https://en.wikipedia.org/wiki/Hystricomorpha","i":"img/33550.jpg","e":"Greek <b>ὕστριξ<\/b> (<i>hústrix<\/i>) \"porcupine\" + <b>μορφή<\/b> (<i>morphḗ<\/i>) \"form\": porcupine-shaped rodents."},"9850":{"p":"35500","n":"Cervidae","r":"family","d":"Family of hoofed mammals","x":"A deer or true deer is a hoofed ruminant ungulate of the family Cervidae. Cervidae is divided into subfamilies Cervinae and Capreolinae.","u":"https://en.wikipedia.org/wiki/Deer","i":"img/9850.jpg","e":"Latin <b>cervus<\/b> \"stag, deer\" + <b>-idae<\/b> \"family\": the deer family."},"9881":{"p":"9850","n":"Odocoileinae","r":"subfamily","d":"Subfamily of mammals","x":"The Capreolinae are a subfamily of deer. The scientific name derives from its type genus, Capreolus.","u":"https://en.wikipedia.org/wiki/Capreolinae","i":"img/9881.jpg","e":"<b>Odocoileus<\/b>, the white-tailed deer genus, from Greek <b>ὀδούς<\/b> (<i>odoús<\/i>) \"tooth\" + <b>κοῖλος<\/b> (<i>koîlos<\/i>) \"hollow\" + <b>-inae<\/b> \"subfamily\". Also called Capreolinae. <i style=\"opacity:.7\">(from the roots of the name)<\/i>","ep":"PIE <b><i>*h₃dónts<\/i><\/b> → English <b>tooth<\/b>"},"186634":{"p":"186625","n":"Otomorpha","r":"cohort","d":"Clade of ray-finned fishes","x":"Otocephala is a clade of ray-finned fishes within the infraclass Teleostei which evolved some 230 million years ago. It is named for the presence of a hearing (otophysic) link from the swimbladder to the inner ear.","u":"https://en.wikipedia.org/wiki/Otocephala","i":"img/186634.jpg","e":"Greek <b>οὖς, ὠτός<\/b> (<i>oûs, ōtós<\/i>) \"ear\" + <b>μορφή<\/b> (<i>morphḗ<\/i>) \"form\". <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"186626":{"p":"186634","n":"Otophysi","r":"clade","d":"Superorder of fishes","x":"Ostariophysi is the second-largest superorder of fish. Members of this superorder are called ostariophysians.","u":"https://en.wikipedia.org/wiki/Ostariophysi","i":"img/186626.jpg","e":"Greek <b>οὖς, ὠτός<\/b> (<i>oûs, ōtós<\/i>) \"ear\" + <b>φῦσα<\/b> (<i>phûsa<\/i>) \"bladder\": ear and swim bladder, which these fish link with a chain of small bones. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"30727":{"p":"186626","n":"Cyprinoidei","r":"suborder","d":"Suborder of fishes","x":"Cyprinoidei is a suborder, or superfamily, of primarily pelagic, freshwater ray-finned fishes nestled within the larger order Cypriniformes. Many fishes in this group include the carps, danionins, and minnows, and are readily found and raised in aquaculture owing to their hardiness and tolerance of extreme water…","u":"https://en.wikipedia.org/wiki/Cyprinoidei","i":"img/30727.jpg","e":"<b>Cyprinus<\/b>, from Greek <b>κυπρῖνος<\/b> (<i>kuprînos<\/i>) \"carp\" + <b>-oidei<\/b> \"suborder\": carps and minnows. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2743694":{"p":"30727","n":"Cyprininae","r":"subfamily","d":"Subfamily of fishes","x":"Cyprininae is a subfamily of largely freshwater ray-finned fishes, one of ten subfamilies belonging to the family Cyprinidae. This family comprises the carps, goldfishes, barbs and related genera.","u":"https://en.wikipedia.org/wiki/Cyprininae","i":"img/2743694.jpg","e":"<b>Cyprinus<\/b> \"carp\" + <b>-inae<\/b> \"subfamily\": carp and goldfish."},"36668":{"p":"7434","n":"Formicidae","r":"family","d":"Family of insects","x":"Ants are eusocial insects of the family Formicidae and, along with the related wasps and bees, belong to the order Hymenoptera. Ants evolved from vespoid wasp ancestors in the Cretaceous period.","u":"https://en.wikipedia.org/wiki/Ant","i":"img/36668.jpg","e":"Latin <b>formīca<\/b> \"ant\" + <b>-idae<\/b> \"family\": the ants. Greek <b>μύρμηξ<\/b> (<i>mýrmēx<\/i>) gives us <b>myrmecology<\/b>, the study of ants."},"8783":{"p":"8782","n":"Palaeognathae","r":"superorder","d":"Infraclass of birds","x":"Palaeognathae is an infraclass of birds, called paleognaths or palaeognaths. It is one of the two infraclasses of birds, the other being Neognathae, both of which form Neornithes.","u":"https://en.wikipedia.org/wiki/Palaeognathae","i":"img/8783.jpg","e":"Greek <b>παλαιός<\/b> (<i>palaiós<\/i>) \"old\" + <b>γνάθος<\/b> (<i>gnáthos<\/i>) \"jaw\": \"old jaws,\" for a palate once thought more primitive: ostriches, emus and kin."},"8784":{"p":"8783","n":"Casuariiformes","r":"order","d":"Order of birds","x":"The Casuariiformes is an order of large flightless birds that has four surviving members: the three species of cassowary, and the only remaining species of emu. All four are placed in a single family, Casuariidae.","u":"https://en.wikipedia.org/wiki/Casuariiformes","i":"img/8784.jpg","e":"<b>Casuarius<\/b>, the cassowary genus + <b>-iformes<\/b> \"shaped\": cassowaries and emus."},"186628":{"p":"186626","n":"Characiphysae","r":"superorder","d":"Superorder of fishes","x":"Ostariophysi is the second-largest superorder of fish. Members of this superorder are called ostariophysians.","u":"https://en.wikipedia.org/wiki/Ostariophysi","i":"img/186628.jpg","e":"<b>Charax<\/b>, the characin genus + Greek <b>φῦσα<\/b> (<i>phûsa<\/i>) \"bladder\": catfish, piranhas and electric eels. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"9903":{"p":"27592","n":"Bos","r":"genus","d":"Genus of wild and domestic cattle","x":"Bos is a genus of bovines, which includes, among others, wild and domestic cattle.","u":"https://en.wikipedia.org/wiki/Bos","i":"img/9903.jpg","e":"Latin <b>bōs<\/b> \"cow, ox, bull.\""},"8511":{"p":"1329911","n":"Iguania","r":"suborder","d":"Suborder of lizards","x":"Iguania is a suborder of squamate reptiles that includes iguanas, chameleons, agamids, and New World lizards. Using morphological features as a guide to evolutionary relationships, the Iguania are believed to form the sister group to the Squamata, which comprise nearly 11,000 named species, roughly 2000 of which are…","u":"https://en.wikipedia.org/wiki/Iguania","i":"img/8511.jpg","e":"<b>Iguana<\/b> + <b>-ia<\/b>: iguanas and their kin, chameleons included."},"1549675":{"p":"8825","n":"Galloanserae","r":"superorder","d":"Superorder of birds","x":"Fowl are birds belonging to one of two biological orders, namely the gamefowl or landfowl (Galliformes) and the waterfowl (Anseriformes). Anatomical and molecular similarities suggest these two groups are close evolutionary relatives; together, they form the fowl clade which is scientifically known as Galloanserae or…","u":"https://en.wikipedia.org/wiki/Fowl","i":"img/1549675.jpg","e":"Latin <b>gallus<\/b> \"rooster\" + <b>ānser<\/b> \"goose\": literally \"chicken-geese.\""},"9005":{"p":"1549675","n":"Phasianidae","r":"family","d":"Family of birds","x":"Phasianidae is a family of heavy-bodied, ground-living birds that includes junglefowls, pheasants, grouse, partridges, turkeys, Old World quail and peafowl, with 185 extant species divided into 54 genera. It was formerly broken up into two subfamilies, the Phasianinae and the Perdicinae, but this arrangement is now…","u":"https://en.wikipedia.org/wiki/Phasianidae","i":"img/9005.jpg","e":"<b>Phasianus<\/b> \"pheasant\" ← Greek <b>φασιανός<\/b> (<i>phāsiānós<\/i>) \"bird of the Phasis,\" a river in Colchis (modern Georgia) + <b>-idae<\/b> \"family\"."},"9072":{"p":"9005","n":"Phasianinae","r":"subfamily","d":"Subfamily of birds","x":"The Phasianinae are a subfamily under the family Phasianidae of the order Galliformes. This subfamily notably includes the true pheasants, tragopans, tetraonids, Coturnicini, Pavonini, amongst other members.","u":"https://en.wikipedia.org/wiki/Phasianinae","i":"img/9072.jpg","e":"<b>Phasianus<\/b> \"pheasant\" + <b>-inae<\/b> \"subfamily\": pheasants, chickens and peafowl."},"55153":{"p":"9989","n":"Sciuridae","r":"family","d":"Family of rodents","x":"Squirrels are members of the family Sciuridae, a family that includes small or medium-sized rodents. The squirrel family includes tree squirrels, ground squirrels, and flying squirrels.","u":"https://en.wikipedia.org/wiki/Squirrel","i":"img/55153.jpg","e":"Latin <b>sciūrus<\/b> \"squirrel\" ← Greek <b>σκίουρος<\/b> (<i>skíouros<\/i>), \"shadow-tail\" + <b>-idae<\/b> \"family\". English <b>squirrel<\/b> comes from the same word."},"337730":{"p":"55153","n":"Marmotini","r":"tribe","d":"Type of ground-dwelling rodent","x":"Ground squirrels are rodents of the squirrel family (Sciuridae) that generally live on the ground or in burrows, rather than in trees like the tree squirrels. The term is most often used for the medium-sized ground squirrels, as the larger ones are more commonly known as marmots or prairie dogs, while the smaller and…","u":"https://en.wikipedia.org/wiki/Ground_squirrel","i":"img/337730.jpg","e":"<b>Marmota<\/b>, the marmot genus + <b>-ini<\/b> \"tribe\": marmots, prairie dogs and chipmunks."},"6340":{"p":"1206795","n":"Annelida","r":"phylum","d":"Phylum of segmented worms","x":"Annelids, also known as segmented worms, are animals that comprise the phylum Annelida. The phylum contains over 22,000 extant species, including ragworms, earthworms, and leeches.","u":"https://en.wikipedia.org/wiki/Annelid","i":"img/6340.jpg","e":"Latin <b>ānellus<\/b> \"little ring\": the ringed, segmented worms."},"7524":{"p":"3701061","n":"Hemiptera","r":"order","d":"Order of insects often called true bugs","x":"Hemiptera is an order of insects, commonly called true bugs, comprising more than 100,000 species within groups such as the cicadas, aphids, planthoppers, leafhoppers, assassin bugs, bed bugs, and shield bugs. They range in size from 1 mm (0.04 in) to around 15 cm (6 in), and share a common arrangement of…","u":"https://en.wikipedia.org/wiki/Hemiptera","i":"img/7524.jpg","e":"Greek <b>ἡμι-<\/b> (<i>hēmi-<\/i>) \"half\" + <b>πτερά<\/b> (<i>pterá<\/i>) \"wings\": forewings that are half hardened, half membrane. These are the true bugs."},"1955247":{"p":"7524","n":"Auchenorrhyncha","r":"suborder","d":"Suborder of insects","x":"The Auchenorrhyncha suborder of the Hemiptera contains most of the familiar members of what was called the \"Homoptera\" – groups such as cicadas, leafhoppers, treehoppers, planthoppers, and spittlebugs. The aphids and scale insects are the other well-known \"Homoptera\", and they are in the suborder Sternorrhyncha.","u":"https://en.wikipedia.org/wiki/Auchenorrhyncha","i":"img/1955247.jpg","e":"Greek <b>αὐχήν<\/b> (<i>auchḗn<\/i>) \"neck, throat\" + <b>ῥύγχος<\/b> (<i>rhúnchos<\/i>) \"snout\": cicadas and planthoppers, with the beak at the back of the head."},"1489908":{"p":"1489872","n":"Ovalentaria","r":"clade","d":"Clade of fishes","x":"Ovalentaria is a clade of ray-finned fishes within the Percomorpha, referred to as a subseries. It is made up of a group of fish families which are referred to in Fishes of the World's fifth edition as incertae sedis, as well as the orders Mugiliformes, Cichliformes, and Blenniiformes.","u":"https://en.wikipedia.org/wiki/Ovalentaria","i":"img/1489908.jpg","e":"Latin <b>ōvum<\/b> \"egg\" + <b>lentus<\/b> \"sticky, clinging\". <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"9223":{"p":"3073809","n":"Psittaciformes","r":"order","d":"Order of birds","x":"Parrots, also known as psittacines from the name of the type genus Psittacus, are birds with a strong curved beak, upright stance, and clawed feet. They are classified in four families that contain roughly 410 species in 101 genera, found mostly in tropical and subtropical regions.","u":"https://en.wikipedia.org/wiki/Parrot","i":"img/9223.jpg","e":"Greek <b>ψιττακός<\/b> (<i>psittakós<\/i>) \"parrot,\" of unknown origin + <b>-iformes<\/b> \"shaped\": the parrots."},"35549":{"p":"9223","n":"Cacatuidae","r":"family","d":"Any bird in the family Cacatuidae","x":"A cockatoo is any of the 22 species of parrots belonging to the family Cacatuidae, the only family in the superfamily Cacatuoidea, native to Australasia. Along with the Psittacoidea and Strigopoidea, they make up the order Psittaciformes.","u":"https://en.wikipedia.org/wiki/Cockatoo","i":"img/35549.jpg","e":"<b>Cacatua<\/b>, the cockatoo genus + <b>-idae<\/b> \"family\": the cockatoos."},"33341":{"p":"33340","n":"Polyneoptera","r":"cohort","d":"Group of insects","x":"The cohort Polyneoptera is one of the major groups of winged insects, comprising the Orthoptera and all other neopteran insects believed to be more closely related to Orthoptera than to any other insect orders. They were formerly grouped together with the Palaeoptera and Paraneoptera as the Hemimetabola or…","u":"https://en.wikipedia.org/wiki/Polyneoptera","i":"img/33341.jpg","e":"Greek <b>πολύς<\/b> (<i>polús<\/i>) \"many\" + <b>Neoptera<\/b> \"new wings\": cockroaches, mantises, crickets and stick insects."},"6970":{"p":"33341","n":"Dictyoptera","r":"superorder","d":"Superorder of insects","x":"Dictyoptera is an insect superorder that includes two extant orders of polyneopterous insects: the order Blattodea and the order Mantodea (mantises). All modern Dictyoptera have short ovipositors and typically lay oothecae.","u":"https://en.wikipedia.org/wiki/Dictyoptera","i":"img/6970.jpg","e":"Greek <b>δίκτυον<\/b> (<i>díktuon<\/i>) \"net\" + <b>πτερόν<\/b> (<i>pterón<\/i>) \"wing\": net-winged, the cockroaches, termites and mantises."},"1049657":{"p":"6970","n":"Blattoidea","r":"superfamily","d":"Superfamily of cockroaches and termites","x":"Blattoidea is a superfamily of cockroaches and termites in the order Blattodea. There are about 17 families and more than 4,100 described species in Blattoidea.","u":"https://en.wikipedia.org/wiki/Blattoidea","i":"img/1049657.jpg","e":"Latin <b>blatta<\/b> \"cockroach\" + <b>-oidea<\/b> \"superfamily\": cockroaches and termites. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"72041":{"p":"3701029","n":"Eumalacostraca","r":"subclass","d":"Subclass of crustaceans","x":"Eumalacostraca is a subclass of crustaceans, containing almost all living malacostracans, or about 40,000 described species. The remaining subclasses of crustaceans that are not in Eumalacostraca are the Phyllocarida and possibly the Hoplocarida.","u":"https://en.wikipedia.org/wiki/Eumalacostraca","i":"img/72041.jpg","e":"Greek <b>εὐ-<\/b> (<i>eu-<\/i>) \"true\" + <b>Malacostraca<\/b>, from <b>μαλακός<\/b> (<i>malakós<\/i>) \"soft\" + <b>ὄστρακον<\/b> (<i>óstrakon<\/i>) \"shell\": the true \"soft-shells\". Crabs and lobsters molt into a soft shell."},"3701045":{"p":"72041","n":"Stomatocarida","r":"clade","d":"Subclass of crustaceans","x":"Eumalacostraca is a subclass of crustaceans, containing almost all living malacostracans, or about 40,000 described species. The remaining subclasses of crustaceans that are not in Eumalacostraca are the Phyllocarida and possibly the Hoplocarida.","u":"https://en.wikipedia.org/wiki/Eumalacostraca","i":"img/3701045.jpg","e":"Greek <b>στόμα<\/b> (<i>stóma<\/i>) \"mouth\" + <b>καρίς<\/b> (<i>karís<\/i>) \"shrimp\": mantis shrimp plus crabs, lobsters and krill. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"6683":{"p":"3701045","n":"Decapoda","r":"order","d":"Order of crustaceans","x":"A decapod is a crustacean in the large order of Decapoda within the class Malacostraca, including crabs, lobsters, crayfish, shrimp, and prawns. Most decapods are scavengers.","u":"https://en.wikipedia.org/wiki/Decapod","i":"img/6683.jpg","e":"Greek <b>δέκα<\/b> (<i>déka<\/i>) \"ten\" + <b>πούς<\/b> (<i>poús<\/i>) \"foot\": ten legs.","ep":"PIE <b><i>*déḱm̥<\/i><\/b> → English <b>ten<\/b> · PIE <b><i>*pṓds<\/i><\/b> → English <b>foot<\/b>"},"6692":{"p":"6683","n":"Pleocyemata","r":"suborder","d":"Suborder of crustaceans","x":"Pleocyemata is a suborder of decapod crustaceans, erected by Martin Burkenroad in 1963. Burkenroad's classification replaced the earlier sub-orders of Natantia and Reptantia with the monophyletic groups Dendrobranchiata (prawns) and Pleocyemata.","u":"https://en.wikipedia.org/wiki/Pleocyemata","i":"img/6692.jpg","e":"Greek <b>πλέος<\/b> (<i>pléos<\/i>) \"full\" + <b>κύημα<\/b> (<i>kúēma<\/i>) \"embryo\": the decapods whose females carry their eggs. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"6744":{"p":"6692","n":"Paguroidea","r":"superfamily","d":"Superfamily of crustaceans (Paguroidea)","x":"Hermit crabs are anomuran decapod crustaceans of the superfamily Paguroidea that have adapted to occupy empty scavenged gastropod shells to protect their fragile abdomens. There are over 800 species of hermit crab, most of which possess an asymmetric abdomen concealed by a snug-fitting shell.","u":"https://en.wikipedia.org/wiki/Hermit_crab","i":"img/6744.jpg","e":"<b>Pagurus<\/b>, from Greek <b>πάγουρος<\/b> (<i>págouros<\/i>), a kind of crab + <b>-oidea<\/b> \"superfamily\": hermit crabs and the coconut crab. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"9611":{"p":"9608","n":"Canis","r":"genus","d":"Genus of canines","x":"Canis is a genus of the Caninae which includes multiple extant species, such as wolves, dogs, coyotes, and golden jackals. Species of this genus are distinguished by their moderate to large size, their massive, well-developed skulls and dentition, long legs, and comparatively short ears and tails.","u":"https://en.wikipedia.org/wiki/Canis","i":"img/9611.jpg","e":"Latin <b>canis<\/b> \"dog.\""},"6993":{"p":"33341","n":"Orthoptera","r":"order","d":"Order of insects that includes grasshoppers","x":"Orthoptera is an order of insects that comprises the grasshoppers, locusts, and crickets, including closely related insects, such as the bush crickets or katydids and wētā. The order is subdivided into two suborders: Caelifera – grasshoppers, locusts, and close relatives; and Ensifera – crickets and close relatives.","u":"https://en.wikipedia.org/wiki/Orthoptera","i":"img/6993.jpg","e":"Greek <b>ὀρθός<\/b> (<i>orthós<\/i>) \"straight\" + <b>πτερά<\/b> (<i>pterá<\/i>) \"wings\": grasshoppers, locusts and crickets."},"30420":{"p":"28725","n":"Corvus","r":"genus","d":"Genus of birds including crows, ravens and rooks","x":"Corvus is a widely distributed genus of passerine birds ranging from medium-sized to large-sized in the family Corvidae. It includes species commonly known as crows, ravens, and rooks.","u":"https://en.wikipedia.org/wiki/Corvus","i":"img/30420.jpg","e":"Latin <b>corvus<\/b> \"raven.\""},"9726":{"p":"9722","n":"Delphinidae","r":"family","d":"Family of marine mammals","x":"Oceanic dolphins or Delphinidae are a widely distributed family of dolphins that live in the sea. Close to forty extant species are recognised.","u":"https://en.wikipedia.org/wiki/Oceanic_dolphin","i":"img/9726.jpg","e":"<b>Delphinus<\/b> \"dolphin\" + <b>-idae<\/b> \"family\": the oceanic dolphins."},"9787":{"p":"314145","n":"Perissodactyla","r":"order","d":"Order of hoofed mammals","x":"Perissodactyla, or odd-toed ungulates, is an order of ungulates. The order includes about 17 living species divided into three families: Equidae, Rhinocerotidae (rhinoceroses), and Tapiridae (tapirs).","u":"https://en.wikipedia.org/wiki/Perissodactyla","i":"img/9787.jpg","e":"Greek <b>περισσός<\/b> (<i>perissós<\/i>) \"odd, uneven\" + <b>δάκτυλος<\/b> (<i>dáktylos<\/i>) \"toe\": odd-toed."},"9789":{"p":"9787","n":"Equus","r":"genus","d":"Genus of mammals that includes horses, asses, and zebras","x":"Equus is a genus of herbivorous mammals in the perissodactyl family Equidae, which includes horses, asses and zebras. Within the Equidae, Equus is the only recognized extant taxon, comprising eight living species, as well as numerous extinct species known only from fossils.","u":"https://en.wikipedia.org/wiki/Equus_(genus)","i":"img/9789.jpg","e":"Latin <b>equus<\/b> \"horse,\" the same word as Greek <b>ἵππος<\/b> (<i>híppos<\/i>) \"horse\" through their common ancestor."},"8930":{"p":"3078114","n":"Columbidae","r":"family","d":"Family of birds","x":"Columbidae is a bird family consisting of doves and pigeons. It is the only family in the order Columbiformes.","u":"https://en.wikipedia.org/wiki/Columbidae","i":"img/8930.jpg","e":"Latin <b>columba<\/b> \"dove\" + <b>-idae<\/b> \"family.\" English <b>pigeon<\/b> comes from Latin <b>pīpiō<\/b>, a \"peeping\" chick."},"33339":{"p":"7496","n":"Palaeoptera","r":"infraclass","d":"Taxonomic grouping of winged insects without a certain form of wing-folding","x":"The name Palaeoptera has been traditionally applied to those ancestral groups of winged insects that lack the ability to fold the wings back over the abdomen as characterizes the Neoptera. The Diaphanopterodea, which are palaeopteran insects, had independently and uniquely evolved a different wing-folding mechanism.","u":"https://en.wikipedia.org/wiki/Palaeoptera","i":"img/33339.jpg","e":"Greek <b>παλαιός<\/b> (<i>palaiós<\/i>) \"old\" + <b>πτερόν<\/b> (<i>pterón<\/i>) \"wing\": \"old wings\" that can't fold, as in mayflies and dragonflies."},"8830":{"p":"1549675","n":"Anatidae","r":"family","d":"Biological family of water birds","x":"The Anatidae are the biological family of water birds that includes ducks, geese, and swans. The family has a cosmopolitan distribution, occurring on all the world's continents except Antarctica.","u":"https://en.wikipedia.org/wiki/Anatidae","i":"img/8830.jpg","e":"Latin <b>anas<\/b> \"duck\" + <b>-idae<\/b> \"family\": ducks, geese and swans."},"41084":{"p":"3701062","n":"Polyphaga","r":"suborder","d":"Suborder of beetles","x":"Polyphaga is the largest and most diverse suborder of beetles. It comprises 144 families in 16 superfamilies, and displays an enormous variety of specialization and adaptation, with over 350,000 described species, or approximately 90% of the beetle species discovered thus far.","u":"https://en.wikipedia.org/wiki/Polyphaga","i":"img/41084.jpg","e":"Greek <b>πολύς<\/b> (<i>polús<\/i>) \"many\" + <b>φαγεῖν<\/b> (<i>phageîn<\/i>) \"to eat\": the \"eaters of many things,\" for the huge range of beetle diets."},"7055":{"p":"41084","n":"Scarabaeidae","r":"family","d":"Family of beetles","x":"The family Scarabaeidae, as currently defined, consists of over 35,000 species of beetles worldwide; they are often called scarabs or scarab beetles. The classification of this family has undergone significant change.","u":"https://en.wikipedia.org/wiki/Scarabaeidae","i":"img/7055.jpg","e":"Latin <b>scarabaeus<\/b> \"beetle\" + <b>-idae<\/b> \"family\": the scarabs."},"42113":{"p":"6340","n":"Clitellata","r":"class","d":"Class of annelids that includes earthworms and leeches","x":"The Clitellata are a class of annelid worms, characterized by having a clitellum – the 'collar' that forms a reproductive cocoon during part of their life cycles. The clitellates comprise around 8,000 species.","u":"https://en.wikipedia.org/wiki/Clitellata","i":"img/42113.jpg","e":"<b>Clitellum<\/b>, from Latin <b>clītellae<\/b> \"pack-saddle\" + <b>-ata<\/b>: earthworms and leeches, named for the saddle-like band around the body. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"9255":{"p":"40674","n":"Monotremata","r":"order","d":"Order of egg-laying mammals","x":"Monotremes are mammals of the order Monotremata. They are the only mammals still in existence which lay eggs, rather than bearing live young.","u":"https://en.wikipedia.org/wiki/Monotreme","i":"img/9255.jpg","e":"Greek <b>μόνος<\/b> (<i>mónos<\/i>) \"single\" + <b>τρῆμα<\/b> (<i>trêma<\/i>) \"hole\": one opening, the cloaca."},"9205":{"p":"3073812","n":"Pelecaniformes","r":"order","d":"Order of birds","x":"The Pelecaniformes are an order of medium-sized and large waterbirds found worldwide. As traditionally defined, they encompass all birds that have feet with all four toes webbed.","u":"https://en.wikipedia.org/wiki/Pelecaniformes","i":"img/9205.jpg","e":"<b>Pelecanus<\/b>, from Greek <b>πελεκάν<\/b> (<i>pelekán<\/i>) \"pelican\" + <b>-iformes<\/b> \"shaped\": pelicans, herons and their kin. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"30389":{"p":"9205","n":"Ardea","r":"genus","d":"Genus of birds","x":"Ardea is a genus of herons. These herons are generally large in size, typically 80–100 cm or more in length.","u":"https://en.wikipedia.org/wiki/Ardea_(bird)","i":"img/30389.jpg","e":"Latin <b>ardea<\/b> \"heron.\""},"9231":{"p":"3073812","n":"Spheniscidae","r":"family","d":"Family of aquatic flightless birds","x":"Penguins are a group of flightless semi-aquatic sea birds which live almost exclusively in the Southern Hemisphere. Only one species, the Galapagos penguin, lives at, and slightly north of, the equator.","u":"https://en.wikipedia.org/wiki/Penguin","i":"img/9231.jpg","e":"<b>Spheniscus<\/b>, from Greek <b>σφήν<\/b> (<i>sphḗn<\/i>) \"wedge\" + <b>-idae<\/b> \"family\": the penguins, for their wedge-shaped flippers. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"8952":{"p":"3073809","n":"Falco","r":"genus","d":"Birds of prey in the genus Falco","x":"Falcons are birds of prey in the genus Falco, which includes about 40 species. Some small species of falcons with long, narrow wings are called hobbies, and some that hover while hunting are called kestrels.","u":"https://en.wikipedia.org/wiki/Falcon","i":"img/8952.jpg","e":"Late Latin <b>falcō<\/b> \"falcon,\" from <b>falx, falcis<\/b> \"sickle\": for the curved claws."},"169418":{"p":"9655","n":"Mustelinae","r":"subfamily","d":"Subfamily of carnivores","x":"Mustelinae is a subfamily of family Mustelidae, including weasels, ferrets, and minks.","u":"https://en.wikipedia.org/wiki/Mustelinae","i":"img/169418.jpg","e":"Latin <b>Mustela<\/b> \"weasel\" + <b>-inae<\/b> \"subfamily\": the weasels proper."},"9665":{"p":"169418","n":"Mustela","r":"genus","d":"Mammal of the mustelid family","x":"Weasels are mammals of the genus Mustela of the family Mustelidae. The genus Mustela includes the least weasels, polecats, stoats, ferrets, and European mink.","u":"https://en.wikipedia.org/wiki/Weasel","i":"img/9665.jpg","e":"Latin <b>mustela<\/b> \"weasel,\" read as <b>mūs<\/b> \"mouse\" + <b>tēlum<\/b> \"javelin\": a mouse shaped like a spear, for its long body."},"1489913":{"p":"1489908","n":"Atherinomorphae","r":"superorder","d":"Clade of fishes","x":"The Atherinomorpha is a clade of fishes in the superorder Acanthopterygii, the ray-finned fishes, consisting of three orders. The clade is ranked as an infraseries within the subseries Ovalentaria, which in turn is ranked within the wider Percomorpha clade.","u":"https://en.wikipedia.org/wiki/Atherinomorpha","i":"img/1489913.jpg","e":"<b>Atherina<\/b>, the silverside genus + Greek <b>μορφή<\/b> (<i>morphḗ<\/i>) \"form\": silversides, flying fish and guppies. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"9991":{"p":"55153","n":"Sciurinae","r":"subfamily","d":"Subfamily of rodents","x":"Sciurinae is a subfamily of squirrels, uniting the flying squirrels with certain related tree squirrels. Older sources place the flying squirrels in a separate subfamily (Pteromyinae) and unite all remaining sciurids into the subfamily Sciurinae, but this has been strongly refuted by genetic studies.","u":"https://en.wikipedia.org/wiki/Sciurinae","i":"img/9991.jpg","e":"<b>Sciurus<\/b> \"squirrel\" + <b>-inae<\/b> \"subfamily\": the tree squirrels."},"2785011":{"p":"6447","n":"Autobranchia","r":"subclass","d":"Class of molluscs","x":"Bivalvia or bivalves, in previous centuries referred to as the Lamellibranchiata and Pelecypoda, is a class of aquatic molluscs that have laterally compressed soft bodies enclosed by a calcified exoskeleton consisting of a hinged pair of half-shells known as valves. As a group, bivalves have no head and lack some…","u":"https://en.wikipedia.org/wiki/Bivalvia","si":"Bivalvia","i":"img/2785011.jpg","e":"Greek <b>αὐτός<\/b> (<i>autós<\/i>) \"self\" + <b>βράγχια<\/b> (<i>bránchia<\/i>) \"gills\": most of the bivalves, a name from Latin <b>bis<\/b> \"two\" + <b>valvae<\/b> \"door leaves\". <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"6599":{"p":"2785011","n":"Heteroconchia","r":"clade","d":"Infraclass of molluscs","x":"Heteroconchia is a taxonomic infraclass of diverse bivalve molluscs, belonging to the subclass Autobranchia.","u":"https://en.wikipedia.org/wiki/Heteroconchia","i":"img/6599.jpg","e":"Greek <b>ἕτερος<\/b> (<i>héteros<\/i>) \"different\" + <b>κόγχη<\/b> (<i>kónkhē<\/i>) \"mussel, shell\": clams and freshwater mussels. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"37516":{"p":"6073","n":"Hydroidolina","r":"subclass","d":"Subclass of hydrozoans","x":"Hydroidolina is a subclass of Hydrozoa and makes up 90% of the class. Controversy surrounds who the sister groups of Hydroidolina are, but research has shown that three orders remain consistent as direct relatives: Siphonophorae, Anthoathecata, and Leptothecata.","u":"https://en.wikipedia.org/wiki/Hydroidolina","i":"img/37516.jpg","e":"<b>Hydra<\/b>, from Greek <b>ὕδρα<\/b> (<i>húdra<\/i>) \"water serpent\" (the many-headed monster) + <b>-oidolina<\/b>: freshwater polyps and the Portuguese man o' war. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"9397":{"p":"314145","n":"Chiroptera","r":"order","d":"Order of flying mammals","x":"Bats are winged mammals, the only mammals capable of true and sustained flight. Bats are more agile in flight than most birds, using long, spread-out digits covered with a thin membrane or patagium.","u":"https://en.wikipedia.org/wiki/Bat","i":"img/9397.jpg","e":"Greek <b>χείρ<\/b> (<i>kheír<\/i>) \"hand\" + <b>πτερόν<\/b> (<i>pterón<\/i>) \"wing\": hand-wings, since a bat's wing is a stretched hand."},"7147":{"p":"3701063","n":"Diptera","r":"order","d":"Order of insects","x":"A fly is an insect of the order Diptera, named for the single pair of wings. The hindwings have evolved into halteres, organs that sense rotation, giving flies precise control of their flight.","u":"https://en.wikipedia.org/wiki/Fly","i":"img/7147.jpg","e":"Greek <b>δι-<\/b> (<i>di-<\/i>) \"two\" + <b>πτερόν<\/b> (<i>pterón<\/i>) \"wing\": true flies, with a single pair of wings."},"43738":{"p":"7147","n":"Schizophora","r":"no rank","d":"Group of flies","x":"The Schizophora are a section of true flies containing 78 families, which are collectively referred to as muscoids, although technically the term \"muscoid\" should be limited to flies in the superfamily Muscoidea; this is an example of informal, historical usage persisting in the vernacular. The section is divided into…","u":"https://en.wikipedia.org/wiki/Schizophora","i":"img/43738.jpg","e":"Greek <b>σχίζω<\/b> (<i>skhízō<\/i>) \"to split\" + <b>φορός<\/b> (<i>phorós<\/i>) \"bearing\": the \"split-bearers,\" for the U-shaped seam in the face the fly pushes through to leave its pupal case."},"337687":{"p":"9989","n":"Muroidea","r":"clade","d":"Superfamily of rodents","x":"The Muroidea are a large superfamily of rodents, including mice, rats, voles, hamsters, lemmings, gerbils, and many other relatives. Although the Muroidea originated in Eurasia, they occupy a vast variety of habitats on every continent except Antarctica.","u":"https://en.wikipedia.org/wiki/Muroidea","i":"img/337687.jpg","e":"Latin <b>Mus<\/b> \"mouse\" + <b>-oidea<\/b> \"superfamily\": the mouse-like rodents."},"10066":{"p":"337687","n":"Muridae","r":"family","d":"Family of rodents","x":"The Muridae, or murids, are either the largest or second-largest family of rodents and of mammals, containing approximately 870 species, including many species of mice, rats, and gerbils found naturally throughout Eurasia, Africa, and Australia.","u":"https://en.wikipedia.org/wiki/Muridae","i":"img/10066.jpg","e":"Latin <b>mūs, mūris<\/b> \"mouse\" + <b>-idae<\/b> \"family\": the mouse family."},"61985":{"p":"197563","n":"Myriapoda","r":"subphylum","d":"Subphylum of arthropods","x":"Myriapods are the members of subphylum Myriapoda, containing arthropods such as millipedes and centipedes. The group contains about 13,000 species, all of them terrestrial.","u":"https://en.wikipedia.org/wiki/Myriapoda","i":"img/61985.jpg","e":"Greek <b>μυρίος<\/b> (<i>muríos<\/i>) \"countless\" + <b>πούς<\/b> (<i>poús<\/i>) \"foot\": the countless-footed. <b>Millipede<\/b> is Latin for \"thousand feet\".","ep":"PIE <b><i>*pṓds<\/i><\/b> → English <b>foot<\/b>"},"7540":{"p":"61985","n":"Chilopoda","r":"class","d":"Many-legged arthropods with elongated bodies","x":"Centipedes are predatory arthropods belonging to the class Chilopoda of the subphylum Myriapoda, an arthropod group which includes millipedes and other multi-legged animals. Centipedes are elongated segmented (metameric) animals with one pair of legs per body segment.","u":"https://en.wikipedia.org/wiki/Centipede","i":"img/7540.jpg","e":"Greek <b>χεῖλος<\/b> (<i>kheîlos<\/i>) \"lip\" + <b>πούς<\/b> (<i>poús<\/i>) \"foot\": for the venom claws, legs turned into mouthparts. <b>Centipede<\/b> is Latin for \"hundred feet\".","ep":"PIE <b><i>*pṓds<\/i><\/b> → English <b>foot<\/b>"},"2908833":{"p":"6599","n":"Neoheterodontei","r":"clade","d":"Infraclass of molluscs","x":"Heteroconchia is a taxonomic infraclass of diverse bivalve molluscs, belonging to the subclass Autobranchia.","u":"https://en.wikipedia.org/wiki/Heteroconchia","si":"Heterodonta","i":"img/2908833.jpg","e":"Greek <b>νεο-<\/b> (<i>neo-<\/i>) \"new\" + <b>ἕτερος<\/b> (<i>héteros<\/i>) \"different\" + <b>ὀδούς, ὀδόντος<\/b> (<i>odoús, odóntos<\/i>) \"tooth\": the newer clams with differing hinge teeth. <i style=\"opacity:.7\">(from the roots of the name)<\/i>","ep":"PIE <b><i>*h₃dónts<\/i><\/b> → English <b>tooth<\/b>"},"8548":{"p":"1329911","n":"Anguimorpha","r":"infraorder","d":"Suborder of lizards","x":"The Anguimorpha is a suborder of squamates. The group was named by Fürbringer in 1900 to include all autarchoglossans closer to Varanus and Anguis than Scincus.","u":"https://en.wikipedia.org/wiki/Anguimorpha","i":"img/8548.jpg","e":"Latin <b>anguis<\/b> \"snake\" + Greek <b>μορφή<\/b> (<i>morphḗ<\/i>) \"form\": snake-shaped lizards, monitors and Gila monsters included."},"9963":{"p":"9895","n":"Caprinae","r":"subfamily","d":"Subfamily of mammals","x":"The subfamily Caprinae, also sometimes referred to as the tribe Caprini, is part of the ruminant family Bovidae, and consists of mostly medium-sized bovids. A member of this subfamily is called a caprine.","u":"https://en.wikipedia.org/wiki/Caprinae","i":"img/9963.jpg","e":"Latin <b>Capra<\/b> \"goat\" + <b>-inae<\/b> \"subfamily\": goats, sheep and their kin."},"9922":{"p":"9963","n":"Capra","r":"genus","d":"Genus of mammals, the goats","x":"Capra is a genus of mammals, the goats, comprising ten species, including the markhor and several species known as ibexes. The domestic goat is a domesticated species derived from the bezoar ibex, a subspecies of the wild goat.","u":"https://en.wikipedia.org/wiki/Capra_(genus)","i":"img/9922.jpg","e":"Latin <b>capra<\/b> \"female goat.\""},"7778":{"p":"7776","n":"Elasmobranchii","r":"subclass","d":"Subclass of fishes","x":"Elasmobranchii is a subclass of Chondrichthyes or cartilaginous fish, including modern sharks, and batomorphs. Members of this subclass are characterised by having five to seven pairs of gill slits opening individually to the exterior, rigid dorsal fins and small placoid scales on the skin.","u":"https://en.wikipedia.org/wiki/Elasmobranchii","i":"img/7778.jpg","e":"Greek <b>ἐλασμο-<\/b> (<i>elasmo-<\/i>) \"plate\" + <b>βράγχια<\/b> (<i>bránchia<\/i>) \"gills\": for their broad, flattened gills."},"119195":{"p":"7778","n":"Galeoidea","r":"superorder","d":"Superorder of sharks","x":"Galeomorphi is a superorder of sharks. They are sometimes called galea or galean sharks.","u":"https://en.wikipedia.org/wiki/Galeomorphi","si":"Galeomorphii","i":"img/119195.jpg","e":"Greek <b>γαλεός<\/b> (<i>galeós<\/i>) \"shark\" + <b>-oidea<\/b>: the galeomorph sharks. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"30496":{"p":"119195","n":"Lamniformes","r":"order","d":"Order of sharks","x":"The Lamniformes are an order of sharks commonly known as mackerel sharks. It includes some of the most familiar species of sharks, such as the great white and mako sharks as well as less familiar ones, such as the goblin shark and megamouth shark.","u":"https://en.wikipedia.org/wiki/Lamniformes","i":"img/30496.jpg","e":"<b>Lamna<\/b>, from Greek <b>lamna<\/b> \"fish of prey\" + <b>-iformes<\/b> \"shaped\": the mackerel sharks, great white included."},"2068722":{"p":"8830","n":"Anserinae","r":"subfamily","d":"Subfamily of birds","x":"The Anserinae are a subfamily in the waterfowl family Anatidae and includes the swan and geese. Under alternative systematical concepts, it is split into two subfamilies.","u":"https://en.wikipedia.org/wiki/Anserinae","i":"img/2068722.jpg","e":"Latin <b>ānser<\/b> \"goose\" + <b>-inae<\/b> \"subfamily\": geese and swans."},"7008":{"p":"6993","n":"Schistocerca","r":"genus","d":"Genus of grasshoppers","x":"Schistocerca is a genus of grasshoppers, commonly called bird grasshoppers, many of which swarm as locusts. The best known species is probably the desert locust, and trans-Atlantic flight may explain the biogeography of some locust species.","u":"https://en.wikipedia.org/wiki/Schistocerca","i":"img/7008.jpg","e":"Greek <b>σχιστός<\/b> (<i>skhistós<\/i>) \"split\" + <b>-cerca<\/b>: the swarming grasshoppers, the locusts. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"9224":{"p":"9223","n":"Psittacidae","r":"family","d":"Family of birds","x":"The family Psittacidae or holotropical parrots is one of three families of true parrots. It comprises the 12 species of subfamily Psittacinae and 167 of subfamily Arinae including several species that have gone extinct in recent centuries.","u":"https://en.wikipedia.org/wiki/Psittacidae","i":"img/9224.jpg","e":"<b>Psittacus<\/b> \"parrot\" + <b>-idae<\/b> \"family\": the Old World parrots."},"7805":{"p":"119195","n":"Carcharhinidae","r":"family","x":"Requiem sharks are members in the family Carcharhinidae. They are migratory, live-bearing sharks of warm seas and include such species as the blacktip shark, bull shark, lemon shark, nervous shark, and whitetip reef shark.","u":"https://en.wikipedia.org/wiki/Requiem_shark","i":"img/7805.jpg","e":"<b>Carcharhinus<\/b>, from Greek <b>κάρχαρος<\/b> (<i>kárcharos<\/i>) \"jagged\" + <b>ῥίνη<\/b> (<i>rhínē<\/i>) \"rasp\": for the rough, rasp-like skin. These are the requiem sharks."},"9979":{"p":"314147","n":"Leporidae","r":"family","d":"Family of lagomorphs","x":"Leporidae is the family of rabbits and hares (Lepus), containing over 70 species of extant mammals in all. Together with the pikas, the Leporidae constitute the mammalian order Lagomorpha.","u":"https://en.wikipedia.org/wiki/Leporidae","i":"img/9979.jpg","e":"Latin <b>lepus<\/b> \"hare\" + <b>-idae<\/b> \"family\": the hare family."},"6236":{"p":"1206794","n":"Rhabditida","r":"order","d":"Order of roundworms","x":"Rhabditida is an order of different nematodes that can be found as free-living (non-parasitic) organisms, parasites, or microbivores living in soil.","u":"https://en.wikipedia.org/wiki/Rhabditida","i":"img/6236.jpg","e":"<b>Rhabditis<\/b>, from Greek <b>ῥάβδος<\/b> (<i>rhábdos<\/i>) \"rod\" + <b>-ida<\/b>: rod-shaped roundworms. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"9362":{"p":"314145","n":"Eulipotyphla","r":"order","d":"Order of mammals","x":"Eulipotyphla is an order of mammals comprising the families Erinaceidae, Solenodontidae (solenodons), Talpidae, and Soricidae.","u":"https://en.wikipedia.org/wiki/Eulipotyphla","i":"img/9362.jpg","e":"Greek <b>εὐ-<\/b> (<i>eu-<\/i>) \"true\" + Haeckel's 1866 <b>Lipotyphla<\/b>, from <b>λείπω<\/b> (<i>leípō<\/i>) \"to lack\" + <b>τυφλός<\/b> (<i>tuphlós<\/i>) \"blind\": they lack a caecum, the \"blind\" gut."},"7948":{"p":"186634","n":"Clupeinae","r":"subfamily","d":"Family of fishes","x":"Clupeidae is a small family of clupeiform ray-finned fishes, comprising the true herrings and sprats, inhabiting temperate marine habitats in both hemispheres. Members of the family have a body protected with shiny cycloid scales, a single dorsal fin, and a fusiform body for quick, evasive swimming and pursuit of prey…","u":"https://en.wikipedia.org/wiki/Clupeidae","i":"img/7948.jpg","e":"Latin <b>clupea<\/b> \"herring\" + <b>-inae<\/b> \"subfamily\": herrings and sardines. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"7439":{"p":"7434","n":"Vespinae","r":"subfamily","d":"Subfamily of wasps","x":"The subfamily Vespinae contains the largest and best-known groups of eusocial wasps, including true hornets, and the \"yellowjackets\". The remaining genus, Provespa, is a small, poorly known group of nocturnal wasps from Southeast Asia.","u":"https://en.wikipedia.org/wiki/Vespinae","i":"img/7439.jpg","e":"Latin <b>vespa<\/b> \"wasp\" + <b>-inae<\/b> \"subfamily\": hornets and yellowjackets."},"8892":{"p":"3078114","n":"Apodiformes","r":"order","d":"Order of birds","x":"The Apodiformes is an order, or taxonomic grouping, of birds which traditionally contained three living families—the Apodidae (swifts), the Hemiprocnidae (treeswifts), and the Trochilidae (hummingbirds); however, in the Sibley–Ahlquist taxonomy, this order is elevated to the superorder Apodimorphae, in which…","u":"https://en.wikipedia.org/wiki/Apodiformes","i":"img/8892.jpg","e":"<b>Apus<\/b>, from Greek <b>ἄπους<\/b> (<i>ápous<\/i>) \"footless\" + <b>-iformes<\/b> \"shaped\": swifts and hummingbirds, with feet so small they seem to have none."},"94015":{"p":"74971","n":"Dionycha","r":"clade","d":"Clade of spiders","x":"The Dionycha are a clade of spiders (Araneomorphae:Entelegynae), characterized by the possession of two tarsal claws with tufts of hairs (setae) beside them, which produce strong adhesion, enabling some species to climb glass. The circumscription of the group has varied widely; a 2021 analysis resulted in about 20…","u":"https://en.wikipedia.org/wiki/Dionycha","i":"img/94015.jpg","e":"Greek <b>δι-<\/b> (<i>di-<\/i>) \"two\" + <b>ὄνυξ<\/b> (<i>ónux<\/i>) \"claw\": spiders with two claws per foot, huntsmen and jumping spiders."},"9688":{"p":"9681","n":"Panthera","r":"genus","d":"Genus within Felidae","x":"Panthera is a genus within the family Felidae, and one of two extant genera in the subfamily Pantherinae. It contains the largest living members of the cat family.","u":"https://en.wikipedia.org/wiki/Panthera","i":"img/9688.jpg","e":"Latin <b>panthēra<\/b> ← Greek <b>πάνθηρ<\/b> (<i>pánthēr<\/i>) \"panther\": the big cats."},"6143":{"p":"6073","n":"Semaeostomeae","r":"order","d":"Order of jellyfish with four long, frilly oral arms","x":"Semaeostomeae is an order of large jellyfish characterized by four long, frilly oral arms flanking their quadrate mouths. The umbrella is domed with scalloped margins, and the gastrovascular system consists of four unbranched pouches radiating outwards from the central stomach; no ring canal is present.","u":"https://en.wikipedia.org/wiki/Semaeostomeae","i":"img/6143.jpg","e":"Greek <b>σημαία<\/b> (<i>sēmaía<\/i>) \"flag, banner\" + <b>στόμα<\/b> (<i>stóma<\/i>) \"mouth\": the true jellyfish. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"9263":{"p":"32525","n":"Metatheria","r":"clade","d":"Clade of marsupials and close relatives","x":"Metatheria is a mammalian clade that includes all mammals more closely related to marsupials than to placentals. First proposed by Thomas Henry Huxley in 1880, it is a more inclusive group than the marsupials; it contains all marsupials as well as many extinct non-marsupial relatives.","u":"https://en.wikipedia.org/wiki/Metatheria","i":"img/9263.jpg","e":"Greek <b>μετά<\/b> (<i>metá<\/i>) \"changed, beyond\" + <b>θηρίον<\/b> (<i>thēríon<\/i>) \"beast\": the marsupials and their relatives."},"38609":{"p":"9263","n":"Diprotodontia","r":"order","d":"Order of marsupial mammals","x":"Diprotodontia is the largest extant order of marsupials, with about 155 species, including the kangaroos, wallabies, possums, koala, wombats, and many others. Extinct diprotodonts include the hippopotamus-sized Diprotodon, and Thylacoleo, the so-called \"marsupial lion\".","u":"https://en.wikipedia.org/wiki/Diprotodontia","i":"img/38609.jpg","e":"Greek <b>δι-<\/b> (<i>di-<\/i>) \"two\" + <b>πρῶτος<\/b> (<i>prôtos<\/i>) \"front\" + <b>ὀδούς, ὀδόντος<\/b> (<i>odoús, odóntos<\/i>) \"tooth\": two front teeth, the big lower incisors of kangaroos and koalas.","ep":"PIE <b><i>*h₃dónts<\/i><\/b> → English <b>tooth<\/b>"},"9647":{"p":"3072906","n":"Procyonidae","r":"family","d":"Family of mammals","x":"Procyonidae is a New World family of the order Carnivora. It includes the raccoons, ringtails, cacomistles, coatis, kinkajous, olingos, and olinguitos.","u":"https://en.wikipedia.org/wiki/Procyonidae","i":"img/9647.jpg","e":"<b>Procyon<\/b>, the raccoon genus + <b>-idae<\/b> \"family\": the raccoon family."},"213547":{"p":"33341","n":"Verophasmatodea","r":"suborder","d":"Suborder of insects","x":"The Euphasmatodea, also known by its junior synonym Verophasmatodea is a suborder of the Phasmatodea, which contains the vast majority of the extant species of stick and leaf insects, excluding the Timematodea. The oldest record of Euphasmatodea is Araripephasma from the Crato Formation of Brazil, dating to the Aptian…","u":"https://en.wikipedia.org/wiki/Euphasmatodea","i":"img/213547.jpg","e":"Latin <b>vērus<\/b> \"true\" + <b>Phasmatodea<\/b>, from Greek <b>φάσμα<\/b> (<i>phásma<\/i>) \"apparition, phantom\": the true stick and leaf insects, hiding in plain sight. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"186745":{"p":"1489872","n":"Scombrinae","r":"subfamily","d":"Subfamily of fishes","x":"The Scombrinae are a subfamily of ray-finned bony fishes in the family Scombridae. Of the 51 species in the Scombridae, 50 are in Scombrinae – with the sole exception being the butterfly kingfish, which is placed in the monospecific subfamily Gasterochismatinae.","u":"https://en.wikipedia.org/wiki/Scombrinae","i":"img/186745.jpg","e":"Latin <b>scomber<\/b> \"mackerel\" + <b>-inae<\/b> \"subfamily\": mackerels and tunas."},"117851":{"p":"7778","n":"Myliobatiformes","r":"order","d":"Order of cartilaginous fishes","x":"Myliobatiformes, commonly known as stingrays, are one of the four orders of batoids, cartilaginous fishes related to sharks. They are members of the subclass elasmobranchs.","u":"https://en.wikipedia.org/wiki/Myliobatiformes","i":"img/117851.jpg","e":"<b>Myliobatis<\/b>, from Greek <b>μύλη<\/b> (<i>múlē<\/i>) \"mill\" + <b>βατίς<\/b> (<i>batís<\/i>) \"ray\" + <b>-iformes<\/b> \"shaped\": stingrays and manta rays. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"9697":{"p":"379583","n":"Herpestidae","r":"family","d":"Family of mammals in Africa and Asia","x":"A mongoose is a small terrestrial carnivorous mammal belonging to the family Herpestidae. This family has two subfamilies, the Herpestinae and the Mungotinae.","u":"https://en.wikipedia.org/wiki/Mongoose","i":"img/9697.jpg","e":"<b>Herpestes<\/b>, the mongoose genus + <b>-idae<\/b> \"family\": the mongoose family. The English word <b>mongoose<\/b> comes from Indian names such as Hindi <b>muṅgūs<\/b>. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"39107":{"p":"10066","n":"Murinae","r":"subfamily","d":"Subfamily of rodents","x":"The Old World rats and mice, part of the subfamily Murinae in the family Muridae, comprise at least 519 species. Members of this subfamily are called murines.","u":"https://en.wikipedia.org/wiki/Murinae","i":"img/39107.jpg","e":"Latin <b>Mus<\/b> \"mouse\" + <b>-inae<\/b> \"subfamily\": Old World mice and rats."},"6545":{"p":"2785011","n":"Pteriomorphia","r":"clade","d":"Subclass of bivalves","x":"The Pteriomorphia are a subclass of saltwater clams, marine bivalve molluscs. They contain several major orders, including the Arcida, Ostreida, Pectinida, Limida, Mytilida, and Pteriida.","u":"https://en.wikipedia.org/wiki/Pteriomorphia","i":"img/6545.jpg","e":"<b>Pteria<\/b>, the wing oyster, from Greek <b>πτερόν<\/b> (<i>pterón<\/i>) \"wing\" + <b>μορφή<\/b> (<i>morphḗ<\/i>) \"form\": oysters, mussels and scallops."},"8314":{"p":"30367","n":"Salamandridae","r":"family","d":"Family of salamanders","x":"Salamandridae is a family of salamanders consisting of true salamanders and newts. Salamandrids are distinguished from other salamanders by the lack of rib or costal grooves along the sides of their bodies and by their rough skin.","u":"https://en.wikipedia.org/wiki/Salamandridae","i":"img/8314.jpg","e":"<b>Salamandra<\/b> \"salamander\" + <b>-idae<\/b> \"family\": salamanders and newts. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"36291":{"p":"9126","n":"Muscicapidae","r":"family","d":"Family of birds","x":"The Old World flycatchers are a large family, the Muscicapidae, of small passerine birds restricted to the Old World, with the exception of several vagrants and two species, bluethroat and northern wheatear, found also in North America. These are mainly small arboreal insectivores, many of which, as the name implies,…","u":"https://en.wikipedia.org/wiki/Old_World_flycatcher","i":"img/36291.jpg","e":"<b>Muscicapa<\/b>, from Latin <b>musca<\/b> \"fly\" + <b>capere<\/b> \"to catch\": the Old World flycatchers, robins and nightingales included."},"9821":{"p":"91561","n":"Suidae","r":"family","d":"Family of mammals belonging to even-toed ungulates","x":"Suidae is a family of artiodactyl mammals which are commonly called pigs, hogs, or swine. In addition to numerous fossil species, 18 extant species are currently recognized, classified into between four and eight genera.","u":"https://en.wikipedia.org/wiki/Suidae","i":"img/9821.jpg","e":"Latin <b>Sus<\/b> \"pig\" + <b>-idae<\/b> \"family\": the pig family."},"41705":{"p":"1489388","n":"Protacanthopterygii","r":"clade","d":"Superorder of fishes","x":"Protacanthopterygii is a superorder of ray-finned fish. They inhabit both marine and freshwater habitats.","u":"https://en.wikipedia.org/wiki/Protacanthopterygii","i":"img/41705.jpg","e":"Greek <b>πρωτο-<\/b> (<i>prōto-<\/i>) \"first\" + <b>ἄκανθα<\/b> (<i>ákantha<\/i>) \"spine\" + <b>πτέρυξ<\/b> (<i>ptérux<\/i>) \"fin\": salmon, trout and pike. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"8417":{"p":"8416","n":"Hyloidea","r":"superfamily","d":"Superfamily of amphibians","x":"Hyloidea is a superfamily of frogs. Hyloidea accounts for 54% of all living anuran species.","u":"https://en.wikipedia.org/wiki/Hyloidea","i":"img/8417.jpg","e":"<b>Hyla<\/b>, the tree-frog genus + <b>-oidea<\/b> \"superfamily\". <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"8906":{"p":"3078114","n":"Charadriiformes","r":"order","d":"Order of birds","x":"Charadriiformes is a diverse order of small to medium-large birds. It includes about 390 species and has members in all parts of the world.","u":"https://en.wikipedia.org/wiki/Charadriiformes","i":"img/8906.jpg","e":"<b>Charadrius<\/b>, the plover genus, from Greek <b>χαραδριός<\/b> (<i>kharadriós<\/i>), a plover-like bird + <b>-iformes<\/b> \"shaped\": shorebirds, gulls and puffins. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"8689":{"p":"34989","n":"Viperidae","r":"family","d":"Family of snakes","x":"Vipers are snakes in the family Viperidae, found in most parts of the world, except for Antarctica, Australia, Hawaii, Madagascar, Ireland, and various other isolated islands. All vipers are venomous, and have long, hinged fangs that permit deep envenomation of their prey.","u":"https://en.wikipedia.org/wiki/Viper","i":"img/8689.jpg","e":"Latin <b>vīpera<\/b> \"viper,\" possibly from <b>vīvus<\/b> \"alive\" + <b>parere<\/b> \"to bear\": for giving birth to live young."},"169417":{"p":"9655","n":"Lutrinae","r":"subfamily","d":"Subfamily of mammals (Lutrinae)","x":"Otters are carnivorous mammals in the subfamily Lutrinae. The 14 extant otter species are all semiaquatic, both freshwater and marine.","u":"https://en.wikipedia.org/wiki/Otter","i":"img/169417.jpg","e":"Latin <b>lutra<\/b> \"otter\" + <b>-inae<\/b> \"subfamily\": the otters."},"504568":{"p":"41705","n":"Salmoninae","r":"subfamily","d":"Family of ray-finned fishes","x":"Salmonidae is a family of ray-finned fish, the only extant member of the suborder Salmonoidei, consisting of 11 extant genera and over 200 species collectively known as \"salmonids\" or \"salmonoids\". The family includes salmon, trout, char, graylings, freshwater whitefishes, taimens and lenoks, all coldwater mid-level…","u":"https://en.wikipedia.org/wiki/Salmonidae","i":"img/504568.jpg","e":"Latin <b>salmō<\/b> \"salmon\" + <b>-inae<\/b> \"subfamily\": salmon and trout."},"133551":{"p":"33511","n":"Eleutherozoa","r":"clade","d":"Clade of echinoderms","x":"Eleutherozoa is a subphylum of echinoderms. They are mobile animals with the mouth directed towards the substrate.","u":"https://en.wikipedia.org/wiki/Eleutherozoa","i":"img/133551.jpg","e":"Greek <b>ἐλεύθερος<\/b> (<i>eleútheros<\/i>) \"free\" + <b>ζῷον<\/b> (<i>zôion<\/i>) \"animal\": the free animals.","ep":"PIE <b><i>*gʷeyh₃-<\/i><\/b> \"to live\" (in ζῷον) → English <b>quick<\/b>, in its old sense \"alive\""},"7624":{"p":"133551","n":"Echinozoa","r":"superclass","d":"Subphylum of marine invertebrates","x":"Echinozoa is a subphylum of free-living echinoderms in which the body is or originally was a modified globe with meridional symmetry. Echinozoans lack arms, brachioles or other appendages, and do not at any time exhibit pinnate structure.","u":"https://en.wikipedia.org/wiki/Echinozoa","i":"img/7624.jpg","e":"<b>Echinus<\/b>, from Greek <b>ἐχῖνος<\/b> (<i>ekhînos<\/i>) \"hedgehog, sea urchin\" + <b>ζῷα<\/b> (<i>zôia<\/i>) \"animals\": sea urchins, sand dollars and sea cucumbers."},"7638":{"p":"7624","n":"Euechinoidea","r":"subclass","d":"Subclass of sea urchins","x":"The subclass Euechinoidea includes almost all living species of sea urchin, with fossil forms going back as far as the Triassic.","u":"https://en.wikipedia.org/wiki/Euechinoidea","i":"img/7638.jpg","e":"Greek <b>εὐ-<\/b> (<i>eu-<\/i>) \"true\" + <b>Echinoidea<\/b> \"hedgehog-like\": the true sea urchins and sand dollars."},"3072905":{"p":"379584","n":"Pinnipedia","r":"clade","d":"Taxonomic group of semi-aquatic mammals","x":"Pinnipeds, commonly known as seals, are widely distributed and diverse carnivorous, fin-footed, semiaquatic, mostly marine mammals, belonging to the clade Pinnipedia. They comprise the extant families Odobenidae, Otariidae, and Phocidae, with 34 extant species and more than 50 extinct species described from fossils.","u":"https://en.wikipedia.org/wiki/Pinniped","i":"img/3072905.jpg","e":"Latin <b>pinna<\/b> \"fin\" + <b>pēs, pedis<\/b> \"foot\": fin-footed."},"1579336":{"p":"1579337","n":"Americhelydia","r":"clade","d":"Clade of turtles","x":"Americhelydia is a clade of turtles that consists of sea turtles, snapping turtles, the Central American river turtle and mud turtles, supported by several lines of molecular work. Prior to these studies some morphological and developmental work have considered sea turtles to be basal members of Cryptodira and…","u":"https://en.wikipedia.org/wiki/Americhelydia","i":"img/1579336.jpg","e":"<b>America<\/b> + Greek <b>χέλυς<\/b> (<i>khélus<\/i>) \"tortoise, turtle\": a turtle group centered on the Americas. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"9219":{"p":"3073808","n":"Piciformes","r":"order","d":"Order of birds","x":"Nine families of largely arboreal birds make up the order Piciformes, the best-known of them being the Picidae, which includes the woodpeckers and close relatives. The Piciformes contain about 71 living genera with a little over 450 species, of which the Picidae make up about half.","u":"https://en.wikipedia.org/wiki/Piciformes","i":"img/9219.jpg","e":"Latin <b>pīcus<\/b> \"woodpecker\" + <b>-iformes<\/b> \"shaped\": woodpeckers and toucans."}},"leaves":{"9818":{"n":"aardvark","s":"Orycteropus afer","p":"311790","x":"The aardvark is a medium-sized, burrowing, nocturnal mammal native to Africa. The aardvark is the only living member of the genus Orycteropus, the family Orycteropodidae and the order Tubulidentata.","u":"https://en.wikipedia.org/wiki/Aardvark","i":"img/9818.jpg"},"46550":{"n":"albatross","s":"Diomedea exulans","p":"3073812","x":"The snowy albatross, also known as the wandering albatross, white-winged albatross, or goonie, is a large seabird from the family Diomedeidae; they have a circumpolar range in the Southern Ocean. It is the largest species of albatross and was long considered to be the same species as the Tristan albatross and the…","u":"https://en.wikipedia.org/wiki/Snowy_albatross","i":"img/46550.jpg"},"8496":{"n":"alligator","s":"Alligator mississippiensis","p":"1294636","x":"The American alligator, sometimes referred to as a common alligator or just gator, is a large crocodilian reptile native to the Southeastern United States. It is one of the two extant species in the genus Alligator, and is larger than the only other living alligator species, the Chinese alligator.","u":"https://en.wikipedia.org/wiki/American_alligator","i":"img/8496.jpg"},"30538":{"n":"alpaca","s":"Vicugna pacos","p":"9835","x":"The alpaca is a domesticated species of South American camelid. Traditionally, alpacas were kept in herds that grazed on the level heights of the Andes of Southern Peru, Western Bolivia, Ecuador, and Northern Chile.","u":"https://en.wikipedia.org/wiki/Alpaca","i":"img/30538.jpg"},"51876":{"n":"anaconda","s":"Eunectes murinus","p":"8572","x":"The green anaconda is a species of snake in the family Boidae (boas). The species is native to northern South America.","u":"https://en.wikipedia.org/wiki/Green_anaconda","i":"img/51876.jpg"},"6105":{"n":"anemone","s":"Actinia tenebrosa","p":"6102","x":"Actinia tenebrosa, commonly known as the waratah anemone, is the most common species of sea anemone found in the waters of eastern Australia and New Zealand. It is found relatively high on the seashore, in rock pools, and various cracks and shaded surfaces such as under rock overhangs in the intertidal zone.","u":"https://en.wikipedia.org/wiki/Actinia_tenebrosa","i":"img/6105.jpg"},"8074":{"n":"anglerfish","s":"Lophius piscatorius","p":"1489922","x":"Lophius piscatorius, commonly known as the angler, toadfish, sea frog, fishing frog, frogfish, or sea devil, is a species of Lophius in the family Lophiidae. It occurs in coastal and shelf waters of the northeast Atlantic, ranging from the Barents Sea south to the Strait of Gibraltar, and is also present in the…","u":"https://en.wikipedia.org/wiki/Lophius_piscatorius","i":"img/8074.jpg"},"84074":{"n":"anteater","s":"Cyclopes didactylus","p":"948950","x":"The common silky anteater, also known as the pygmy anteater, is a species of anteater in the genus Cyclopes. It has nocturnal habits and appears to be completely arboreal; its hind feet are highly modified for climbing.","u":"https://en.wikipedia.org/wiki/Common_silky_anteater","i":"img/84074.jpg"},"37189":{"n":"antelope","s":"Hippotragus niger","p":"9895","x":"The sable antelope is a large antelope which inhabits wooded savanna in East and Southern Africa, from the south of Kenya to South Africa, with a separated population in Angola.","u":"https://en.wikipedia.org/wiki/Sable_antelope","i":"img/37189.jpg"},"494514":{"n":"arctic fox","s":"Vulpes lagopus","p":"9625","x":"The Arctic fox, also known as the white fox, polar fox, or snow fox, is a small species of fox native to the Arctic regions of the Northern Hemisphere and common throughout the Arctic tundra. It is well adapted to living in cold environments, and is known for its thick, warm fur that can be used as camouflage against…","u":"https://en.wikipedia.org/wiki/Arctic_fox","i":"img/494514.jpg"},"340076":{"n":"armadillo","s":"Chaetophractus vellerosus","p":"9348","x":"The screaming hairy armadillo is a species of armadillo also known as the small screaming armadillo, crying armadillo or the small hairy armadillo. It is a burrowing armadillo found in the central and southern parts of South America.","u":"https://en.wikipedia.org/wiki/Screaming_hairy_armadillo","i":"img/340076.jpg"},"63978":{"n":"atlas moth","s":"Attacus atlas","p":"37569","x":"Attacus atlas, the Atlas moth, is a large saturniid moth endemic to the forests of Asia. The species was described by Carl Linnaeus in his 1758 10th edition of Systema Naturae.","u":"https://en.wikipedia.org/wiki/Attacus_atlas","i":"img/63978.jpg"},"8296":{"n":"axolotl","s":"Ambystoma mexicanum","p":"30367","x":"The axolotl is a species of mole salamander. It is neotenic, reaching sexual maturity without undergoing metamorphosis, and the adults remain fully aquatic with obvious external gills.","u":"https://en.wikipedia.org/wiki/Axolotl","i":"img/8296.jpg"},"100937":{"n":"baboon","s":"Papio papio","p":"9528","x":"The Guinea baboon is a baboon from the Old World monkey family. Some (older) classifications list only two species in the genus Papio, this one and the hamadryas baboon.","u":"https://en.wikipedia.org/wiki/Guinea_baboon","i":"img/100937.jpg"},"30554":{"n":"badger","s":"Taxidea taxus","p":"9655","x":"The American badger is a North American badger similar in appearance to the European badger, although not closely related. It is found in the western, central, and northeastern United States, northern Mexico, and south-central Canada to certain areas of southwestern British Columbia.","u":"https://en.wikipedia.org/wiki/American_badger","i":"img/30554.jpg"},"52644":{"n":"bald eagle","s":"Haliaeetus leucocephalus","p":"8955","x":"The bald eagle is a bird of prey found in North America. A sea eagle, it has two known subspecies and forms a species pair with the white-tailed eagle, which occupies the same niche as the bald eagle in the Palearctic.","u":"https://en.wikipedia.org/wiki/Bald_eagle","i":"img/52644.jpg"},"2067768":{"n":"banana slug","s":"Ariolimax columbianus","p":"216366","x":"Ariolimax columbianus, the Pacific banana slug, is a species of slug found on the Pacific coast of North America. It is the second-largest species of terrestrial slug in the world, growing up to 260 millimeters long when fully extended.","u":"https://en.wikipedia.org/wiki/Ariolimax_columbianus","i":"img/2067768.jpg"},"218467":{"n":"bark scorpion","s":"Centruroides sculpturatus","p":"6855","x":"The Arizona bark scorpion is a small light brown scorpion common to the Sonoran Desert in the southwestern United States and northwestern Mexico. An adult male can reach 8 centimetres (3.1 in) of body length, while a female is slightly smaller, with a maximum length of 7 centimetres (2.8 in).","u":"https://en.wikipedia.org/wiki/Arizona_bark_scorpion","i":"img/218467.jpg"},"56313":{"n":"barn owl","s":"Tyto alba","p":"30458","x":"The western barn owl is a species of barn owl native to Europe, southwestern Asia, and Africa. It was formerly considered a subspecies group together with barn owls native to other parts of the world, but this classification was found to be paraphyletic with respect to some other members of the genus.","u":"https://en.wikipedia.org/wiki/Western_barn_owl","i":"img/56313.jpg"},"110520":{"n":"barnacle","s":"Balanus glandula","p":"3701029","x":"Balanus glandula is one of the most common barnacle species on the Pacific coast of North America, distributed from the U.S. state of Alaska to Bahía de San Quintín near San Quintín, Baja California.","u":"https://en.wikipedia.org/wiki/Balanus_glandula","i":"img/110520.jpg"},"70868":{"n":"barracuda","s":"Sphyraena barracuda","p":"1489904","x":"Sphyraena barracuda, commonly known as the great barracuda, is a species of barracuda, a genus of 27 species of large ray-finned fish found in subtropical oceans worldwide.","u":"https://en.wikipedia.org/wiki/Great_barracuda","i":"img/70868.jpg"},"27706":{"n":"bass","s":"Micropterus salmoides","p":"1489922","x":"The largemouth bass is a carnivorous, freshwater, ray-finned fish in the Centrarchidae (sunfish) family, native to the eastern and central United States, southeastern Canada and northern Mexico. It is known by a variety of regional names, such as the widemouth bass, bigmouth bass, black bass, largie, potter's fish,…","u":"https://en.wikipedia.org/wiki/Largemouth_bass","i":"img/27706.jpg"},"51338":{"n":"beaver","s":"Castor canadensis","p":"9989","x":"The North American beaver is one of two extant beaver species, along with the Eurasian beaver. It is native to North America and has been introduced in South America (Patagonia) and Europe.","u":"https://en.wikipedia.org/wiki/North_American_beaver","i":"img/51338.jpg"},"9749":{"n":"beluga whale","s":"Delphinapterus leucas","p":"9747","x":"The beluga whale or the white whale is an Arctic and sub-Arctic cetacean. It is one of two living members of the family Monodontidae, along with the narwhal, and the only member of the genus Delphinapterus.","u":"https://en.wikipedia.org/wiki/Beluga_whale","i":"img/9749.jpg"},"209230":{"n":"betta fish","s":"Betta tussyae","p":"1489892","x":"Betta tussyae is a species of gourami endemic to Malaysia where it is only known from Pahang. It is an inhabitant of peat swamps.","u":"https://en.wikipedia.org/wiki/Betta_tussyae","i":"img/209230.jpg"},"34570":{"n":"bigfin squid","s":"Sepioteuthis lessoniana","p":"215450","x":"Sepioteuthis lessoniana, commonly known as the bigfin reef squid, tiger squid, glitter squid, oval squid, or northern calamari, is a species complex in the loliginid squid family. It is one of the three currently recognized species belonging to the genus Sepioteuthis.","u":"https://en.wikipedia.org/wiki/Bigfin_reef_squid","i":"img/34570.jpg"},"9901":{"n":"bison","s":"Bison bison","p":"27592","x":"The American bison, commonly known as the American buffalo, or simply buffalo, is a species of bison that is endemic to North America. It is one of two extant species of bison, along with the European bison.","u":"https://en.wikipedia.org/wiki/American_bison","i":"img/9901.jpg"},"9643":{"n":"black bear","s":"Ursus americanus","p":"9639","x":"The American black bear, or simply black bear, is a species of medium-sized bear which is endemic to North America. It is the continent's smallest and most widely distributed bear species.","u":"https://en.wikipedia.org/wiki/American_black_bear","i":"img/9643.jpg"},"8624":{"n":"black mamba","s":"Dendroaspis polylepis","p":"42168","x":"The black mamba is a species of highly venomous snake belonging to the family Elapidae. It is native to parts of sub-Saharan Africa.","u":"https://en.wikipedia.org/wiki/Black_mamba","i":"img/8624.jpg"},"33614":{"n":"black vulture","s":"Coragyps atratus","p":"8922","x":"The black vulture, also known as the American black vulture, Mexican vulture, zopilote, urubu, or gallinazo, is a bird in the New World vulture family whose range extends from the northeastern United States to Peru, Central Chile and Uruguay in South America, and common throughout Brazil where it can be seen in large…","u":"https://en.wikipedia.org/wiki/Black_vulture","i":"img/33614.jpg"},"6925":{"n":"black widow","s":"Latrodectus tredecimguttatus","p":"74975","x":"Latrodectus tredecimguttatus, also known as the Mediterranean black widow or the European black widow, is a species in the genus Latrodectus of the widow spiders. It is commonly found throughout the Mediterranean region and central Asia, hence the name.","u":"https://en.wikipedia.org/wiki/Latrodectus_tredecimguttatus","i":"img/6925.jpg"},"9187":{"n":"blackbird","s":"Turdus merula","p":"9126","x":"The common blackbird is a species of true thrush. It is also known as the Eurasian blackbird, or simply the blackbird.","u":"https://en.wikipedia.org/wiki/Common_blackbird","i":"img/9187.jpg"},"28727":{"n":"blue jay","s":"Cyanocitta cristata","p":"28725","x":"The blue jay is a passerine bird in the family Corvidae, native to eastern North America. It lives in most of the eastern and central United States; some eastern populations may be migratory.","u":"https://en.wikipedia.org/wiki/Blue_jay","i":"img/28727.jpg"},"9771":{"n":"blue whale","s":"Balaenoptera musculus","p":"9765","x":"The blue whale is a species of baleen whale and the largest marine mammal in the rorqual family Balaenopteridae. Reaching a maximum confirmed length of 29.9–30.5 m (98–100 ft) and weighing up to 190–200 t, it is the largest animal known to have ever existed.","u":"https://en.wikipedia.org/wiki/Blue_whale","i":"img/9771.jpg"},"37087":{"n":"blue-footed booby","s":"Sula nebouxii","p":"3073812","x":"The blue-footed booby is a species of marine bird in the family Sulidae. The species, native to subtropical and tropical regions of the eastern Pacific Ocean, is one of six species of the genus Sula, commonly known as boobies.","u":"https://en.wikipedia.org/wiki/Blue-footed_booby","i":"img/37087.jpg"},"102866":{"n":"blue-ringed octopus","s":"Hapalochlaena lunulata","p":"6647","x":"The greater blue-ringed octopus is one of four species of extremely venomous blue-ringed octopuses belonging to the family Octopodidae. This particular species of blue-ringed octopus is known as one of the most toxic marine animals in the world.","u":"https://en.wikipedia.org/wiki/Greater_blue-ringed_octopus","i":"img/102866.jpg"},"8574":{"n":"boa constrictor","s":"Boa constrictor","p":"8572","x":"The boa constrictor, also known as the common boa, is a species of large, non-venomous, heavy-bodied snake that is frequently kept and bred in captivity. The boa constrictor is a member of the family Boidae.","u":"https://en.wikipedia.org/wiki/Boa_constrictor","i":"img/8574.jpg"},"61384":{"n":"bobcat","s":"Lynx rufus","p":"13124","x":"The bobcat, also known as the wildcat, bay lynx, or red lynx, is one of the four extant species within the medium-sized wild cat genus Lynx. Native to North America, it ranges from southern Canada through most of the contiguous United States to Oaxaca in Mexico.","u":"https://en.wikipedia.org/wiki/Bobcat","i":"img/61384.jpg"},"9597":{"n":"bonobo","s":"Pan paniscus","p":"9596","x":"The bonobo, also historically called the pygmy chimpanzee, is the smallest species of great ape and one of the two making up the genus Pan. While bonobos are today recognized as a distinct species, they were initially thought to be a subspecies of Pan troglodytes, because of the physical similarities between the two…","u":"https://en.wikipedia.org/wiki/Bonobo","i":"img/9597.jpg"},"158814":{"n":"box turtle","s":"Terrapene carolina","p":"8486","x":"The common box turtle is a species of box turtle with five existing subspecies. It is found throughout the Eastern United States and Mexico.","u":"https://en.wikipedia.org/wiki/Common_box_turtle","i":"img/158814.jpg"},"242715":{"n":"brain coral","s":"Diploria labyrinthiformis","p":"6102","x":"Diploria is a monotypic genus of massive reef building stony corals in the family Mussidae. It is represented by a single species, Diploria labyrinthiformis, commonly known as grooved brain coral, and is found in the western Atlantic Ocean and Caribbean Sea.","u":"https://en.wikipedia.org/wiki/Diploria","i":"img/242715.jpg"},"9644":{"n":"brown bear","s":"Ursus arctos","p":"9639","x":"The brown bear is a large bear native to Eurasia and North America. Of the land carnivorans, it is rivaled in size only by its closest relative, the polar bear, which is much less variable in size and slightly bigger on average.","u":"https://en.wikipedia.org/wiki/Brown_bear","i":"img/9644.jpg"},"6921":{"n":"brown recluse","s":"Loxosceles reclusa","p":"74970","x":"The brown recluse is a recluse spider with necrotic venom. Similar to those of other recluse spiders, their bites sometimes require medical attention.","u":"https://en.wikipedia.org/wiki/Brown_recluse_spider","i":"img/6921.jpg"},"8400":{"n":"bullfrog","s":"Aquarana catesbeiana","p":"8416","x":"The American bullfrog, often simply known as the bullfrog in Canada and the United States, is a species of large frog in the family Ranidae. The species is native to eastern North America.","u":"https://en.wikipedia.org/wiki/American_bullfrog","i":"img/8400.jpg"},"132113":{"n":"bumble bee","s":"Bombus impatiens","p":"70987","x":"Bombus impatiens, the common eastern bumblebee, is the most commonly encountered bumblebee across much of eastern North America. They can be found in the Eastern temperate forest region of the eastern United States, southern Canada, and the eastern Great Plains.","u":"https://en.wikipedia.org/wiki/Bombus_impatiens","i":"img/132113.jpg"},"176946":{"n":"burmese python","s":"Python bivittatus","p":"34984","x":"The Burmese python is one of the largest species of snakes. It is native to a large area of Southeast Asia and is listed as Vulnerable on the IUCN Red List.","u":"https://en.wikipedia.org/wiki/Burmese_python","i":"img/176946.jpg"},"190476":{"n":"caiman","s":"Caiman latirostris","p":"1294636","x":"The broad-snouted caiman is a crocodilian in the family Alligatoridae found in eastern and central South America, including the Pantanal habitat of Bolivia, Southeast Brazil, and Paraguay, as well as northern Argentina and Uruguay. Behind the black caiman, it is the second-largest caiman species; it is the…","u":"https://en.wikipedia.org/wiki/Broad-snouted_caiman","i":"img/190476.jpg"},"9838":{"n":"camel","s":"Camelus dromedarius","p":"9835","x":"The dromedary, also known as the dromedary camel, Arabian camel and one-humped camel, is a large camel of the genus Camelus with one hump on its back. It is the tallest of the three camel species; adult males stand 1.8–2.4 m (5.9–7.9 ft) at the shoulder, while females are 1.7–1.9 m (5.6–6.2 ft) tall.","u":"https://en.wikipedia.org/wiki/Dromedary","i":"img/9838.jpg"},"163847":{"n":"canary","s":"Crithagra flaviventris","p":"9133","x":"The yellow canary  is a small passerine bird in the true finch family. It is a resident breeder in much of the western and central regions of southern Africa and has been introduced to Ascension and St Helena islands.","u":"https://en.wikipedia.org/wiki/Yellow_canary","i":"img/163847.jpg"},"37295":{"n":"capuchin","s":"Cebus olivaceus","p":"9498","x":"The wedge-capped capuchin or Guianan weeper capuchin is a capuchin monkey from South America. It is found in northern Brazil, Guyana and Venezuela.","u":"https://en.wikipedia.org/wiki/Wedge-capped_capuchin","i":"img/37295.jpg"},"10149":{"n":"capybara","s":"Hydrochoerus hydrochaeris","p":"33550","x":"The capybara or greater capybara is the largest living rodent, native to all countries in South America except Chile. It is a semiaquatic herbivore that inhabits savannas and dense forests, living near and in bodies of freshwater and feeding mainly on grasses and aquatic plants.","u":"https://en.wikipedia.org/wiki/Capybara","i":"img/10149.jpg"},"9870":{"n":"caribou","s":"Rangifer tarandus","p":"9881","x":"The reindeer or caribou is a species of deer with circumpolar distribution, native to the Arctic, subarctic, tundra, boreal, and mountainous regions of Northern Europe, Siberia, and North America. It is the only representative of the genus Rangifer.","u":"https://en.wikipedia.org/wiki/Reindeer","i":"img/9870.jpg"},"7962":{"n":"carp","s":"Cyprinus carpio","p":"2743694","x":"The common carp, also known as European carp, Eurasian carp, or simply carp, is a widespread freshwater fish of eutrophic waters in lakes and large rivers in Europe and Asia. The native wild populations are considered vulnerable to extinction by the International Union for Conservation of Nature (IUCN), but the…","u":"https://en.wikipedia.org/wiki/Common_carp","i":"img/7962.jpg"},"104421":{"n":"carpenter ant","s":"Camponotus floridanus","p":"36668","x":"Camponotus floridanus, or Florida car
