&lt;script&gt;
/* Metavita info window (pasted into the tree and the trainer by build_trainer.py at the INFOWIN marker).
   Docked as a column on the right or left, or floating anywhere.
   - drag the title bar to float it; drag it against the left or right edge of the window to snap it back into a column
   - floating: resize from either bottom corner
   - docked: drag the inner edge for width, the bottom edge for height */
function makeInfoWin({ store, top = () =&gt; 0, onClose = () =&gt; {}, onLayout = () =&gt; {} }) {
  const el = document.createElement(&#x27;div&#x27;); el.id = &#x27;info&#x27;; el.className = &#x27;glass&#x27;;
  const ghost = document.createElement(&#x27;div&#x27;); ghost.className = &#x27;snap-ghost&#x27;;
  document.body.append(el, ghost);
  let dock = store.get(&#x27;infoDock&#x27;, &#x27;right&#x27;);           // &#x27;right&#x27; | &#x27;left&#x27; | null (floating)
  if (dock === true) dock = &#x27;right&#x27;; if (dock === false) dock = null;  // older saved value
  let pos = store.get(&#x27;infoPos&#x27;, null), size = store.get(&#x27;infoSize&#x27;, null);
  let dockW = store.get(&#x27;infoW&#x27;, 400), dockH = store.get(&#x27;infoH&#x27;, null);  // dockH null = full height
  const narrow = () =&gt; innerWidth &lt;= 640;
  const save = () =&gt; { store.set(&#x27;infoDock&#x27;, dock); store.set(&#x27;infoPos&#x27;, pos); store.set(&#x27;infoSize&#x27;, size); store.set(&#x27;infoW&#x27;, dockW); store.set(&#x27;infoH&#x27;, dockH); };

  function place() {
    const t = top(), s = el.style;
    el.classList.toggle(&#x27;docked&#x27;, !!dock); el.classList.toggle(&#x27;float&#x27;, !dock);
    el.classList.toggle(&#x27;left&#x27;, dock === &#x27;left&#x27;); el.classList.toggle(&#x27;right&#x27;, dock === &#x27;right&#x27;);
    el.classList.remove(&#x27;short&#x27;);
    s.left = s.right = s.top = s.width = s.height = s.maxHeight = s.bottom = &#x27;&#x27;;
    if (dock &amp;&amp; narrow()) { s.top = &#x27;&#x27;; }                // phone: bottom sheet (CSS)
    else if (dock) {
      s.top = t + &#x27;px&#x27;; s[dock] = &#x27;0&#x27;;
      s.width = Math.min(dockW, innerWidth - 120) + &#x27;px&#x27;;
      const full = innerHeight - t;
      el.classList.toggle(&#x27;short&#x27;, !!dockH &amp;&amp; dockH &lt; full - 4);
      if (dockH &amp;&amp; dockH &lt; full) s.height = Math.max(140, dockH) + &#x27;px&#x27;; else s.bottom = &#x27;0&#x27;;
    } else {
      const w = Math.min(size ? size[0] : 420, innerWidth - 16);
      s.width = w + &#x27;px&#x27;;
      if (size) { s.height = Math.min(size[1], innerHeight - 16) + &#x27;px&#x27;; s.maxHeight = &#x27;none&#x27;; }
      const p = pos || [innerWidth - w - 16, t + 16];
      s.left = Math.min(Math.max(0, p[0]), innerWidth - w) + &#x27;px&#x27;;
      s.top = Math.min(Math.max(0, p[1]), innerHeight - 60) + &#x27;px&#x27;;
    }
    const shown = el.classList.contains(&#x27;show&#x27;) &amp;&amp; dock &amp;&amp; !narrow() ? el.offsetWidth : 0;
    document.documentElement.style.setProperty(&#x27;--dock-l&#x27;, (dock === &#x27;left&#x27; ? shown : 0) + &#x27;px&#x27;);
    document.documentElement.style.setProperty(&#x27;--dock-r&#x27;, (dock === &#x27;right&#x27; ? shown : 0) + &#x27;px&#x27;);
    onLayout();
  }

  function show(title, html) {
    el.innerHTML = `&lt;div class=&quot;grip&quot; title=&quot;Drag to move · drag to the left or right edge to make it a column&quot;&gt;&lt;h2&gt;${title}&lt;/h2&gt;` +
      `&lt;button class=&quot;dk&quot; title=&quot;Make it a column on the right&quot;&gt;⇥&lt;/button&gt;&lt;button class=&quot;x&quot; title=&quot;Close&quot;&gt;×&lt;/button&gt;&lt;/div&gt;` +
      `&lt;div class=&quot;scroll&quot;&gt;${html}&lt;/div&gt;` +
      `&lt;div class=&quot;rz rz-e&quot; title=&quot;Drag to resize&quot;&gt;&lt;/div&gt;&lt;div class=&quot;rz rz-b&quot; title=&quot;Drag to change the height&quot;&gt;&lt;/div&gt;` +
      `&lt;div class=&quot;rz rz-bl&quot; title=&quot;Drag to resize&quot;&gt;&lt;/div&gt;&lt;div class=&quot;rz rz-br&quot; title=&quot;Drag to resize&quot;&gt;&lt;/div&gt;`;
    el.classList.add(&#x27;show&#x27;); place();
    el.querySelector(&#x27;.dk&#x27;).onclick = () =&gt; { dock = &#x27;right&#x27;; save(); place(); };
    el.querySelector(&#x27;.x&#x27;).onclick = () =&gt; { hide(); onClose(); };
    return el.querySelector(&#x27;.scroll&#x27;);
  }
  function hide() { el.classList.remove(&#x27;show&#x27;); place(); }

  // pointer handling: move, snap, resize
  let act = null;
  const SNAP = 24;
  const zone = x =&gt; x &lt;= SNAP ? &#x27;left&#x27; : x &gt;= innerWidth - SNAP ? &#x27;right&#x27; : null;
  el.addEventListener(&#x27;pointerdown&#x27;, e =&gt; {
    if (e.button) return;
    const b = el.getBoundingClientRect(), h = e.target.closest(&#x27;.rz&#x27;);
    if (h) act = { kind: [...h.classList].find(c =&gt; c !== &#x27;rz&#x27;).slice(3), x: e.clientX, y: e.clientY, b };
    else if (e.target.closest(&#x27;.grip&#x27;) &amp;&amp; !e.target.closest(&#x27;button&#x27;)) {
      if (dock) {  // tear the column off into a window under the pointer
        const w = Math.min(size ? size[0] : 420, innerWidth - 16), fx = Math.min(Math.max(0, e.clientX - w / 2), innerWidth - w);
        dock = null; pos = [fx, b.top]; place();
      }
      const nb = el.getBoundingClientRect();
      act = { kind: &#x27;move&#x27;, dx: e.clientX - nb.left, dy: e.clientY - nb.top };
    } else return;
    act.id = e.pointerId; el.classList.add(&#x27;busy&#x27;);
    el.setPointerCapture(e.pointerId); e.preventDefault();
  });
  el.addEventListener(&#x27;pointermove&#x27;, e =&gt; {
    if (!act || e.pointerId !== act.id) return;
    const dx = e.clientX - act.x, dy = e.clientY - act.y, b = act.b;
    if (act.kind === &#x27;move&#x27;) {
      pos = [e.clientX - act.dx, e.clientY - act.dy]; place();
      const z = narrow() ? null : zone(e.clientX);   // Aero-style snap preview
      ghost.className = &#x27;snap-ghost&#x27; + (z ? &#x27; on &#x27; + z : &#x27;&#x27;); act.snap = z;
      if (z) { ghost.style.top = top() + &#x27;px&#x27;; ghost.style.width = Math.min(dockW, innerWidth - 120) + &#x27;px&#x27;; }
      return;
    }
    if (act.kind === &#x27;e&#x27;) dockW = Math.max(260, Math.min(innerWidth - 120, b.width + (dock === &#x27;left&#x27; ? dx : -dx)));
    else if (act.kind === &#x27;b&#x27;) dockH = Math.max(140, b.height + dy);
    else {  // floating corners
      const w = Math.max(260, act.kind === &#x27;bl&#x27; ? b.width - dx : b.width + dx), h = Math.max(160, b.height + dy);
      size = [w, h]; if (act.kind === &#x27;bl&#x27;) pos = [b.right - w, b.top]; else pos = [b.left, b.top];
    }
    place();
  });
  const end = e =&gt; {
    if (!act || e.pointerId !== act.id) return;
    if (act.kind === &#x27;move&#x27; &amp;&amp; act.snap) { dock = act.snap; }
    if (act.kind === &#x27;b&#x27; &amp;&amp; dockH &gt;= innerHeight - top() - 4) dockH = null;  // dragged back to the bottom: full height again
    ghost.className = &#x27;snap-ghost&#x27;; el.classList.remove(&#x27;busy&#x27;); act = null; save(); place();
  };
  el.addEventListener(&#x27;pointerup&#x27;, end); el.addEventListener(&#x27;pointercancel&#x27;, end);
  addEventListener(&#x27;resize&#x27;, place);
  place();
  return { el, show, hide, place, isOpen: () =&gt; el.classList.contains(&#x27;show&#x27;),
    dockSide: () =&gt; (el.classList.contains(&#x27;show&#x27;) &amp;&amp; dock &amp;&amp; !narrow()) ? dock : null, width: () =&gt; el.offsetWidth };
}

/* Shared description: Wikipedia summary, picture, etymology, lineage. opts.members=false hides the example animal list. */
function infoHTML(G, x, { noun = &#x27;animals&#x27;, members = true } = {}) {
  const esc = s =&gt; String(s).replace(/[&amp;&lt;&gt;&quot;]/g, c =&gt; ({ &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27; })[c]);
  if (!G._kids) {
    G._kids = {};
    for (const [id, n] of Object.entries(G.nodes)) if (n.p) (G._kids[n.p] = G._kids[n.p] || []).push(id);
    for (const [id, l] of Object.entries(G.leaves)) (G._kids[l.p] = G._kids[l.p] || []).push(id);
  }
  const kids = G._kids, leaf = !!G.leaves[x], n = leaf ? G.leaves[x] : G.nodes[x];
  const nm = id =&gt; (G.nodes[id] || G.leaves[id]).n;
  const anc = []; for (let p = n.p; p; p = G.nodes[p].p) anc.unshift(p);
  const crumb = anc.map(a =&gt; `&lt;a data-id=&quot;${a}&quot;&gt;${esc(nm(a))}&lt;/a&gt;`).join(&#x27; › &#x27;);
  let body = &#x27;&#x27;;
  if (leaf) body = `&lt;div class=&quot;meta&quot;&gt;&lt;i&gt;${esc(n.s)}&lt;/i&gt;&lt;/div&gt;`;
  else {
    const all = []; (function walk(y) { if (G.leaves[y]) all.push(G.leaves[y].n); else (kids[y] || []).forEach(walk); })(x);
    const sub = (kids[x] || []).filter(c =&gt; !G.leaves[c]).length, direct = (kids[x] || []).filter(c =&gt; G.leaves[c]).length;
    body = `&lt;div class=&quot;meta&quot;&gt;${esc(n.d || n.r)} · ${all.length} ${noun}` +
      (sub ? ` · ${sub} sub-clade${sub &gt; 1 ? &#x27;s&#x27; : &#x27;&#x27;}` : &#x27;&#x27;) + (direct ? ` · ${direct} directly` : &#x27;&#x27;) + `&lt;/div&gt;` +
      (members ? `&lt;div class=&quot;ex&quot;&gt;${all.slice(0, 8).map(esc).join(&#x27;, &#x27;)}${all.length &gt; 8 ? ` +${all.length - 8} more` : &#x27;&#x27;}&lt;/div&gt;` : &#x27;&#x27;);
  }
  // etymology lines are our own trusted HTML from the build
  const ety = n.e ? `&lt;div class=&quot;ety&quot;&gt;${n.e}${n.ep ? `&lt;div class=&quot;pie&quot;&gt;${n.ep}&lt;/div&gt;` : &#x27;&#x27;}&lt;/div&gt;` : &#x27;&#x27;;
  const wk = (n.x || n.i || ety) ? `&lt;div class=&quot;wk&quot;&gt;${n.i ? `&lt;img src=&quot;${n.i}&quot; alt=&quot;&quot; onerror=&quot;this.remove()&quot;&gt;` : &#x27;&#x27;}&lt;div&gt;${ety}` +
    (n.x ? `&lt;div class=&quot;sum&quot;&gt;${esc(n.x)}${n.u ? ` &lt;a href=&quot;${esc(n.u)}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia →&lt;/a&gt;` : &#x27;&#x27;}&lt;/div&gt;` : &#x27;&#x27;) +
    (n.si ? `&lt;div class=&quot;si&quot;&gt;No Wikipedia article for ${esc(nm(x))}; showing ${esc(n.si)}.&lt;/div&gt;` : &#x27;&#x27;) + `&lt;/div&gt;&lt;/div&gt;` : &#x27;&#x27;;
  return `${body}${wk}&lt;div class=&quot;crumb&quot;&gt;${crumb || &#x27;Top of the tree&#x27;}&lt;/div&gt;`;
}

const DATA = window.parent.METAVITA_DATA;

&lt;body&gt;
&lt;main&gt;

&lt;script&gt;
const DATA = window.parent.METAVITA_DATA;
const $ = id =&gt; document.getElementById(id);
if (window.parent !== window) document.documentElement.classList.add(&#x27;embedded&#x27;);
const readTheme = () =&gt; { try { return JSON.parse(localStorage.getItem(&#x27;treeRef:theme&#x27;)) || &#x27;dark&#x27;; } catch (e) { return &#x27;dark&#x27;; } };

const store = {

const GAMES = [[&#x27;animals&#x27;, &#x27;Animals&#x27;, &#x27;animals&#x27;], [&#x27;plants&#x27;, &#x27;Plants&#x27;, &#x27;plants&#x27;], [&#x27;microbes&#x27;, &#x27;Microbes&#x27;, &#x27;microbes&#x27;]];
const SIZES = { s: [5, 13], m: [12, 25], l: [22, 42] };
const PICK_CAP = 45;  // a clade picked by hand is cut off below the level where it would pass this many names

let game = store.get(&#x27;game&#x27;, &#x27;animals&#x27;), mode = store.get(&#x27;mode&#x27;, &#x27;fill&#x27;), size = store.get(&#x27;size&#x27;, &#x27;m&#x27;);
let G, kids, root, L, deckCount, PK, SZ, T = null, active = null, picked = null;
const nm = id =&gt; (G.nodes[id] || G.leaves[id]).n;
const isLeaf = id =&gt; !!G.leaves[id];

/* ---------- which part of the tree: the decks checked under Practice ---------- */
function studied() {

  const ds = ((S &amp;&amp; S.decks) || []).filter(d =&gt; G.decks.some(x =&gt; x[0] === d));
  return { n: ds.length, leaves: ds.length ? new Set(G.decks.filter(d =&gt; ds.includes(d[0])).flatMap(d =&gt; d[1])) : null };
}
function refreshPool() {  // prune the tree to studied animals; PK = kept children, SZ = names in the pruned subtree
  const st = studied(); L = st.leaves; deckCount = st.n; PK = {}; SZ = {};
  (function walk(x) {
    if (isLeaf(x)) return (!L || L.has(x)) ? 1 : 0;
    let s = 1; const keep = [];
    for (const c of kids[x] || []) { const k = walk(c); if (k) { keep.push(c); s += k; } }
    PK[x] = keep; SZ[x] = keep.length ? s : 0; return SZ[x];
  })(root);
  const n = L ? L.size : Object.keys(G.leaves).length;
  $(&#x27;setline&#x27;).innerHTML = (deckCount ? `From your &lt;b&gt;${deckCount} studied deck${deckCount &gt; 1 ? &#x27;s&#x27; : &#x27;&#x27;}&lt;/b&gt; · ${n} ${GAMES.find(g =&gt; g[0] === game)[2]}`
    : `From &lt;b&gt;every deck&lt;/b&gt; · ${n} ${GAMES.find(g =&gt; g[0] === game)[2]}`) +
    ` · &lt;a id=&quot;chgDecks&quot;&gt;change in Practice&lt;/a&gt;`;
  $(&#x27;chgDecks&#x27;).onclick = () =&gt; { if (window.parent !== window &amp;&amp; window.parent.metavitaShow) window.parent.metavitaShow(&#x27;practice&#x27;); else location.href = &#x27;clade-trainer.html&#x27;; };
}

function load(g) {
  game = g; G = DATA[g]; store.set(&#x27;game&#x27;, g); kids = {};
  for (const [id, n] of Object.entries(G.nodes)) if (n.p) (kids[n.p] = kids[n.p] || []).push(id);
  for (const [id, l] of Object.entries(G.leaves)) (kids[l.p] = kids[l.p] || []).push(id);
  root = Object.keys(G.nodes).find(id =&gt; !G.nodes[id].p);
  const tips = {}; const count = id =&gt; tips[id] ?? (tips[id] = isLeaf(id) ? 1 : (kids[id] || []).reduce((s, c) =&gt; s + count(c), 0)); count(root);
  for (const k in kids) kids[k].sort((a, b) =&gt; (isLeaf(a) - isLeaf(b)) || tips[b] - tips[a] || nm(a).localeCompare(nm(b)));
  $(&#x27;tabs&#x27;).innerHTML = &#x27;&#x27;;
  for (const [gg, label] of GAMES) {
    const b = document.createElement(&#x27;button&#x27;); b.textContent = label; b.className = gg === game ? &#x27;on&#x27; : &#x27;&#x27;;
    b.onclick = () =&gt; { if (gg !== game) load(gg); }; $(&#x27;tabs&#x27;).append(b);
  }
  refreshPool(); newTree();
}

/* ---------- choose and cut a skeleton ---------- */
function candidates() {
  const [lo, hi] = SIZES[size], ids = Object.keys(PK).filter(x =&gt; PK[x].length &gt;= 2);
  let c = ids.filter(x =&gt; SZ[x] &gt;= lo &amp;&amp; SZ[x] &lt;= hi);
  if (!c.length) { const mid = (lo + hi) / 2; c = ids.sort((a, b) =&gt; Math.abs(SZ[a] - mid) - Math.abs(SZ[b] - mid)).slice(0, 5); }
  return c;
}
function newTree(rootId, byHand = !!rootId) {
  if (rootId &amp;&amp; !(PK[rootId] &amp;&amp; PK[rootId].length)) { rootId = null; byHand = false; }  // not in the studied decks (any more)
  let r = rootId;
  if (!r) {

    const fresh = c.filter(x =&gt; !recent.includes(x)), from = fresh.length ? fresh : c;
    if (!from.length) { T = null; draw(); return; }
    r = from[Math.floor(Math.random() * from.length)];
    store.set(&#x27;recent:&#x27; + game, [r, ...recent.filter(x =&gt; x !== r)].slice(0, Math.min(8, Math.max(1, c.length - 1))));
  }
  // take whole levels until the next one would pass the cap; clades at the cut stay closed (shown with a count)
  const cap = byHand ? PICK_CAP : SIZES[size][1];
  const parent = { [r]: null }, depth = { [r]: 0 }, shownKids = {}, stub = new Set();
  let level = [r], total = 1;
  while (level.length) {

    if (!next.length) break;
    if (total + next.length &gt; cap &amp;&amp; total &gt; 1) { level.forEach(x =&gt; { if (!isLeaf(x) &amp;&amp; PK[x].length) stub.add(x); }); break; }
    for (const x of level) if (!isLeaf(x)) { shownKids[x] = PK[x]; for (const c of PK[x]) { parent[c] = x; depth[c] = depth[x] + 1; } }
    total += next.length; level = next;
  }
  const order = []; (function dfs(x) { order.push(x); (shownKids[x] || []).forEach(dfs); })(r);
  const blanks = order.filter(x =&gt; x !== r);
  let hidden;
  if (mode === &#x27;rebuild&#x27;) hidden = new Set(blanks);
  else {  // about half, never zero
    const sh = blanks.slice().sort(() =&gt; Math.random() - .5);
    hidden = new Set(sh.slice(0, Math.max(1, Math.round(blanks.length / 2))));
  }
  T = { r, byHand, order, parent, depth, shownKids, stub, hidden, placed: {}, marks: {}, done: false };
  active = order.find(x =&gt; hidden.has(x)) || null; picked = null; needFit = true;
  $(&#x27;result&#x27;).innerHTML = &#x27;&#x27;; $(&#x27;result&#x27;).className = &#x27;result&#x27;;
  draw();
}

/* ---------- layout: root on the left, one row per tip ---------- */
const meas = document.createElement(&#x27;canvas&#x27;).getContext(&#x27;2d&#x27;);
const tw = (s, bold) =&gt; { meas.font = `${bold ? 700 : 400} 13px &quot;Lucida Grande&quot;, &quot;Segoe UI&quot;, &quot;Frutiger&quot;, &quot;Myriad Pro&quot;, -apple-system, Helvetica, Arial, sans-serif`; return meas.measureText(s).width; };
function draw() {
  const cv = $(&#x27;canvas&#x27;);
  if (!T) {
    cv.innerHTML = `&lt;div class=&quot;empty-msg&quot;&gt;Nothing to build from these decks yet. Check more decks under Practice, or pick a smaller size.&lt;/div&gt;`;
    cv.style.width = cv.style.height = &#x27;&#x27;; $(&#x27;title&#x27;).innerHTML = &#x27;&#x27;; $(&#x27;bank&#x27;).innerHTML = &#x27;&#x27;; return;
  }
  const ROW = 38, GAP = 36, stubW = 34, BH = 28, ROWV = 74, HGAP = 12;
  const colW = [];  // one width per level, so a blank&#x27;s size never hints at its name
  for (const x of T.order) { const d = T.depth[x]; colW[d] = Math.max(colW[d] || 90, tw(nm(x), !isLeaf(x)) + 22 + (T.stub.has(x) ? stubW : 0)); }

  let W, H;
  if (!vert) {      // root on the left, one row per tip

    let row = 0; const y = {};

    })(T.r);

  } else {          // root on top, tips spread along the bottom
    const SW = {};
    const width = x =&gt; SW[x] ?? (SW[x] = Math.max(colW[T.depth[x]] + HGAP, (T.shownKids[x] || []).reduce((t, c) =&gt; t + width(c), 0)));
    width(T.r);

  let svg = `&lt;svg width=&quot;${W}&quot; height=&quot;${H}&quot;&gt;`;
  for (const x of T.order) if (T.parent[x]) {

    if (!vert) { const x1 = pl + pw, y1 = pt + BH / 2, mx = x1 + GAP / 2; svg += `&lt;path d=&quot;M${x1},${y1} H${mx} V${ct + BH / 2} H${cl}&quot;/&gt;`; }
    else { const px = pl + pw / 2, cx = cl + cw / 2, my = pt + BH + (ct - pt - BH) / 2; svg += `&lt;path d=&quot;M${px},${pt + BH} V${my} H${cx} V${ct}&quot;/&gt;`; }
  }
  cv.innerHTML = svg + &#x27;&lt;/svg&gt;&#x27;;
  for (const x of T.order) {

    b.className = &#x27;node &#x27; + (clade ? &#x27;clade&#x27; : &#x27;leaf&#x27;); b.dataset.id = x;
    b.style.left = box[x][0] + &#x27;px&#x27;; b.style.top = box[x][1] + &#x27;px&#x27;; b.style.width = box[x][2] + &#x27;px&#x27;;
    const more = T.stub.has(x) ? ` &lt;small&gt;+${SZ[x] - 1}&lt;/small&gt;` : &#x27;&#x27;;
    if (!T.hidden.has(x)) { b.className += &#x27; given&#x27; + (x === T.r ? &#x27; root&#x27; : &#x27;&#x27;); b.innerHTML = esc(nm(x)) + more; b.tabIndex = -1; }
    else {

      b.innerHTML = v ? esc(nm(v)) + more : (clade ? &#x27;clade?&#x27; : &#x27;?&#x27;) + more;
      b.title = v ? &#x27;Click to give this name back&#x27; : &#x27;Click, then pick a name below&#x27;;
      b.onclick = () =&gt; { if (!panMoved) slotClick(x); };
    }

  }

  if (needFit) { needFit = false; fit(); }
  else if (active &amp;&amp; box[active]) keepVisible(box[active]);
  const s = SZ[T.r] - 1, hid = T.hidden.size;
  $(&#x27;title&#x27;).innerHTML = `&lt;b&gt;${esc(nm(T.r))}&lt;/b&gt;&lt;span&gt;${esc(G.nodes[T.r].d || G.nodes[T.r].r)} · ${T.order.length - 1} names shown · ${hid} blank` +
    (T.stub.size ? ` · deeper levels folded (${s} below in all)` : &#x27;&#x27;) + `&lt;/span&gt;`;
  drawBank();
  const st = store.get(&#x27;stats:&#x27; + game, { done: 0, perfect: 0 });
  $(&#x27;stats&#x27;).textContent = st.done ? `${GAMES.find(g =&gt; g[0] === game)[1]}: ${st.perfect} of ${st.done} trees perfect` : &#x27;&#x27;;
  $(&#x27;checkBtn&#x27;).disabled = $(&#x27;showBtn&#x27;).disabled = $(&#x27;clearBtn&#x27;).disabled = T.done;
}
let bankOpen = store.get(&#x27;bankOpen&#x27;, true);
function setBank() {

  $(&#x27;filter&#x27;).placeholder = bankOpen ? &#x27;Type a name, Enter to place it&#x27; : &#x27;Type the full name, Enter to place it&#x27;;
}
$(&#x27;bankToggle&#x27;).onclick = () =&gt; { bankOpen = !bankOpen; store.set(&#x27;bankOpen&#x27;, bankOpen); setBank(); if (T) drawBank(); $(&#x27;filter&#x27;).focus(); };
setBank();
function drawBank() {

&lt;script&gt;
/* Metavita info window (pasted into the tree and the trainer by build_trainer.py at the INFOWIN marker).

   - drag the title bar to float it; drag it against the left or right edge of the window to snap it back into a column
   - floating: resize from either bottom corner

  const el = document.createElement(&#x27;div&#x27;); el.id = &#x27;info&#x27;; el.className = &#x27;glass&#x27;;

  document.body.append(el, ghost);
  let dock = store.get(&#x27;infoDock&#x27;, &#x27;right&#x27;);           // &#x27;right&#x27; | &#x27;left&#x27; | null (floating)
  if (dock === true) dock = &#x27;right&#x27;; if (dock === false) dock = null;  // older saved value
  let pos = store.get(&#x27;infoPos&#x27;, null), size = store.get(&#x27;infoSize&#x27;, null);
  let dockW = store.get(&#x27;infoW&#x27;, 400), dockH = store.get(&#x27;infoH&#x27;, null);  // dockH null = full height
  const narrow = () =&gt; innerWidth &lt;= 640;
  const save = () =&gt; { store.set(&#x27;infoDock&#x27;, dock); store.set(&#x27;infoPos&#x27;, pos); store.set(&#x27;infoSize&#x27;, size); store.set(&#x27;infoW&#x27;, dockW); store.set(&#x27;infoH&#x27;, dockH); };

  function place() {
    const t = top(), s = el.style;
    el.classList.toggle(&#x27;docked&#x27;, !!dock); el.classList.toggle(&#x27;float&#x27;, !dock);
    el.classList.toggle(&#x27;left&#x27;, dock === &#x27;left&#x27;); el.classList.toggle(&#x27;right&#x27;, dock === &#x27;right&#x27;);
    el.classList.remove(&#x27;short&#x27;);
    s.left = s.right = s.top = s.width = s.height = s.maxHeight = s.bottom = &#x27;&#x27;;
    if (dock &amp;&amp; narrow()) { s.top = &#x27;&#x27;; }                // phone: bottom sheet (CSS)
    else if (dock) {
      s.top = t + &#x27;px&#x27;; s[dock] = &#x27;0&#x27;;
      s.width = Math.min(dockW, innerWidth - 120) + &#x27;px&#x27;;
      const full = innerHeight - t;
      el.classList.toggle(&#x27;short&#x27;, !!dockH &amp;&amp; dockH &lt; full - 4);
      if (dockH &amp;&amp; dockH &lt; full) s.height = Math.max(140, dockH) + &#x27;px&#x27;; else s.bottom = &#x27;0&#x27;;
    } else {
      const w = Math.min(size ? size[0] : 420, innerWidth - 16);
      s.width = w + &#x27;px&#x27;;
      if (size) { s.height = Math.min(size[1], innerHeight - 16) + &#x27;px&#x27;; s.maxHeight = &#x27;none&#x27;; }
      const p = pos || [innerWidth - w - 16, t + 16];
      s.left = Math.min(Math.max(0, p[0]), innerWidth - w) + &#x27;px&#x27;;
      s.top = Math.min(Math.max(0, p[1]), innerHeight - 60) + &#x27;px&#x27;;

    const shown = el.classList.contains(&#x27;show&#x27;) &amp;&amp; dock &amp;&amp; !narrow() ? el.offsetWidth : 0;
    document.documentElement.style.setProperty(&#x27;--dock-l&#x27;, (dock === &#x27;left&#x27; ? shown : 0) + &#x27;px&#x27;);
    document.documentElement.style.setProperty(&#x27;--dock-r&#x27;, (dock === &#x27;right&#x27; ? shown : 0) + &#x27;px&#x27;);
    onLayout();
  }

  function show(title, html) {
    el.innerHTML = `&lt;div class=&quot;grip&quot; title=&quot;Drag to move · drag to the left or right edge to make it a column&quot;&gt;&lt;h2&gt;${title}&lt;/h2&gt;` +
      `&lt;button class=&quot;dk&quot; title=&quot;Make it a column on the right&quot;&gt;⇥&lt;/button&gt;&lt;button class=&quot;x&quot; title=&quot;Close&quot;&gt;×&lt;/button&gt;&lt;/div&gt;` +
      `&lt;div class=&quot;scroll&quot;&gt;${html}&lt;/div&gt;` +
      `&lt;div class=&quot;rz rz-e&quot; title=&quot;Drag to resize&quot;&gt;&lt;/div&gt;&lt;div class=&quot;rz rz-b&quot; title=&quot;Drag to change the height&quot;&gt;&lt;/div&gt;` +
      `&lt;div class=&quot;rz rz-bl&quot; title=&quot;Drag to resize&quot;&gt;&lt;/div&gt;&lt;div class=&quot;rz rz-br&quot; title=&quot;Drag to resize&quot;&gt;&lt;/div&gt;`;
    el.classList.add(&#x27;show&#x27;); place();
    el.querySelector(&#x27;.dk&#x27;).onclick = () =&gt; { dock = &#x27;right&#x27;; save(); place(); };
    el.querySelector(&#x27;.x&#x27;).onclick = () =&gt; { hide(); onClose(); };

  let act = null;
  const SNAP = 24;
  const zone = x =&gt; x &lt;= SNAP ? &#x27;left&#x27; : x &gt;= innerWidth - SNAP ? &#x27;right&#x27; : null;

    else if (e.target.closest(&#x27;.grip&#x27;) &amp;&amp; !e.target.closest(&#x27;button&#x27;)) {

        const w = Math.min(size ? size[0] : 420, innerWidth - 16), fx = Math.min(Math.max(0, e.clientX - w / 2), innerWidth - w);

/* ---------- search ---------- */
(function () {

    else if (e.key === &#x27;ArrowUp&#x27; &amp;&amp; shown.length) { hi = (hi - 1 + shown.length) % shown.length; draw(); e.preventDefault(); }
    else if (e.key === &#x27;Enter&#x27; &amp;&amp; shown.length) { pick(shown[hi]); e.preventDefault(); }

for (const [g, label] of GAMES) {
  const b = document.createElement(&#x27;button&#x27;); b.textContent = label; b.dataset.g = g;

}
window.addEventListener(&#x27;resize&#x27;, () =&gt; { setHeaderVar(); placeInfo(); applyCam(); });
setHeaderVar();
load(DATA[store.get(&#x27;game&#x27;, &#x27;animals&#x27;)] ? store.get(&#x27;game&#x27;, &#x27;animals&#x27;) : &#x27;animals&#x27;);

/* ---------- combined page (metavita.html) ---------- */
let fittedVisible = false;  // in metavita.html the tree may be laid out while its tab is hidden (0 x 0): fit again on first show
window.metavita = { game: () =&gt; game, load: g =&gt; { if (g !== game &amp;&amp; DATA[g]) load(g); },
  shown: () =&gt; { setHeaderVar(); placeInfo(); if (!fittedVisible) { fittedVisible = true; fit(); } } };
document.addEventListener(&#x27;click&#x27;, e =&gt; {
  const a = e.target.closest(&#x27;a[href$=&quot;.html&quot;]&#x27;);
  if (a &amp;&amp; window.parent !== window &amp;&amp; window.parent.metavitaShow) { e.preventDefault(); window.parent.metavitaShow(/tree/.test(a.getAttribute(&#x27;href&#x27;)) ? &#x27;tree&#x27; : &#x27;practice&#x27;); }
});

<script>
const $ = id => document.getElementById(id);
const get = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };

theme(); addEventListener('storage', e => { if (e.key === 'treeRef:theme') theme(); });
let cur = null;
window.metavitaShow = name => {
  if (name === cur) return;
  const from = cur && $('f-' + cur).contentWindow, to = $('f-' + name).contentWindow;
  try { if (from && from.metavita && to.metavita) to.metavita.load(from.metavita.game()); } catch (e) {}  // keep the same game (animals / plants / microbes)
  for (const n of ['practice', 'skeleton', 'tree']) { $('f-' + n).classList.toggle('on', n === name); $('b-' + n).classList.toggle('on', n === name); }
