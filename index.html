e","i":"img/1699513.jpg","e":"Latin <b>Myrtus<\/b> \"myrtle\" + <b>-oideae<\/b> \"subfamily\": eucalyptus, guava and cloves."},"163743":{"p":"2233839","n":"Fabeae","r":"tribe","d":"Tribe of legumes","x":"The tribe Fabeae is one of the subdivisions of the plant family Fabaceae. It is included within the Inverted repeat-lacking clade (IRLC).","u":"https://en.wikipedia.org/wiki/Fabeae","i":"img/163743.jpg","e":"Latin <b>Faba<\/b> \"bean\" + <b>-eae<\/b> \"tribe\": peas, lentils and broad beans."},"3853":{"p":"163743","n":"Lathyrus","r":"genus","d":"Genus of flowering plants","x":"Lathyrus is a genus of flowering plants in the legume family Fabaceae, and contains approximately 160 species. Commonly known as peavines or vetchlings, they are native to temperate areas, with a breakdown of 52 species in Europe, 30 species in North America, 78 in Asia, 24 in tropical East Africa, and 24 in temperate…","u":"https://en.wikipedia.org/wiki/Lathyrus","i":"img/3853.jpg","e":"Greek <b>λάθυρος<\/b> (<i>láthuros<\/i>), a kind of pulse: sweet peas and the garden pea."},"4678":{"p":"4668","n":"Allium","r":"genus","d":"Genus of flowering plants","x":"Allium is a large genus of monocotyledonous flowering plants with 1112 accepted species, making Allium the largest genus in the family Amaryllidaceae and among the largest plant genera in the world. Many of the species are edible, and some have a long history of cultivation and human consumption such as the onion,…","u":"https://en.wikipedia.org/wiki/Allium","i":"img/4678.jpg","e":"Latin <b>allium<\/b> \"garlic\": onions, garlic, leeks and chives."},"41946":{"p":"1437201","n":"Saxifragales","r":"order","d":"Order of flowering plants","x":"Saxifragales is an order of flowering plants in the superrosid clade of the eudicots. It contains 15 families and around 100 genera, with nearly 2,500 species.","u":"https://en.wikipedia.org/wiki/Saxifragales","i":"img/41946.jpg","e":"<b>Saxifraga<\/b>, Latin <b>saxum<\/b> \"rock\" + <b>frangere<\/b> \"to break\": \"rock-breakers,\" plants that grow in rock cracks. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"2231385":{"p":"2231393","n":"core genistoids","r":"clade","d":"Clade of legumes","x":"The Genistoids are one of the major radiations in the plant family Fabaceae. Members of this phylogenetic clade are primarily found in the Southern Hemisphere.","u":"https://en.wikipedia.org/wiki/Genistoids","i":"img/2231385.jpg","e":"<b>Genista<\/b>, the broom genus + <b>-oids<\/b> \"like\": lupins and their kin. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"1699523":{"p":"1699513","n":"Myrteae","r":"tribe","d":"Tribe of flowering plants in the myrtle family","x":"Myrteae is the largest tribe in the plant family Myrtaceae. It includes most of the species of the family that have fleshy fruits.","u":"https://en.wikipedia.org/wiki/Myrteae","i":"img/1699523.jpg","e":"Latin <b>Myrtus<\/b> \"myrtle\" + <b>-eae<\/b> \"tribe\": guava, cloves and allspice."},"3804":{"p":"3803","n":"Caesalpinioideae","r":"subfamily","d":"Subfamily of legumes","x":"Caesalpinioideae is a botanical name at the rank of subfamily, placed in the large family Fabaceae or Leguminosae. Its name is formed from the generic name Caesalpinia.","u":"https://en.wikipedia.org/wiki/Caesalpinioideae","i":"img/3804.jpg","e":"<b>Caesalpinia<\/b>, named for the Italian botanist Andrea Cesalpino + <b>-oideae<\/b> \"subfamily\". <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"3807":{"p":"3804","n":"mimosoid clade","r":"clade","d":"Subfamily of legumes","x":"The Mimosoideae are a traditional subfamily of trees, herbs, lianas, and shrubs in the pea family (Fabaceae) that mostly grow in tropical and subtropical climates. They are typically characterized by having radially symmetric flowers, with petals that are twice divided (valvate) in bud and possess numerous showy,…","u":"https://en.wikipedia.org/wiki/Mimosoideae","i":"img/3807.jpg","e":"<b>Mimosa<\/b>, from Greek <b>μῖμος<\/b> (<i>mîmos<\/i>) \"mimic\": for leaves that fold when touched, as if alive. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"3514":{"p":"3502","n":"Betulaceae","r":"family","d":"Family of flowering plants comprising hazel and birch trees","x":"Betulaceae, the birch family, includes six genera of deciduous nut-bearing trees and shrubs, including the birches, alders, hazels, hornbeams, hazel-hornbeam, and hop-hornbeams, numbering a total of 167 species. They are mostly natives of the temperate Northern Hemisphere, with a few species reaching the Southern…","u":"https://en.wikipedia.org/wiki/Betulaceae","i":"img/3514.jpg","e":"Latin <b>Betula<\/b> \"birch\" + <b>-aceae<\/b> \"family\": birches, alders and hazels."},"3481":{"p":"3744","n":"Cannabaceae","r":"family","d":"Family of flowering plants known as the hemp family","x":"Cannabaceae is a small family of flowering plants, known as the hemp family. As now circumscribed, the family includes about 170 species grouped in about 11 genera, including Cannabis (hemp), Humulus (hops) and Celtis (hackberries).","u":"https://en.wikipedia.org/wiki/Cannabaceae","i":"img/3481.jpg","e":"<b>Cannabis<\/b>, Greek <b>κάνναβις<\/b> (<i>kánnabis<\/i>) \"hemp\" + <b>-aceae<\/b> \"family\": hemp and hops."},"3928":{"p":"41944","n":"Lythraceae","r":"family","d":"Family of flowering plants","x":"Lythraceae is a family of flowering plants that includes 28 genera and about 620 species of herbs, shrubs, and trees. The larger genera include Cuphea, Lagerstroemia (56), Nesaea (50), Rotala (45), and Lythrum (35).","u":"https://en.wikipedia.org/wiki/Lythraceae","i":"img/3928.jpg","e":"<b>Lythrum<\/b>, Greek <b>λύθρον<\/b> (<i>lúthron<\/i>) \"gore,\" for its red flowers + <b>-aceae<\/b> \"family\": loosestrife, pomegranate and henna. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"980193":{"p":"3700","n":"Cardamineae","r":"tribe","d":"Genus of flowering plants in the cabbage family","x":"Cardamine is a large genus of flowering plants in the mustard family, Brassicaceae, known as bittercresses and toothworts. It contains more than 200 species of annuals and perennials.","u":"https://en.wikipedia.org/wiki/Cardamine","i":"img/980193.jpg","e":"<b>Cardamine<\/b>, Greek <b>καρδαμίνη<\/b> (<i>kardamínē<\/i>) \"watercress\" + <b>-eae<\/b> \"tribe\": watercress and horseradish."},"4144":{"p":"4143","n":"Oleaceae","r":"family","d":"Family of flowering plants","x":"Oleaceae, also known as the olive family or sometimes the lilac family, is a taxonomic family of flowering shrubs, trees, and a few lianas in the order Lamiales. It presently comprises 28 genera, one of which is recently extinct.","u":"https://en.wikipedia.org/wiki/Oleaceae","i":"img/4144.jpg","e":"Latin <b>Olea<\/b> \"olive\" + <b>-aceae<\/b> \"family\": olives, ash trees, lilac and jasmine."},"232378":{"p":"1437183","n":"Proteales","r":"order","d":"Order of eudicot flowering plants","x":"Proteales is an order of flowering plants consisting of three families. The Proteales have been recognized by almost all taxonomists.","u":"https://en.wikipedia.org/wiki/Proteales","i":"img/232378.jpg","e":"<b>Protea<\/b> + <b>-ales<\/b> \"order\": proteas, plane trees and the sacred lotus."},"23672":{"p":"41937","n":"Sapindaceae","r":"family","d":"Family of flowering plants","x":"The Sapindaceae are a family of flowering plants in the order Sapindales known as the soapberry family. It contains 138 genera and 1,858 accepted species.","u":"https://en.wikipedia.org/wiki/Sapindaceae","i":"img/23672.jpg","e":"<b>Sapindus<\/b>, the soapberry + <b>-aceae<\/b> \"family\": maples, lychees and horse chestnuts."},"3400":{"p":"232347","n":"Magnoliales","r":"order","d":"Basal order of flowering plants","x":"The Magnoliales are an order of flowering plants. Well-known members of Magnoliales include: magnolias, tulip trees, custard apples, American pawpaw, cherimoyas, ylang-ylang, soursop fruit, and nutmeg.","u":"https://en.wikipedia.org/wiki/Magnoliales","i":"img/3400.jpg","e":"<b>Magnolia<\/b> + <b>-ales<\/b> \"order\": magnolias, nutmeg and custard apples."},"41947":{"p":"1437201","n":"Santalales","r":"order","d":"Order of flowering plants","x":"The Santalales are an order of flowering plants of eudicots. Well-known members of the Santalales include sandalwoods and the many species of mistletoes.","u":"https://en.wikipedia.org/wiki/Santalales","i":"img/41947.jpg","e":"<b>Santalum<\/b> \"sandalwood\" + <b>-ales<\/b> \"order\": sandalwood and mistletoe."},"147387":{"p":"147368","n":"Poeae","r":"tribe","d":"Tribe of grasses","x":"The Poeae are the largest tribe of the grasses, with around 2,500 species in 121 genera. The tribe includes many lawn and pasture grasses.","u":"https://en.wikipedia.org/wiki/Poeae","i":"img/147387.jpg","e":"<b>Poa<\/b> \"grass\" + <b>-eae<\/b> \"tribe\": oats and bluegrasses. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"4747":{"p":"73496","n":"Orchidaceae","r":"family","d":"Family of flowering plants in the order Asparagales","x":"Orchids are plants that belong to the family Orchidaceae, a diverse and widespread group of flowering plants with blooms that are often colourful and fragrant. Orchids are cosmopolitan plants, living in diverse habitats on every continent except Antarctica.","u":"https://en.wikipedia.org/wiki/Orchid","i":"img/4747.jpg","e":"<b>Orchis<\/b>, Greek <b>ὄρχις<\/b> (<i>órkhis<\/i>) \"testicle,\" for the paired root tubers + <b>-aceae<\/b> \"family\". The same word gives medicine <b>orchitis<\/b> and <b>orchiectomy<\/b>."},"16714":{"p":"3502","n":"Juglandaceae","r":"family","d":"Walnut family of trees","x":"The Juglandaceae are an angiosperm family known as the walnuts. They are trees, or sometimes shrubs, in the order Fagales.","u":"https://en.wikipedia.org/wiki/Juglandaceae","i":"img/16714.jpg","e":"<b>Juglans<\/b>, Latin <b>Iovis glāns<\/b> \"Jupiter's acorn\" + <b>-aceae<\/b> \"family\": walnuts and pecans. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"1307796":{"p":"3563","n":"Chenopodioideae","r":"subfamily","d":"Subfamily of flowering plants","x":"The Chenopodioideae are a subfamily of the flowering plant family Amaranthaceae in the APG III system, which is largely based on molecular phylogeny, but were included – together with other subfamilies – in the family Chenopodiaceae, or goosefoot family, in the Cronquist system.","u":"https://en.wikipedia.org/wiki/Chenopodioideae","i":"img/1307796.jpg","e":"<b>Chenopodium<\/b>, Greek <b>χήν<\/b> (<i>khḗn<\/i>) \"goose\" + <b>πούς<\/b> (<i>poús<\/i>) \"foot,\" for the goosefoot-shaped leaves + <b>-oideae<\/b> \"subfamily\": spinach, beets and quinoa. <i style=\"opacity:.7\">(from the roots of the name)<\/i>"},"216718":{"p":"216706","n":"Mentheae","r":"tribe","d":"Tribe of flowering plants in the sage family","x":"Mentheae is the largest tribe of plants in the family Lamiaceae. It includes herbs such as sage, hyssop, mint, catnip, bee balm and thyme.","u":"https://en.wikipedia.org/wiki/Mentheae","i":"img/216718.jpg","e":"Latin <b>Mentha<\/b> \"mint\" + <b>-eae<\/b> \"tribe\": mints, sage, rosemary and oregano."},"21880":{"p":"216718","n":"Salvia","r":"genus","d":"Largest genus of plants in the mint family","x":"Salvia is the largest genus of plants in the sage family Lamiaceae, with just under 1,000 species of shrubs, herbaceous perennials, and annuals. Within the Lamiaceae, Salvia is part of the tribe Mentheae within the subfamily Nepetoideae.","u":"https://en.wikipedia.org/wiki/Salvia","i":"img/21880.jpg","e":"Latin <b>salvia<\/b> \"sage,\" from <b>salvus<\/b> \"safe, healthy\": the healing herb. English <b>sage<\/b> comes from the same word through French."},"4564":{"p":"147389","n":"Triticum","r":"genus","d":"Genus of grass cultivated for grain","x":"Wheat is a group of wild and domesticated grasses of the genus Triticum. As cereals, they are cultivated for their grains, which are staple foods around the world.","u":"https://en.wikipedia.org/wiki/Wheat","i":"img/4564.jpg","e":"Latin <b>trīticum<\/b> \"wheat.\""},"4677":{"p":"1437197","n":"Liliaceae","r":"family","d":"Family of flowering plants in order Liliales, including lilies","x":"The lily family, Liliaceae, consists of about 15 genera and 610 species of flowering plants within the order Liliales. They are monocotyledonous, perennial, herbaceous geophytes, often growing from bulbs although some have rhizomes.","u":"https://en.wikipedia.org/wiki/Liliaceae","i":"img/4677.jpg","e":"Latin <b>Lilium<\/b> \"lily\" + <b>-aceae<\/b> \"family\": lilies and tulips."}},"leaves":{"39510":{"n":"agave","s":"Agave americana","p":"40552","x":"Agave americana, commonly known as the century plant, maguey, or American aloe, is a flowering plant species belonging to the family Asparagaceae. It is native to Mexico and the United States.","u":"https://en.wikipedia.org/wiki/Agave_americana","i":"img/39510.jpg"},"3879":{"n":"alfalfa","s":"Medicago sativa","p":"163742","x":"Medicago sativa, commonly known as alfalfa in North America and lucerne in the United Kingdom, South Africa, and Australia, is a perennial flowering plant in the legume family, Fabaceae.","u":"https://en.wikipedia.org/wiki/Alfalfa","i":"img/3879.jpg"},"3755":{"n":"almond","s":"Prunus dulcis","p":"3754","x":"The almond is a species of tree from the genus Prunus. Along with the peach, it is classified in the subgenus Amygdalus, distinguished from the other subgenera by corrugations on the woody shell (endocarp) surrounding the seed.","u":"https://en.wikipedia.org/wiki/Almond","i":"img/3755.jpg"},"34199":{"n":"aloe","s":"Aloe vera","p":"73496","x":"Aloe vera is a succulent plant species of the genus Aloe. It is widely distributed and is considered an invasive species in many regions of the world.","u":"https://en.wikipedia.org/wiki/Aloe_vera","i":"img/34199.jpg"},"271192":{"n":"anise","s":"Pimpinella anisum","p":"241780","x":"Anise, also called aniseed or rarely anix, is a flowering plant in the family Apiaceae native to the Eastern Mediterranean and Southwest Asia.","u":"https://en.wikipedia.org/wiki/Anise","i":"img/271192.jpg"},"3752":{"n":"apple","s":"Malus sylvestris","p":"721813","x":"Malus sylvestris, the European crab apple, also known as the European wild apple or simply the crab apple, is a species of the genus Malus. Its scientific name means \"forest apple\", reflecting its habitat.","u":"https://en.wikipedia.org/wiki/Malus_sylvestris","i":"img/3752.jpg"},"36596":{"n":"apricot","s":"Prunus armeniaca","p":"3754","x":"Prunus armeniaca is the most commonly cultivated apricot species. The native range is somewhat uncertain due to its extensive prehistoric cultivation.","u":"https://en.wikipedia.org/wiki/Prunus_armeniaca","i":"img/36596.jpg"},"4265":{"n":"artichoke","s":"Cynara cardunculus","p":"4210","x":"The cardoon, also called the artichoke thistle, is a thistle in the family Asteraceae. It is a naturally occurring species that also has many cultivated forms, including the globe artichoke.","u":"https://en.wikipedia.org/wiki/Cardoon","i":"img/4265.jpg"},"4686":{"n":"asparagus","s":"Asparagus officinalis","p":"40552","x":"Asparagus or garden asparagus is a perennial flowering plant species in the genus Asparagus native to Eurasia. Widely cultivated as a vegetable crop, its young shoots are used as a spring vegetable.","u":"https://en.wikipedia.org/wiki/Asparagus"},"3435":{"n":"avocado","s":"Persea americana","p":"3433","x":"The avocado, alligator pear or avocado pear is an evergreen tree in the laurel family (Lauraceae). It is native to the Americas, with archaeological evidence of early human avocado use dating back thousands of years across various regions of Central and South America.","u":"https://en.wikipedia.org/wiki/Avocado","i":"img/3435.jpg"},"3349":{"n":"baltic pine","s":"Pinus sylvestris","p":"3318","x":"Pinus sylvestris is a species of conifer, a pine, in the family Pinaceae. It is native to Eurasia.","u":"https://en.wikipedia.org/wiki/Pinus_sylvestris","i":"img/3349.jpg"},"318051":{"n":"bamboo","s":"Bambusa textilis","p":"359160","x":"Bambusa textilis, also known as slender bamboo, clumping bamboo and weaver's bamboo, is a species of bamboo in the Poaceae (grasses) family that is native to China. The subspecies var.","u":"https://en.wikipedia.org/wiki/Bambusa_textilis","i":"img/318051.jpg"},"89151":{"n":"banana","s":"Musa x paradisiaca","p":"4618","x":"Musa × paradisiaca is a species as well as a cultivar, originating as the hybrid between Musa acuminata and Musa balbisiana, cultivated and domesticated by humans very early. Most cultivated bananas and plantains are polyploid cultivars either of this hybrid or of M.","u":"https://en.wikipedia.org/wiki/Musa_%C3%97_paradisiaca","i":"img/89151.jpg"},"69109":{"n":"baobab","s":"Adansonia digitata","p":"3629","x":"Adansonia digitata, the African baobab, is the most widespread tree species of the genus Adansonia, the baobabs, and is native to the African continent and the southern Arabian Peninsula. These are long-lived pachycauls; radiocarbon dating has shown at least one individual to be 1,275 years old.","u":"https://en.wikipedia.org/wiki/Adansonia_digitata","i":"img/69109.jpg"},"4513":{"n":"barley","s":"Hordeum vulgare","p":"1648017","x":"Barley, a member of the grass family, is a major cereal grain grown in temperate climates globally. One of the first cultivated grains, it was domesticated in the Fertile Crescent around 9000 BC, giving it nonshattering spikelets and making it much easier to harvest.","u":"https://en.wikipedia.org/wiki/Barley","i":"img/4513.jpg"},"130111":{"n":"barrel cactus","s":"Kroenleinia grusonii","p":"186270","x":"Kroenleinia grusonii, popularly known as the golden barrel cactus, golden ball, \"mother-in-law's cushion\" or \"mother-in-law's chair\", is a species of barrel cactus which is endemic to east-central Mexico.","u":"https://en.wikipedia.org/wiki/Kroenleinia_grusonii","i":"img/130111.jpg"},"39350":{"n":"basil","s":"Ocimum basilicum","p":"216719","x":"Basil, also called great basil, is a culinary herb of the family Lamiaceae (mints). It is a tender plant and is used in cuisines worldwide.","u":"https://en.wikipedia.org/wiki/Basil","i":"img/39350.jpg"},"161934":{"n":"beetroot","s":"Beta vulgaris","p":"3563","x":"Beta vulgaris (beet) is a species of flowering plant in the subfamily Betoideae of the family Amaranthaceae. It is a perennial plant usually growing up to 120 centimetres (4 ft) tall.","u":"https://en.wikipedia.org/wiki/Beta_vulgaris","i":"img/161934.jpg"},"4202":{"n":"black elderberry","s":"Sambucus nigra","p":"4199","x":"Sambucus nigra is a temperate species of tree or shrub in the family Viburnaceae native to the Azores, Europe, and the Middle East. Common names include elder, common elder, black elder, European elder, and also elderberry for the fruit, and elderflower for the flowers.","u":"https://en.wikipedia.org/wiki/Sambucus_nigra","i":"img/4202.jpg"},"3917":{"n":"black eyed pea","s":"Vigna unguiculata","p":"163735","x":"The cowpea is an annual herbaceous legume from the genus Vigna. It can be erect, semierect (trailing), or climbing.","u":"https://en.wikipedia.org/wiki/Cowpea","i":"img/3917.jpg"},"3710":{"n":"black mustard","s":"Brassica nigra","p":"3705","x":"Rhamphospermum nigrum, black mustard, is an annual plant native to cooler regions of North Africa, temperate regions of Europe, and parts of Asia. It is cultivated for its dark-brown-to-black seeds, which are commonly used as a spice.","u":"https://en.wikipedia.org/wiki/Rhamphospermum_nigrum","i":"img/3710.jpg"},"13216":{"n":"black pepper","s":"Piper nigrum","p":"232347","x":"Black pepper is a flowering vine in the family Piperaceae, cultivated for its fruit, which is usually dried and used as a spice and seasoning. The fruit is a drupe (stonefruit) which is about 5 mm in diameter, dark red, and contains a stone which encloses a single pepper seed.","u":"https://en.wikipedia.org/wiki/Black_pepper","i":"img/13216.jpg"},"75062":{"n":"blackberry","s":"Rubus allegheniensis","p":"23216","x":"Rubus allegheniensis is a North American species of highbush blackberry. It is commonly known as Allegheny blackberry.","u":"https://en.wikipedia.org/wiki/Rubus_allegheniensis","i":"img/75062.jpg"},"3331":{"n":"blue spruce","s":"Picea pungens","p":"3328","x":"The blue spruce, also commonly known as Colorado spruce or Colorado blue spruce, is a species of spruce tree native to North America in Arizona, Colorado, Idaho, New Mexico, Utah and Wyoming. It is noted for its often strongly glaucous blue-green needles, and has therefore been used as an ornamental tree in many…","u":"https://en.wikipedia.org/wiki/Blue_spruce","i":"img/3331.jpg"},"69266":{"n":"blueberry","s":"Vaccinium corymbosum","p":"13749","x":"Vaccinium corymbosum is a North American species of blueberry with several common names, including highbush blueberry and rabbiteye blueberry.","u":"https://en.wikipedia.org/wiki/Vaccinium_corymbosum","i":"img/69266.jpg"},"3711":{"n":"bok choy","s":"Brassica rapa","p":"3705","x":"Brassica rapa is an annual to biennial plant species native to Eurasia that is from the Brassicaceae family. The B.","u":"https://en.wikipedia.org/wiki/Brassica_rapa","i":"img/3711.jpg"},"3645":{"n":"brazil nut","s":"Bertholletia excelsa","p":"41945","x":"Brazil nut refers to a South American tree of the monotypic genus Bertholletia in the family Lecythidaceae as well as the tree's commercially-harvested edible seeds. It is one of the largest and longest-lived trees in the Amazon rainforest.","u":"https://en.wikipedia.org/wiki/Brazil_nut","i":"img/3645.jpg"},"194251":{"n":"breadfruit","s":"Artocarpus altilis","p":"3488","x":"Breadfruit is a species of flowering tree in the mulberry and jackfruit family Moraceae. Its name is derived from the texture of the moderately ripe fruit when cooked, similar to freshly baked bread and having a potato-like flavor.","u":"https://en.wikipedia.org/wiki/Breadfruit","i":"img/194251.jpg"},"3617":{"n":"buckwheat","s":"Fagopyrum esculentum","p":"1110380","x":"Buckwheat or common buckwheat is a flowering plant in the knotweed family Polygonaceae cultivated for its grain-like seeds and as a cover crop. Buckwheat cultivation originated around the 6th millennium BC in the region of what is now Yunnan Province in southwestern China.","u":"https://en.wikipedia.org/wiki/Buckwheat","i":"img/3617.jpg"},"3662":{"n":"butternut squash","s":"Cucurbita moschata","p":"3660","x":"Cucurbita moschata is a species originating in the tropical Americas which is cultivated for edible flesh, flowers, greens, and seeds. It includes cultivars known in English as squash or pumpkin.","u":"https://en.wikipedia.org/wiki/Cucurbita_moschata","i":"img/3662.jpg"},"3712":{"n":"cabbage","s":"Brassica oleracea","p":"3705","x":"Brassica oleracea, also known as wild cabbage in its uncultivated form, is a plant of the family Brassicaceae.","u":"https://en.wikipedia.org/wiki/Brassica_oleracea","i":"img/3712.jpg"},"3641":{"n":"cacao","s":"Theobroma cacao","p":"3629","x":"Theobroma cacao is a small evergreen tree in the Malvaceae family. Its seeds—cocoa beans when dried and fermented—are used to make chocolate liquor, cocoa powder, cocoa butter and chocolate.","u":"https://en.wikipedia.org/wiki/Theobroma_cacao","i":"img/3641.jpg"},"130122":{"n":"cactus","s":"Ferocactus flavovirens","p":"186270","x":"Ferocactus flavovirens is a species of Ferocactus from Mexico.","u":"https://en.wikipedia.org/wiki/Ferocactus_flavovirens","i":"img/130122.jpg"},"65558":{"n":"caper","s":"Capparis spinosa","p":"3699","x":"Capparis spinosa, the caper bush, also called Flinders rose, is a perennial plant that bears rounded, fleshy leaves and large white to pinkish-white flowers.","u":"https://en.wikipedia.org/wiki/Caper","i":"img/65558.jpg"},"105181":{"n":"cardamom","s":"Elettaria cardamomum","p":"4642","x":"Elettaria cardamomum, commonly known as green cardamom or true cardamom, is a herbaceous, perennial plant in the ginger family, native to southern India. It is the most common of the species whose seeds are used as a spice called cardamom that has a strong aroma used in both savory and sweet cooking.","u":"https://en.wikipedia.org/wiki/Elettaria_cardamomum","i":"img/105181.jpg"},"3570":{"n":"carnation","s":"Dianthus caryophyllus","p":"3524","x":"Dianthus caryophyllus, commonly known as carnation or clove pink, is a species of Dianthus native to the Mediterranean region. While its exact natural range is uncertain due to extensive cultivation over the last 2,000 years, wild carnations are most common in the Mediterranean region.","u":"https://en.wikipedia.org/wiki/Dianthus_caryophyllus","i":"img/3570.jpg"},"20340":{"n":"carob","s":"Ceratonia siliqua","p":"3803","x":"The carob is a flowering evergreen tree or shrub in the Caesalpinioideae subfamily of the legume family, Fabaceae. The carob tree is native to the Mediterranean region and the Middle East.","u":"https://en.wikipedia.org/wiki/Carob","i":"img/20340.jpg"},"4039":{"n":"carrot","s":"Daucus carota","p":"241778","x":"Daucus carota, whose common names include wild carrot, European wild carrot, bird's nest, bishop's lace, carrot flower, and Queen Anne's lace, is a flowering plant in the family Apiaceae. It is native to temperate regions of Afro-Eurasia with a number of regional subspecies, and is naturalised widely elsewhere.","u":"https://en.wikipedia.org/wiki/Daucus_carota","i":"img/4039.jpg"},"171929":{"n":"cashew","s":"Anacardium occidentale","p":"4011","x":"Cashew is the common name of a tropical evergreen tree Anacardium occidentale, in the family Anacardiaceae. It is the source of the cashew nut and the cashew apple.","u":"https://en.wikipedia.org/wiki/Cashew","i":"img/171929.jpg"},"3983":{"n":"cassava","s":"Manihot esculenta","p":"235631","x":"Manihot esculenta, commonly called cassava, manioc, or yuca, is a woody shrub of the spurge family, Euphorbiaceae, native to South America, from Brazil, Paraguay and parts of the Andes. Although a perennial plant, cassava is extensively cultivated in tropical and subtropical regions as an annual crop for its edible…","u":"https://en.wikipedia.org/wiki/Cassava","i":"img/3983.jpg"},"93692":{"n":"cedar of lebanon","s":"Cedrus libani","p":"3318","x":"Cedrus libani, commonly known as cedar of Lebanon, Lebanon cedar, or Lebanese cedar, is a species of large conifer in the pine family, Pinaceae, and is native to the mountains of the Eastern Mediterranean basin. Known for its longevity, height, and durable wood, it has held profound significance for millennia.","u":"https://en.wikipedia.org/wiki/Cedrus_libani","i":"img/93692.jpg"},"4045":{"n":"celery","s":"Apium graveolens","p":"241793","x":"Apium graveolens, commonly known as celery, is an Old World species of flowering plant in the family Apiaceae. It was first described by Carl Linnaeus in 1753.","u":"https://en.wikipedia.org/wiki/Apium_graveolens","i":"img/4045.jpg"},"98504":{"n":"chamomile","s":"Matricaria chamomilla","p":"102810","x":"Matricaria chamomilla, commonly known as chamomile, German chamomile, Hungarian chamomile (kamilla), wild chamomile, blue chamomile, or scented mayweed, is an annual plant of the composite family Asteraceae. Commonly, the name M.","u":"https://en.wikipedia.org/wiki/Matricaria_chamomilla","i":"img/98504.jpg"},"42229":{"n":"cherry","s":"Prunus avium","p":"3754","x":"Prunus avium, commonly called wild cherry, sweet cherry or gean, is a species of cherry, a flowering plant in the rose family, Rosaceae. It is native to western Eurasia and naturalized elsewhere.","u":"https://en.wikipedia.org/wiki/Prunus_avium","i":"img/42229.jpg"},"21020":{"n":"chestnut","s":"Castanea sativa","p":"3503","x":"The sweet chestnut, also known as the Spanish chestnut or European chestnut, is a species of tree in the flowering plant family Fagaceae.","u":"https://en.wikipedia.org/wiki/Sweet_chestnut","i":"img/21020.jpg"},"3827":{"n":"chickpea","s":"Cicer arietinum","p":"2233839","x":"The chickpea or chick pea is an annual legume of the family Fabaceae, subfamily Faboideae, cultivated for its edible seeds. Its different types are variously known as gram, Bengal gram, chana, garbanzo, garbanzo bean, or Egyptian pea.","u":"https://en.wikipedia.org/wiki/Chickpea","i":"img/3827.jpg"},"13427":{"n":"chicory","s":"Cichorium intybus","p":"219121","x":"Common chicory is a somewhat woody, perennial herbaceous plant of the family Asteraceae, usually with bright blue flowers, rarely white or pink. Native to Europe, North Africa, and western Asia, it has been introduced to the Americas, Australia, and South Africa.","u":"https://en.wikipedia.org/wiki/Chicory","i":"img/13427.jpg"},"146995":{"n":"chrysanthemum","s":"Chrysanthemum indicum","p":"886714","x":"Chrysanthemum indicum is a flowering plant commonly called Indian chrysanthemum, within the family Asteraceae and genus Chrysanthemum.","u":"https://en.wikipedia.org/wiki/Chrysanthemum_indicum","i":"img/146995.jpg"},"128608":{"n":"cinnamon","s":"Cinnamomum verum","p":"3433","x":"Cinnamomum verum, also known as true cinnamon or Ceylon cinnamon, is a small evergreen tree belonging to the family Lauraceae, native to Sri Lanka. The inner bark of the tree is historically regarded as the spice cinnamon, though this name has also been used for C.","u":"https://en.wikipedia.org/wiki/Cinnamomum_verum","i":"img/128608.jpg"},"171251":{"n":"citron","s":"Citrus medica","p":"2706","x":"The citron is a large fragrant citrus fruit with a thick, coarse rind. It resembles a lemon, but is larger.","u":"https://en.wikipedia.org/wiki/Citron","i":"img/171251.jpg"},"97021":{"n":"clover","s":"Trifolium dubium","p":"163742","x":"Trifolium dubium, the lesser trefoil, suckling clover, little hop clover or lesser hop trefoil, is a flowering plant in the pea and clover family Fabaceae. This species is generally accepted as the primary plant to represent the traditional Irish shamrock.","u":"https://en.wikipedia.org/wiki/Trifolium_dubium","i":"img/97021.jpg"},"289672":{"n":"coca","s":"Erythroxylum coca","p":"3646","x":"Erythroxylum coca is a species of flowering plant in the family Erythroxylaceae. It is one of the two species of cultivated coca.","u":"https://en.wikipedia.org/wiki/Erythroxylum_coca","i":"img/289672.jpg"},"13894":{"n":"coconut","s":"Cocos nucifera","p":"169705","x":"The coconut is a member of the palm family (Arecaceae) and the only living species of the genus Cocos. The term \"coconut\" can denote the whole coconut palm tree or the large hard fruit.","u":"https://en.wikipedia.org/wiki/Coconut","i":"img/13894.jpg"},"13443":{"n":"coffee","s":"Coffea arabica","p":"91888","x":"Coffea arabica, also known as the Arabica coffee, is a species of flowering plant in the coffee and madder family Rubiaceae. It is believed to be the first species of coffee to have been cultivated and is the dominant cultivar, representing about 60% of global production.","u":"https://en.wikipedia.org/wiki/Coffea_arabica","i":"img/13443.jpg"},"3885":{"n":"common bean","s":"Phaseolus vulgaris","p":"163735","x":"Phaseolus vulgaris, the common bean, is a herbaceous annual plant. Its botanical classification, along with other Phaseolus species, is as a member of the legume family, Fabaceae.","u":"https://en.wikipedia.org/wiki/Phaseolus_vulgaris","i":"img/3885.jpg"},"28930":{"n":"common beech","s":"Fagus sylvatica","p":"3503","x":"Fagus sylvatica, the European beech or common beech, is a species of tree in the flowering plant family Fagaceae. It can grow to a height of more than 40 m and has smooth silvery-grey bark, large leaf area, and a short trunk with low branches.","u":"https://en.wikipedia.org/wiki/Fagus_sylvatica","i":"img/28930.jpg"},"4052":{"n":"common ivy","s":"Hedera helix","p":"4050","x":"Hedera helix, simply ivy, or common ivy, English ivy, European ivy, or King's choice ivy, is a species of flowering plant in the family Araliaceae. It is native to most of Europe and parts of western Asia.","u":"https://en.wikipedia.org/wiki/Hedera_helix","i":"img/4052.jpg"},"72332":{"n":"common wormwood","s":"Artemisia absinthium","p":"886714","x":"Artemisia absinthium, otherwise known as common wormwood, is a species of Artemisia native to North Africa and temperate regions of Eurasia, and widely naturalized in Canada and the northern United States. It is grown as an ornamental plant and is used as an ingredient in the spirit absinthe and some other alcoholic…","u":"https://en.wikipedia.org/wiki/Artemisia_absinthium","i":"img/72332.jpg"},"4047":{"n":"coriander","s":"Coriandrum sativum","p":"241780","x":"Coriander, or Coriandrum sativum, is an annual herb in the family Apiaceae. The leaves are known as cilantro in the US.","u":"https://en.wikipedia.org/wiki/Coriander","i":"img/4047.jpg"},"4577":{"n":"corn","s":"Zea mays","p":"147429","x":"Maize, also known as corn, is a tall stout grass that produces cereal grain. The leafy stalk of the plant gives rise to male inflorescences or tassels which produce pollen, and female inflorescences called ears.","u":"https://en.wikipedia.org/wiki/Maize","i":"img/4577.jpg"},"3635":{"n":"cotton","s":"Gossypium hirsutum","p":"214907","x":"Gossypium hirsutum, also known as upland cotton or Mexican cotton, is the most widely planted species of cotton in the world. Globally, about 90% of all cotton production is of cultivars derived from this species.","u":"https://en.wikipedia.org/wiki/Gossypium_hirsutum","i":"img/3635.jpg"},"13750":{"n":"cranberry","s":"Vaccinium macrocarpon","p":"13749","x":"Vaccinium macrocarpon, also called large cranberry, American cranberry and bearberry, is a North American species of cranberry.","u":"https://en.wikipedia.org/wiki/Vaccinium_macrocarpon","i":"img/13750.jpg"},"3659":{"n":"cucumber","s":"Cucumis sativus","p":"3655","x":"The cucumber is a widely-cultivated creeping vine plant in the family Cucurbitaceae that bears cylindrical to spherical fruits, used as culinary vegetables. Considered an annual plant, there are three main types: slicing, pickling, and seedless.","u":"https://en.wikipedia.org/wiki/Cucumber","i":"img/3659.jpg"},"54855":{"n":"daffodil","s":"Narcissus poeticus","p":"4668","x":"Narcissus poeticus, the poet's daffodil, poet's narcissus, nargis, pheasant's eye, findern flower or pinkster lily, was one of the first daffodils to be cultivated, and is frequently identified as the narcissus of ancient times. It is also often associated with the Greek legend of Narcissus.","u":"https://en.wikipedia.org/wiki/Narcissus_poeticus","i":"img/54855.jpg"},"101596":{"n":"dahlia","s":"Dahlia pinnata","p":"911341","x":"Dahlia pinnata is a species in the genus Dahlia, family Asteraceae, with the common name garden dahlia. It is the type species of the genus and is widely cultivated.","u":"https://en.wikipedia.org/wiki/Dahlia_pinnata","i":"img/101596.jpg"},"41492":{"n":"daisy","s":"Bellis perennis","p":"102804","x":"Bellis perennis, the daisy, is a European species of the family Asteraceae, often considered the archetypal species of the name daisy. To distinguish this species from other plants known as daisies, it is sometimes qualified or known as common daisy, lawn daisy or English daisy.","u":"https://en.wikipedia.org/wiki/Bellis_perennis","i":"img/41492.jpg"},"50225":{"n":"dandelion","s":"Taraxacum officinale","p":"219121","x":"Taraxacum officinale, the dandelion or common dandelion, is a herbaceous perennial flowering plant in the daisy family, Asteraceae. The common dandelion is well-known for its yellow flower heads that turn into round balls of many silver-tufted fruit, which disperse in the wind.","u":"https://en.wikipedia.org/wiki/Taraxacum_officinale","i":"img/50225.jpg"},"42345":{"n":"date","s":"Phoenix dactylifera","p":"4710","x":"Phoenix dactylifera, commonly known as the date palm, is a flowering-plant species in the palm family Arecaceae, native to the region from the Gulf States and Iraq to Pakistan and India. It is cultivated for its edible sweet fruit called dates.","u":"https://en.wikipedia.org/wiki/Date_palm","i":"img/42345.jpg"},"40922":{"n":"dill","s":"Anethum graveolens","p":"40921","x":"Dill is an annual herb in the celery family Apiaceae. Native to North Africa and West Asia, dill is grown widely in Eurasia, where its leaves and seeds are used as a herb or spice for flavouring food.","u":"https://en.wikipedia.org/wiki/Dill","i":"img/40922.jpg"},"3357":{"n":"douglas fir","s":"Pseudotsuga menziesii","p":"3318","x":"The Douglas fir is a conifer species in the pine family, Pinaceae. It is the tallest tree in the family.","u":"https://en.wikipedia.org/wiki/Douglas_fir","i":"img/3357.jpg"},"1125938":{"n":"dragon fruit","s":"Selenicereus costaricensis","p":"186265","x":"Selenicereus costaricensis, also known as Costa Rica nightblooming cactus or Costa Rican pitaya, is a perennial climbing succulent in the cactus family (Cactaceae). Its fruit, a type of pitaya, has high economic and nutritional value.","u":"https://en.wikipedia.org/wiki/Selenicereus_costaricensis","i":"img/1125938.jpg"},"66656":{"n":"durian","s":"Durio zibethinus","p":"3629","x":"Durio zibethinus is the most common tree species in the genus Durio, commonly known as durian, and has edible fruits by the same name.","u":"https://en.wikipedia.org/wiki/Durio_zibethinus","i":"img/66656.jpg"},"4111":{"n":"eggplant","s":"Solanum melongena","p":"4107","x":"Solanum melongena is a plant species in the nightshade family Solanaceae, grown worldwide for its edible fruit, typically used as a vegetable in cooking. It is known by a number of names, including eggplant, aubergine, and brinjal.","u":"https://en.wikipedia.org/wiki/Eggplant","i":"img/4111.jpg"},"36592":{"n":"eucalyptus tree","s":"Eucalyptus obliqua","p":"1699513","x":"Eucalyptus obliqua, commonly known as messmate stringybark or messmate, but also known as brown top, brown top stringbark, stringybark or Tasmanian oak, is a species of tree that is endemic to south-eastern Australia. It has rough, stringy or fibrous bark on the trunk and larger branches, smooth greyish bark on the…","u":"https://en.wikipedia.org/wiki/Eucalyptus_obliqua","i":"img/36592.jpg"},"3906":{"n":"fava bean","s":"Vicia faba","p":"163743","x":"Vicia faba, commonly known as the broad bean, fava bean, or faba bean, is a species of vetch, a flowering plant in the pea and bean family Fabaceae. It is widely cultivated as a crop for human consumption, and also as a cover crop.","u":"https://en.wikipedia.org/wiki/Vicia_faba","i":"img/3906.jpg"},"2849586":{"n":"fennel","s":"Anethum foeniculum","p":"40921","x":"Fennel is a flowering plant species in the carrot family. It is a hardy, perennial herb with yellow flowers and feathery leaves.","u":"https://en.wikipedia.org/wiki/Fennel","i":"img/2849586.jpg"},"361556":{"n":"fern","s":"Sphaeropteris medullaris","p":"78536","x":"Sphaeropteris medullaris, synonym Cyathea medullaris, commonly known as mamaku or black tree fern, is a large tree fern up to 20 m (66 ft) tall with a trunk up to 20 cm diameter at breast height. It is distributed across the south-west Pacific from Fiji to Pitcairn Island and is a common plant found in forests of New…","u":"https://en.wikipedia.org/wiki/Sphaeropteris_medullaris","i":"img/361556.jpg"},"3494":{"n":"fig","s":"Ficus carica","p":"3487","x":"The fig is the edible fruit of Ficus carica, a species of tree or shrub in the flowering plant family Moraceae, native to the Mediterranean region, and to western and southern Asia. It has been cultivated since ancient times and is now widely grown throughout the world.","u":"https://en.wikipedia.org/wiki/Fig","i":"img/3494.jpg"},"4006":{"n":"flax","s":"Linum usitatissimum","p":"3646","x":"Flax, also known as common flax or line, is a flowering plant, Linum usitatissimum, in the family Linaceae. It is cultivated as a food and fiber crop in regions of the world with temperate climates.","u":"https://en.wikipedia.org/wiki/Flax","i":"img/4006.jpg"},"519065":{"n":"forget-me-not","s":"Myosotis scorpioides","p":"91888","x":"Myosotis scorpioides, the true forget-me-not or water forget-me-not, is a forget-me-not plant species in the borage family, Boraginaceae.","u":"https://en.wikipedia.org/wiki/Myosotis_scorpioides","i":"img/519065.jpg"},"3888":{"n":"garden pea","s":"Lathyrus oleraceus","p":"3853","x":"Pea is a pulse or fodder crop, but the word often refers to the seed or sometimes the pod of this flowering plant species. Peas are eaten as a vegetable.","u":"https://en.wikipedia.org/wiki/Pea","i":"img/3888.jpg"},"4682":{"n":"garlic","s":"Allium sativum","p":"4678","x":"Garlic is a species of bulbous flowering plants in the genus Allium. Its close relatives include the onion, shallot, leek, chives, Welsh onion, and Chinese onion.","u":"https://en.wikipedia.org/wiki/Garlic","i":"img/4682.jpg"},"379952":{"n":"geranium","s":"Geranium phaeum","p":"91836","x":"Geranium phaeum, commonly called dusky crane's-bill, mourning widow or black widow, is a herbaceous plant species in the family Geraniaceae. It is native to southern, central, and western Europe, and is cultivated as a garden subject.","u":"https://en.wikipedia.org/wiki/Geranium_phaeum","i":"img/379952.jpg"},"99814":{"n":"giant sequoia","s":"Sequoiadendron giganteum","p":"3313","x":"Sequoiadendron giganteum is a species of coniferous tree, classified in the family Cupressaceae in the subfamily Sequoioideae. Giant sequoia specimens are the largest trees on Earth.","u":"https://en.wikipedia.org/wiki/Sequoiadendron_giganteum","i":"img/99814.jpg"},"94328":{"n":"ginger","s":"Zingiber officinale","p":"4642","x":"Ginger is a flowering plant whose rhizome, ginger root or ginger, is widely used as a spice and a folk medicine. It is an herbaceous perennial that grows annual pseudostems about one meter tall, bearing narrow leaf blades.","u":"https://en.wikipedia.org/wiki/Ginger","i":"img/94328.jpg"},"3311":{"n":"ginkgo","s":"Ginkgo biloba","p":"1437180","x":"Ginkgo biloba, commonly known as ginkgo, also known as the maidenhair tree, and often misspelled \"gingko\" is a species of gymnosperm tree native to East Asia. It is the last living species in the order Ginkgoales, which first appeared over 290 million years ago.","u":"https://en.wikipedia.org/wiki/Ginkgo_biloba","i":"img/3311.jpg"},"4054":{"n":"ginseng","s":"Panax ginseng","p":"4050","x":"Panax ginseng, ginseng, also known as Asian ginseng, Chinese ginseng or Korean ginseng, is a species of plant whose root is the original source of ginseng. It is a perennial plant that grows in the mountains of East Asia.","u":"https://en.wikipedia.org/wiki/Panax_ginseng","i":"img/4054.jpg"},"135518":{"n":"gooseberry","s":"Ribes uva-crispa","p":"41946","x":"Ribes uva-crispa, commonly known as the gooseberry or European gooseberry, is a species of flowering shrub native to Europe, northwestern Africa, and southwestern Asia. It belongs to the family Grossulariaceae, which includes currants and gooseberries.","u":"https://en.wikipedia.org/wiki/Ribes_uva-crispa","i":"img/135518.jpg"},"3902":{"n":"gorse","s":"Ulex europaeus","p":"2231385","x":"Ulex europaeus, commonly known as gorse, common gorse, furze or whin, is a species of flowering plant native to Western Europe.","u":"https://en.wikipedia.org/wiki/Ulex_europaeus","i":"img/3902.jpg"},"29760":{"n":"grape","s":"Vitis vinifera","p":"71275","x":"Vitis vinifera, the common grape vine, is a species of flowering plant, native to the Mediterranean region, Central Europe, and southwestern Asia, from Morocco and Portugal north to southern Germany and east to northern Iran. As of 2012, there were between 5,000 and 10,000 varieties of Vitis vinifera grapes though…","u":"https://en.wikipedia.org/wiki/Vitis_vinifera","i":"img/29760.jpg"},"37656":{"n":"grapefruit","s":"Citrus x paradisi","p":"2706","x":"The grapefruit is a subtropical citrus tree known for its relatively large, sour to semi-sweet, somewhat bitter fruit. The flesh of the fruit is segmented and varies in color from pale yellow to dark red.","u":"https://en.wikipedia.org/wiki/Grapefruit","i":"img/37656.jpg"},"120290":{"n":"guava","s":"Psidium guajava","p":"1699523","x":"Psidium guajava, the common guava, yellow guava, lemon guava, or apple guava is an evergreen shrub or small tree native to South America. It is pollinated by insects.","u":"https://en.wikipedia.org/wiki/Psidium_guajava","i":"img/120290.jpg"},"138033":{"n":"gum arabic tree","s":"Vachellia nilotica","p":"3807","x":"Vachellia nilotica, more commonly known as Acacia nilotica, and by the vernacular names of gum arabic tree, babul, thorn mimosa, Egyptian acacia or thorny acacia, is a flowering tree in the family Fabaceae. It is native to Africa, the Middle East and the Indian subcontinent.","u":"https://en.wikipedia.org/wiki/Vachellia_nilotica","i":"img/138033.jpg"},"13451":{"n":"hazelnut","s":"Corylus avellana","p":"3514","x":"Corylus avellana, the common hazel, is a species of flowering plant in the birch family Betulaceae. The shrubs usually grow 3–8 metres tall.","u":"https://en.wikipedia.org/wiki/Corylus_avellana","i":"img/13451.jpg"},"3483":{"n":"hemp","s":"Cannabis sativa","p":"3481","x":"Cannabis sativa is an annual herbaceous flowering plant. The species was first classified by Carl Linnaeus in 1753.","u":"https://en.wikipedia.org/wiki/Cannabis_sativa","i":"img/3483.jpg"},"141191":{"n":"henna","s":"Lawsonia inermis","p":"3928","x":"Lawsonia inermis, also known as hina, the henna tree, the mignonette tree, and the Egyptian privet, is a flowering plant and one of the only two species of the genus Lawsonia, with the other being Lawsonia odorata. It is used as a traditional medicinal plant.","u":"https://en.wikipedia.org/wiki/Lawsonia_inermis","i":"img/141191.jpg"},"106335":{"n":"hibiscus","s":"Hibiscus syriacus","p":"214907","x":"Hibiscus syriacus is a species of flowering plant in the mallow family, Malvaceae. It is native to areas of east Asia, but widely introduced elsewhere, including much of Europe and North America.","u":"https://en.wikipedia.org/wiki/Hibiscus_syriacus","i":"img/106335.jpg"},"4298":{"n":"holly","s":"Ilex aquifolium","p":"91882","x":"Ilex aquifolium, the holly, common holly, English holly, European holly, or occasionally Christmas holly, is a species of flowering plant in the family Aquifoliaceae, native to western and southern Europe, northwest Africa, and southwest Asia. It is regarded as the type species of the genus Ilex, which by association…","u":"https://en.wikipedia.org/wiki/Ilex_aquifolium","i":"img/4298.jpg"},"105884":{"n":"honeysuckle","s":"Lonicera japonica","p":"4199","x":"Lonicera japonica, known as Japanese honeysuckle and golden-and-silver honeysuckle, is a species of honeysuckle native to East Asia, including many parts of China. It is often grown as an ornamental plant, but has become an invasive species in a number of countries.","u":"https://en.wikipedia.org/wiki/Lonicera_japonica","i":"img/105884.jpg"},"3486":{"n":"hop","s":"Humulus lupulus","p":"3481","x":"Humulus lupulus, the common hop or hops, is a species of flowering plant in the hemp family, Cannabaceae. It is a perennial, herbaceous climbing plant which sends up new shoots in early spring and dies back to a cold-hardy rhizome in autumn.","u":"https://en.wikipedia.org/wiki/Humulus_lupulus","i":"img/3486.jpg"},"3704":{"n":"horseradish","s":"Armoracia rusticana","p":"980193","x":"Horseradish is a perennial plant of the family Brassicaceae. It is a root vegetable, cultivated and used worldwide as a spice and as a condiment.","u":"https://en.wikipedia.org/wiki/Horseradish","i":"img/3704.jpg"},"82025":{"n":"hyacinth","s":"Hyacinthus orientalis","p":"40552","x":"Hyacinthus orientalis, the common hyacinth, garden hyacinth or Dutch hyacinth, is a species of flowering plant in the family Asparagaceae, subfamily Scilloideae. It is native to western Asia, from southern Turkey, through Syria and Lebanon to northern Israel.","u":"https://en.wikipedia.org/wiki/Hyacinthus_orientalis","i":"img/82025.jpg"},"3489":{"n":"jackfruit","s":"Artocarpus heterophyllus","p":"3488","x":"The jackfruit or jakfruit is a fruit tree in the mulberry family of Moraceae. Native to India, the species was first described under the name Artocarpus heterophyllus in Encyclopédie Méthodique, Botanique in 1789 by Jean-Baptiste Lamarck, based on a specimen collected by botanist Philibert Commerson.","u":"https://en.wikipedia.org/wiki/Jackfruit","i":"img/3489.jpg"},"126433":{"n":"jasmine","s":"Jasminum officinale","p":"4144","x":"Jasminum officinale, known as the common jasmine or simply jasmine, is a species of flowering plant in the olive family Oleaceae. It is native to the Caucasus and parts of Asia, also widely naturalized.","u":"https://en.wikipedia.org/wiki/Jasminum_officinale","i":"img/126433.jpg"},"3627":{"n":"kiwi","s":"Actinidia deliciosa","p":"41945","x":"Actinidia chinensis var. deliciosa, also known as Actinidia deliciosa, green kiwifruit or the fuzzy kiwifruit, is a fruiting vine native to central Southern China, growing naturally at altitudes between 800 and 1,400 metres.","u":"https://en.wikipedia.org/wiki/Actinidia_chinensis_var._deliciosa","i":"img/3627.jpg"},"39329":{"n":"lavender","s":"Lavandula angustifolia","p":"216719","x":"Lavandula angustifolia, formerly L. officinalis, is a flowering plant in the family Lamiaceae, native to the Mediterranean basin.","u":"https://en.wikipedia.org/wiki/Lavandula_angustifolia","i":"img/39329.jpg"},"4681":{"n":"leek","s":"Allium ampeloprasum","p":"4678","x":"Allium ampeloprasum is a member of the onion genus Allium. The wild plant is commonly known as wild leek or broadleaf wild leek.","u":"https://en.wikipedia.org/wiki/Allium_ampeloprasum","i":"img/4681.jpg"},"2708":{"n":"lemon","s":"Citrus x limon","p":"2706","x":"The lemon is a species of small evergreen tree in the Citrus genus of the flowering plant family Rutaceae. A true lemon is a hybrid of the citron and the bitter orange.","u":"https://en.wikipedia.org/wiki/Lemon","i":"img/2708.jpg"},"66014":{"n":"lemongrass","s":"Cymbopogon citratus","p":"147429","x":"Cymbopogon citratus, commonly known as West Indian lemon grass or simply lemon grass, is a tropical plant native to South Asia and Maritime Southeast Asia and introduced to many tropical regions.","u":"https://en.wikipedia.org/wiki/Cymbopogon_citratus","i":"img/66014.jpg"},"3864":{"n":"lentil","s":"Lens culinaris","p":"163743","x":"The lentil is an annual legume grown for its lens-shaped edible seeds or pulses, also called lentils. It is about 40 cm (16 in) tall, and the seeds grow in pods, usually with two seeds in each.","u":"https://en.wikipedia.org/wiki/Lentil","i":"img/3864.jpg"},"4236":{"n":"lettuce","s":"Lactuca sativa","p":"219121","x":"Lettuce is an annual plant of the family Asteraceae mostly grown as a leaf vegetable. The leaves are most often used raw in green salads, although lettuce is also seen in other kinds of food, such as sandwiches, wraps and soups; it can also be grilled.","u":"https://en.wikipedia.org/wiki/Lettuce","i":"img/4236.jpg"},"49827":{"n":"licorice","s":"Glycyrrhiza glabra","p":"2233839","x":"Liquorice or licorice is the common name of Glycyrrhiza glabra, a flowering plant of the bean family Fabaceae, from the root of which a sweet, aromatic flavouring is extracted.","u":"https://en.wikipedia.org/wiki/Liquorice","i":"img/49827.jpg"},"159033":{"n":"lime","s":"Citrus x aurantiifolia","p":"2706","x":"The Key lime, also known as West Indian lime, Mexican lime, or Egyptian lime is a type of lime. While it is treated as a species in botanical classification, it originated as a natural hybrid between Citrus micrantha and Citrus medica (citron).","u":"https://en.wikipedia.org/wiki/Key_lime","i":"img/159033.jpg"},"32224":{"n":"loquat","s":"Eriobotrya japonica","p":"721813","x":"The loquat is a large evergreen shrub or tree grown commercially for its orange-coloured fruits. It is also cultivated as an ornamental plant.","u":"https://en.wikipedia.org/wiki/Loquat","i":"img/32224.jpg"},"4432":{"n":"lotus","s":"Nelumbo nucifera","p":"232378","x":"Nelumbo nucifera, also known as Padma or Kamala, sacred lotus, pink lotus, Indian lotus, or simply lotus, is one of two extant species of aquatic plant in the family Nelumbonaceae. It is sometimes colloquially called water lily, though this more often refers to members of the family Nymphaeaceae.","u":"https://en.wikipedia.org/wiki/Nelumbo_nucifera","i":"img/4432.jpg"},"151069":{"n":"lychee","s":"Litchi chinensis","p":"23672","x":"Lychees are the fruit of the tree Litchi chinensis, the sole member of the genus Litchi, part of the soapberry family, Sapindaceae. They are edible, with a sweet, mildly tart flavor, and have a distinctive floral aroma often described as rose-like.","u":"https://en.wikipedia.org/wiki/Lychee","i":"img/151069.jpg"},"60698":{"n":"macadamia nut","s":"Macadamia integrifolia","p":"232378","x":"Macadamia integrifolia is a small to medium-sized tree native to Australian rainforests. Common names include macadamia, smooth-shelled macadamia, bush nut, Queensland nut, Bauple nut and nut oak.","u":"https://en.wikipedia.org/wiki/Macadamia_integrifolia","i":"img/60698.jpg"},"51089":{"n":"mace","s":"Myristica fragrans","p":"3400","x":"Myristica fragrans, commonly known as the nutmeg tree, is an evergreen species indigenous to the Maluku Islands of Indonesia. This aromatic tree is economically significant as the primary source of two distinct spices: nutmeg, derived from its seed, and mace, obtained from the seed's aril.","u":"https://en.wikipedia.org/wiki/Myristica_fragrans","i":"img/51089.jpg"},"85868":{"n":"magnolia","s":"Magnolia sieboldii","p":"3400","x":"Magnolia sieboldii, or Siebold's magnolia, also known as Korean mountain magnolia and Oyama magnolia, is a species of Magnolia native to east Asia in China, Japan, and Korea. It is named after the German doctor Philipp Franz von Siebold (1796–1866).","u":"https://en.wikipedia.org/wiki/Magnolia_sieboldii","i":"img/85868.jpg"},"85571":{"n":"mandarin","s":"Citrus reticulata","p":"2706","x":"A mandarin orange, often simply called mandarin, is a small, rounded citrus tree fruit. Treated as a distinct species of orange, it is usually eaten plain or in fruit salads.","u":"https://en.wikipedia.org/wiki/Mandarin_orange","i":"img/85571.jpg"},"29780":{"n":"mango","s":"Mangifera indica","p":"4011","x":"Mangifera indica, commonly known as the mango tree after its fruit, is an evergreen species of flowering plant in the family Anacardiaceae. It is a large fruit tree, capable of growing to a height and width of 30 m (100 ft).","u":"https://en.wikipedia.org/wiki/Mangifera_indica","i":"img/29780.jpg"},"58228":{"n":"mangosteen","s":"Garcinia mangostana","p":"3646","x":"Mangosteen, also called mangostan or purple mangosteen, is a tropical evergreen tree growing from 6 to 25 metres tall. The edible endocarp of the fruit is encased in an inedible purplish rind.","u":"https://en.wikipedia.org/wiki/Mangosteen","i":"img/58228.jpg"},"3656":{"n":"melon","s":"Cucumis melo","p":"3655","x":"Cucumis melo, also known as melon or true melon, is a species of Cucumis that has been developed into many cultivated varieties. The fruit is a pepo.","u":"https://en.wikipedia.org/wiki/Cucumis_melo","i":"img/3656.jpg"},"3972":{"n":"mistletoe","s":"Viscum album","p":"41947","x":"Viscum album is a species of mistletoe in the family Santalaceae, commonly called European mistletoe, common mistletoe, or simply mistletoe. It is native to Europe, as well as western and southern Asia.","u":"https://en.wikipedia.org/wiki/Viscum_album","i":"img/3972.jpg"},"94688":{"n":"moss","s":"Leucobryum glaucum","p":"3193","x":"Leucobryum glaucum, commonly known as leucobryum moss or pincushion moss, is a species of haplolepideous mosses (Dicranidae) with a wide distribution in eastern North America and Europe. It inhabits temperate forests in the Northern Hemisphere, and its structure allows it to absorb metal ions.","u":"https://en.wikipedia.org/wiki/Leucobryum_glaucum","i":"img/94688.jpg"},"119949":{"n":"myrtle","s":"Myrtus communis","p":"1699523","x":"Myrtus communis, the common myrtle or true myrtle, is an Old World species of flowering plant in the myrtle family, Myrtaceae. It forms an evergreen shrub.","u":"https://en.wikipedia.org/wiki/Myrtus_communis","i":"img/119949.jpg"},"3501":{"n":"nettle","s":"Urtica dioica","p":"3744","x":"Urtica dioica, often known as common nettle, burn nettle, stinging nettle, nettle leaf, or just a nettle or stinger, is a herbaceous perennial flowering plant in the family Urticaceae. Originally native to Europe, much of temperate Asia and western North Africa, it is now found worldwide.","u":"https://en.wikipedia.org/wiki/Urtica_dioica","i":"img/3501.jpg"},"38942":{"n":"oak","s":"Quercus robur","p":"3503","x":"Quercus robur, pedunculate oak, European oak, or English oak, is a species of flowering plant in the beech and oak family, Fagaceae. It is a large tree, native to Europe and western Asia, and is widely cultivated in other temperate regions.","u":"https://en.wikipedia.org/wiki/Quercus_robur","i":"img/38942.jpg"},"4498":{"n":"oat","s":"Avena sativa","p":"147387","x":"The oat, sometimes called the common oat, is a species of cereal grass (Avena) grown for fodder and for its seed, which is known by the same name. Oats appear to have been domesticated as a secondary crop, as their seeds resembled those of other cereals closely enough for them to be included by early cultivators.","u":"https://en.wikipedia.org/wiki/Oat","i":"img/4498.jpg"},"51953":{"n":"oil palm","s":"Elaeis guineensis","p":"169705","x":"Elaeis guineensis is a species of palm commonly called oil palm but also sometimes African oil palm or macaw-fat. The first Western person to describe it and bring back seeds was the French naturalist Michel Adanson.","u":"https://en.wikipedia.org/wiki/Elaeis_guineensis","i":"img/51953.jpg"},"455045":{"n":"okra","s":"Abelmoschus esculentus","p":"214907","x":"Okra, Abelmoschus esculentus, known in some English-speaking countries as lady's fingers, is a flowering plant in the mallow family native to West Africa. Cultivated in tropical, subtropical, and warm temperate regions around the world for its edible green seed pods, okra is used in the cuisines of many countries.","u":"https://en.wikipedia.org/wiki/Okra","i":"img/455045.jpg"},"4146":{"n":"olive","s":"Olea europaea","p":"4144","x":"Olea europaea is the tree species that includes the cultivated olive, and five other subspecies. Some of the subspecies are polyploid.","u":"https://en.wikipedia.org/wiki/Olea_europaea","i":"img/4146.jpg"},"4679":{"n":"onion","s":"Allium cepa","p":"4678","x":"The onion, also known as the bulb onion or common onion, is a vegetable that is the most widely cultivated species of the genus Allium. The shallot is a botanical variety of the onion which was classified as a separate species until 2011.","u":"https://en.wikipedia.org/wiki/Onion","i":"img/4679.jpg"},"2711":{"n":"orange","s":"Citrus sinensis","p":"2706","x":"Citrus × sinensis, the sweet orange, is a broadleaf evergreen hybrid between pomelo and mandarin. Hybrid sweet oranges are commonly cultivated fruits that include Valencia oranges, blood oranges and navel oranges.","u":"https://en.wikipedia.org/wiki/Citrus_%C3%97_sinensis","i":"img/2711.jpg"},"4509":{"n":"orchard grass","s":"Dactylis glomerata","p":"147387","x":"Dactylis glomerata is a species of flowering plant in the grass family Poaceae, commonly known as barnyard grass, cocksfoot grass, cockspur, orchard grass, or cat grass (due to its popularity for use with domestic cats). It is a cool-season perennial C3 tufted grass native throughout most of Europe, temperate Asia,…","u":"https://en.wikipedia.org/wiki/Dactylis_glomerata","i":"img/4509.jpg"},"78817":{"n":"orchid","s":"Ophrys apifera","p":"4747","x":"Ophrys apifera, known in Europe as the bee orchid, is a perennial herbaceous plant of the genus Ophrys, in the family of Orchidaceae. It serves as an example of sexually deceptive pollination and floral mimicry, a highly selective and highly evolved plant–pollinator relationship.","u":"https://en.wikipedia.org/wiki/Ophrys_apifera","i":"img/78817.jpg"},"3649":{"n":"papaya","s":"Carica papaya","p":"3699","x":"The papaya is the plant species Carica papaya, one of the 3 accepted species in the genus Carica of the family Caricaceae.","u":"https://en.wikipedia.org/wiki/Papaya","i":"img/3649.jpg"},"4043":{"n":"parsley","s":"Petroselinum crispum","p":"241793","x":"Parsley, or garden parsley, is a species of flowering plant in the family Apiaceae that is native to Greece, the Balkans, Algeria and Morocco. It has been introduced and naturalized in Europe and elsewhere in the world with suitable climates, and is widely cultivated as a herb and a vegetable.","u":"https://en.wikipedia.org/wiki/Parsley","i":"img/4043.jpg"},"4041":{"n":"parsnip","s":"Pastinaca sativa","p":"241780","x":"The parsnip is a root vegetable closely related to carrot and parsley, all belonging to the flowering plant family Apiaceae. It is a biennial plant usually grown as an annual.","u":"https://en.wikipedia.org/wiki/Parsnip","i":"img/4041.jpg"},"78168":{"n":"passionfruit","s":"Passiflora edulis","p":"3646","x":"Passiflora edulis, commonly known as passion fruit, is a vine species of passion flower native to southern Brazil, through Paraguay, and northern Argentina. The fruit is a pepo, a type of botanical berry, round to oval, either yellow or dark purple at maturity, with a soft to firm, juicy interior filled with numerous…","u":"https://en.wikipedia.org/wiki/Passiflora_edulis","i":"img/78168.jpg"},"12953":{"n":"pawpaw","s":"Asimina triloba","p":"3400","x":"Asimina triloba, the American papaw, pawpaw, paw paw, or paw-paw, among many regional names, is a species of small deciduous tree. It has large leaves and produces a large, yellowish-green to brown fruit.","u":"https://en.wikipedia.org/wiki/Asimina_triloba","i":"img/12953.jpg"},"3760":{"n":"peach","s":"Prunus persica","p":"3754","x":"The peach is a deciduous tree that bears edible juicy fruits with various characteristics. Most are simply called peaches, while the glossy-skinned, non-fuzzy varieties are called nectarines.","u":"https://en.wikipedia.org/wiki/Peach","i":"img/3760.jpg"},"3818":{"n":"peanut","s":"Arachis hypogaea","p":"2231393","x":"The peanut, also known as the groundnut, goober, goober pea, pindar or monkey nut (UK), is a legume crop grown mainly for its edible seeds, contained in underground pods. It is widely grown in the tropics and subtropics by small and large commercial producers, both as a grain legume and as an oil crop.","u":"https://en.wikipedia.org/wiki/Peanut","i":"img/3818.jpg"},"23211":{"n":"pear","s":"Pyrus communis","p":"721813","x":"Pyrus communis, the common pear, is a species of pear native to central and eastern Europe, and western Asia.","u":"https://en.wikipedia.org/wiki/Pyrus_communis","i":"img/23211.jpg"},"4543":{"n":"pearl millet","s":"Cenchrus americanus","p":"147369","x":"Pearl millet is the most widely grown type of millet. It has been grown in Africa and the Indian subcontinent since prehistoric times.","u":"https://en.wikipedia.org/wiki/Pearl_millet","i":"img/4543.jpg"},"32201":{"n":"pecan","s":"Carya illinoinensis","p":"16714","x":"The pecan is a species of hickory native to the Southern United States and northern Mexico in the region of the Mississippi River.","u":"https://en.wikipedia.org/wiki/Pecan","i":"img/32201.jpg"},"69717":{"n":"peony","s":"Paeonia officinalis","p":"41946","x":"Paeonia officinalis, the common peony, or garden peony, is a species of flowering plant in the family Paeoniaceae, native to mainly mountainous areas of Southern Europe and introduced in Central and Western Europe and North America.","u":"https://en.wikipedia.org/wiki/Paeonia_officinalis","i":"img/69717.jpg"},"13493":{"n":"persimmon","s":"Diospyros virginiana","p":"41945","x":"Diospyros virginiana is a persimmon species commonly called the American persimmon, common persimmon, eastern persimmon, simmon, possumwood, possum apples, or sugar plum. The tree is typically dioecious, so one must have both male and female plants to obtain fruit.","u":"https://en.wikipedia.org/wiki/Diospyros_virginiana","i":"img/13493.jpg"},"4103":{"n":"petunia","s":"Petunia integrifolia","p":"4070","x":"Petunia integrifolia, the violet petunia or violetflower petunia, is a species of wild petunia with violet-colored blooms. Petunia integrifolia is native to Brazil, Argentina, Paraguay and Uruguay.","u":"https://en.wikipedia.org/wiki/Petunia_integrifolia","i":"img/4103.jpg"},"4615":{"n":"pineapple","s":"Ananas comosus","p":"38820","x":"The pineapple is a tropical plant with an edible fruit; it is the most economically significant plant in the family Bromeliaceae.","u":"https://en.wikipedia.org/wiki/Pineapple","i":"img/4615.jpg"},"55513":{"n":"pistachio","s":"Pistacia vera","p":"4011","x":"The pistachio is a small to medium-sized tree of the cashew family. The tree produces seeds that are widely consumed as food.","u":"https://en.wikipedia.org/wiki/Pistachio","i":"img/55513.jpg"},"2675020":{"n":"pitcher plant","s":"Nepenthes attenboroughii","p":"3524","x":"Nepenthes attenboroughii, or Attenborough's pitcher plant, is a montane species of carnivorous pitcher plant of the genus Nepenthes. It is named after the celebrated broadcaster and naturalist Sir David Attenborough, who is a keen enthusiast of the genus.","u":"https://en.wikipedia.org/wiki/Nepenthes_attenboroughii","i":"img/2675020.jpg"},"3758":{"n":"plum","s":"Prunus domestica","p":"3754","x":"Prunus domestica is a species of flowering plant in the family Rosaceae. A deciduous tree, it includes many varieties of the fruit trees known as plums in English, though not all plums belong to this species.","u":"https://en.wikipedia.org/wiki/Prunus_domestica","i":"img/3758.jpg"},"43853":{"n":"poison ivy","s":"Toxicodendron radicans","p":"4011","x":"Toxicodendron radicans, commonly known as eastern poison ivy or poison ivy, is a species of allergenic flowering plant. It has numerous subtaxons and forms both vines and shrubs.","u":"https://en.wikipedia.org/wiki/Toxicodendron_radicans","i":"img/43853.jpg"},"22663":{"n":"pomegranate","s":"Punica granatum","p":"3928","x":"The pomegranate is a fruit-bearing, deciduous shrub or tree in the family Lythraceae, subfamily Punicoideae, that grows to between 1.5–5 metres (5–16 ft) tall. Rich in symbolic and mythological associations in many cultures, and mentioned in the Old Testament, it originated in the region spanning the Caucasus and the…","u":"https://en.wikipedia.org/wiki/Pomegranate","i":"img/22663.jpg"},"3469":{"n":"poppy","s":"Papaver somniferum","p":"1437183","x":"Papaver somniferum, commonly known as the opium poppy or breadseed poppy, is a species of flowering plant in the family Papaveraceae. It is the species of plant from which both opium and poppy seeds are derived and is also a valuable ornamental plant grown in gardens.","u":"https://en.wikipedia.org/wiki/Papaver_somniferum","i":"img/3469.jpg"},"4113":{"n":"potato","s":"Solanum tuberosum","p":"4107","x":"The potato is a starchy tuberous vegetable native to the Americas that is consumed as a staple food in many parts of the world. Potatoes are underground stem tubers of the plant Solanum tuberosum, a perennial in the nightshade family Solanaceae.","u":"https://en.wikipedia.org/wiki/Potato","i":"img/4113.jpg"},"1041245":{"n":"prickly pear","s":"Opuntia macrorhiza","p":"3593","x":"Opuntia macrorhiza, also known as the prairie pricklypear, western pricklypear, twistpine pricklypear, or plains pricklypear, is a common, widespread species of cactus native to North America.","u":"https://en.wikipedia.org/wiki/Opuntia_macrorhiza","i":"img/1041245.jpg"},"3663":{"n":"pumpkin","s":"Cucurbita pepo","p":"3660","x":"Cucurbita pepo is a cultivated plant of the genus Cucurbita. It yields varieties of winter squash and pumpkin, but the most widespread varieties belong to the subspecies Cucurbita pepo subsp.","u":"https://en.wikipedia.org/wiki/Cucurbita_pepo","i":"img/3663.jpg"},"63459":{"n":"quinoa","s":"Chenopodium quinoa","p":"1307796","x":"Quinoa is a flowering plant in the amaranth family. It is a herbaceous annual plant grown as a crop primarily for its edible seeds; the seeds are high in protein, dietary fiber, B vitamins, and dietary minerals, especially potassium and magnesium, which are present in amounts greater than in many grains.","u":"https://en.wikipedia.org/wiki/Quinoa","i":"img/63459.jpg"},"3726":{"n":"radish","s":"Raphanus sativus","p":"981071","x":"The radish is a flowering plant in the mustard family, Brassicaceae. Its large taproot is commonly used as a root vegetable, although the entire plant is edible and its leaves are sometimes used as a leaf vegetable.","u":"https://en.wikipedia.org/wiki/Radish","i":"img/3726.jpg"},"32247":{"n":"raspberry","s":"Rubus idaeus","p":"23216","x":"Rubus idaeus is a red-fruited species of Rubus native to Eurasia and commonly cultivated in other temperate regions.","u":"https://en.wikipedia.org/wiki/Rubus_idaeus","i":"img/32247.jpg"},"40031":{"n":"red mangrove","s":"Rhizophora mangle","p":"3646","x":"Rhizophora mangle, also known as the red mangrove, is a salt-tolerant, small-to-medium sized evergreen tree restricted to coastal, estuarine ecosystems along the southern portions of North America, the Caribbean as well as Central America and tropical West Africa. Its viviparous \"seeds\", in actuality called…","u":"https://en.wikipedia.org/wiki/Rhizophora_mangle","i":"img/40031.jpg"},"3621":{"n":"rhubarb","s":"Rheum rhabarbarum","p":"1110380","x":"Rhubarb is the fleshy, edible stalks (petioles) of species and hybrids of Rheum in the family Polygonaceae, which are cooked and used for food. The plant is a herbaceous perennial that grows from short, thick rhizomes.","u":"https://en.wikipedia.org/wiki/Rhubarb","i":"img/3621.jpg"},"4530":{"n":"rice","s":"Oryza sativa","p":"359160","x":"Oryza sativa, having the common name Asian cultivated rice, is the much more common of the two rice species cultivated as a cereal, the other species being O. glaberrima, African rice.","u":"https://en.wikipedia.org/wiki/Oryza_sativa","i":"img/4530.jpg"},"3988":{"n":"ricin","s":"Ricinus communis","p":"3977","x":"Ricinus communis, the castor bean or castor oil plant, is a species of perennial flowering plant in the spurge family, Euphorbiaceae. It is the sole species in the monotypic genus, Ricinus, and subtribe, Ricininae.","u":"https://en.wikipedia.org/wiki/Ricinus","i":"img/3988.jpg"},"155124":{"n":"rooibos","s":"Aspalathus linearis","p":"2231385","x":"Rooibos, or Aspalathus linearis, is a broom-like member of the plant family Fabaceae that grows in South Africa's Fynbos biome. The leaves are used to make a caffeine-free herbal infusion that has been consumed in Southern Africa for generations.","u":"https://en.wikipedia.org/wiki/Rooibos","i":"img/155124.jpg"},"396733":{"n":"rose","s":"Rosa x centifolia","p":"1176516","x":"Rosa × centifolia, the Provence rose, cabbage rose, May rose or Rose de Mai, is a hybrid rose developed by Dutch breeders in the period between the 17th century and the 19th century, possibly earlier.","u":"https://en.wikipedia.org/wiki/Rosa_%C3%97_centifolia","i":"img/396733.jpg"},"39367":{"n":"rosemary","s":"Salvia rosmarinus","p":"21880","x":"Salvia rosmarinus, synonym Rosmarinus officinalis, commonly known as rosemary, is a shrub with fragrant, evergreen, needle-like leaves and purple or sometimes white, pink, or blue flowers. It is a member of the mint family, Lamiaceae.","u":"https://en.wikipedia.org/wiki/Rosemary","i":"img/39367.jpg"},"3981":{"n":"rubber","s":"Hevea brasiliensis","p":"235631","x":"Hevea brasiliensis, the Pará rubber tree, sharinga tree, seringueira, or, most commonly, rubber tree or rubber plant, is a flowering plant belonging to the spurge family, Euphorbiaceae. It is originally native to the Amazon basin, but is now pantropical in distribution due to introductions.","u":"https://en.wikipedia.org/wiki/Hevea_brasiliensis","i":"img/3981.jpg"},"4550":{"n":"rye","s":"Secale cereale","p":"1648017","x":"Rye is a grass grown extensively as a grain, a cover crop and a forage crop. It is grown principally in an area from Eastern and Northern Europe into Russia.","u":"https://en.wikipedia.org/wiki/Rye","i":"img/4550.jpg"},"38868":{"n":"sage","s":"Salvia officinalis","p":"21880","x":"Salvia officinalis, common sage or sage, is a perennial, evergreen subshrub, with woody stems, grayish leaves, and blue to purplish flowers. It is a member of the mint family (Lamiaceae) and native to the Mediterranean region, though it has been naturalized in many places throughout the world.","u":"https://en.wikipedia.org/wiki/Salvia_officinalis","i":"img/38868.jpg"},"35974":{"n":"sandalwood","s":"Santalum album","p":"41947","x":"Santalum album is a small tropical tree, and the traditional source of sandalwood oil. It is native to Indonesia, the Philippines, and Western Australia.","u":"https://en.wikipedia.org/wiki/Santalum_album","i":"img/35974.jpg"},"76314":{"n":"seaweed","s":"Caulerpa prolifera","p":"33090","x":"Caulerpa prolifera is a species of green alga, a seaweed in the family Caulerpaceae. It is the type species of the genus Caulerpa, the type location being Alexandria, Egypt.","u":"https://en.wikipedia.org/wiki/Caulerpa_prolifera","i":"img/76314.jpg"},"72402":{"n":"senna","s":"Senna alexandrina","p":"3804","x":"Senna alexandrina is an ornamental plant in the genus Senna. It is used in herbalism.","u":"https://en.wikipedia.org/wiki/Senna_alexandrina","i":"img/72402.jpg"},"4182":{"n":"sesame","s":"Sesamum indicum","p":"4143","x":"Sesame is a plant in the genus Sesamum, also called benne. Numerous wild relatives occur in Africa and a smaller number in India.","u":"https://en.wikipedia.org/wiki/Sesame","i":"img/4182.jpg"},"292385":{"n":"shea nut","s":"Vitellaria paradoxa","p":"41945","x":"Vitellaria paradoxa, commonly known as shea tree, shi tree, or vitellaria, is a tree of the family Sapotaceae. It is the only species in the genus Vitellaria, and is indigenous to Africa.","u":"https://en.wikipedia.org/wiki/Vitellaria","i":"img/292385.jpg"},"3498":{"n":"silkworm mulberry","s":"Morus alba","p":"3487","x":"Morus alba, known as white mulberry, common mulberry and silkworm mulberry, is a fast-growing, small to medium-sized mulberry tree which grows to 10–20 m (33–66 ft) tall. It is native to China and is widely cultivated and naturalized elsewhere.","u":"https://en.wikipedia.org/wiki/Morus_alba","i":"img/3498.jpg"},"3505":{"n":"silver birch","s":"Betula pendula","p":"3514","x":"Betula pendula, the silver birch, is a species of tree in the flowering plant family, Betulaceae. The trees can reach a height of 30 m, and have white bark that sheds regularly.","u":"https://en.wikipedia.org/wiki/Betula_pendula","i":"img/3505.jpg"},"3847":{"n":"soy bean","s":"Glycine max","p":"163735","x":"The soybean, soy bean, or soya bean is a species of legume native to East Asia, widely grown for its edible bean. Soy is a staple crop, the world's most grown legume, and an important animal feed.","u":"https://en.wikipedia.org/wiki/Soybean","i":"img/3847.jpg"},"29719":{"n":"spearmint","s":"Mentha spicata","p":"216718","x":"Spearmint, also known as garden mint, common mint, lamb mint and mackerel mint, is native to Europe and southern temperate Asia, extending from Ireland in the west to southern China in the east. It is naturalized in many other temperate parts of the world, including northern and southern Africa, North America, and…","u":"https://en.wikipedia.org/wiki/Spearmint","i":"img/29719.jpg"},"58933":{"n":"spelt","s":"Triticum spelta","p":"4564","x":"Spelt, also known as dinkel wheat, is a species of wheat. It is a relict crop, eaten in Central Europe and northern Spain.","u":"https://en.wikipedia.org/wiki/Spelt","i":"img/58933.jpg"},"3562":{"n":"spinach","s":"Spinacia oleracea","p":"1307796","x":"Spinach is a leafy green flowering plant native to Central and Western Asia. It is of the order Caryophyllales, family Amaranthaceae, subfamily Chenopodioideae.","u":"https://en.wikipedia.org/wiki/Spinach","i":"img/3562.jpg"},"3329":{"n":"spruce","s":"Picea abies","p":"3328","x":"Picea abies, the Norway spruce, is a species of spruce native to Northern, Central and Eastern Europe. It has branchlets that typically hang downwards, and the longest cones of any spruce, 9–20 cm long.","u":"https://en.wikipedia.org/wiki/Picea_abies","i":"img/3329.jpg"},"3747":{"n":"strawberry","s":"Fragaria x ananassa","p":"171638","x":"The garden strawberry is a widely grown hybrid plant cultivated worldwide for its fruit. The genus Fragaria, the strawberries, is in the rose family, Rosaceae.","u":"https://en.wikipedia.org/wiki/Strawberry","i":"img/3747.jpg"},"4024":{"n":"sugar maple","s":"Acer saccharum","p":"23672","x":"Acer saccharum, the sugar maple, is a species of flowering plant in the soapberry and lychee family, Sapindaceae. It may also be called rock maple, sugar tree, sweet maple, or, particularly in reference to the wood, hard maple.","u":"https://en.wikipedia.org/wiki/Acer_saccharum","i":"img/4024.jpg"},"4547":{"n":"sugarcane","s":"Saccharum officinarum","p":"147429","x":"Saccharum officinarum is a large, strong-growing species of grass in the sugarcane genus. Its stout stalks are rich in sucrose, a disaccharide sugar which accumulates in the stalk internodes.","u":"https://en.wikipedia.org/wiki/Saccharum_officinarum","i":"img/4547.jpg"},"4232":{"n":"sunflower","s":"Helianthus annuus","p":"911341","x":"The common sunflower is a large annual forb in the daisy family Asteraceae. The most common varieties have large yellow orange flowers heads, that are a tall stem.","u":"https://en.wikipedia.org/wiki/Common_sunflower","i":"img/4232.jpg"},"3859":{"n":"sweet pea","s":"Lathyrus odoratus","p":"3853","x":"The sweet pea, Lathyrus odoratus, is a flowering plant in the genus Lathyrus in the family Fabaceae (legumes), native to Sicily, southern Italy and the Aegean Islands.","u":"https://en.wikipedia.org/wiki/Sweet_pea","i":"img/3859.jpg"},"4072":{"n":"sweet pepper","s":"Capsicum annuum","p":"424551","x":"Capsicum annuum is a flowering plant in the family Solanaceae (nightshades), native to the northern regions of South America and to southwestern North America. The plant produces berries of many colors including red, green, and yellow, often with pungent taste.","u":"https://en.wikipedia.org/wiki/Capsicum_annuum","i":"img/4072.jpg"},"4120":{"n":"sweet potato","s":"Ipomoea batatas","p":"4069","x":"The sweet potato or sweetpotato is a dicotyledonous plant in the morning glory family, Convolvulaceae. Its sizeable, starchy, sweet-tasting, tuberous roots are used as a root vegetable, which is a staple food in parts of the world.","u":"https://en.wikipedia.org/wiki/Sweet_potato","i":"img/4120.jpg"},"4403":{"n":"sycamore","s":"Platanus occidentalis","p":"232378","x":"Platanus occidentalis, also known as American sycamore or American planetree, is a species of Platanus native to the eastern and central United States, the mountains of northeastern Mexico, extreme southern Ontario, and extreme southern Quebec. It is usually called sycamore in North America, a name which can refer to…","u":"https://en.wikipedia.org/wiki/Platanus_occidentalis","i":"img/4403.jpg"},"58860":{"n":"tamarind","s":"Tamarindus indica","p":"3803","x":"Tamarind is a leguminous tree bearing edible fruit that is indigenous to tropical Africa and naturalized in Asia. The genus Tamarindus is monotypic, meaning that it contains only this species.","u":"https://en.wikipedia.org/wiki/Tamarind","i":"img/58860.jpg"},"4460":{"n":"taro","s":"Colocasia esculenta","p":"4447","x":"Taro, also known as dasheen, is a root vegetable. It is the most widely cultivated species of several plants in the family Araceae that are used as vegetables for their corms, leaves, stems and petioles
