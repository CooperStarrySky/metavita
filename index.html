penter ant, is a species of ant in the genus Camponotus. First described as Formica floridana by Buckley in 1866, the species was moved to Camponotus by Mayr in 1886.","u":"https://en.wikipedia.org/wiki/Camponotus_floridanus","i":"img/104421.jpg"},"8787":{"n":"cassowary","s":"Casuarius casuarius","p":"8784","x":"The southern cassowary, also known as double-wattled cassowary, Australian cassowary, or two-wattled cassowary, is a large, flightless, mostly black bird, found in Indonesia, Papua New Guinea, and northeastern Australia. It is one of the three living species of cassowary, alongside the dwarf cassowary and the northern…","u":"https://en.wikipedia.org/wiki/Southern_cassowary","i":"img/8787.jpg"},"9685":{"n":"cat","s":"Felis catus","p":"338152","x":"The cat, also called domestic cat and house cat, is a small domesticated carnivorous mammal. It is a member of Felidae, the family of mammals in the order Carnivora also colloquially referred to as cats.","u":"https://en.wikipedia.org/wiki/Cat","i":"img/9685.jpg"},"7998":{"n":"catfish","s":"Ictalurus punctatus","p":"186628","x":"The channel catfish, known informally as the \"channel cat\", is a species of catfish native to North America. They are North America's most abundant catfish species, and the official state fish of Kansas, Missouri, Nebraska and Tennessee.","u":"https://en.wikipedia.org/wiki/Channel_catfish","i":"img/7998.jpg"},"9913":{"n":"cattle","s":"Bos taurus","p":"9903","x":"Cattle are large, domesticated, bovid ungulates widely kept as livestock. They are prominent modern members of the subfamily Bovinae and the most widespread species of the genus Bos.","u":"https://en.wikipedia.org/wiki/Cattle","i":"img/9913.jpg"},"280423":{"n":"cellar spider","s":"Pholcus opilionoides","p":"74970","x":"Pholcus opilionoides is a species of spider in the family Pholcidae found in Europe, Egypt, the Caucasus and possibly Iran. It can be easily confused with Pholcus phalangioides.","u":"https://en.wikipedia.org/wiki/Pholcus_opilionoides","i":"img/280423.jpg"},"91907":{"n":"chameleon","s":"Chamaeleo chamaeleon","p":"8511","x":"The common chameleon or Mediterranean chameleon is a species of chameleon native to the Mediterranean Basin and parts surrounding the Red Sea. It is the only extant species of Chamaeleonidae with a range that naturally extends into Europe.","u":"https://en.wikipedia.org/wiki/Common_chameleon","i":"img/91907.jpg"},"32536":{"n":"cheetah","s":"Acinonyx jubatus","p":"338152","x":"The cheetah is a species of large feline and the only living member of the genus Acinonyx. The cheetah is a pursuit predator and the fastest land animal, capable of running at 93–104 km/h (58–65 mph); it has evolved for speed, having powerful hindlimb muscles and a long lumbar spine.","u":"https://en.wikipedia.org/wiki/Cheetah","i":"img/32536.jpg"},"9031":{"n":"chicken","s":"Gallus gallus","p":"9072","x":"The red junglefowl, also known as the Indian red junglefowl, is a species of tropical, galliform bird in the phasianid family, found across much of Southeast Asia and parts of South Asia.","u":"https://en.wikipedia.org/wiki/Red_junglefowl","i":"img/9031.jpg"},"9598":{"n":"chimpanzee","s":"Pan troglodytes","p":"9596","x":"The chimpanzee, commonly abbreviated to chimp, is a medium-sized great ape species found in the forests and savannas of equatorial Africa. It has four confirmed subspecies and a fifth proposed one.","u":"https://en.wikipedia.org/wiki/Chimpanzee","i":"img/9598.jpg"},"10152":{"n":"chinchilla","s":"Chinchilla chinchilla","p":"33550","x":"The short-tailed chinchilla is a small rodent part of the Chinchillidae family and is classified as an endangered species by the IUCN. Originating in South America, the chinchilla is part of the genus Chinchilla, which is separated into two species: the long-tailed chinchilla and the short-tailed chinchilla.","u":"https://en.wikipedia.org/wiki/Short-tailed_chinchilla","i":"img/10152.jpg"},"45474":{"n":"chipmunk","s":"Tamias striatus","p":"337730","x":"The eastern chipmunk is a chipmunk species found in eastern North America. It is the only living member of the genus Tamias.","u":"https://en.wikipedia.org/wiki/Eastern_chipmunk","i":"img/45474.jpg"},"1914524":{"n":"Christmas tree worm","s":"Spirobranchus giganteus","p":"6340","x":"Spirobranchus giganteus, commonly known as the Christmas tree worm, is a polychaete worm belonging to the family Serpulidae building calcareous tubes. The S.","u":"https://en.wikipedia.org/wiki/Spirobranchus_giganteus","i":"img/1914524.jpg"},"44679":{"n":"cicada","s":"Magicicada septendecim","p":"1955247","x":"Magicicada septendecim, sometimes called the Pharaoh cicada or the 17-year locust, is native to Canada and the United States and is the largest and most northern species of periodical cicada with a 17-year lifecycle.","u":"https://en.wikipedia.org/wiki/Magicicada_septendecim","i":"img/44679.jpg"},"94186":{"n":"civet","s":"Civettictis civetta","p":"379583","x":"The African civet is a large viverrid native to sub-Saharan Africa, where it is considered common and widely distributed in woodlands and secondary forests. It has been listed as least concern on the IUCN Red List since 2008.","u":"https://en.wikipedia.org/wiki/African_civet","i":"img/94186.jpg"},"161767":{"n":"clownfish","s":"Amphiprion percula","p":"1489908","x":"The orange clownfish also known as percula clownfish and clown anemonefish, is widely known as a popular aquarium fish. Like other clownfishes, it often lives in association with sea anemones.","u":"https://en.wikipedia.org/wiki/Orange_clownfish","i":"img/161767.jpg"},"13180":{"n":"cockatiel","s":"Nymphicus hollandicus","p":"35549","x":"The cockatiel, also known as the weero/weiro or quarrion, is a species of small- to medium-sized parrot belonging to the cockatoo family (Cacatuidae), of which it is the smallest member. Native to Australia, it is the sole member of the genus Nymphicus.","u":"https://en.wikipedia.org/wiki/Cockatiel","i":"img/13180.jpg"},"12983":{"n":"cockatoo","s":"Cacatua goffiniana","p":"35549","x":"The Tanimbar corella, also known as Goffin's cockatoo or Tanimbar cockatoo, is a species of cockatoo endemic to forests of Yamdena, Larat, and Selaru, all islands in the Tanimbar Islands archipelago in Indonesia. It has been introduced to the Kai Islands, Indonesia; Puerto Rico; and Singapore.","u":"https://en.wikipedia.org/wiki/Tanimbar_corella","i":"img/12983.jpg"},"6978":{"n":"cockroach","s":"Periplaneta americana","p":"1049657","x":"The American cockroach is the largest species of cockroach routinely found in homes, and often considered a pest. In certain regions of the U.S.","u":"https://en.wikipedia.org/wiki/American_cockroach","i":"img/6978.jpg"},"177283":{"n":"coconut crab","s":"Birgus latro","p":"6744","x":"The coconut crab is a terrestrial species of giant hermit crab, and is also known as the robber crab or palm thief. It is the largest living terrestrial arthropod, with a weight up to 4.1 kg (9.0 lb).","u":"https://en.wikipedia.org/wiki/Coconut_crab","i":"img/177283.jpg"},"8049":{"n":"cod","s":"Gadus morhua","p":"123368","x":"The Atlantic cod is a fish of the family Gadidae, widely consumed by humans. It is also commercially known as cod or codling.","u":"https://en.wikipedia.org/wiki/Atlantic_cod","i":"img/8049.jpg"},"7897":{"n":"coelacanth","s":"Latimeria chalumnae","p":"8287","x":"The West Indian Ocean coelacanth, sometimes known as the gombessa, African coelacanth, and simply coelacanth, is a crossopterygian, one of two extant species of coelacanth, a rare order of vertebrates more closely related to lungfish and tetrapods than to the common ray-finned fishes. The other extant species is the…","u":"https://en.wikipedia.org/wiki/West_Indian_Ocean_coelacanth","i":"img/7897.jpg"},"320166":{"n":"comb jelly","s":"Beroe abyssicola","p":"6072","x":"Beroe abyssicola is a species of beroid ctenophore, or comb jelly. It is largely found in deep waters in the North Pacific Ocean, and is common in Japan and the Arctic Ocean.","u":"https://en.wikipedia.org/wiki/Beroe_abyssicola","i":"img/320166.jpg"},"8924":{"n":"condor","s":"Vultur gryphus","p":"8922","x":"The Andean condor is a South American New World vulture and is the only extant member of the genus Vultur. It is found in the Andes mountains and adjacent Pacific coasts of western South America.","u":"https://en.wikipedia.org/wiki/Andean_condor","i":"img/8924.jpg"},"9614":{"n":"coyote","s":"Canis latrans","p":"9611","x":"The coyote is a species of canine also known as the American jackal, prairie wolf, and brush wolf. It is native to North America, and it is smaller than its close relative, the gray wolf, and slightly smaller than the closely related eastern wolf and red wolf.","u":"https://en.wikipedia.org/wiki/Coyote","i":"img/9614.jpg"},"1977160":{"n":"crane","s":"Antigone canadensis","p":"3078114","x":"The sandhill crane is a species of large crane of North America and extreme northeastern Siberia. The common name of this bird refers to its habitat, such as the Platte River, on the edge of Nebraska's Sandhills on the American Great Plains.","u":"https://en.wikipedia.org/wiki/Sandhill_crane","i":"img/1977160.jpg"},"58607":{"n":"cricket","s":"Gryllus campestris","p":"6993","x":"Gryllus campestris, the European field cricket or simply the field cricket in the British Isles, is the type species of crickets in its genus and tribe Gryllini. These flightless dark colored insects are comparatively large; the males range from 19 to 23 mm and the females from 17 to 22 mm.","u":"https://en.wikipedia.org/wiki/Gryllus_campestris","i":"img/58607.jpg"},"8502":{"n":"crocodile","s":"Crocodylus porosus","p":"1294634","x":"The saltwater crocodile is a crocodilian native to saltwater habitats, brackish wetlands and freshwater rivers from India's east coast across Southeast Asia and the Sundaland to northern Australia and Micronesia. It has been listed as Least Concern on the IUCN Red List since 1996.","u":"https://en.wikipedia.org/wiki/Saltwater_crocodile","i":"img/8502.jpg"},"85066":{"n":"crow","s":"Corvus brachyrhynchos","p":"30420","x":"The American crow is a large passerine bird species of the family Corvidae. It is a common bird found throughout much of North America, only absent from the tundra biome.","u":"https://en.wikipedia.org/wiki/American_crow","i":"img/85066.jpg"},"55661":{"n":"cuckoo","s":"Cuculus canorus","p":"3078114","x":"The cuckoo, common cuckoo, European cuckoo or Eurasian cuckoo is a member of the cuckoo order of birds, Cuculiformes, which includes the roadrunners, the anis and the coucals.","u":"https://en.wikipedia.org/wiki/Common_cuckoo","i":"img/55661.jpg"},"6610":{"n":"cuttlefish","s":"Sepia officinalis","p":"215450","x":"The common cuttlefish or European common cuttlefish is one of the largest and best-known cuttlefish species. They are a migratory species that spend the summer and spring inshore for spawning and then move to depths of 100–200 metres (330–660 ft) during autumn and winter.","u":"https://en.wikipedia.org/wiki/Common_cuttlefish","i":"img/6610.jpg"},"9874":{"n":"deer","s":"Odocoileus virginianus","p":"9881","x":"The white-tailed deer, also known commonly as the whitetail and the Virginia deer, is a medium-sized species of deer native to North and South America. It is the most widely distributed mainland ungulate herbivore in the Americas; coupled with its natural predator, the mountain lion, it is one of the most widely…","u":"https://en.wikipedia.org/wiki/White-tailed_deer","i":"img/9874.jpg"},"9615":{"n":"dog","s":"Canis lupus familiaris","p":"9611","x":"The dog is a domesticated descendant of wolves. Also called the domestic dog, it was selectively bred during the Late Pleistocene by hunter-gatherers.","u":"https://en.wikipedia.org/wiki/Dog","i":"img/9615.jpg"},"9739":{"n":"dolphin","s":"Tursiops truncatus","p":"9726","x":"The common bottlenose dolphin or Atlantic bottlenose dolphin is one of three species of bottlenose dolphin in the genus Tursiops. While formerly known simply as the bottlenose dolphin, this term is now applied to the genus Tursiops as a whole.","u":"https://en.wikipedia.org/wiki/Common_bottlenose_dolphin","i":"img/9739.jpg"},"9793":{"n":"donkey","s":"Equus asinus","p":"9789","x":"The donkey, ass, or burro is a domesticated equine. It derives from the African wild ass, Equus africanus, and may be classified either as a subspecies thereof, Equus africanus asinus, or as a separate species, Equus asinus.","u":"https://en.wikipedia.org/wiki/Donkey","i":"img/9793.jpg"},"135631":{"n":"dove","s":"Leptotila verreauxi","p":"8930","x":"The white-tipped dove is a large New World tropical dove. Its scientific name commemorates the French naturalists Jules and Edouard Verreaux.","u":"https://en.wikipedia.org/wiki/White-tipped_dove","i":"img/135631.jpg"},"1646243":{"n":"dragonfly","s":"Aeshna canadensis","p":"33339","x":"Aeshna canadensis, the Canada darner, is a species of dragonfly in the family Aeshnidae. It is common throughout southern Canada and the northern United States.","u":"https://en.wikipedia.org/wiki/Aeshna_canadensis","i":"img/1646243.jpg"},"8839":{"n":"duck","s":"Anas platyrhynchos","p":"8830","x":"The mallard or wild duck is a dabbling duck that breeds throughout temperate and subtropical North America, Eurasia, and North Africa. It has been introduced to New Zealand, Australia, Peru, Brazil, Uruguay, Argentina, Chile, Colombia, the Falkland Islands, and South Africa.","u":"https://en.wikipedia.org/wiki/Mallard","i":"img/8839.jpg"},"166335":{"n":"dung beetle","s":"Scarabaeus sacer","p":"7055","x":"Scarabaeus sacer, common name sacred scarab, is the type species of the genus Scarabaeus and the family Scarabaeidae. This dung beetle is native to southern Europe, North Africa, West Asia, and was venerated in ancient Egypt.","u":"https://en.wikipedia.org/wiki/Scarabaeus_sacer","i":"img/166335.jpg"},"6398":{"n":"earthworm","s":"Lumbricus terrestris","p":"42113","x":"Lumbricus terrestris is a large, reddish worm species thought to be native to Western Europe, now widely distributed around the world. In some areas where it is an introduced species, some people consider it to be a significant pest for out-competing native worms.","u":"https://en.wikipedia.org/wiki/Lumbricus_terrestris","i":"img/6398.jpg"},"13068":{"n":"earwig","s":"Forficula auricularia","p":"33341","x":"Forficula auricularia is a species complex comprising the common earwig. It is also known as the European earwig.","u":"https://en.wikipedia.org/wiki/Forficula_auricularia","i":"img/13068.jpg"},"9261":{"n":"echidna","s":"Tachyglossus aculeatus","p":"9255","x":"The short-beaked echidna, also known as the common echidna, or short-nosed echidna, is one of four living species of echidna, and the only member of the genus Tachyglossus, from Ancient Greek ταχύς, meaning \"fast\", and γλῶσσα, meaning \"tongue\". It is covered in fur and spines and has a distinctive snout and a…","u":"https://en.wikipedia.org/wiki/Short-beaked_echidna","i":"img/9261.jpg"},"110620":{"n":"egret","s":"Ardea alba","p":"30389","x":"The great egret, also known as the common egret, large egret, great white egret, or great white heron, is a large, widely distributed egret. The four subspecies occur in Asia, Africa, the Americas, and southern Europe.","u":"https://en.wikipedia.org/wiki/Great_egret","i":"img/110620.jpg"},"8005":{"n":"electric eel","s":"Electrophorus electricus","p":"186628","x":"Electrophorus electricus is the best-known species of electric eel. It is a South American electric fish.","u":"https://en.wikipedia.org/wiki/Electrophorus_electricus","i":"img/8005.jpg"},"9785":{"n":"elephant","s":"Loxodonta africana","p":"311790","x":"The African bush elephant, also known as the African savanna elephant, is a species of elephant native to sub-Saharan Africa and the largest living terrestrial animal, with fully grown bulls reaching an average shoulder height of 3.04–3.36 m (10.0–11.0 ft) and a body mass of 5.2–6.9 t ; the largest recorded specimen…","u":"https://en.wikipedia.org/wiki/African_bush_elephant","i":"img/9785.jpg"},"1574408":{"n":"elk","s":"Cervus canadensis","p":"9850","x":"The elk or wapiti is the second largest species within the deer family, Cervidae, and one of the largest terrestrial mammals in its native range of North America and Central and East Asia. The word \"elk\" originally referred to the European variety of the moose, Alces alces, but was transferred to Cervus canadensis by…","u":"https://en.wikipedia.org/wiki/Elk","i":"img/1574408.jpg"},"9233":{"n":"emperor penguin","s":"Aptenodytes forsteri","p":"9231","x":"The emperor penguin is the tallest and heaviest of all living penguin species and is endemic to Antarctica. The male and female are similar in plumage and size, reaching 100 cm (39 in) in length and weighing from 22 to 45 kg.","u":"https://en.wikipedia.org/wiki/Emperor_penguin","i":"img/9233.jpg"},"55084":{"n":"emperor scorpion","s":"Pandinus imperator","p":"6855","x":"The emperor scorpion (Pandinus imperator) is a species of scorpion native to rainforests and savannas in West Africa. It is one of the largest scorpions in the world and lives for six to eight years.","u":"https://en.wikipedia.org/wiki/Emperor_scorpion","i":"img/55084.jpg"},"8790":{"n":"emu","s":"Dromaius novaehollandiae","p":"8784","x":"The emu is a species of flightless bird endemic to Australia, where it is the tallest native bird. It is the only extant member of the genus Dromaius and the third-tallest living bird after its African ratite relatives, the common ostrich and Somali ostrich.","u":"https://en.wikipedia.org/wiki/Emu","i":"img/8790.jpg"},"8954":{"n":"falcon","s":"Falco peregrinus","p":"8952","x":"The peregrine falcon, sometimes referred to simply as the peregrine, is a bird of prey (raptor) in the family Falconidae known for its speed. A large, crow-sized falcon, it has a blue-grey back, barred white underparts and a black head.","u":"https://en.wikipedia.org/wiki/Peregrine_falcon","i":"img/8954.jpg"},"9669":{"n":"ferret","s":"Mustela putorius furo","p":"9665","x":"The ferret is a small, domesticated species belonging to the family Mustelidae. The ferret is most likely a domesticated form of the wild European polecat, as evidenced by the ferret's ability to interbreed with European polecats and produce hybrid offspring.","u":"https://en.wikipedia.org/wiki/Ferret","i":"img/9669.jpg"},"1647984":{"n":"fiddler crab","s":"Tubuca urvillei","p":"6692","x":"Tubuca urvillei is a species of fiddler crab. It is found in Southeastern Africa from southern Somalia to South Africa and Madagascar.","u":"https://en.wikipedia.org/wiki/Tubuca_urvillei","i":"img/1647984.jpg"},"37607":{"n":"finch","s":"Pyrrhula pyrrhula","p":"9133","x":"The Eurasian bullfinch or common bullfinch is a small passerine bird in the finch family, Fringillidae. In Anglophone Europe it is known simply as the bullfinch, as it is the original bird to bear the name bullfinch.","u":"https://en.wikipedia.org/wiki/Eurasian_bullfinch","i":"img/37607.jpg"},"13686":{"n":"fire ant","s":"Solenopsis invicta","p":"36668","x":"Solenopsis invicta, the fire ant, or red imported fire ant (RIFA), is a species of ant native to South America. A member of the genus Solenopsis in the subfamily Myrmicinae, it was described by Swiss entomologist Felix Santschi as a variant of S.","u":"https://en.wikipedia.org/wiki/Red_imported_fire_ant","i":"img/13686.jpg"},"206118":{"n":"fire eel","s":"Mastacembelus erythrotaenia","p":"1489892","x":"The fire eel is a relatively large species of spiny eel. This omnivorous freshwater fish is native to Southeast Asia but is also found in the aquarium trade.","u":"https://en.wikipedia.org/wiki/Fire_eel","i":"img/206118.jpg"},"7051":{"n":"firefly","s":"Nipponoluciola cruciata","p":"41084","x":"Nipponoluciola cruciata, known as \"genji-botaru\" (ゲンジボタル) in Japanese, is a species of firefly found in Japan. Its habitat is small ditches and streams, and its larvae are aquatic.","u":"https://en.wikipedia.org/wiki/Nipponoluciola_cruciata","i":"img/7051.jpg"},"435638":{"n":"flamingo","s":"Phoenicopterus roseus","p":"3078114","x":"The greater flamingo is the largest and most widespread species of the flamingo family. Common in the Old World, they are found in Northern (coastal) and Sub-Saharan Africa, the Indian subcontinent, Central Asia, the Middle East, the Levant, the Persian Gulf, the Gulf of Aden, the Red Sea, and the Mediterranean…","u":"https://en.wikipedia.org/wiki/Greater_flamingo","i":"img/435638.jpg"},"50434":{"n":"flea","s":"Ctenocephalides canis","p":"3701063","x":"The dog flea is a species of flea that lives as an ectoparasite on a wide variety of mammals, particularly the domestic dog and cat. It closely resembles the cat flea, which can live on a wider range of animals and is generally more prevalent worldwide.","u":"https://en.wikipedia.org/wiki/Dog_flea","i":"img/50434.jpg"},"129044":{"n":"flying fish","s":"Cheilopogon melanurus","p":"1489913","x":"The Atlantic flyingfish is a flying fish of the family Exocoetidae; the species is one of 6 in the genus Cheilopogon. It was first described by the French zoologist Achille Valenciennes in a 22-volume work entitled Histoire naturelle des poissons, which was written in collaboration with fellow zoologist Georges Cuvier.","u":"https://en.wikipedia.org/wiki/Atlantic_flyingfish","i":"img/129044.jpg"},"254707":{"n":"flying squirrel","s":"Hylopetes nigripes","p":"9991","x":"The Palawan flying squirrel or tapilak is a species of rodent in the family Sciuridae. It is endemic to the Philippines.","u":"https://en.wikipedia.org/wiki/Palawan_flying_squirrel","i":"img/254707.jpg"},"52365":{"n":"freshwater mussel","s":"Cumberlandia monodonta","p":"6599","x":"Cumberlandia monodonta is a freshwater mussel endemic to the United States. Currently, C.","u":"https://en.wikipedia.org/wiki/Spectacle_case_pearly_mussel","i":"img/52365.jpg"},"6087":{"n":"freshwater polyp","s":"Hydra vulgaris","p":"37516","x":"Hydra vulgaris, the fresh-water polyp, is a small freshwater hydroid with length from 10 mm to 30 mm and width about 1 mm.","u":"https://en.wikipedia.org/wiki/Hydra_vulgaris","i":"img/6087.jpg"},"505845":{"n":"fruit bat","s":"Acerodon jubatus","p":"9397","x":"The giant golden-crowned flying fox, also known as the golden-capped fruit bat, is a species of megabat endemic to the Philippines. Since its description in 1831, three subspecies of the giant golden-crowned flying fox have been recognized, one of which is extinct.","u":"https://en.wikipedia.org/wiki/Giant_golden-crowned_flying_fox","i":"img/505845.jpg"},"7227":{"n":"fruit fly","s":"Drosophila melanogaster","p":"43738","x":"Drosophila melanogaster is a species of fly in the family Drosophilidae. The species is often referred to as the fruit fly or lesser fruit fly, or less commonly the \"vinegar fly\", \"pomace fly\", or \"banana fly\".","u":"https://en.wikipedia.org/wiki/Drosophila_melanogaster","i":"img/7227.jpg"},"37751":{"n":"gazelle","s":"Gazella dorcas","p":"9895","x":"The dorcas gazelle, also known as the ariel gazelle, is a small and common gazelle. The dorcas gazelle stands about 55–65 cm at the shoulder, with a head and body length of 90–110 cm and a weight of 15–20 kg.","u":"https://en.wikipedia.org/wiki/Dorcas_gazelle","i":"img/37751.jpg"},"301843":{"n":"gecko","s":"Lygodactylus capensis","p":"1329961","x":"The Cape dwarf gecko is a species of dwarf gecko found in the woodlands and forests of central and southern Africa. It also occurs commonly in towns and cities and is sometimes kept as a pet.","u":"https://en.wikipedia.org/wiki/Cape_dwarf_gecko","i":"img/301843.jpg"},"10047":{"n":"gerbil","s":"Meriones unguiculatus","p":"10066","x":"The Mongolian gerbil, also referred to as the Mongolian jird, is a rodent belonging to the subfamily Gerbillinae. Their body size is typically 110–135 mm, with a 95–120 mm tail, and body weight 60–130 g, with adult males larger than females.","u":"https://en.wikipedia.org/wiki/Mongolian_gerbil","i":"img/10047.jpg"},"2716284":{"n":"giant centipede","s":"Scolopendra cataracta","p":"7540","x":"Scolopendra cataracta is a species of centipede in the family Scolopendridae. It is the first known amphibious centipede and grows to up to 20 centimetres (7.9 in) in length.","u":"https://en.wikipedia.org/wiki/Scolopendra_cataracta","i":"img/2716284.jpg"},"80829":{"n":"giant clam","s":"Tridacna gigas","p":"2908833","x":"Tridacna gigas, the giant clam, is the best-known species of the giant clam genus Tridacna. Giant clams are the largest living bivalve molluscs.","u":"https://en.wikipedia.org/wiki/Giant_clam","i":"img/80829.jpg"},"267067":{"n":"giant octopus","s":"Enteroctopus dofleini","p":"6647","x":"The giant Pacific octopus, also known as the North Pacific giant octopus, is a large marine cephalopod belonging to the genus Enteroctopus and Enteroctopodidae family.","u":"https://en.wikipedia.org/wiki/Giant_Pacific_octopus","i":"img/267067.jpg"},"9646":{"n":"giant panda","s":"Ailuropoda melanoleuca","p":"9632","x":"The giant panda, also known as the panda bear or simply panda, is a bear species endemic to China. It is characterised by its white coat with black patches around the eyes, ears, legs and shoulders.","u":"https://en.wikipedia.org/wiki/Giant_panda","i":"img/9646.jpg"},"256136":{"n":"giant squid","s":"Architeuthis dux","p":"215450","x":"The giant squid is a species of deep-ocean dwelling squid in the family Architeuthidae. It can grow to a tremendous size, offering an example of abyssal gigantism; recent estimates put the maximum body size at around 5 m (16 ft) for females, with males slightly shorter, from the posterior fins to the tip of its long…","u":"https://en.wikipedia.org/wiki/Giant_squid","i":"img/256136.jpg"},"61853":{"n":"gibbon","s":"Nomascus leucogenys","p":"314295","x":"The northern white-cheeked gibbon is a Critically Endangered species of gibbon native to South East Asia.","u":"https://en.wikipedia.org/wiki/Northern_white-cheeked_gibbon","i":"img/61853.jpg"},"8554":{"n":"gila monster","s":"Heloderma suspectum","p":"8548","x":"The Gila monster is a species of venomous lizard native to the Southwestern United States and the northwestern Mexican state of Sonora. It is a heavy, slow-moving reptile, up to 22 in (56 cm) long, and it is the only venomous lizard native to the United States.","u":"https://en.wikipedia.org/wiki/Gila_monster","i":"img/8554.jpg"},"9894":{"n":"giraffe","s":"Giraffa camelopardalis","p":"35500","x":"The northern giraffe, also known as the three-horned giraffe, is a species of giraffe native to North Africa.","u":"https://en.wikipedia.org/wiki/Northern_giraffe","i":"img/9894.jpg"},"9925":{"n":"goat","s":"Capra hircus","p":"9922","x":"The goat or domestic goat is a species of caprine that is mostly kept as livestock. It was domesticated from the wild goat of Southwest Asia and Eastern Europe.","u":"https://en.wikipedia.org/wiki/Goat","i":"img/9925.jpg"},"57987":{"n":"goblin shark","s":"Mitsukurina owstoni","p":"30496","x":"The goblin shark is a rare species of deep-sea shark. Sometimes called a \"living fossil\", it is the only extant representative of the family Mitsukurinidae, a lineage some 125 million years old.","u":"https://en.wikipedia.org/wiki/Goblin_shark","i":"img/57987.jpg"},"7957":{"n":"goldfish","s":"Carassius auratus","p":"2743694","x":"The goldfish is a freshwater fish in the family Cyprinidae of the order Cypriniformes. It is commonly kept as a pet in indoor aquariums, and is one of the most popular aquarium fish.","u":"https://en.wikipedia.org/wiki/Goldfish","i":"img/7957.jpg"},"8853":{"n":"goose","s":"Branta canadensis","p":"2068722","x":"The Canada goose is a large species of goose with a black head and neck, white cheeks, white under its chin, and a brown body. It is native to the Arctic and temperate regions of North America, and it is occasionally found during migration across the Atlantic in northern Europe.","u":"https://en.wikipedia.org/wiki/Canada_goose","i":"img/8853.jpg"},"9593":{"n":"gorilla","s":"Gorilla gorilla","p":"207598","x":"The western gorilla is a great ape found in Africa, one of two species of the hominine genus Gorilla. Large and robust with males weighing around 168 kilograms (370 lb), the species is found in a region of midwest Africa, geographically isolated from the eastern gorilla.","u":"https://en.wikipedia.org/wiki/Western_gorilla","i":"img/9593.jpg"},"7009":{"n":"grasshopper","s":"Schistocerca americana","p":"7008","x":"Schistocerca americana is a species of grasshopper in the family Acrididae known commonly as the American grasshopper and American bird grasshopper. It is native to North America, where it occurs in the eastern United States, Mexico, and the Bahamas.","u":"https://en.wikipedia.org/wiki/Schistocerca_americana","i":"img/7009.jpg"},"13397":{"n":"great white shark","s":"Carcharodon carcharias","p":"30496","x":"The great white shark, also known as the white shark, white pointer, or great white, is a large shark. It is closely related to the mako sharks, the porbeagle, and the salmon shark.","u":"https://en.wikipedia.org/wiki/Great_white_shark","i":"img/13397.jpg"},"129333":{"n":"green tree python","s":"Morelia viridis","p":"34984","x":"The green tree python, is a species of snake in the family Pythonidae. The species is native to New Guinea, some islands in Indonesia, and the Cape York Peninsula in Australia.","u":"https://en.wikipedia.org/wiki/Green_tree_python","i":"img/129333.jpg"},"57247":{"n":"grey parrot","s":"Psittacus erithacus","p":"9224","x":"The grey parrot, also known as the Congo grey parrot, is an African parrot in the family Psittacidae. Psittacus erithacus was previously also known as the African grey parrot until the Timneh parrot, previously treated as a subspecies, was elevated to a full species.","u":"https://en.wikipedia.org/wiki/Grey_parrot","i":"img/57247.jpg"},"9995":{"n":"groundhog","s":"Marmota monax","p":"337730","x":"The groundhog, also known as the woodchuck, is a rodent of the family Sciuridae, belonging to the group of large ground squirrels known as marmots. A lowland creature of North America, it is found through much of the Eastern United States, across Canada and into Alaska.","u":"https://en.wikipedia.org/wiki/Groundhog","i":"img/9995.jpg"},"10141":{"n":"guinea pig","s":"Cavia porcellus","p":"33550","x":"The guinea pig, also known as the domestic guinea pig, cavy or domestic cavy, is a species of rodent. It belongs to the genus Cavia, family Caviidae, and its closest wild relatives include the montane guinea pig.","u":"https://en.wikipedia.org/wiki/Guinea_pig","i":"img/10141.jpg"},"8081":{"n":"guppy","s":"Poecilia reticulata","p":"1489913","x":"The guppy, also known as the peacock fish, millionfish or rainbow fish, is a member of the family Poeciliidae and, akin to most New World members of the family, is classified as a livebearer. Male guppies, which are smaller than females, have ornamental caudal and dorsal fins.","u":"https://en.wikipedia.org/wiki/Guppy","i":"img/8081.jpg"},"195615":{"n":"halibut","s":"Hippoglossus stenolepis","p":"1489904","x":"Hippoglossus stenolepis, the Pacific halibut, is a species of righteye flounder. This very large species of flatfish is native to the North Pacific and is fished by commercial fisheries, sport fishers, and subsistence fishers.","u":"https://en.wikipedia.org/wiki/Pacific_halibut","i":"img/195615.jpg"},"195334":{"n":"hammerhead shark","s":"Sphyrna mokarran","p":"7805","x":"The great hammerhead is the largest species of hammerhead shark, belonging to the family Sphyrnidae, attaining an average length of 4.6 m (15 ft) and reaching a maximum length of 6.2 m (20 ft). It is found around the globe in all the warmer parts of the oceans.","u":"https://en.wikipedia.org/wiki/Great_hammerhead","i":"img/195334.jpg"},"10036":{"n":"hamster","s":"Mesocricetus auratus","p":"337687","x":"The golden hamster or Syrian hamster is a rodent belonging to the hamster subfamily, Cricetinae. Their natural geographical range is in an arid region of northern Syria and southern Turkey.","u":"https://en.wikipedia.org/wiki/Golden_hamster","i":"img/10036.jpg"},"48087":{"n":"hare","s":"Lepus californicus","p":"9979","x":"The black-tailed jackrabbit, also known as the American desert hare, is a common hare of the western United States and Mexico, where it is found at elevations from sea level up to 10,000 ft (3,000 m). Reaching a length around 2 ft (61 cm), and a weight from 3 to 6 lb, the black-tailed jackrabbit is one of the largest…","u":"https://en.wikipedia.org/wiki/Black-tailed_jackrabbit","i":"img/48087.jpg"},"475616":{"n":"harvestman","s":"Rilaena triangularis","p":"6854","x":"Rilaena triangularis is a species of the harvestman family Phalangiidae. Previously it has been considered to be in the genus and subgenus Platybunus (Paraplatybunus) Dumitrescu, 1970, in the subfamily Platybuninae.","u":"https://en.wikipedia.org/wiki/Rilaena_triangularis","i":"img/475616.jpg"},"1037346":{"n":"hawk","s":"Accipiter gundlachi","p":"8955","x":"Gundlach's hawk is a species of bird of prey in the family Accipitridae. It was formerly placed in the genus Accipiter.","u":"https://en.wikipedia.org/wiki/Gundlach's_hawk","i":"img/1037346.jpg"},"6287":{"n":"heartworm","s":"Dirofilaria immitis","p":"6236","x":"Dirofilaria immitis, also known as heartworm or dog heartworm, is a parasitic roundworm that is a type of filarial worm, a small thread-like worm, and which causes dirofilariasis. It is spread from host to host through the bites of mosquitoes.","u":"https://en.wikipedia.org/wiki/Dirofilaria_immitis","i":"img/6287.jpg"},"9365":{"n":"hedgehog","s":"Erinaceus europaeus","p":"9362","x":"The European hedgehog, also known as the West European hedgehog, Western European hedgehog or common hedgehog, is a hedgehog species native to Europe from Iberia and Italy northwards into Scandinavia and westwards into Ireland. It is a generally common and widely distributed species that can survive across a wide…","u":"https://en.wikipedia.org/wiki/European_hedgehog","i":"img/9365.jpg"},"1247135":{"n":"hercules beetle","s":"Dynastes hercules","p":"7055","x":"The Hercules beetle is a species of rhinoceros beetle native to the tropical forests of southern Mexico, Central America, South America, and the Lesser Antilles. It is the longest extant species of beetle in the world, and is also one of the largest flying insects in the world.","u":"https://en.wikipedia.org/wiki/Hercules_beetle","i":"img/1247135.jpg"},"1129476":{"n":"hermit crab","s":"Dardanus calidus","p":"6744","x":"Dardanus calidus is a species of hermit crab from the East Atlantic and Mediterranean Sea.","u":"https://en.wikipedia.org/wiki/Dardanus_calidus","i":"img/1129476.jpg"},"56072":{"n":"heron","s":"Ardea herodias","p":"30389","x":"The great blue heron is a large wading bird in the heron family (Ardeidae), common near shores of open water and wetlands over most of North and Central America, as well as Northwestern South America, the Caribbean, and the Galápagos Islands. It is occasionally found in the Azores and is a rare vagrant to Europe.","u":"https://en.wikipedia.org/wiki/Great_blue_heron","i":"img/56072.jpg"},"7950":{"n":"herring","s":"Clupea harengus","p":"7948","x":"Atlantic herring is a herring in the family Clupeidae. It is one of the most abundant fish species in the world.","u":"https://en.wikipedia.org/wiki/Atlantic_herring","i":"img/7950.jpg"},"9833":{"n":"hippopotamus","s":"Hippopotamus amphibius","p":"2653789","x":"The hippopotamus, often shortened to hippo, further qualified as the common hippopotamus, Nile hippopotamus and river hippopotamus, is a large semiaquatic mammal native to sub-Saharan Africa. It is one of only two extant species in the family Hippopotamidae, the other being the pygmy hippopotamus.","u":"https://en.wikipedia.org/wiki/Hippopotamus","i":"img/9833.jpg"},"7460":{"n":"honey bee","s":"Apis mellifera","p":"70987","x":"The western honey bee is the most common of the 7–12 species of honey bees worldwide. The genus name Apis is Latin for 'bee', and mellifera is the Latin for 'honey-bearing' or 'honey-carrying', referring to the species' production of honey.","u":"https://en.wikipedia.org/wiki/Western_honey_bee","i":"img/7460.jpg"},"7445":{"n":"hornet","s":"Vespa crabro","p":"7439","x":"The European hornet is the largest eusocial wasp native to Europe. It is also the only true hornet  found in North America, having been introduced to the United States and Canada from Europe as early as 1840.","u":"https://en.wikipedia.org/wiki/European_hornet","i":"img/7445.jpg"},"9796":{"n":"horse","s":"Equus caballus","p":"9789","x":"The horse is a domesticated, one-toed, hoofed mammal. It belongs to the taxonomic family Equidae and is one of two extant subspecies of Equus ferus.","u":"https://en.wikipedia.org/wiki/Horse","i":"img/9796.jpg"},"6850":{"n":"horseshoe crab","s":"Limulus polyphemus","p":"6843","x":"The Atlantic horseshoe crab, also known as the American horseshoe crab, is a species of horseshoe crab, a kind of marine and brackish chelicerate arthropod. It is found in the Gulf of Mexico and along the Atlantic coast of North America.","u":"https://en.wikipedia.org/wiki/Atlantic_horseshoe_crab","i":"img/6850.jpg"},"29022":{"n":"house centipede","s":"Scutigera coleoptrata","p":"7540","x":"Scutigera coleoptrata, also known as the house centipede, is a species of centipede that is typically yellowish-gray and has up to 15 pairs of long legs. Originating in the Mediterranean region, it has spread to other parts of the world, where it frequently lives in and around human homes.","u":"https://en.wikipedia.org/wiki/Scutigera_coleoptrata","i":"img/29022.jpg"},"7370":{"n":"house fly","s":"Musca domestica","p":"43738","x":"The housefly is a species of fly in the family Muscidae. From its place of origin, possibly in the Middle East, it has spread around the world as a commensal of humans.","u":"https://en.wikipedia.org/wiki/Housefly","i":"img/7370.jpg"},"182253":{"n":"howler monkey","s":"Alouatta pigra","p":"9479","x":"The Yucatán black howler, or Guatemalan black howler, is a species of howler monkey, a type of New World monkey, from Central America. It is found in Belize, Guatemala and Mexico, in and near the Yucatán Peninsula.","u":"https://en.wikipedia.org/wiki/Yucat%C3%A1n_black_howler","i":"img/182253.jpg"},"9606":{"n":"human","s":"Homo sapiens","p":"207598","x":"Humans are the most abundant and widespread species of primates, characterized by bipedalism, minimal body hair, and large, complex brains enabling the development of advanced technology, culture, and language. Humans are highly social beings and tend to live in complex social structures composed of many cooperating…","u":"https://en.wikipedia.org/wiki/Human","i":"img/9606.jpg"},"2082998":{"n":"hummingbird","s":"Mellisuga helenae","p":"8892","x":"The bee hummingbird, zunzuncito or Helena hummingbird is a species of hummingbird, native to the island of Cuba in the Caribbean. It is the smallest known bird.","u":"https://en.wikipedia.org/wiki/Bee_hummingbird","i":"img/2082998.jpg"},"9773":{"n":"humpback whale","s":"Megaptera novaeangliae","p":"9765","x":"The humpback whale is a species of baleen whale. It is a rorqual and is the only species in the genus Megaptera.","u":"https://en.wikipedia.org/wiki/Humpback_whale","i":"img/9773.jpg"},"679132":{"n":"huntsman spider","s":"Heteropoda maxima","p":"94015","x":"The giant huntsman spider is a species of the huntsman spider family Sparassidae found in Laos. It is considered the world's largest spider by leg span, which can reach up to 30 cm (1 ft).","u":"https://en.wikipedia.org/wiki/Giant_huntsman_spider","i":"img/679132.jpg"},"9678":{"n":"hyena","s":"Crocuta crocuta","p":"379583","x":"The spotted hyena, also known as the laughing hyena, is a hyena species, currently classed as the sole extant member of the genus Crocuta, native to sub-Saharan Africa. It is listed as being of least concern by the IUCN due to its widespread range and large numbers estimated between 27,000 and 47,000 individuals.","u":"https://en.wikipedia.org/wiki/Spotted_hyena","i":"img/9678.jpg"},"9813":{"n":"hyrax","s":"Procavia capensis","p":"311790","x":"The rock hyrax, also called dassie, Rickaz, Cape hyrax, rock rabbit, or coney, is a medium-sized terrestrial hyrax native to Africa and the Middle East. Commonly called the dassie in South Africa, it is one of the five living species of the order Hyracoidea, and the only one in the genus Procavia.","u":"https://en.wikipedia.org/wiki/Rock_hyrax","i":"img/9813.jpg"},"72542":{"n":"ibex","s":"Capra ibex","p":"9922","x":"The Alpine ibex, also known as the steinbock, is a European species of goat which lives in the Alps. It is one of ten species in the genus Capra, and its closest living relative is the Iberian ibex.","u":"https://en.wikipedia.org/wiki/Alpine_ibex","i":"img/72542.jpg"},"8517":{"n":"iguana","s":"Iguana iguana","p":"8511","x":"The green iguana, also known as the American iguana or the common green iguana, is a large, arboreal, mostly herbivorous species of lizard of the genus Iguana. Usually, this animal is simply called the iguana.","u":"https://en.wikipedia.org/wiki/Green_iguana","i":"img/8517.jpg"},"68724":{"n":"jackal","s":"Canis aureus","p":"9611","x":"The golden jackal, also called the common jackal, is a wolf-like canid that is native to Eurasia. The golden jackal's coat varies in color from a pale creamy yellow in summer to a dark tawny beige in winter.","u":"https://en.wikipedia.org/wiki/Golden_jackal","i":"img/68724.jpg"},"9690":{"n":"jaguar","s":"Panthera onca","p":"9688","x":"The jaguar is a large cat species and the only living member of the genus Panthera that is native to the Americas. Its coat features pale yellow to tan colored fur covered with spots that transition to rosettes on the sides; some individuals have a melanistic spotted coat.","u":"https://en.wikipedia.org/wiki/Jaguar","i":"img/9690.jpg"},"6145":{"n":"jellyfish","s":"Aurelia aurita","p":"6143","x":"Aurelia aurita is a species of true jellyfish in the family Ulmaridae and the type species of its genus, Aurelia. Before the 2020s, the species was considered cosmopolitan, but the taxon has since been split into at least 28 species.","u":"https://en.wikipedia.org/wiki/Aurelia_aurita","i":"img/6145.jpg"},"9321":{"n":"kangaroo","s":"Osphranter rufus","p":"38609","x":"The red kangaroo is the largest of all kangaroos, the largest terrestrial mammal native to Australia, and the largest extant marsupial. It is found across mainland Australia, except for the more fertile areas, such as southern Western Australia, the eastern and southeastern coasts, and the rainforests along the…","u":"https://en.wikipedia.org/wiki/Red_kangaroo","i":"img/9321.jpg"},"56350":{"n":"kestrel","s":"Falco sparverius","p":"8952","x":"The American kestrel is the smallest and most common falcon in the Americas. Though it has been called the American \"sparrow hawk\", this now obsolete vernacular name is a misnomer; the American kestrel is a true falcon, while neither the Eurasian sparrowhawk nor the other species called sparrowhawks are in the family…","u":"https://en.wikipedia.org/wiki/American_kestrel","i":"img/56350.jpg"},"8665":{"n":"king cobra","s":"Ophiophagus hannah","p":"42168","x":"The king cobra is a species complex of snakes endemic to Asia. With an average length of 3.18 to 4 m and a record length of 5.85 m (19.2 ft), it is the world's longest venomous snake and among the heaviest.","u":"https://en.wikipedia.org/wiki/King_cobra","i":"img/8665.jpg"},"29067":{"n":"kinkajou","s":"Potos flavus","p":"9647","x":"The kinkajou is a mammal of the family Procyonidae, a relative to olingos, coatis, raccoons, and the ringtail and cacomistle. It is the only member of the genus Potos and is also known as the honey bear.","u":"https://en.wikipedia.org/wiki/Kinkajou","i":"img/29067.jpg"},"52810":{"n":"kite","s":"Milvus migrans","p":"8955","x":"The black kite or fire kite is a medium-sized bird of prey in the family Accipitridae, which also includes many other diurnal raptors. It is thought to be the world's most abundant species of Accipitridae, although some populations have experienced dramatic declines or fluctuations.","u":"https://en.wikipedia.org/wiki/Black_kite","i":"img/52810.jpg"},"308060":{"n":"kiwi","s":"Apteryx rowi","p":"8783","x":"The Okarito kiwi, also known as Rowi or Okarito brown kiwi, is a member of the kiwi family Apterygidae, described as new to science in 2003. The species is part of the brown kiwi complex, and is morphologically very similar to other members of that complex.","u":"https://en.wikipedia.org/wiki/Okarito_kiwi","i":"img/308060.jpg"},"38626":{"n":"koala","s":"Phascolarctos cinereus","p":"38609","x":"The koala, sometimes inaccurately called the koala bear, is an arboreal herbivorous marsupial native to Australia. It is the only extant representative of the family Phascolarctidae.","u":"https://en.wikipedia.org/wiki/Koala","i":"img/38626.jpg"},"61221":{"n":"komodo dragon","s":"Varanus komodoensis","p":"8548","x":"The Komodo dragon, also known as the Komodo monitor, is a large reptile of the monitor lizard family Varanidae that is endemic to the Indonesian islands of Komodo, Rinca, Flores, Gili Dasami, and Gili Motang. The largest extant population lives within the Komodo National Park in Eastern Indonesia.","u":"https://en.wikipedia.org/wiki/Komodo_dragon","i":"img/61221.jpg"},"102976":{"n":"krill","s":"Euphausia pacifica","p":"3701045","x":"Euphausia pacifica, the North Pacific krill, is a euphausid that lives in the northern Pacific Ocean.","u":"https://en.wikipedia.org/wiki/Euphausia_pacifica","i":"img/102976.jpg"},"41139":{"n":"ladybug","s":"Coccinella septempunctata","p":"41084","x":"Coccinella septempunctata, commonly known as the seven-spot ladybird, often abbreviated C-7, is a carnivorous beetle native to Europe, most of Asia, and North Africa. It inhabits many regions with a temperate climate.","u":"https://en.wikipedia.org/wiki/Coccinella_septempunctata","i":"img/41139.jpg"},"338475":{"n":"lamprey","s":"Eudontomyzon mariae","p":"7742","x":"The Ukrainian brook lamprey is a species of lamprey in the Petromyzontidae family. It is found in brackish and freshwater areas in Austria, Belarus, Bulgaria, the Czech Republic, Georgia, Hungary, Moldova, North Macedonia, Poland, Romania, Russia, Serbia, Montenegro, Slovakia, Turkey, and Ukraine.","u":"https://en.wikipedia.org/wiki/Ukrainian_brook_lamprey","i":"img/338475.jpg"},"130591":{"n":"lanternfly","s":"Lycorma delicatula","p":"1955247","x":"The spotted lanternfly is a species of planthopper indigenous to parts of China and Vietnam. It was accidentally introduced into South Korea and has spread invasively to Japan, 21 U.S.","u":"https://en.wikipedia.org/wiki/Spotted_lanternfly","i":"img/130591.jpg"},"2815683":{"n":"leaf insect","s":"Phyllium letiranti","p":"213547","x":"Phyllium letiranti is a species of stick insects belonging to the Phylliidae described in 2018. The species has been recorded on several Indonesian islands east of Sulawesi.","u":"https://en.wikipedia.org/wiki/Phyllium_letiranti","i":"img/2815683.jpg"},"6421":{"n":"leech","s":"Hirudo medicinalis","p":"42113","x":"Hirudo medicinalis, or the European medicinal leech, is one of several species of leeches used as medicinal leeches.","u":"https://en.wikipedia.org/wiki/Hirudo_medicinalis","i":"img/6421.jpg"},"9447":{"n":"lemur","s":"Lemur catta","p":"9443","x":"The ring-tailed lemur is a medium- to larger-sized strepsirrhine (wet-nosed) primate and the most internationally recognized lemur species, owing to its long, black-and-white, ringed tail. It belongs to Lemuridae, one of five lemur families, and is the only member of the Lemur genus.","u":"https://en.wikipedia.org/wiki/Ring-tailed_lemur","i":"img/9447.jpg"},"9691":{"n":"leopard","s":"Panthera pardus","p":"9688","x":"The leopard is one of the five extant cat species in the genus Panthera. It has a pale yellowish to dark golden fur with dark spots grouped in rosettes.","u":"https://en.wikipedia.org/wiki/Leopard","i":"img/9691.jpg"},"9689":{"n":"lion","s":"Panthera leo","p":"9688","x":"The lion is a large cat of the genus Panthera, currently ranging only in sub-Saharan Africa and India. It has a muscular, broad-chested body; a short, rounded head; round ears; and a dark, hairy tuft at the tip of its tail.","u":"https://en.wikipedia.org/wiki/Lion","i":"img/9689.jpg"},"27804":{"n":"lions mane jellyfish","s":"Cyanea capillata","p":"6143","x":"The lion's mane jellyfish is one of the largest known species of jellyfish. Its range is confined to cold, boreal waters of the Arctic, northern Atlantic, and northern Pacific Oceans.","u":"https://en.wikipedia.org/wiki/Lion's_mane_jellyfish","i":"img/27804.jpg"},"9844":{"n":"llama","s":"Lama glama","p":"9835","x":"The llama is a domesticated South American camelid, widely used as a meat and pack animal by Andean cultures since the pre-Columbian era.","u":"https://en.wikipedia.org/wiki/Llama","i":"img/9844.jpg"},"6707":{"n":"lobster","s":"Homarus gammarus","p":"6692","x":"Homarus gammarus, known as the European lobster or common lobster, is a species of clawed lobster from the eastern Atlantic Ocean, Mediterranean Sea and parts of the Black Sea. It is closely related to the American lobster, H.","u":"https://en.wikipedia.org/wiki/Homarus_gammarus","i":"img/6707.jpg"},"7010":{"n":"locust","s":"Schistocerca gregaria","p":"7008","x":"The desert locust is a species of locust in the grasshopper family, Acrididae. A periodically swarming, short-horned bird grasshopper, it is found primarily in the deserts and dry areas of northern and eastern Africa, Arabia, and southwest Asia.","u":"https://en.wikipedia.org/wiki/Desert_locust","i":"img/7010.jpg"},"37039":{"n":"loon","s":"Gavia immer","p":"3073812","x":"The common loon or great northern diver is a large member of the loon, or diver, family of birds. Breeding adults have a plumage that includes a broad black head and neck with a greenish, purplish, or bluish sheen, blackish or blackish-grey upperparts, and pure white underparts except some black on the undertail…","u":"https://en.wikipedia.org/wiki/Common_loon","i":"img/37039.jpg"},"13125":{"n":"lynx","s":"Lynx lynx","p":"13124","x":"The Eurasian lynx is one of the four extant species within the medium-sized wild cat genus Lynx. It is widely distributed from Northern, Central and Eastern Europe to Central Asia and Siberia, the Tibetan Plateau and the Himalayas.","u":"https://en.wikipedia.org/wiki/Eurasian_lynx","i":"img/13125.jpg"},"9542":{"n":"macaque","s":"Macaca fuscata","p":"9528","x":"The Japanese macaque, also known as the snow monkey, is a terrestrial Old World monkey species that is native to Japan. Colloquially, this macaque is referred to as the \"snow monkey\", because some live in areas where snow covers the ground for months each year.","u":"https://en.wikipedia.org/wiki/Japanese_macaque","i":"img/9542.jpg"},"79627":{"n":"macaroni penguin","s":"Eudyptes chrysolophus","p":"9231","x":"The macaroni penguin is a species of penguin found from the Subantarctic to the Antarctic Peninsula. One of eight species of crested penguin, it is very closely related to the royal penguin, and some authorities consider the two to be a single species.","u":"https://en.wikipedia.org/wiki/Macaroni_penguin","i":"img/79627.jpg"},"51900":{"n":"macaw","s":"Anodorhynchus hyacinthinus","p":"9224","x":"The hyacinth macaw, or hyacinthine macaw, is a large parrot native to central and eastern South America. With a length of about one meter it is longer than any other species of parrot.","u":"https://en.wikipedia.org/wiki/Hyacinth_macaw","i":"img/51900.jpg"},"29150":{"n":"mackerel","s":"Scomber australasicus","p":"186745","x":"The blue mackerel, also called Japanese mackerel, Pacific mackerel, slimy mackerel, or spotted chub mackerel, is a fish of the family Scombridae.","u":"https://en.wikipedia.org/wiki/Blue_mackerel","i":"img/29150.jpg"},"34924":{"n":"magpie","s":"Pica pica","p":"28725","x":"The Eurasian magpie or common magpie is a resident breeding bird throughout the northern part of the Eurasian continent. It is one of several birds in the crow family (corvids) that are designated as magpies, and it belongs to the Holarctic radiation of \"monochrome\" magpies.","u":"https://en.wikipedia.org/wiki/Eurasian_magpie","i":"img/34924.jpg"},"168775":{"n":"man o war","s":"Physalia physalis","p":"37516","x":"The Portuguese man o' war, also known as the man-of-war, bluebottle, or sometimes called Caravela Portuguesa, is a marine hydrozoan found in the Atlantic, Indian, and Pacific oceans. While it is typically considered the only species in its genus, Physalia, and family, Physaliidae, genetic evidence suggests there may…","u":"https://en.wikipedia.org/wiki/Portuguese_man_o'_war","i":"img/168775.jpg"},"9778":{"n":"manatee","s":"Trichechus manatus","p":"311790","x":"The West Indian manatee, also known as the North American manatee, is a large, aquatic mammal native to warm coastal areas of the Caribbean, from the Eastern United States to northern Brazil. Living alone or in herds, it feeds on underwater plants and uses its whiskers to navigate.","u":"https://en.wikipedia.org/wiki/West_Indian_manatee","i":"img/9778.jpg"},"9561":{"n":"mandrill","s":"Mandrillus sphinx","p":"9528","x":"The mandrill is a large Old World monkey native to west central Africa. It is one of the most colorful mammals in the world, with red and blue skin on its face and posterior.","u":"https://en.wikipedia.org/wiki/Mandrill","i":"img/9561.jpg"},"1983395":{"n":"manta ray","s":"Mobula birostris","p":"117851","x":"The giant oceanic manta ray, giant manta ray, oceanic manta ray, or pelagic manta ray is a species of ray in the family Mobulidae and the largest type of ray in the world. It is circumglobal and is typically found in tropical and subtropical waters but can also be found in temperate waters.","u":"https://en.wikipedia.org/wiki/Giant_oceanic_manta_ray","i":"img/1983395.jpg"},"120888":{"n":"mantis shrimp","s":"Odontodactylus scyllarus","p":"3701045","x":"Odontodactylus scyllarus, commonly known as the peacock mantis shrimp, harlequin mantis shrimp, painted mantis shrimp, clown mantis shrimp, rainbow mantis shrimp, peacock odontodactyl, thumb splitter, or simply mantis shrimp, is a large odontodactylid stomatopod native to the epipelagic seabed across the Indo-Pacific,…","u":"https://en.wikipedia.org/wiki/Odontodactylus_scyllarus","i":"img/120888.jpg"},"1678817":{"n":"mayfly","s":"Rhithrogena germanica","p":"33339","x":"Rhithrogena germanica is a European species of mayfly, and is \"probably the most famous of all British mayflies\", because of its use in fly fishing. It is known in the British Isles as the March brown mayfly, a name which is used in the United States for a different species, Rhithrogena morrisoni.","u":"https://en.wikipedia.org/wiki/Rhithrogena_germanica","i":"img/1678817.jpg"},"37032":{"n":"meerkat","s":"Suricata suricatta","p":"9697","x":"The meerkat or suricate is a small mongoose found in southern Africa. It is characterised by a broad head, large eyes, a pointed snout, long legs, a thin tapering tail, and a brindled coat pattern.","u":"https://en.wikipedia.org/wiki/Meerkat","i":"img/37032.jpg"},"291247":{"n":"millipede","s":"Oxidus gracilis","p":"61985","x":"The greenhouse millipede, also known as the hothouse millipede, short-flange millipede, or garden millipede, is a species of millipede in the family Paradoxosomatidae that has been widely introduced around the world, and is sometimes a pest in greenhouses.","u":"https://en.wikipedia.org/wiki/Greenhouse_millipede","i":"img/291247.jpg"},"9666":{"n":"mink","s":"Mustela lutreola","p":"9665","x":"The European mink, also known as the Russian mink and Eurasian mink, is a semiaquatic species of mustelid native to Europe.","u":"https://en.wikipedia.org/wiki/European_mink","i":"img/9666.jpg"},"60713":{"n":"mockingbird","s":"Mimus polyglottos","p":"9126","x":"The northern mockingbird is a mockingbird commonly found in North America, of the family Mimidae. The species is also found in some parts of the Caribbean, as well as on the Hawaiian Islands.","u":"https://en.wikipedia.org/wiki/Northern_mockingbird","i":"img/60713.jpg"},"9375":{"n":"mole","s":"Talpa europaea","p":"9362","x":"The European mole is a mammal of the order Eulipotyphla. It is also known as the common mole and the northern mole.","u":"https://en.wikipedia.org/wiki/European_mole","i":"img/9375.jpg"},"13037":{"n":"monarch butterfly","s":"Danaus plexippus","p":"104431","x":"The monarch butterfly or simply monarch is a milkweed butterfly in the family Nymphalidae. Other common names, depending on region, include milkweed, common tiger, wanderer, and black-veined brown.","u":"https://en.wikipedia.org/wiki/Monarch_butterfly","i":"img/13037.jpg"},"9700":{"n":"mongoose","s":"Herpestes ichneumon","p":"9697","x":"The Egyptian mongoose, also known as ichneumon, is a mongoose species native to the tropical and subtropical grasslands, savannas, and shrublands of Africa and around the Mediterranean Basin in North Africa, the Middle East and the Iberian Peninsula. Whether it is introduced or native to the Iberian Peninsula is in…","u":"https://en.wikipedia.org/wiki/Egyptian_mongoose","i":"img/9700.jpg"},"9852":{"n":"moose","s":"Alces alces","p":"9881","x":"The moose or elk is the world's tallest, largest and heaviest extant species of deer and the only extant species in the genus Alces. It is also the tallest, and the second-largest, land animal in North America, falling short only to the American bison in body mass.","u":"https://en.wikipedia.org/wiki/Moose","i":"img/9852.jpg"},"586820":{"n":"moray eel","s":"Enchelycore pardalis","p":"32443","x":"The leopard moray eel, also known as the dragon moray, tiger moray or puhi-kauila in Hawaiian, is a species of moray eel of the family Muraenidae.","u":"https://en.wikipedia.org/wiki/Leopard_moray_eel","i":"img/586820.jpg"},"7159":{"n":"mosquito","s":"Aedes aegypti","p":"7147","x":"Aedes aegypti – sometimes called the yellow fever mosquito – is a mosquito that spreads diseases such as dengue fever, yellow fever, and chikungunya. The mosquito can be recognized by black and white markings on its legs and a marking in the form of a lyre on the upper surface of its thorax.","u":"https://en.wikipedia.org/wiki/Aedes_aegypti","i":"img/7159.jpg"},"10090":{"n":"mouse","s":"Mus musculus","p":"39107","x":"The house mouse is a small mammal of the rodent family Muridae, characteristically having a pointed snout, large rounded ears, and a long and almost hairless tail. It is one of the most abundant species of the genus Mus.","u":"https://en.wikipedia.org/wiki/House_mouse","i":"img/10090.jpg"},"6550":{"n":"mussel","s":"Mytilus edulis","p":"6545","x":"The blue mussel, also known as the common mussel, is a medium-sized edible marine bivalve mollusc in the family Mytilidae, the only extant family in the order Mytilida, known as \"true mussels\". Blue mussels are subject to commercial use and intensive aquaculture.","u":"https://en.wikipedia.org/wiki/Blue_mussel","i":"img/6550.jpg"},"10181":{"n":"naked mole rat","s":"Heterocephalus glaber","p":"33550","x":"The naked mole-rat, also known as the sand puppy, is a burrowing rodent native to the Horn of Africa and parts of Kenya, notably in Somali regions. It is the only species in the genus Heterocephalus.","u":"https://en.wikipedia.org/wiki/Naked_mole-rat","i":"img/10181.jpg"},"40151":{"n":"narwhal","s":"Monodon monoceros","p":"9747","x":"The narwhal is a species of toothed whale native to the Arctic. It is the only member of the genus Monodon and one of two living representatives of the family Monodontidae.","u":"https://en.wikipedia.org/wiki/Narwhal","i":"img/40151.jpg"},"34578":{"n":"nautilus","s":"Nautilus belauensis","p":"6605","x":"The Palau nautilus is a nautiloid mainly found off of Palau in the Western Carolines. It can be found on fore reef slopes, at depths of 95-504 m (311-1,653'), though typically preferring a range of 150-300 m (492-984'), where water temperatures stay around 16.6 °C (61.88°F) and do not go much lower than 9.4 °C…","u":"https://en.wikipedia.org/wiki/Nautilus_belauensis","i":"img/34578.jpg"},"6239":{"n":"nematode","s":"Caenorhabditis elegans","p":"6236","x":"Caenorhabditis elegans is a free-living transparent nematode about 1 mm in length that lives in temperate soil environments. It is the type species of its genus.","u":"https://en.wikipedia.org/wiki/Caenorhabditis_elegans","i":"img/6239.jpg"},"54263":{"n":"newt","s":"Ichthyosaura alpestris","p":"8314","x":"The alpine newt is a species of newt native to continental Europe and introduced to Great Britain and New Zealand. Adults measure 7–12 cm (2.8–4.7 in) and are usually dark grey to blue on the back and sides, with an orange belly and throat.","u":"https://en.wikipedia.org/wiki/Alpine_newt","i":"img/54263.jpg"},"383689":{"n":"nightingale","s":"Luscinia megarhynchos","p":"36291","x":"The common nightingale, rufous nightingale or simply nightingale, is a small passerine bird which is known for its powerful and beautiful song, often described as one of the most beautiful sounds in nature. An Old World flycatcher, it belongs to a group of more terrestrial species, often called chats.","u":"https://en.wikipedia.org/wiki/Common_nightingale","i":"img/383689.jpg"},"81389":{"n":"oarfish","s":"Regalecus glesne","p":"123368","x":"The giant oarfish is a species of oarfish of the family Regalecidae. It is an oceanodromous species with a worldwide distribution, excluding polar regions.","u":"https://en.wikipedia.org/wiki/Giant_oarfish","i":"img/81389.jpg"},"32538":{"n":"ocelot","s":"Leopardus pardalis","p":"338152","x":"The ocelot is a medium-sized spotted wild cat that reaches 40–50 cm (16–20 in) at the shoulders and weighs between 7 and 15.5 kg on average. It is native to the southwestern United States, Mexico, Central and South America, and the Caribbean islands of Trinidad and Margarita.","u":"https://en.wikipedia.org/wiki/Ocelot","i":"img/32538.jpg"},"9268":{"n":"opossum","s":"Didelphis marsupialis","p":"9263","x":"The common opossum, also called the northern black-eared opossum, is a species of marsupial living from the northeast of Mexico to Bolivia, including Trinidad and Tobago as well as the Windward Islands in the Caribbean, where it is referred to as the manicou. The common opossum prefers forests, but can also be found…","u":"https://en.wikipedia.org/wiki/Common_opossum","i":"img/9268.jpg"},"9601":{"n":"orangutan","s":"Pongo abelii","p":"9604","x":"The Sumatran orangutan is one of the three species of orangutans. Critically endangered, and found only in the north of the Indonesian island of Sumatra, it is rarer than the Bornean orangutan but more common than the recently identified Tapanuli orangutan, also found in Sumatra.","u":"https://en.wikipedia.org/wiki/Sumatran_orangutan","i":"img/9601.jpg"},"299642":{"n":"orbweaver spider","s":"Nephila pilipes","p":"74975","x":"Nephila pilipes is a species of golden orb-web spider. It resides all over countries in East and Southeast Asia as well as Oceania.","u":"https://en.wikipedia.org/wiki/Nephila_pilipes","i":"img/299642.jpg"},"9733":{"n":"orca","s":"Orcinus orca","p":"9726","x":"The orca, or killer whale, is a toothed whale and the largest member of the oceanic dolphin family. The only extant species in the genus Orcinus, it is recognizable by its distinct pigmentation, being mostly black on top, white on the bottom, and having recognizable white eye patches.","u":"https://en.wikipedia.org/wiki/Orca","i":"img/9733.jpg"},"56262":{"n":"osprey","s":"Pandion haliaetus","p":"2558200","x":"The osprey, historically known as sea hawk, river hawk, and fish hawk, is a diurnal, fish-eating bird of prey with a cosmopolitan range. It is a large raptor, reaching more than 60 cm (24 in) in length and a wingspan of 180 cm (71 in).","u":"https://en.wikipedia.org/wiki/Osprey","i":"img/56262.jpg"},"8801":{"n":"ostrich","s":"Struthio camelus","p":"8783","x":"The common ostrich, or simply ostrich, is a species of flightless bird native to certain areas of Africa and is the largest living species of bird. The common ostrich is one of two extant species of ostriches, the only living members of the genus Struthio in the ratite group of birds.","u":"https://en.wikipedia.org/wiki/Common_ostrich","i":"img/8801.jpg"},"29159":{"n":"oyster","s":"Magallana gigas","p":"6545","x":"The Pacific oyster, also called the Japanese oyster, is an oyster native to the Pacific coast of Asia. It has become an introduced species in North America, Australia, Europe, and New Zealand.","u":"https://en.wikipedia.org/wiki/Pacific_oyster","i":"img/29159.jpg"},"9974":{"n":"pangolin","s":"Manis javanica","p":"314145","x":"The Sunda pangolin, also known as the Malayan or Javan pangolin, is a species of pangolin. It is a member of the Manidae family.","u":"https://en.wikipedia.org/wiki/Sunda_pangolin","i":"img/9974.jpg"},"51908":{"n":"parakeet","s":"Aratinga nenday","p":"9224","x":"The nanday parakeet, also known as the black-hooded parakeet or nanday conure, is a medium-small, mostly green, Neotropical parrot native to continental South America.","u":"https://en.wikipedia.org/wiki/Nanday_parakeet","i":"img/51908.jpg"},"9049":{"n":"peacock","s":"Pavo cristatus","p":"9072","x":"The Indian peafowl, also known as the common peafowl, or blue peafowl, is a species of peafowl native to the Indian subcontinent. While it originated in the Indian subcontinent, it has since been introduced to many other parts of the world.","u":"https://en.wikipedia.org/wiki/Indian_peafowl","i":"img/9049.jpg"},"2775238":{"n":"peacock jumping spider","s":"Maratus volans","p":"94015","x":"Maratus volans is a species in the jumping spider family (Salticidae), belonging to the genus Maratus. These spiders are native to certain areas in Australia and occupy a wide distribution of habitats.","u":"https://en.wikipedia.org/wiki/Maratus_volans","i":"img/2775238.jpg"},"36301":{"n":"pelican","s":"Pelecanus onocrotalus","p":"9205","x":"The great white pelican, also known as the eastern white pelican, rosy pelican or simply white pelican, is a bird in the pelican family. It breeds from southeastern Europe through Asia and Africa, in swamps and shallow lakes.","u":"https://en.wikipedia.org/wiki/Great_white_pelican","i":"img/36301.jpg"},"8167":{"n":"perch","s":"Perca flavescens","p":"1489922","x":"The yellow perch, commonly referred to as perch, striped perch, American perch or preacher is a freshwater ray-finned fish from the perch family Percidae, native to much of central North America, particularly the Great Lakes–St. Lawrence River basin and the Upper Mississippi River catchment.","u":"https://en.wikipedia.org/wiki/Yellow_perch","i":"img/8167.jpg"},"9042":{"n":"pheasant","s":"Lophura bulweri","p":"9072","x":"Bulwer's pheasant, also known as Bulwer's wattled pheasant, the wattled pheasant or the white-tailed wattled pheasant, is a Southeast Asian bird in the family Phasianidae endemic to the forests of Borneo. It is currently listed as Vulnerable by the IUCN.","u":"https://en.wikipedia.org/wiki/Bulwer's_pheasant","i":"img/9042.jpg"},"9823":{"n":"pig","s":"Sus scrofa","p":"9821","x":"The wild boar, also known as the wild swine, common wild pig, Eurasian wild pig, or simply wild pig, is a suid native to much of Eurasia and North Africa and has been introduced to the Americas and Oceania. The species is now one of the widest-ranging mammals in the world as well as the most widespread suiform.","u":"https://en.wikipedia.org/wiki/Wild_boar","i":"img/9823.jpg"},"262124":{"n":"pigeon","s":"Hemiphaga novaeseelandiae","p":"8930","x":"The kererū, also known as kūkupa, New Zealand pigeon or wood pigeon, is a species of pigeon native to New Zealand. Johann Friedrich Gmelin described the bird in 1789 as a large, conspicuous pigeon up to 50 cm (20 in) in length and 550–850 g (19–30 oz) in weight, with a white breast and iridescent green–blue plumage.","u":"https://en.wikipedia.org/wiki/Kerer%C5%AB","i":"img/262124.jpg"},"8010":{"n":"pike","s":"Esox lucius","p":"41705","x":"The northern pike, also known as jack, northern or simply pike, is a species of carnivorous fish of the genus Esox (pikes). It is commonly found in fresh waters of the Northern Hemisphere.","u":"https://en.wikipedia.org/wiki/Northern_pike","i":"img/8010.jpg"},"71769":{"n":"pikeminnow","s":"Ptychocheilus oregonensis","p":"30727","x":"The Northern pikeminnow, Columbia River dace or colloquially squawfish is a large member of the minnow family, Leuciscidae. This predatory freshwater fish is native to northwestern North America, ranging from the Nass River basin to the Columbia River basin.","u":"https://en.wikipedia.org/wiki/Northern_pikeminnow","i":"img/71769.jpg"},"13347":{"n":"pillbug","s":"Armadillidium vulgare","p":"72041","x":"Armadillidium vulgare, the common pill-bug, common pill woodlouse, roly-poly, potato bug, slater, doodle bug, or carpenter is a widespread European species of woodlouse and the most extensively investigated terrestrial isopod species. It is native to Mediterranean Europe, but has been an introduced species and…","u":"https://en.wikipedia.org/wiki/Armadillidium_vulgare","i":"img/13347.jpg"},"42514":{"n":"piranha","s":"Pygocentrus nattereri","p":"186628","x":"The red-bellied piranha, also known as the red piranha, is a species of freshwater ray-finned fish belonging to the family Serrasalmidae, which includes the pacus, piranhas and related fishes. The red-bellied piranha occurs in South America, found in the Amazon, Paraguay, Paraná and Essequibo basins, as well as…","u":"https://en.wikipedia.org/wiki/Red-bellied_piranha","i":"img/42514.jpg"},"2109549":{"n":"pistol shrimp","s":"Alpheus digitalis","p":"6692","x":"Alpheus digitalis is a species of pistol shrimp in the family Alpheidae. The species was first discovered after a taxonomic study of a snapping shrimp from the genus Alpheus from Japan and the Gulf of Thailand, of which, it was found that two species was confounded under A.digitalis, which was originally described…","u":"https://en.wikipedia.org/wiki/Alpheus_digitalis","i":"img/2109549.jpg"},"9258":{"n":"platypus","s":"Ornithorhynchus anatinus","p":"9255","x":"The platypus, sometimes referred to as the duck-billed platypus, is a semiaquatic, egg-laying mammal endemic to eastern Australia, including Tasmania. The platypus is the sole living representative of the family Ornithorhynchidae and genus Ornithorhynchus, though a number of related species appear in the fossil record.","u":"https://en.wikipedia.org/wiki/Platypus","i":"img/9258.jpg"},"51949":{"n":"poison frog","s":"Oophaga histrionica","p":"8417","x":"The harlequin poison frog, also known as harlequin poison-dart frog, is a species of poison dart frog endemic to the Chocó region of western Colombia. The frog is normally found on the ground of tropical rain forests, among fallen limbs or leaf litter.","u":"https://en.wikipedia.org/wiki/Harlequin_poison_frog","i":"img/51949.jpg"},"29073":{"n":"polar bear","s":"Ursus maritimus","p":"9639","x":"The polar bear is a large bear native to the Arctic and nearby areas. It is closely related to the brown bear, and the two species can interbreed.","u":"https://en.wikipedia.org/wiki/Polar_bear","i":"img/29073.jpg"},"10138":{"n":"porcupine","s":"Hystrix africaeaustralis","p":"33550","x":"The Cape porcupine is a species of Old World porcupine native to central and southern Africa. It is among the largest living rodents and has a stocky body covered with long spines and shorter defensive quills.","u":"https://en.wikipedia.org/wiki/Cape_porcupine","i":"img/10138.jpg"},"9742":{"n":"porpoise","s":"Phocoena phocoena","p":"9722","x":"The harbour porpoise is one of eight extant species of porpoise. It is one of the smallest species of cetacean.","u":"https://en.wikipedia.org/wiki/Harbour_porpoise","i":"img/9742.jpg"},"9333":{"n":"possum","s":"Pseudocheirus peregrinus","p":"38609","x":"The common ringtail possum is an Australian marsupial.","u":"https://en.wikipedia.org/wiki/Common_ringtail_possum","i":"img/9333.jpg"},"45480":{"n":"prairie dog","s":"Cynomys ludovicianus","p":"337730","x":"The black-tailed prairie dog is a rodent of the family Sciuridae found in the Great Plains of North America from about the United States–Canada border to the United States–Mexico border. Unlike some other prairie dogs, these animals do not truly hibernate.","u":"https://en.wikipedia.org/wiki/Black-tailed_prairie_dog","i":"img/45480.jpg"},"7507":{"n":"praying mantis","s":"Mantis religiosa","p":"6970","x":"The European mantis is a large hemimetabolic insect in the family Mantidae, which is the largest family of the order Mantodea (mantises). Their common name praying mantis is derived from the distinctive posture of the first pair of legs, which can be observed when the mantis is in repose, resembling a praying position.","u":"https://en.wikipedia.org/wiki/European_mantis","i":"img/7507.jpg"},"342437":{"n":"pufferfish","s":"Arothron meleagris","p":"1489922","x":"Arothron meleagris, commonly known as the guineafowl puffer or golden puffer, is a pufferfish from the Indo-Pacific, and Eastern Pacific. It is occasionally caught for the aquarium trade.","u":"https://en.wikipedia.org/wiki/Arothron_meleagris","i":"img/342437.jpg"},"28701":{"n":"puffin","s":"Fratercula arctica","p":"8906","x":"The Atlantic puffin, also known as the common puffin, is a species of seabird in the auk family. It is the only puffin native to the Atlantic Ocean; two related species, the tufted puffin and the horned puffin, are found in the northeastern Pacific.","u":"https://en.wikipedia.org/wiki/Atlantic_puffin","i":"img/28701.jpg"},"9696":{"n":"puma","s":"Puma concolor","p":"338152","x":"The cougar, also called puma, mountain lion, catamount, and panther, is a large small cat native to the Americas. It inhabits North, Central and South America, making it the most widely distributed wild, terrestrial mammal in the Western Hemisphere, and one of the most widespread in the world.","u":"https://en.wikipedia.org/wiki/Cougar","i":"img/9696.jpg"},"9986":{"n":"rabbit","s":"Oryctolagus cuniculus","p":"9979","x":"The European rabbit or coney is a species of rabbit native to the Iberian Peninsula and southwestern France. It has been introduced to hundreds of locations around the world.","u":"https://en.wikipedia.org/wiki/European_rabbit","i":"img/9986.jpg"},"9654":{"n":"raccoon","s":"Procyon lotor","p":"9647","x":"The raccoon, sometimes called the North American, northern or common raccoon to distinguish it from other species of raccoon, is a mammal native to North America. It is the largest of the procyonid family, having a body length of 40 to 70 cm, and a body weight of 5 to 26 kg.","u":"https://en.wikipedia.org/wiki/Raccoon","i":"img/9654.jpg"},"10116":{"n":"rat","s":"Rattus norvegicus","p":"39107","x":"The brown rat, also known as the common rat, street rat, sewer rat, wharf rat, Hanover rat, Norway rat and Norwegian rat, is a widespread, common species of rat. One of the largest muroids, it is a brown or grey rodent with a body length of up to 28 cm (11 in) long, and a tail slightly shorter than that.","u":"https://en.wikipedia.org/wiki/Brown_rat","i":"img/10116.jpg"},"8730":{"n":"rattlesnake","s":"Crotalus atrox","p":"8689","x":"The western diamondback rattlesnake or western diamond-backed rattlesnake, is a rattlesnake species and member of the viper family, found in the southwestern United States and Mexico. Like all other rattlesnakes and all other vipers, it is venomous.","u":"https://en.wikipedia.org/wiki/Western_diamondback_rattlesnake","i":"img/8730.jpg"},"56781":{"n":"raven","s":"Corvus corax","p":"30420","x":"The common raven or northern raven is a large all-black passerine bird. It is the most widely distributed of all corvids, found across the Northern Hemisphere.","u":"https://en.wikipedia.org/wiki/Common_raven","i":"img/56781.jpg"},"9627":{"n":"red fox","s":"Vulpes vulpes","p":"9625","x":"The red fox is the largest of the true foxes, and the most widely distributed member of the order Carnivora. It is present across the entire Northern Hemisphere, including most of Europe, Asia, and North America, as well as parts of North Africa.","u":"https://en.wikipedia.org/wiki/Red_fox","i":"img/9627.jpg"},"9649":{"n":"red panda","s":"Ailurus fulgens","p":"3072906","x":"The red panda, also known as the lesser panda, is a small mammal native to the eastern Himalayas and southwestern China. It has dense reddish-brown fur with a black belly and legs, white-lined ears, a mostly white muzzle and a ringed tail.","u":"https://en.wikipedia.org/wiki/Red_panda","i":"img/9649.jpg"},"9807":{"n":"rhinoceros","s":"Ceratotherium simum","p":"9787","x":"The white rhinoceros, white rhino or square-lipped rhinoceros is the largest extant species of rhinoceros. It has a wide mouth used for grazing and is the most social of all rhino species.","u":"https://en.wikipedia.org/wiki/White_rhinoceros","i":"img/9807.jpg"},"76717":{"n":"river otter","s":"Lontra canadensis","p":"169417","x":"The North American river otter, also known as the northern river otter and river otter, is a semiaquatic mammal that is endemic to the North American continent throughout most of Canada and along the coasts of the United States and its inland waterways. An adult North American river otter can weigh between 5 and 14…","u":"https://en.wikipedia.org/wiki/North_American_river_otter","i":"img/76717.jpg"},"37610":{"n":"robin","s":"Erithacus rubecula","p":"36291","x":"The European robin, known simply as the robin or robin redbreast in the British Isles, is a small insectivorous passerine bird belonging to the Old World flycatcher family Muscicapidae. It is found across Europe, as far east as Western Siberia, and as far south as North Africa.","u":"https://en.wikipedia.org/wiki/European_robin","i":"img/37610.jpg"},"57571":{"n":"salamander","s":"Salamandra salamandra","p":"8314","x":"The fire salamander is a common species of salamander found in Europe.","u":"https://en.wikipedia.org/wiki/Fire_salamander","i":"img/57571.jpg"},"8030":{"n":"salmon","s":"Salmo salar","p":"504568","x":"The Atlantic salmon is a species of ray-finned fish in the family Salmonidae. It is the third largest of the Salmonidae, behind Siberian taimen and Pacific Chinook salmon, growing up to 1 m (3.3 ft) in length.","u":"https://en.wikipedia.org/wiki/Atlantic_salmon","i":"img/8030.jpg"},"1351942":{"n":"sand dollar","s":"Mellita quinquiesperforata","p":"7638","x":"Mellita quinquiesperforata is a tropical species of sand dollar, a flat, round marine animal related to sea urchins, starfish, and other echinoderms. They have been found to possess significantly more food in the gut at night than in the day.","u":"https://en.wikipedia.org/wiki/Mellita_quinquiesperforata","i":"img/1351942.jpg"},"96889":{"n":"sardine","s":"Sardinella tawilis","p":"7948","x":"Sardinella tawilis is a freshwater sardine found exclusively in the Philippines. It is the only member of the genus Sardinella known to exist entirely in fresh water.","u":"https://en.wikipedia.org/wiki/Sardinella_tawilis","i":"img/96889.jpg"},"301549":{"n":"scallop","s":"Pecten novaezelandiae","p":"6545","x":"Pecten novaezelandiae, common name the New Zealand scallop, is a bivalve mollusc of the family Pectinidae, the scallops. Its name is sometimes found misspelt as Pecten novaezealandiae.","u":"https://en.wikipedia.org/wiki/Pecten_novaezelandiae","i":"img/301549.jpg"},"6584":{"n":"sea clam","s":"Spisula solidissima","p":"2908833","x":"The Atlantic surf clam, also called the bar clam, hen clam, skimmer or simply sea clam, is a very large, edible, saltwater clam or marine bivalve mollusk in the famil
